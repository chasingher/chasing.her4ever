<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#241010" />
<title>Backstage — Memories Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#241010; --ink-soft:#7a6a62; --panel:#fdf6ee; --panel-soft:#f6ead9; --line:rgba(36,16,16,.12);
    --accent:#c2185b; --accent-deep:#96123f; --gold:#cf9f4e; --good:#3d7a4f; --bad:#b23b3b;
    --font-display:'Dancing Script',cursive; --font-ui:'Poppins',sans-serif; }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font-ui);background:var(--ink);color:var(--ink)}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  #root{min-height:100%}

  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 20px;text-align:center;
    background:radial-gradient(circle at 50% 20%,#3a1414 0%,var(--ink) 65%);color:#f3e3d3}
  .gate-mark{font-family:var(--font-display);font-size:2.6rem}
  .gate input{padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;min-width:220px}
  .gate button{padding:12px 22px;border-radius:10px;border:none;background:linear-gradient(155deg,var(--accent),var(--accent-deep));color:#fff;font-weight:600}
  .gate-error{color:#ff9f9f;font-size:.85rem;min-height:1em}
  .gate form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  .shell{display:flex;min-height:100vh}
  .sidebar{width:280px;flex:0 0 280px;background:linear-gradient(180deg,#2c1212,#1c0b0b);color:#f3e3d3;padding:26px 18px;display:flex;flex-direction:column;gap:18px}
  .brand-mark{font-family:var(--font-display);font-size:1.8rem}
  .brand-sub{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#c9ab98}
  .new-btn{padding:11px 14px;border-radius:10px;border:1px dashed rgba(255,255,255,.35);background:transparent;color:#f3e3d3;font-size:.88rem}
  .project-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .project-item{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:transparent;color:#e9d6c6;font-size:.86rem}
  .project-item:hover{background:rgba(255,255,255,.07)}
  .project-item.active{background:rgba(194,24,91,.24);border-color:rgba(194,24,91,.55)}
  .project-item .slug{font-weight:600;color:#fff;display:block}
  .sidebar-foot{font-size:.68rem;color:#8a6f62;line-height:1.5}

  .main{flex:1;overflow-y:auto;background:var(--ink)}
  .main-inner{max-width:860px;margin:0 auto;padding:40px 32px 140px}
  .topline{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .topline h1{font-family:var(--font-display);font-size:2.1rem;color:#f3e3d3;margin:0}
  .status{font-size:.78rem;color:#c9ab98}
  .status.ok{color:#8fd19e} .status.err{color:#ff9f9f}

  .card{background:var(--panel);border-radius:16px;padding:26px 28px;margin-bottom:20px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
  .card h2{margin:0 0 4px;font-size:1.05rem;color:var(--accent-deep)}
  .card .hint{margin:0 0 18px;font-size:.8rem;color:var(--ink-soft);line-height:1.5}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.78rem;font-weight:600;margin-bottom:6px}
  .field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:.9rem}
  .field .field-hint{font-size:.72rem;color:var(--ink-soft);margin-top:5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:560px){.row2{grid-template-columns:1fr}}

  .memory-item{background:var(--panel-soft);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:14px}
  .memory-thumb{width:90px;height:90px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#ddd;display:flex;align-items:center;justify-content:center}
  .memory-thumb img,.memory-thumb video{width:100%;height:100%;object-fit:cover}
  .memory-fields{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
  .memory-fields input,.memory-fields select{padding:8px 10px;border-radius:7px;border:1px solid var(--line);font-size:.8rem;min-width:0;width:100%}
  .memory-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--bad);font-size:.9rem}
  .icon-btn.up-down{color:var(--ink)}
  .chk{display:flex;align-items:center;gap:5px;font-size:.75rem;grid-column:span 2}
  @media (max-width:560px){.memory-fields{grid-template-columns:1fr}.chk{grid-column:span 1}}

  .photo-drop{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;cursor:pointer;color:var(--ink-soft);font-size:.85rem;margin-bottom:16px}
  .photo-drop:hover,.photo-drop.dragging{border-color:var(--accent);background:#fdeef3;color:var(--accent-deep)}
  .photo-drop input{display:none}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .photo-card{background:#fff;border-radius:6px;padding:6px;box-shadow:0 4px 12px rgba(0,0,0,.15);position:relative}
  .photo-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:4px}
  .photo-card .remove{margin-top:6px;width:100%;border:none;background:none;color:var(--bad);font-size:.65rem;text-transform:uppercase}
  .photo-card .ord{position:absolute;top:10px;left:10px;background:rgba(36,16,16,.72);color:#fff;font-size:.62rem;border-radius:999px;padding:2px 7px}
  .pick-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
  .pick-thumb{width:76px;height:76px;border-radius:8px;overflow:hidden;flex-shrink:0;border:2px solid transparent;cursor:pointer}
  .pick-thumb.selected{border-color:var(--accent)}
  .pick-thumb img{width:100%;height:100%;object-fit:cover}

  .meter{height:7px;border-radius:999px;background:#e7d8c6;overflow:hidden;margin:10px 0 6px}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s ease}

  /* audio library */
  .audio-row{display:flex;align-items:center;gap:10px;background:var(--panel-soft);border-radius:10px;padding:9px 11px;margin-bottom:7px;flex-wrap:wrap}
  .audio-row.in-use{background:#fbe3ec;box-shadow:inset 0 0 0 1px rgba(194,24,91,.35)}
  .audio-play{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--accent-deep);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:.8rem}
  .audio-name{flex:1;min-width:120px;font-size:.84rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .audio-name input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:.82rem}
  .audio-meta{font-size:.68rem;color:var(--ink-soft);white-space:nowrap}
  .audio-tag{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px}
  .mini-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:.72rem;color:var(--ink)}
  .mini-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .mini-btn.danger{color:var(--bad)}
  .scrub{width:100%;margin:10px 0 4px}
  .trim-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .time-chip{font-variant-numeric:tabular-nums;font-size:.76rem;color:var(--ink-soft)}

  .action-bar{position:sticky;bottom:0;background:linear-gradient(0deg,var(--ink) 60%,rgba(36,16,16,0));padding:26px 0 10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn{padding:13px 22px;border-radius:11px;border:none;font-size:.88rem;font-weight:600}
  .btn-primary{background:linear-gradient(155deg,var(--accent),var(--accent-deep));color:#fff}
  .btn-gold{background:linear-gradient(155deg,#e0b975,var(--gold));color:#3a2405}
  .btn-outline{background:transparent;border:1px solid rgba(255,255,255,.3);color:#f3e3d3}
  .btn:disabled{opacity:.5}
  .setup-notice{max-width:560px;margin:60px auto;background:var(--panel);border-radius:16px;padding:32px 36px;box-shadow:0 20px 50px rgba(0,0,0,.35);line-height:1.6}
  .fix-banner{background:#3a1414;border:1px solid #c2185b;border-radius:14px;padding:16px 18px;margin-bottom:20px;color:#ffe3e3;font-size:.85rem}
  .fix-banner code{display:block;background:#1c0b0b;border-radius:8px;padding:10px 12px;font-size:.76rem;color:#ffd3a8;margin:10px 0;white-space:pre}
</style>
</head>

     slug text primary key,
     pin text default '123456',

function base64ToUtf8(b64){ const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder("utf-8").decode(bytes); }
function utf8ToBase64(str){ const bytes=new TextEncoder().encode(str); let bin=""; bytes.forEach((b)=>{bin+=String.fromCharCode(b);}); return btoa(bin); }

/* Uploading used to be the slow part of this tool: a 4 MB phone photo went up
   at full size, one file at a time, and then every visitor had to download all
   4 MB of it again. Photos are now resized and re-encoded in the browser
   first, and files go up several at a time. A heart photo only ever renders
   about 180px wide, so 1100px is already generous. */
const MOSAIC_MAX_DIM = 1100;
const FLOWER_MAX_DIM = 900;
const MEMORY_MAX_DIM = 1600;
const JPEG_QUALITY = 0.82;

async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;
      out[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.max(1, Math.min(limit, items.length)) }, worker));
  return out;
}

async function compressImage(file, maxDim, quality) {
  if (!file.type || !file.type.startsWith("image/") || file.type === "image/gif") return file;
  try {
    const bitmap = await createImageBitmap(file);
    const biggest = Math.max(bitmap.width, bitmap.height);
    const scale = Math.min(1, maxDim / biggest);
    if (scale === 1 && file.size < 350 * 1024) { if (bitmap.close) bitmap.close(); return file; }
    const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
    if (bitmap.close) bitmap.close();
    const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", quality || JPEG_QUALITY));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch (e) {
    return file; // unusual format (HEIC, etc.) — send the original rather than fail
  }
}

async function uploadOne(file, slug, folder) {
  const ext = (file.name.match(/\.[^.]+$/) || [""])[0];
  const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "file";
  const path = `${slug}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${base}${ext}`;
  const { error: upErr } = await supabaseClient.storage.from("photos").upload(path, file, { upsert: true, cacheControl: "31536000" });
  if (upErr) throw upErr;
  const { data } = supabaseClient.storage.from("photos").getPublicUrl(path);
  return data.publicUrl;
}

/* Same layout math as memories-template.html — MUST stay identical so the
   preview here matches the live site exactly. Row by row, this traces the
   real heart curve rather than scattering points randomly, so it reads as
   a heart: two lobes with a notch at the top, tapering to a single point
   at the bottom, with a mix of square and rectangular tiles. If you ever
   change MOSAIC_COLS/MOSAIC_ROWS/TILE_* constants, change both files. */
function insideHeart(x, y) {
  const v = Math.pow(x*x + y*y - 1, 3) - x*x*y*y*y;
  return v <= 0;
}
function seededJitter(id) {
  const s = Math.sin(id * 12.9898) * 43758.5453;
  return s - Math.floor(s);
}
function slotShape(id) {
  const r = seededJitter(id * 7 + 3);
  if (r < 0.58) return { wMul: 1, hMul: 1 };
  if (r < 0.80) return { wMul: 1.42, hMul: 1 };
  return { wMul: 1, hMul: 1.42 };
}
const MOSAIC_COLS = 9;
const MOSAIC_ROWS = 7;
/* Tiles near the middle are the biggest; the ones on the rim shrink so the
   silhouette stays crisp instead of squaring off at the shoulders. */
const TILE_EDGE = 1.02;
const TILE_CENTER = 1.72;
const TILE_DEPTH_REF = 0.46;
function heartDepth(x, y) {
  const maxd = 0.62, steps = 22, dirs = 16;
  let best = maxd;
  for (let k = 0; k < dirs; k++) {
    const a = (2 * Math.PI * k) / dirs, dx = Math.cos(a), dy = Math.sin(a);
    let d = maxd;
    for (let s = 1; s <= steps; s++) {
      const t = (maxd * s) / steps;
      if (!insideHeart(x + dx * t, y + dy * t)) { d = t; break; }
    }
    if (d < best) best = d;
  }
  return best;
}
function buildHeartLayout(cols, rows) {
  const xscale = 2.9, xshift = 1.45, yscale = 2.497, yshift = 1.328;
  const slots = [];
  let id = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const nx = ((c + 0.5) / cols) * xscale - xshift;
      const ny = yshift - ((r + 0.5) / rows) * yscale;
      if (!insideHeart(nx, ny)) continue;
      const j1 = seededJitter(id * 2 + 1);
      const j2 = seededJitter(id * 2 + 2);
      const shape = slotShape(id);
      const dep = Math.min(1, heartDepth(nx, ny) / TILE_DEPTH_REF);
      const spread = TILE_EDGE + (TILE_CENTER - TILE_EDGE) * Math.pow(dep, 0.85);
      const base = (1 / cols) * (spread + j1 * 0.14);
      const xPct = (nx + xshift) / xscale;
      const yPct = (yshift - ny) / yscale;
      slots.push({
        id, row: r, col: c, xPct, yPct,
        widthPct: base * shape.wMul,
        heightPct: base * shape.hMul,
        rotate: (j2 - 0.5) * 15,
        z: id,
        dist: Math.sqrt(Math.pow(xPct - 0.5, 2) + Math.pow((yPct - 0.46) * 1.1, 2))
      });
      id++;
    }
  }
  const order = slots.slice().sort((a, b) => a.dist - b.dist);
  order.forEach((s, i) => { s.order = i; });
  return slots;
}
const MOSAIC_LAYOUT = buildHeartLayout(MOSAIC_COLS, MOSAIC_ROWS);

/* ---------------------------------------------------------------------
   Shared-bucket file browser — lists files already sitting under
   `<any-slug>/<folder>/` in the shared `photos` bucket, so images or
   songs uploaded for other projects can be reused without re-uploading.
--------------------------------------------------------------------- */
/* One pass over the bucket, shared by every picker on the page. This used to
   be three separate walks (voice, music, flowers), each listing every project
   folder one after another — slow to begin with, and slower with every new
   project. Now it's a single cached sweep that runs its lookups in parallel. */
const BUCKET_FOLDERS = ["voice", "music", "flowers"];
let bucketIndexPromise = null;
function loadBucketIndex(force) {
  if (!supabaseClient) return Promise.resolve({});
  if (!force && bucketIndexPromise) return bucketIndexPromise;
  bucketIndexPromise = (async () => {
    const index = {};
    BUCKET_FOLDERS.forEach((f) => { index[f] = []; });
    const { data: top } = await supabaseClient.storage.from("photos").list("", { limit: 200 });
    const projects = (top || []).filter((i) => i.id === null);
    const jobs = [];
    projects.forEach((p) => BUCKET_FOLDERS.forEach((sub) => jobs.push({ project: p.name, sub })));
    await mapLimit(jobs, 8, async (job) => {
      try {
        const { data: items } = await supabaseClient.storage.from("photos").list(`${job.project}/${job.sub}`, { limit: 200 });
        (items || []).forEach((it) => {
          if (!it.name || it.id === null) return;
          const path = `${job.project}/${job.sub}/${it.name}`;
          const { data: pub } = supabaseClient.storage.from("photos").getPublicUrl(path);
          index[job.sub].push({ url: pub.publicUrl, name: it.name, from: job.project, path });
        });
      } catch (e) {}
    });
    BUCKET_FOLDERS.forEach((f) => index[f].sort((a, b) => (a.from + a.name).localeCompare(b.from + b.name)));
    return index;
  })();
  bucketIndexPromise.catch(() => { bucketIndexPromise = null; });
  return bucketIndexPromise;
}
function useSharedBucketFiles(folder) {
  const [files, setFiles] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState("");
  const load = React.useCallback(async (force) => {
    if (!supabaseClient) { setLoading(false); return; }
    setLoading(true); setError("");
    try {
      const index = await loadBucketIndex(force === true);
      setFiles(index[folder] || []);
    } catch (e) { setError("Couldn't load existing files: " + (e.message || e)); }
    setLoading(false);
  }, [folder]);
  React.useEffect(() => { load(false); }, [load]);
  return { files, loading, error, refresh: () => load(true) };
}

/* ---------------------------------------------------------------------
   Audio library — one component used for both voice notes and songs.
   Every file can be previewed, renamed, deleted, or set as the one this
   project uses. Renaming moves the file inside the bucket, so the URL
   changes: any project already pointing at it is updated here if it's
   the one open, and other projects keep working because the rename is
   only ever done on files you choose.
--------------------------------------------------------------------- */
function AudioLibrary({ slug, folder, kind, selectedUrl, onSelect }) {
  const { files, loading, error: listError, refresh } = useSharedBucketFiles(folder);
  const [uploading, setUploading] = React.useState(false);
  const [progress, setProgress] = React.useState(null);
  const [error, setError] = React.useState("");
  const [playingPath, setPlayingPath] = React.useState(null);
  const [editingPath, setEditingPath] = React.useState(null);
  const [draftName, setDraftName] = React.useState("");
  const [durations, setDurations] = React.useState({});
  const [busyPath, setBusyPath] = React.useState(null);
  const [dragging, setDragging] = React.useState(false);
  const audioRef = React.useRef(null);
  const fileInput = React.useRef(null);

  React.useEffect(() => () => { if (audioRef.current) audioRef.current.pause(); }, []);

  function togglePlay(file) {
    if (playingPath === file.path) {
      if (audioRef.current) audioRef.current.pause();
      setPlayingPath(null);
      return;
    }
    if (audioRef.current) audioRef.current.pause();
    const a = new Audio(file.url);
    audioRef.current = a;
    a.addEventListener("loadedmetadata", () => setDurations((d) => ({ ...d, [file.path]: a.duration })));
    a.addEventListener("ended", () => setPlayingPath(null));
    a.play().then(() => setPlayingPath(file.path)).catch(() => setError("Couldn't play that file."));
  }

  async function handleUpload(fileList) {
    setError("");
    const arr = Array.from(fileList || []);
    if (!arr.length) return;
    if (!slug) { setError("Give the project a slug first — uploads are filed under it."); return; }
    if (!supabaseClient) { setError("Connect Supabase first."); return; }
    setUploading(true);
    setProgress({ done: 0, total: arr.length });
    let lastUrl = "";
    let done = 0;
    await mapLimit(arr, 2, async (file) => {
      try {
        lastUrl = await uploadOne(file, slug, folder);
      } catch (e) { setError("Couldn't upload " + file.name + ": " + (e.message || e)); }
      done++; setProgress({ done, total: arr.length });
    });
    setUploading(false);
    setProgress(null);
    await refresh();
    if (lastUrl && !selectedUrl) onSelect(lastUrl);
  }

  async function saveRename(file) {
    const clean = slugify(draftName);
    if (!clean) { setEditingPath(null); return; }
    const ext = (file.name.match(/\.[^.]+$/) || [""])[0];
    const dir = file.path.slice(0, file.path.lastIndexOf("/"));
    const newPath = `${dir}/${clean}${ext}`;
    if (newPath === file.path) { setEditingPath(null); return; }
    setBusyPath(file.path); setError("");
    try {
      const { error: mvErr } = await supabaseClient.storage.from("photos").move(file.path, newPath);
      if (mvErr) throw mvErr;
      const { data } = supabaseClient.storage.from("photos").getPublicUrl(newPath);
      if (selectedUrl === file.url) onSelect(data.publicUrl);
      setEditingPath(null);
      await refresh();
    } catch (e) {
      setError("Couldn't rename: " + (e.message || e) + " — you may need the storage update policy noted at the top of this file.");
    }
    setBusyPath(null);
  }

  async function deleteFile(file) {
    if (!window.confirm(`Delete "${prettyName(file.name)}" for good? Any published site still using it will lose the sound.`)) return;
    setBusyPath(file.path); setError("");
    try {
      const { error: rmErr } = await supabaseClient.storage.from("photos").remove([file.path]);
      if (rmErr) throw rmErr;
      if (selectedUrl === file.url) onSelect("");
      if (playingPath === file.path && audioRef.current) { audioRef.current.pause(); setPlayingPath(null); }
      await refresh();
    } catch (e) { setError("Couldn't delete: " + (e.message || e)); }
    setBusyPath(null);
  }

  const label = kind === "voice" ? "voice note" : "song";

  return (
    <div>
      {loading && <div className="field-hint">Loading {label}s…</div>}
      {(error || listError) && <div className="field-hint" style={{color:"var(--bad)",marginBottom:8}}>{error || listError}</div>}
      {!loading && !files.length && <div className="field-hint" style={{marginBottom:10}}>No {label}s uploaded yet. Add your first one below.</div>}

      {files.map((file) => {
        const inUse = selectedUrl === file.url;
        const editing = editingPath === file.path;
        const busy = busyPath === file.path;
        return (
          <div className={"audio-row" + (inUse ? " in-use" : "")} key={file.path}>
            <button type="button" className="audio-play" onClick={() => togglePlay(file)}
              aria-label={playingPath === file.path ? "Pause preview" : "Play preview"}>
              {playingPath === file.path ? "❚❚" : "▶"}
            </button>
            <div className="audio-name">
              {editing ? (
                <input autoFocus value={draftName} onChange={(e)=>setDraftName(e.target.value)}
                  onKeyDown={(e)=>{ if(e.key==="Enter") saveRename(file); if(e.key==="Escape") setEditingPath(null); }} />
              ) : prettyName(file.name)}
            </div>
            <span className="audio-meta">{durations[file.path] ? fmtTime(durations[file.path]) : ""} · {file.from}</span>
            {inUse && <span className="audio-tag">In use</span>}
            {editing ? (
              <React.Fragment>
                <button type="button" className="mini-btn primary" disabled={busy} onClick={() => saveRename(file)}>Save name</button>
                <button type="button" className="mini-btn" onClick={() => setEditingPath(null)}>Cancel</button>
              </React.Fragment>
            ) : (
              <React.Fragment>
                {!inUse && <button type="button" className="mini-btn primary" onClick={() => onSelect(file.url)}>Use this</button>}
                {inUse && <button type="button" className="mini-btn" onClick={() => onSelect("")}>Unset</button>}
                <button type="button" className="mini-btn" disabled={busy}
                  onClick={() => { setEditingPath(file.path); setDraftName(prettyName(file.name)); }}>Rename</button>
                <button type="button" className="mini-btn danger" disabled={busy} onClick={() => deleteFile(file)}>Delete</button>
              </React.Fragment>
            )}
          </div>
        );
      })}

      <div className={"photo-drop" + (dragging ? " dragging" : "")} style={{marginTop:14}}
        onClick={() => fileInput.current && fileInput.current.click()}
        onDragOver={(e)=>{e.preventDefault();setDragging(true);}}
        onDragLeave={()=>setDragging(false)}
        onDrop={(e)=>{e.preventDefault();setDragging(false);handleUpload(e.dataTransfer.files);}}>
        <input ref={fileInput} type="file" accept="audio/*" multiple onChange={(e)=>handleUpload(e.target.files)} />
        {uploading ? (progress ? `Uploading ${progress.done + 1} of ${progress.total}…` : "Uploading…") : `Click to upload a ${label}, or drag files in`}
      </div>
    </div>
  );
}

/* Music player with a scrub bar and trim controls that read from the
   playhead, so the start and end points can be set by ear. */
function MusicTrimmer({ url, start, end, onChangeStart, onChangeEnd }) {
  const audioRef = React.useRef(null);
  const [duration, setDuration] = React.useState(null);
  const [time, setTime] = React.useState(0);
  const [playing, setPlaying] = React.useState(false);
  const [previewingTrim, setPreviewingTrim] = React.useState(false);

  React.useEffect(() => {
    if (!url) return;
    const a = new Audio(url);
    a.preload = "metadata";
    audioRef.current = a;
    const onMeta = () => setDuration(a.duration);
    const onTime = () => {
      setTime(a.currentTime);
      if (previewingTrim && end && a.currentTime >= end) { a.pause(); setPlaying(false); setPreviewingTrim(false); }
    };
    const onEnd = () => { setPlaying(false); setPreviewingTrim(false); };
    a.addEventListener("loadedmetadata", onMeta);
    a.addEventListener("timeupdate", onTime);
    a.addEventListener("ended", onEnd);
    return () => { a.pause(); a.removeEventListener("loadedmetadata", onMeta); a.removeEventListener("timeupdate", onTime); a.removeEventListener("ended", onEnd); };
  }, [url, previewingTrim, end]);

  function toggle() {
    const a = audioRef.current; if (!a) return;
    if (playing) { a.pause(); setPlaying(false); setPreviewingTrim(false); }
    else { a.play().then(()=>setPlaying(true)).catch(()=>{}); }
  }
  function playTrimmed() {
    const a = audioRef.current; if (!a) return;
    try { a.currentTime = start || 0; } catch(e){}
    setPreviewingTrim(true);
    a.play().then(()=>setPlaying(true)).catch(()=>{});
  }
  function seek(v) {
    const a = audioRef.current; if (!a) return;
    try { a.currentTime = v; setTime(v); } catch(e){}
  }

  if (!url) return null;
  return (
    <div style={{marginTop:14}}>
      <div className="trim-row">
        <button type="button" className="mini-btn primary" onClick={toggle}>{playing ? "Pause" : "Play"}</button>
        <button type="button" className="mini-btn" onClick={playTrimmed}>Play the trimmed part</button>
        <span className="time-chip">{fmtTime(time)} / {fmtTime(duration)}</span>
      </div>
      <input className="scrub" type="range" min="0" max={duration || 0} step="0.1" value={time}
        onChange={(e)=>seek(Number(e.target.value))} aria-label="Scrub through the song" />
      <div className="trim-row">
        <button type="button" className="mini-btn" onClick={()=>onChangeStart(Math.floor(time))}>Start here ({fmtTime(start||0)})</button>
        <button type="button" className="mini-btn" onClick={()=>onChangeEnd(Math.ceil(time))}>End here ({end ? fmtTime(end) : "song end"})</button>
        {(start || end) ? <button type="button" className="mini-btn danger" onClick={()=>{onChangeStart(0);onChangeEnd(null);}}>Clear trim</button> : null}
      </div>
      <div className="row2">
        <div className="field">
          <label>Start at (seconds)</label>
          <input type="number" min="0" step="1" value={start || 0} onChange={(e)=>onChangeStart(Math.max(0, Number(e.target.value)||0))} />
        </div>
        <div className="field">
          <label>End at (seconds, blank = play to the end)</label>
          <input type="number" min="0" step="1" value={end || ""} placeholder={duration?String(Math.floor(duration)):""}
            onChange={(e)=>onChangeEnd(e.target.value===""?null:Number(e.target.value))} />
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   Mosaic uploader — upload a batch, the heart arranges them for you.
--------------------------------------------------------------------- */
function MosaicPreview({ images }) {
  const containerSize = 340;
  const list = (images || []).filter(Boolean);
  return (
    <div style={{position:"relative", width:containerSize, height:containerSize, margin:"0 auto 14px",
      background:"radial-gradient(circle at 50% 45%,#f9e9d6,#f1dcc4)", borderRadius:12}}>
      {MOSAIC_LAYOUT.map((slot) => {
        const w = slot.widthPct * containerSize, h = slot.heightPct * containerSize;
        const img = list.length ? list[slot.id % list.length] : null;
        return (
          <div key={slot.id}
            style={{
              position:"absolute",
              left: slot.xPct*containerSize - w/2, top: slot.yPct*containerSize - h/2,
              width:w, height:h, transform:`rotate(${slot.rotate}deg)`,
              borderRadius:3, overflow:"hidden",
              border: img ? "2px solid #fff" : "1.5px dashed rgba(36,16,16,.28)",
              background: img ? "#eee" : "rgba(36,16,16,.05)",
              boxShadow: img ? "0 4px 10px rgba(0,0,0,.22)" : "none",
              zIndex: Math.round(slot.z)
            }}>
            {img ? <img src={img.url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} /> : null}
          </div>
        );
      })}
    </div>
  );
}

function MosaicUploader({ slug, images, onChange }) {
  const list = images || [];
  const [uploading, setUploading] = React.useState(false);
  const [progress, setProgress] = React.useState(null);
  const [error, setError] = React.useState("");
  const [dragging, setDragging] = React.useState(false);
  const fileInput = React.useRef(null);

  async function handleFiles(fileList) {
    setError("");
    const files = Array.from(fileList || []);
    if (!files.length) return;
    if (!slug) { setError("Give the project a slug first."); return; }
    if (!supabaseClient) { setError("Connect Supabase first."); return; }
    setUploading(true);
    setProgress({ done: 0, total: files.length });
    let done = 0;
    const results = await mapLimit(files, 4, async (file) => {
      try {
        const small = await compressImage(file, MOSAIC_MAX_DIM);
        const url = await uploadOne(small, slug, "mosaic");
        done++; setProgress({ done, total: files.length });
        return { url };
      } catch (e) {
        setError("Some images didn't upload: " + (e.message || e));
        done++; setProgress({ done, total: files.length });
        return null;
      }
    });
    onChange([...list, ...results.filter(Boolean)]);
    setUploading(false);
    setProgress(null);
  }
  function remove(i) { onChange(list.filter((_, idx) => idx !== i)); }
  function move(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    const next = list.slice();
    const tmp = next[i]; next[i] = next[j]; next[j] = tmp;
    onChange(next);
  }

  const count = list.length;
  const pct = Math.min(100, Math.round((count / MOSAIC_SLOT_COUNT) * 100));
  let readout;
  if (count === 0) readout = `The heart has ${MOSAIC_SLOT_COUNT} spots. Upload at least ${MOSAIC_MIN_PHOTOS} photos and they'll fill it automatically, in the order shown below.`;
  else if (count < MOSAIC_MIN_PHOTOS) readout = `${count} photos — ${MOSAIC_MIN_PHOTOS - count} more and the heart stops looking repetitive. ${MOSAIC_SLOT_COUNT} gives every spot its own photo.`;
  else if (count < MOSAIC_SLOT_COUNT) readout = `${count} photos — enough for a full heart. Some will appear twice; ${MOSAIC_SLOT_COUNT - count} more makes every spot unique.`;
  else if (count === MOSAIC_SLOT_COUNT) readout = `${count} photos — every spot has its own photo. This is the sweet spot.`;
  else readout = `${count} photos, but the heart only has ${MOSAIC_SLOT_COUNT} spots. The first ${MOSAIC_SLOT_COUNT} are used — reorder below to choose which, or remove the extras.`;

  return (
    <div>
      <div className="field-hint" style={{marginBottom:2}}>{readout}</div>
      <div className="meter"><i style={{width:pct+"%"}} /></div>
      {count > MOSAIC_SLOT_COUNT && <div className="field-hint" style={{color:"var(--bad)",marginBottom:8}}>{count - MOSAIC_SLOT_COUNT} photos past the end won't appear in the heart.</div>}
      {error && <div className="field-hint" style={{color:"var(--bad)",marginBottom:8}}>{error}</div>}
      <MosaicPreview images={list} />
      <div className={"photo-drop" + (dragging ? " dragging" : "")}
        onClick={() => fileInput.current && fileInput.current.click()}
        onDragOver={(e)=>{e.preventDefault();setDragging(true);}}
        onDragLeave={()=>setDragging(false)}
        onDrop={(e)=>{e.preventDefault();setDragging(false);handleFiles(e.dataTransfer.files);}}>
        <input ref={fileInput} type="file" accept="image/*" multiple onChange={(e)=>handleFiles(e.target.files)} />
        {uploading ? `Shrinking and uploading ${progress ? progress.done + " of " + progress.total : ""}…` : "Click to add photos, or drag them in"}
      </div>
      {!!list.length && (
        <div className="photo-grid">
          {list.map((img, i) => (
            <div className="photo-card" key={img.url+i} style={{opacity: i >= MOSAIC_SLOT_COUNT ? .45 : 1}}>
              <img src={img.url} alt="" />
              <span className="ord">{i+1}</span>
              <div style={{display:"flex",gap:4,marginTop:4}}>
                <button type="button" className="icon-btn up-down" style={{flex:1,fontSize:10}} onClick={()=>move(i,-1)} title="Move earlier">↑</button>
                <button type="button" className="icon-btn up-down" style={{flex:1,fontSize:10}} onClick={()=>move(i,1)} title="Move later">↓</button>
              </div>
              <button type="button" className="remove" onClick={() => remove(i)}>Remove</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------
   Flower picker — reuse-first, upload-optional
--------------------------------------------------------------------- */
function FlowerPicker({ slug, items, onChange }) {
  const { files: available, loading, error: listError, refresh } = useSharedBucketFiles("flowers");
  const [uploading, setUploading] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInput = React.useRef(null);

  function toggle(url) {
    const exists = items.some((it) => (it.url || it) === url);
    if (exists) onChange(items.filter((it) => (it.url || it) !== url));
    else onChange([...items, { url }]);
  }

  async function handleUpload(fileList) {
    setError("");
    if (!slug) { setError("Give the project a slug first."); return; }
    if (!supabaseClient) { setError("Connect Supabase first."); return; }
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setUploading(true);
    const results = await mapLimit(files, 4, async (file) => {
      try {
        const small = await compressImage(file, FLOWER_MAX_DIM);
        return { url: await uploadOne(small, slug, "flowers") };
      } catch (e) { setError("Some images didn't upload: " + (e.message || e)); return null; }
    });
    onChange([...items, ...results.filter(Boolean)]);
    setUploading(false);
    refresh();
  }

  return (
    <div>
      <div className="field-hint" style={{marginBottom:8}}>
        Pick from flower images already uploaded (across all your projects), or upload new ones below.
      </div>
      {loading && <div className="field-hint">Loading existing images…</div>}
      {(error || listError) && <div className="field-hint" style={{color:"var(--bad)"}}>{error || listError}</div>}
      {!!available.length && (
        <div className="pick-strip">
          {available.map((a, i) => {
            const selected = items.some((it) => (it.url || it) === a.url);
            return (
              <div key={a.url+i} className={"pick-thumb" + (selected ? " selected" : "")} title={"from: " + a.from} onClick={() => toggle(a.url)}>
                <img src={a.url} alt="" />
              </div>
            );
          })}
        </div>
      )}
      <div className="photo-drop" onClick={() => fileInput.current && fileInput.current.click()}>
        <input ref={fileInput} type="file" accept="image/*" multiple onChange={(e)=>handleUpload(e.target.files)} />
        {uploading ? "Uploading…" : "Click to upload new flower images"}
      </div>
      {!!items.length && (
        <div className="photo-grid">
          {items.map((it, i) => (
            <div className="photo-card" key={(it.url||it)+i}>
              <img src={it.url || it} alt="" />
              <button type="button" className="remove" onClick={() => onChange(items.filter((_, idx) => idx !== i))}>Remove</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------
   Memory items manager (photos + videos, transitions, per-slide seconds)
--------------------------------------------------------------------- */
function MemoriesEditor({ slug, items, onChange }) {
  const [uploading, setUploading] = React.useState(false);
  const [progress, setProgress] = React.useState(null);
  const [error, setError] = React.useState("");
  const [dragging, setDragging] = React.useState(false);
  const fileInput = React.useRef(null);

  async function handleFiles(fileList) {
    setError("");
    if (!slug) { setError("Give the project a slug first."); return; }
    if (!supabaseClient) { setError("Connect Supabase first."); return; }
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setUploading(true);
    setProgress({ done: 0, total: files.length });
    let done = 0;
    const results = await mapLimit(files, 3, async (file) => {
      try {
        const isVideo = file.type.startsWith("video/");
        const toSend = isVideo ? file : await compressImage(file, MEMORY_MAX_DIM);
        const url = await uploadOne(toSend, slug, "memories");
        done++; setProgress({ done, total: files.length });
        return {
          type: isVideo ? "video" : "photo",
          url,
          caption: "", date: "", place: "",
          muted: isVideo ? true : undefined,
          transition: "", duration: ""
        };
      } catch (e) {
        setError("Some files didn't upload: " + (e.message || e));
        done++; setProgress({ done, total: files.length });
        return null;
      }
    });
    onChange([...items, ...results.filter(Boolean)]);
    setUploading(false);
    setProgress(null);
  }

  function update(i, field, value) {
    const next = items.slice();
    next[i] = { ...next[i], [field]: value };
    onChange(next);
  }
  function remove(i) {
    if (!window.confirm("Remove this from the slideshow?")) return;
    onChange(items.filter((_, idx) => idx !== i));
  }
  function move(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= items.length) return;
    const next = items.slice();
    const tmp = next[i]; next[i] = next[j]; next[j] = tmp;
    onChange(next);
  }

  return (
    <div>
      <div className={"photo-drop" + (dragging ? " dragging" : "")}
        onClick={() => fileInput.current && fileInput.current.click()}
        onDragOver={(e)=>{e.preventDefault();setDragging(true);}}
        onDragLeave={()=>setDragging(false)}
        onDrop={(e)=>{e.preventDefault();setDragging(false);handleFiles(e.dataTransfer.files);}}>
        <input ref={fileInput} type="file" accept="image/*,video/*" multiple onChange={(e)=>handleFiles(e.target.files)} />
        {uploading ? `Uploading ${progress ? progress.done + " of " + progress.total : ""}…` : "Click to add photos or videos, or drag them in"}
      </div>
      {error && <div className="field-hint" style={{color:"var(--bad)",marginBottom:10}}>{error}</div>}
      {!items.length && <div className="field-hint">Nothing here yet — the slideshow plays in the order you add things.</div>}
      {items.map((item, i) => (
        <div className="memory-item" key={item.url + i}>
          <div className="memory-thumb">
            {item.type === "video"
              ? <video src={item.url} muted />
              : <img src={item.url} alt="" />}
          </div>
          <div className="memory-fields">
            <input type="text" placeholder="Caption" value={item.caption || ""} onChange={(e)=>update(i,"caption",e.target.value)} />
            <input type="text" placeholder="Date (e.g. June 2024)" value={item.date || ""} onChange={(e)=>update(i,"date",e.target.value)} />
            <input type="text" placeholder="Place" value={item.place || ""} onChange={(e)=>update(i,"place",e.target.value)} />
            <select value={item.transition || ""} onChange={(e)=>update(i,"transition",e.target.value)}>
              {TRANSITION_OPTIONS.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
            {item.type !== "video" && (
              <input type="number" min="2" step="1" placeholder="Seconds on screen (default 6.5)"
                value={item.duration || ""} onChange={(e)=>update(i,"duration",e.target.value)} />
            )}
            {item.type === "video" && (
              <label className="chk">
                <input type="checkbox" checked={item.muted !== false} onChange={(e)=>update(i,"muted",e.target.checked)} />
                Start muted (they can tap to unmute)
              </label>
            )}
          </div>
          <div className="memory-actions">
            <button type="button" className="icon-btn up-down" onClick={() => move(i,-1)} title="Move up">↑</button>
            <button type="button" className="icon-btn up-down" onClick={() => move(i,1)} title="Move down">↓</button>
            <button type="button" className="icon-btn" onClick={() => remove(i)} title="Remove">✕</button>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------------
   buildSiteHtml — same seam pattern as the other Backstage builder
--------------------------------------------------------------------- */
function buildSiteHtml(slug, form) {
  const templateHtml = base64ToUtf8(TEMPLATE_B64);
  const snapshot = {
    pin: form.pin,
    hero_title: form.hero_title,
    hero_subtitle: form.hero_subtitle,
    collage_names: form.collage_names,
    collage_day: form.collage_day,
    collage_month: form.collage_month,
    collage_year: form.collage_year,
    collage_quote: form.collage_quote,
    mosaic_images: form.mosaic_images,
    letter_title: form.letter_title,
    letter_body: form.letter_body,
    final_message: form.final_message,
    memories: form.memories,
    flower_images: form.flower_images,
    music_url: form.music_url,
    music_start: form.music_start,
    music_end: form.music_end,
    voice_url: form.voice_url
  };
  const startMarker = "/* DEFAULT_CONFIG:START */";
  const endMarker = "/* DEFAULT_CONFIG:END */";
  const startIdx = templateHtml.indexOf(startMarker);
  const endIdx = templateHtml.indexOf(endMarker);
  if (startIdx === -1 || endIdx === -1) throw new Error("Template markers not found — check TEMPLATE_B64.");
  const before = templateHtml.slice(0, startIdx);
  const after = templateHtml.slice(endIdx + endMarker.length);
  const middle = startMarker + "\nconst DEFAULT_CONFIG = " + JSON.stringify(snapshot, null, 2) + ";\n" + endMarker;
  let output = before + middle + after;
  output = output.split('"YOUR_SUPABASE_URL"').join(JSON.stringify(SUPABASE_URL));
  output = output.split('"YOUR_SUPABASE_ANON_KEY"').join(JSON.stringify(SUPABASE_ANON_KEY));
  output = output.split('"YOUR_PROJECT_SLUG"').join(JSON.stringify(slug));
  return output;
}

/* ---------------------------------------------------------------------
   Minimal GitHub publish (optional — same pattern as the other builder)
--------------------------------------------------------------------- */
async function githubRequest(path, options) {
  options = options || {};
  const res = await fetch("https://api.github.com" + path, {
    ...options,
    headers: { Authorization: "Bearer " + GITHUB_TOKEN, Accept: "application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(options.headers||{}) }
  });
  if (!res.ok) {
    let message = "GitHub API error (" + res.status + ")";
    try { const body = await res.json(); if (body && body.message) message = body.message; } catch(e){}
    throw new Error(message);
  }
  if (res.status === 204) return null;
  return res.json();
}
async function githubGetUsername(){ const u = await githubRequest("/user"); return u.login; }
async function githubCreateRepo(name){
  return githubRequest("/user/repos", { method:"POST", body: JSON.stringify({ name, description:"Made with Backstage — Memories.", private:false, auto_init:true }) });
}
async function githubGetRepo(owner, repo){ return githubRequest("/repos/"+owner+"/"+repo); }
async function githubGetFileSha(owner, repo, path, branch){
  try { const data = await githubRequest("/repos/"+owner+"/"+repo+"/contents/"+path+"?ref="+encodeURIComponent(branch)); return data.sha; }
  catch(e){ return null; }
}
async function githubUpsertFile(owner, repo, path, content, message, sha, branch){
  const body = { message, content: utf8ToBase64(content), branch };
  if (sha) body.sha = sha;
  return githubRequest("/repos/"+owner+"/"+repo+"/contents/"+path, { method:"PUT", body: JSON.stringify(body) });
}
async function githubEnablePages(owner, repo, branch){
  try { await githubRequest("/repos/"+owner+"/"+repo+"/pages", { method:"POST", body: JSON.stringify({ source:{ branch, path:"/" } }) }); } catch(e){}
}

/* ---------------------------------------------------------------------
   Dashboard
--------------------------------------------------------------------- */
function Dashboard() {
  const [projects, setProjects] = React.useState([]);
  const [loadingList, setLoadingList] = React.useState(true);
  const [currentSlug, setCurrentSlug] = React.useState(null);
  const [form, setForm] = React.useState(blankProject());
  const [saving, setSaving] = React.useState(false);
  const [generating, setGenerating] = React.useState(false);
  const [publishing, setPublishing] = React.useState(false);
  const [status, setStatus] = React.useState({ text:"", kind:"" });
  const [fixBanner, setFixBanner] = React.useState(null);

  const refreshList = React.useCallback(async () => {
    if (!supabaseClient) { setLoadingList(false); return; }
    setLoadingList(true);
    const { data, error } = await supabaseClient.from("memory_projects").select("slug, hero_title, updated_at").order("updated_at", { ascending:false });
    if (!error && data) setProjects(data);
    else if (error && /does not exist/i.test(error.message||"")) {
      setFixBanner({ text: "The memory_projects table doesn't exist yet. Run this once in Supabase's SQL editor, then reload this page:",
        sql: "create table if not exists memory_projects (\n  slug text primary key,\n  pin text default '123456',\n  hero_title text default 'For You',\n  hero_subtitle text default 'I made something for you... tap to begin.',\n  collage_names text default '',\n  collage_day text default '',\n  collage_month text default '',\n  collage_year text default '',\n  collage_quote text default 'Every love story is beautiful, but ours is my favorite.',\n  mosaic_images jsonb default '[]',\n  letter_title text default 'My Dearest,',\n  letter_body text default '',\n  final_message text default 'I love you, to the moon and back.',\n  memories jsonb default '[]',\n  flower_images jsonb default '[]',\n  music_url text,\n  music_start numeric default 0,\n  music_end numeric,\n  voice_url text,\n  github_repo text,\n  published_url text,\n  updated_at timestamptz default now()\n);" });
    }
    setLoadingList(false);
  }, []);
  React.useEffect(() => { refreshList(); }, [refreshList]);

  // Deep link support: memories-admin.html?slug=xyz opens that project
  // straight away (used by orders-admin.html's "Edit" links).
  React.useEffect(() => {
    const wanted = new URLSearchParams(window.location.search).get("slug");
    if (wanted && supabaseClient) openProject(wanted);
  }, []);

  function startNew(){ setCurrentSlug(null); setForm(blankProject()); setStatus({text:"",kind:""}); }

  async function openProject(slug){
    setStatus({text:"Loading…",kind:""});
    const { data, error } = await supabaseClient.from("memory_projects").select("*").eq("slug", slug).single();
    if (error || !data) { setStatus({text:"Couldn't load that project.",kind:"err"}); return; }
    setCurrentSlug(slug);
    setForm({
      slug: data.slug, pin: data.pin || "123456",
      hero_title: data.hero_title || "For You",
      hero_subtitle: data.hero_subtitle || "",
      collage_names: data.collage_names || "",
      collage_day: data.collage_day || "", collage_month: data.collage_month || "", collage_year: data.collage_year || "",
      collage_quote: data.collage_quote || "",
      mosaic_images: (data.mosaic_images && data.mosaic_images.length) ? data.mosaic_images : [],
      letter_title: data.letter_title || "",
      letter_body: data.letter_body || "",
      final_message: data.final_message || "",
      memories: data.memories || [],
      flower_images: data.flower_images || [],
      music_url: data.music_url || "",
      music_start: data.music_start || 0,
      music_end: data.music_end != null ? data.music_end : null,
      voice_url: data.voice_url || "",
      github_repo: data.github_repo || "",
      published_url: data.published_url || ""
    });
    setStatus({text:"",kind:""});
  }

  function set(field, value){ setForm((f) => ({...f, [field]: value})); }

    // Sends people who want us to build it for them to the custom-build thank-you page.
  function goCustomBuild() {
    if (!window.confirm("Nothing on this page has been saved, so leaving now will clear what you've added. Continue to the custom-build page?")) return;
    const qs = new URLSearchParams();
    if (leadName) qs.set("name", leadName);
    if (leadWa) qs.set("wa", leadWa);
    qs.set("product", "memories");
    window.location.href = "thankyou-custom.html?" + qs.toString();
  }

  async function saveProject(){
    const slug = slugify(form.slug);
    if (!slug) { setStatus({text:"Give the project a slug before saving.",kind:"err"}); return; }
    if (!supabaseClient) { setStatus({text:"Connect Supabase first.",kind:"err"}); return; }
    setSaving(true); setStatus({text:"Saving…",kind:""});
    const payload = { ...form, slug, updated_at: new Date().toISOString() };
    // .select() makes the write report back which rows it actually changed.
    // Without it, a row-level-security rule that blocks UPDATE looks exactly
    // like a successful save: no error, no rows touched, nothing stored.
    const { data: written, error } = await supabaseClient
      .from("memory_projects").upsert(payload, { onConflict:"slug" }).select();
    setSaving(false);
    if (error) {
      const msg = error.message || "";
      const missingColumn = msg.match(/column ['"]?([a-zA-Z_]+)['"]?[^a-zA-Z]*does not exist/i);
      if (missingColumn) {
        const col = missingColumn[1];
        const arrayFields = ["memories","flower_images","mosaic_images"];
        const colDef = arrayFields.includes(col) ? col+" jsonb default '[]'" : (col.indexOf("music_start")>=0||col.indexOf("music_end")>=0 ? col+" numeric" : col+" text");
        setFixBanner({ text: `Nothing was saved just now because your table is missing the "${col}" column. Run this once, then Save again:`,
          sql: `alter table memory_projects add column if not exists ${colDef};` });
      } else if (/row-level security|row level security|violates/i.test(msg)) {
        setFixBanner({ text: RLS_NOTICE, sql: RLS_SQL });
      }
      setStatus({text:"Couldn't save: " + msg, kind:"err"});
      return;
    }
    if (!written || !written.length) {
      // Postgres accepted the statement and changed nothing — the classic sign
      // of a table that allows inserts but has no matching update policy.
      setFixBanner({ text: RLS_NOTICE, sql: RLS_SQL });
      setStatus({text:"Nothing was written — see the notice above.", kind:"err"});
      return;
    }
    setFixBanner(null);
    setForm((f)=>({...f, slug})); setCurrentSlug(slug);
    const when = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    setStatus({text:"Saved at " + when + ".",kind:"ok"});
    refreshList();
  }

  function downloadFile(){
    const slug = slugify(form.slug);
    if (!slug) { setStatus({text:"Give the project a slug first.",kind:"err"}); return; }
    setGenerating(true);
    try {
      const output = buildSiteHtml(slug, form);
      const blob = new Blob([output], { type:"text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = slug + ".html";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus({text:"Downloaded " + slug + ".html", kind:"ok"});
    } catch(e){ setStatus({text:"Couldn't generate the file: " + e.message, kind:"err"}); }
    setGenerating(false);
  }

  function previewSite(){
    const slug = slugify(form.slug) || "preview";
    try {
      const output = buildSiteHtml(slug, form);
      const blob = new Blob([output], { type:"text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
      setStatus({text:"Preview opened in a new tab.", kind:"ok"});
    } catch(e){ setStatus({text:"Couldn't build the preview: " + e.message, kind:"err"}); }
  }

  async function publishLive(){
    const slug = slugify(form.slug);
    if (!slug) { setStatus({text:"Give the project a slug first.",kind:"err"}); return; }
    if (!GITHUB_READY) { setStatus({text:"Paste a GitHub token at the top of this file to enable publishing.",kind:"err"}); return; }
    setPublishing(true); setStatus({text: form.github_repo ? "Publishing changes…" : "Publishing for the first time…", kind:""});
    try {
      const output = buildSiteHtml(slug, form);
      const owner = await githubGetUsername();
      const repoName = form.github_repo || slug;
      let branch = "main", sha = null;
      if (!form.github_repo) {
        const repo = await githubCreateRepo(repoName);
        branch = repo.default_branch || "main";
        await new Promise((r)=>setTimeout(r,1500));
      } else {
        const repo = await githubGetRepo(owner, repoName);
        branch = repo.default_branch || "main";
        sha = await githubGetFileSha(owner, repoName, "index.html", branch);
      }
      await githubUpsertFile(owner, repoName, "index.html", output, sha ? "Update site" : "Publish site", sha, branch);
      if (!form.github_repo) await githubEnablePages(owner, repoName, branch);
      const liveUrl = "https://" + owner + ".github.io/" + repoName + "/";
      const updated = { ...form, slug, github_repo: repoName, published_url: liveUrl };
      setForm(updated); setCurrentSlug(slug);
      if (supabaseClient) { await supabaseClient.from("memory_projects").upsert({...updated, updated_at:new Date().toISOString()}, {onConflict:"slug"}); refreshList(); }
      setStatus({text:"Published!",kind:"ok"});
    } catch(e){ setStatus({text:"Couldn't publish: " + e.message, kind:"err"}); }
    setPublishing(false);
  }

  const isNew = currentSlug === null;

  return (
    <div className="shell">
      <div className="sidebar">
        <div className="brand-mark">Backstage</div>
        <div className="brand-sub">Memories builder</div>
        <button className="new-btn" onClick={startNew}>+ New project</button>
        <div className="project-list">
          {loadingList && <div style={{fontSize:".8rem",color:"#a98b7c"}}>Loading…</div>}
          {!loadingList && !projects.length && <div style={{fontSize:".8rem",color:"#a98b7c"}}>No projects yet.</div>}
          {projects.map((p) => (
            <button key={p.slug} className={"project-item" + (p.slug===currentSlug?" active":"")} onClick={()=>openProject(p.slug)}>
              <span className="slug">{p.slug}</span>
            </button>
          ))}
        </div>
        <div className="sidebar-foot">Uses the same Supabase project as your other Backstage site — flower images, songs and voice notes can be reused across both.</div>
      </div>

      <div className="main">
        <div className="main-inner">
          {fixBanner && (
            <div className="fix-banner">
              {fixBanner.text}
              <code>{fixBanner.sql}</code>
            </div>
          )}
          <div className="topline">
            <h1>{isNew ? "New project" : form.slug}</h1>
            <span className={"status " + status.kind}>{status.text}</span>
          </div>

          <div className="card">
            <h2>Basics</h2>
            <div className="row2">
              <div className="field">
                <label>Slug</label>
                <input type="text" value={form.slug} disabled={!isNew} placeholder="e.g. for-sarah-2026" onChange={(e)=>set("slug",e.target.value)} />
              </div>
              <div className="field">
                <label>PIN</label>
                <input type="text" value={form.pin} onChange={(e)=>set("pin",e.target.value)} />
              </div>
            </div>
            <div className="field"><label>Opening screen title</label><input type="text" value={form.hero_title} onChange={(e)=>set("hero_title",e.target.value)} /></div>
            <div className="field"><label>Opening screen subtitle</label><input type="text" value={form.hero_subtitle} onChange={(e)=>set("hero_subtitle",e.target.value)} /></div>
          </div>

          <div className="card">
            <h2>Voice note — the sound they hear first</h2>
            <p className="hint">
              Plays at full volume the instant they tap "Begin". Preview any file before choosing it, rename it so you can tell your recordings apart,
              or delete ones you're done with. The one marked "In use" is what this project plays.
            </p>
            <AudioLibrary slug={slugify(form.slug)} folder="voice" kind="voice"
              selectedUrl={form.voice_url} onSelect={(v)=>set("voice_url",v)} />
          </div>

          <div className="card">
            <h2>Music — blends underneath</h2>
            <p className="hint">
              Starts with the voice note, ducked quiet so it doesn't compete, then rises to full volume once the voice note ends.
              Trim it by ear: play the song, then set the start and end points from wherever the playhead is.
            </p>
            <AudioLibrary slug={slugify(form.slug)} folder="music" kind="music"
              selectedUrl={form.music_url} onSelect={(v)=>set("music_url",v)} />
            <MusicTrimmer url={form.music_url} start={form.music_start} end={form.music_end}
              onChangeStart={(v)=>set("music_start",v)} onChangeEnd={(v)=>set("music_end",v)} />
          </div>

          <div className="card">
            <h2>The heart mosaic</h2>
            <p className="hint">
              Photos fly in one by one from the centre outward until they've built a heart — two lobes at the top, a single point at the bottom, squares
              mixed with wide and tall tiles like a hand-cut scrapbook page. It holds, beats three times, each beat stronger than the last, then bursts
              apart into the flowers. Upload a batch; the arrangement is worked out for you.
            </p>
            <div className="row2">
              <div className="field"><label>Names (shown above the heart)</label><input type="text" placeholder="Noah and Zoe" value={form.collage_names} onChange={(e)=>set("collage_names",e.target.value)} /></div>
              <div></div>
            </div>
            <div className="row2">
              <div className="field"><label>Day</label><input type="text" placeholder="19" value={form.collage_day} onChange={(e)=>set("collage_day",e.target.value)} /></div>
              <div className="field"><label>Month</label><input type="text" placeholder="11" value={form.collage_month} onChange={(e)=>set("collage_month",e.target.value)} /></div>
            </div>
            <div className="field"><label>Year</label><input type="text" placeholder="2022" value={form.collage_year} onChange={(e)=>set("collage_year",e.target.value)} /></div>
            <div className="field"><label>Quote on the note (centre of the heart)</label><textarea rows={2} value={form.collage_quote} onChange={(e)=>set("collage_quote",e.target.value)} /></div>
            <div className="field">
              <label>Heart photos</label>
              <MosaicUploader slug={slugify(form.slug)} images={form.mosaic_images} onChange={(v)=>set("mosaic_images",v)} />
            </div>
          </div>

          <div className="card">
            <h2>Memories slideshow</h2>
            <p className="hint">
              Plays after the flowers clear. Each photo drifts slowly as it sits, the caption rises into frame, and a thin progress line runs along the top.
              Set how long each photo holds, pick its transition, and reorder freely. When the last one finishes, an invitation appears to scroll down to the letter.
            </p>
            <MemoriesEditor slug={slugify(form.slug)} items={form.memories} onChange={(v)=>set("memories",v)} />
          </div>

          <div className="card">
            <h2>Flower burst</h2>
            <p className="hint">The images that fill the screen when the heart bursts, then part like curtains to reveal the slideshow.</p>
            <FlowerPicker slug={slugify(form.slug)} items={form.flower_images} onChange={(v)=>set("flower_images",v)} />
          </div>

          <div className="card">
            <h2>The letter</h2>
            <p className="hint">Revealed after they tap the envelope open — drawn with CSS, no image needed.</p>
            <div className="field"><label>Letter title</label><input type="text" value={form.letter_title} onChange={(e)=>set("letter_title",e.target.value)} /></div>
            <div className="field"><label>Letter body</label><textarea rows={7} value={form.letter_body} onChange={(e)=>set("letter_body",e.target.value)} /></div>
            <div className="field"><label>Signature line</label><input type="text" value={form.final_message} onChange={(e)=>set("final_message",e.target.value)} /></div>
          </div>

                  <div className="card">
          <h2>Prefer we build it for you?</h2>
          <p className="hint">
            Not up for building it yourself? We can do a custom build of this site for you instead.
            You send us the photos and words, and we put it all together.
          </p>
          <button type="button" className="btn btn-gold" style={{ width: "100%" }} onClick={goCustomBuild}>
            I want a custom build instead
          </button>
        </div>

          <div className="action-bar">
            <button className="btn btn-primary" onClick={saveProject} disabled={saving}>{saving ? "Saving…" : "Save project"}</button>
            <button className="btn btn-gold" onClick={publishLive} disabled={publishing}>{publishing ? "Publishing…" : (form.github_repo ? "Publish changes" : "Publish live")}</button>
            <button className="btn btn-outline" onClick={previewSite}>Preview it</button>
            <button className="btn btn-outline" onClick={downloadFile} disabled={generating}>{generating ? "Generating…" : "Download file"}</button>
            {!isNew && <button className="btn btn-outline" onClick={startNew}>Start a new project</button>}
          </div>
          {form.published_url && (
            <p style={{color:"#c9ab98",fontSize:".85rem"}}>Live at: <a href={form.published_url} target="_blank" rel="noreferrer" style={{color:"#fff"}}>{form.published_url}</a></p>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [unlocked, setUnlocked] = React.useState(() => sessionStorage.getItem("memories_unlocked") === "1");
  if (!unlocked) return <Gate onUnlock={() => setUnlocked(true)} />;
  if (!supabaseClient) return <SetupNotice />;
  return <Dashboard />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
