<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Backstage</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FBF3EA;--deep:#F5E9DC;--wine:#5A1A2C;--ink:#33101B;--gold:#DCC397;--brown:#7A5A47;--ok:#2F6B3F;--ok-bg:#EAF4EC;--off:#EFE9E2}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--ivory);color:#2B1710;font:15px/1.5 Manrope,system-ui,sans-serif;display:flex;flex-direction:column}
h2{font-family:Fraunces,serif;font-weight:600;margin:0;color:var(--ink);font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--wine);padding-top:calc(10px + env(safe-area-inset-top))}
nav button{flex:none;border:0;border-radius:100px;padding:9px 16px;font:700 14px Manrope;background:transparent;color:#f3dfd5;cursor:pointer}
nav button.on{background:var(--ivory);color:var(--wine)}
main{flex:1;overflow:auto;padding:14px;min-height:0}iframe{width:100%;height:100%;border:0;background:#fff}
.pane[hidden]{display:none}.grid{display:grid;gap:12px;max-width:900px;margin:0 auto}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
.c{background:#fff;border:1px solid var(--deep);border-radius:16px;padding:14px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--gold);border-radius:10px;background:#fff;margin-top:6px}
label{display:block;font-size:13px;font-weight:700;color:var(--brown);margin-top:10px}
.b{border:0;border-radius:100px;background:var(--wine);color:#fff;font:700 14px Manrope;padding:11px 18px;cursor:pointer;margin-top:12px}
.b:disabled{opacity:.6;cursor:not-allowed}
.b-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--gold);border-radius:100px;font:700 13px Manrope;padding:8px 14px;cursor:pointer;margin-top:12px}
.b-danger{background:transparent;color:#8A2A2A;border:1.5px solid rgba(138,42,42,.3);border-radius:100px;font:700 13px Manrope;padding:8px 14px;cursor:pointer;margin-top:12px}
.m{color:var(--brown);font-size:13px}.t{background:var(--deep);border-radius:100px;padding:3px 10px;font-size:12px;font-weight:700}
.tag{display:inline-block;border-radius:100px;padding:3px 10px;font-size:11.5px;font-weight:700}
.tag.on{background:var(--ok-bg);color:var(--ok)}.tag.off{background:var(--off);color:var(--brown)}
#gate{margin:auto;max-width:340px;padding:24px;text-align:center}#gate input{text-align:center}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--deep)}
.ph{width:56px;height:56px;border-radius:10px;flex:none;background:var(--deep);display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--brown);text-align:center}
.t-item{display:flex;gap:12px}.t-body{flex:1;min-width:0}
.hint{font-size:12.5px;color:var(--brown);margin-top:6px}
</style></head><body>
<div id="gate"><h2>Backstage</h2><input id="pw" type="password" placeholder="Password" aria-label="Password"><button class="b" id="in">Unlock</button></div>
<nav id="nav" hidden></nav><main id="main" hidden></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var PASS="150406";
// Funnel project: submissions, templates, payment-link settings.
var db=supabase.createClient("https://zxnqoxyyzspvznehdpnj.supabase.co","sb_publishable_u3seCQ2HMrlAC9gSjQ7DOw_Eo4Qg2Kc");
// Landing-page project: testimonials shown on index.html.
var db2=supabase.createClient("https://yaisiawnqlfosfawcxle.supabase.co","sb_publishable_KZbznu5oAKqKtCTQ36PM1A_eiBCvm8-");
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var TABS=[["cust","Customers"],["pay","Payments"],["funnel","Funnel"],["storage","Storage"],["show","Showcase"],["testi","Testimonials"],["music","Music"],["orders","Orders","orders-admin.html"],["chasing","Chasing Her editor","chasing-admin.html"],["mem","Memories editor","memories-admin.html"]];
function unlock(){["orders_unlocked","backstage_unlocked","memories_unlocked"].forEach(function(k){sessionStorage.setItem(k,"1")});
 $("gate").hidden=true;$("nav").hidden=false;$("main").hidden=false;
 $("nav").innerHTML=TABS.map(function(t){return'<button data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
 $("main").innerHTML=TABS.map(function(t){return'<section class="pane" id="p-'+t[0]+'" hidden></section>'}).join("");
 $("nav").onclick=function(e){if(e.target.dataset.t)go(e.target.dataset.t)};go("cust")}
function go(k){TABS.forEach(function(t){$("p-"+t[0]).hidden=t[0]!==k});
 document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===k)});
 var t=TABS.filter(function(x){return x[0]===k})[0],p=$("p-"+k);$("main").style.padding=t[2]?"0":"14px";
 if(t[2]){if(!p.firstChild){p.style.height="100%";p.innerHTML='<iframe src="'+t[2]+'" title="'+t[1]+'"></iframe>'}}
 else if(k==="cust")loadCust();else if(k==="pay")loadPay();else if(k==="funnel")loadFunnel();else if(k==="storage")loadStorage();else if(k==="testi")loadTesti();else if(k==="music")loadMusic();else loadShow()}
$("in").onclick=function(){$("pw").value===PASS?unlock():($("pw").value="",$("pw").placeholder="Wrong password")};
$("pw").onkeydown=function(e){if(e.key==="Enter")$("in").click()};

/* ---------------- Customers ---------------- */
var ROWS=[];
async function loadCust(){var p=$("p-cust");p.innerHTML='<p class="m">Loading…</p>';
 var r=await db.from("submissions").select("*").order("created_at",{ascending:false});
 if(r.error){p.innerHTML='<p class="m">Could not load customers: '+esc(r.error.message)+'. Have you run supabase-customer-portal.sql?</p>';return}
 ROWS=r.data;p.innerHTML='<div class="grid"><input id="q" placeholder="Search name, email or WhatsApp" aria-label="Search"><div class="grid two" id="list"></div></div>';
 $("q").oninput=draw;draw()}
function draw(){var q=($("q").value||"").toLowerCase();
 $("list").innerHTML=ROWS.filter(function(o){return((o.full_name||"")+(o.email||"")+(o.whatsapp||"")).toLowerCase().indexOf(q)>-1}).map(function(o,i){
 var b=o.brief?'<p class="m">Brief: '+esc(Object.keys(o.brief).filter(function(k){return o.brief[k]}).map(function(k){return k+": "+o.brief[k]}).join(" · ")||"no details given yet")+'</p>':'';
 return'<div class="c" data-id="'+o.id+'"><div class="row"><b>'+esc(o.full_name||"No name")+'</b><span class="t">'+esc(o.product)+' · '+esc(o.status)+'</span></div>'
 +'<p class="m">'+esc(o.email||"no email saved")+' · '+esc(o.whatsapp||"")+'</p>'
 +'<p style="margin:8px 0 0">'+payTag(o)+' '+buildTag(o)+'</p>'+b
 +buildPanel(o)
 +'<label>Progress<select class="pg">'+[["received","Order received"],["building","Building"],["review","Final checks"],["hosted","Live"]].map(function(s){return'<option value="'+s[0]+'"'+(o.progress===s[0]?' selected':'')+'>'+s[1]+'</option>'}).join('')+'</select></label>'
 +'<label>Note for customer<input class="nt" value="'+esc(o.progress_note)+'"></label>'
 +'<label>Hosted link<input class="hu" inputmode="url" placeholder="https://" value="'+esc(o.hosted_url)+'"></label>'
 +'<button class="b sv">Save</button> <span class="m ok"></span></div>'}).join("")||'<p class="m">No customers yet.</p>'}
document.addEventListener("click",async function(e){if(!e.target.classList.contains("sv"))return;
 var c=e.target.closest(".c"),hu=c.querySelector(".hu").value.trim(),pg=c.querySelector(".pg").value;if(hu)pg="hosted";
 var r=await db.from("submissions").update({progress:pg,progress_note:c.querySelector(".nt").value.trim()||null,hosted_url:hu||null}).eq("id",c.dataset.id);
 c.querySelector(".ok").textContent=r.error?"Failed: "+r.error.message:"Saved"});


/* ---------------- Build for a customer ---------------- */
var BUILD_FILES={"chasing-her":"build-chasingher.html","memories":"build-memories.html"};
function isPaid(o){return o.status&&o.status!=="pending_payment"}
function payTag(o){return isPaid(o)?'<span class="tag on">Paid</span>':o.returned_from_payment_at?'<span class="tag on" style="background:#FFF3D6;color:#7A5A10">Back from payment, confirm</span>':'<span class="tag off">Not paid yet</span>'}
function hasBuild(o){return !!(o.project_data||o.build_saved_at)}
function buildTag(o){return hasBuild(o)?'<span class="tag on">Build saved</span>':'<span class="tag off">No saved build</span>'}
function buildPanel(o){if(!o.slug)return'';
 var cur=o.build_product||(o.product!=="custom"?o.product:"chasing-her");
 return'<div class="bp" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--deep)"><label>Design to build for them<select class="bsel">'
  +[["chasing-her","Chasing Her"],["memories","Memories"]].map(function(x){return'<option value="'+x[0]+'"'+(cur===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label>'
  +'<button class="b bo">'+(hasBuild(o)?'Open their build':'Start their build')+'</button> <span class="m bm"></span>'
  +'<p class="hint">Opens the builder for that design with this customer attached. Press "Save to customer\'s account" there and it appears in their account as Continue building.</p></div>'}
document.addEventListener("click",async function(e){if(!e.target.classList.contains("bo"))return;
 var c=e.target.closest(".c"),row=ROWS.filter(function(r){return String(r.id)===c.dataset.id})[0],m=c.querySelector(".bm");if(!row)return;
 var design=c.querySelector(".bsel").value;m.textContent="";
 // Remember the choice on the order so their account knows which builder to open. Ignore the error if the column isn't added yet.
 var r=await db.from("submissions").update({build_product:design}).eq("id",row.id);
 if(r.error)m.textContent="Opening (run supabase-fixes.sql to remember the design on their account).";
 row.build_product=design;
 var qs=new URLSearchParams({resume:row.slug,admin:"1"});
 if(row.email)qs.set("email",row.email);if(row.full_name)qs.set("name",row.full_name);if(row.whatsapp)qs.set("wa",row.whatsapp);
 window.open(BUILD_FILES[design]+"?"+qs.toString(),"_blank")});

/* ---------------- Payments ---------------- */
var PAY_PRODUCTS=[["chasing-her","Chasing Her"],["memories","Memories"],["custom","Custom build"]];
async function loadPay(){var p=$("p-pay");p.innerHTML='<p class="m">Loading…</p>';
 var r=await db.from("settings").select("*").like("key","payment_url_%");
 if(r.error){p.innerHTML='<p class="m">Could not load payment links: '+esc(r.error.message)+'. Have you run the settings part of supabase-customer-portal.sql?</p>';return}
 var vals={};r.data.forEach(function(row){vals[row.key.replace("payment_url_","")]=row.value||""});
 p.innerHTML='<div class="grid two">'+PAY_PRODUCTS.map(function(x){
  return'<div class="c" data-k="'+x[0]+'"><h2>'+x[1]+'</h2><p class="m">Where people are sent to pay after building this design. Leave blank to use the placeholder link until you set one.</p>'
  +'<label>Outbound payment link<input class="pu" inputmode="url" placeholder="https://" value="'+esc(vals[x[0]]||"")+'"></label>'
  +'<button class="b sv2">Save</button> <span class="m ok"></span></div>'}).join("")+'</div>'}
document.addEventListener("click",async function(e){if(!e.target.classList.contains("sv2"))return;
 var c=e.target.closest(".c"),v=c.querySelector(".pu").value.trim(),s=e.target.nextElementSibling;
 var r=await db.from("settings").upsert({key:"payment_url_"+c.dataset.k,value:v||null},{onConflict:"key"});
 s.textContent=r.error?"Failed: "+r.error.message:"Saved — live immediately"});

/* ---------------- Showcase ---------------- */
async function loadShow(){var p=$("p-show");p.innerHTML='<div class="grid two">'+[["chasing-her","Chasing Her"],["memories","Memories"]].map(function(x){
 return'<div class="c" data-p="'+x[0]+'"><h2>'+x[1]+'</h2><p class="m">Image or video shown on the landing page and the design picker.</p><input type="file" accept="image/*,video/*"><button class="b up">Upload and use</button> <span class="m ok"></span></div>'}).join("")+'</div>'}
document.addEventListener("click",async function(e){if(!e.target.classList.contains("up"))return;
 var c=e.target.closest(".c"),f=c.querySelector("input").files[0],s=c.querySelector(".ok");if(!f){s.textContent="Choose a file first";return}
 var path="showcase/"+c.dataset.p+"-"+Date.now()+"."+f.name.split(".").pop();s.textContent="Uploading…";
 var u=await db.storage.from("templates").upload(path,f,{upsert:true,contentType:f.type});if(u.error){s.textContent=u.error.message;return}
 var url=db.storage.from("templates").getPublicUrl(path).data.publicUrl;
 var r=await db.from("templates").update({media_url:url,media_type:f.type.indexOf("video")===0?"video":"image"}).eq("product",c.dataset.p).select();
 s.textContent=r.error?r.error.message:(r.data.length?"Live on landing page and picker":"Add an example for this design in Orders first")});

/* ---------------- Testimonials ---------------- */
var TESTI=[],tEditId=null;
async function loadTesti(){var p=$("p-testi");p.innerHTML='<p class="m">Loading…</p>';
 var r=await db2.from("testimonials").select("*").order("display_order",{ascending:true});
 if(r.error){p.innerHTML='<p class="m">Could not load testimonials: '+esc(r.error.message)+'. Have you run testimonials-setup.sql on the landing-page project?</p>';return}
 TESTI=r.data;
 p.innerHTML='<div class="grid two"><div class="c"><h2 id="tTitle">Add a testimonial</h2>'
 +'<label>Type<select id="tKind"><option value="photo">Photo</option><option value="video">Video</option></select></label>'
 +'<label>Customer name<input id="tName" placeholder="a happy customer"></label>'
 +'<label>Quote<textarea id="tQuote" rows="3" placeholder="What they said…"></textarea></label>'
 +'<label>Photo (or video thumbnail)<input type="file" id="tMedia" accept="image/*"></label><p class="hint">Uploads to the testimonials storage bucket.</p>'
 +'<div id="tVideoWrap" hidden><label>Video link<input id="tVideoUrl" inputmode="url" placeholder="https://drive.google.com/file/d/…/view?usp=sharing"></label><p class="hint">Google Drive (shared as "Anyone with the link"), YouTube, or a direct video file link.</p></div>'
 +'<div class="grid two"><label>Display order<input id="tOrder" type="number" value="0"></label><label>Published<select id="tPublished"><option value="true">Yes</option><option value="false">No</option></select></label></div>'
 +'<p class="m" id="tErr" style="color:#a3262e"></p>'
 +'<button class="b" id="tSave">Save testimonial</button> <button class="b-ghost" id="tCancel" hidden>Cancel</button></div>'
 +'<div id="tList" class="grid"></div></div>';
 $("tKind").onchange=function(){$("tVideoWrap").hidden=$("tKind").value!=="video"};
 $("tCancel").onclick=resetTesti;$("tSave").onclick=saveTesti;
 drawTesti()}
function drawTesti(){$("tList").innerHTML=TESTI.map(function(t){
 var thumb=t.media_url?'<img class="thumb" src="'+esc(t.media_url)+'" alt="">':'<div class="ph">No photo</div>';
 return'<div class="c t-item" data-id="'+t.id+'">'+thumb+'<div class="t-body"><div class="row" style="margin-bottom:4px"><span class="t">'+esc(t.kind)+'</span><span class="tag '+(t.is_published?'on':'off')+'">'+(t.is_published?"Published":"Hidden")+'</span><span class="t">order '+t.display_order+'</span></div>'
 +'<p style="margin:4px 0 2px">'+esc(t.quote)+'</p><p class="m">— '+esc(t.customer_name||"a happy customer")+'</p>'
 +'<div class="row" style="margin-top:8px"><button class="b-ghost te">Edit</button><button class="b-danger td">Delete</button></div></div></div>'}).join("")||'<p class="m">No testimonials yet — add your first one on the left.</p>'}
document.addEventListener("click",function(e){
 if(e.target.classList.contains("te")){var row=TESTI.find(function(r){return r.id===e.target.closest(".t-item").dataset.id});if(row)editTesti(row)}
 if(e.target.classList.contains("td")){var id=e.target.closest(".t-item").dataset.id;if(confirm("Delete this testimonial?"))deleteTesti(id)}});
function editTesti(row){tEditId=row.id;$("tTitle").textContent="Edit testimonial";$("tKind").value=row.kind;$("tVideoWrap").hidden=row.kind!=="video";
 $("tName").value=row.customer_name||"";$("tQuote").value=row.quote||"";if($("tVideoUrl"))$("tVideoUrl").value=row.video_url||"";
 $("tOrder").value=row.display_order||0;$("tPublished").value=row.is_published?"true":"false";$("tSave").textContent="Update testimonial";$("tCancel").hidden=false;
 window.scrollTo({top:0,behavior:"smooth"})}
function resetTesti(){tEditId=null;["tName","tQuote"].forEach(function(i){$(i).value=""});if($("tVideoUrl"))$("tVideoUrl").value="";
 $("tMedia").value="";$("tOrder").value=0;$("tPublished").value="true";$("tKind").value="photo";$("tVideoWrap").hidden=true;
 $("tTitle").textContent="Add a testimonial";$("tSave").textContent="Save testimonial";$("tCancel").hidden=true;$("tErr").textContent=""}
async function deleteTesti(id){var r=await db2.from("testimonials").delete().eq("id",id);if(r.error){alert("Could not delete: "+r.error.message);return}loadTesti()}
async function saveTesti(){$("tErr").textContent="";var btn=$("tSave");btn.disabled=true;var orig=btn.textContent;btn.textContent="Saving…";
 try{
  var quote=$("tQuote").value.trim();if(!quote)throw new Error("Add a quote before saving.");
  var mediaUrl=tEditId?(TESTI.find(function(r){return r.id===tEditId})||{}).media_url:null;
  var f=$("tMedia").files[0];
  if(f){var path=Date.now()+"_"+f.name.replace(/\s+/g,"_");
   var up=await db2.storage.from("testimonials").upload(path,f);if(up.error)throw up.error;
   mediaUrl=db2.storage.from("testimonials").getPublicUrl(path).data.publicUrl}
  var payload={kind:$("tKind").value,customer_name:$("tName").value.trim()||"a happy customer",quote:quote,media_url:mediaUrl||null,
   video_url:$("tKind").value==="video"?($("tVideoUrl").value.trim()||null):null,display_order:parseInt($("tOrder").value,10)||0,is_published:$("tPublished").value==="true"};
  var r=tEditId?await db2.from("testimonials").update(payload).eq("id",tEditId):await db2.from("testimonials").insert([payload]);
  if(r.error)throw r.error;
  resetTesti();loadTesti();
 }catch(err){$("tErr").textContent=err.message||"Something went wrong saving this testimonial."}
 finally{btn.disabled=false;btn.textContent=orig}}

/* ---------------- Music library (background music customers can pick from) ---------------- */
var MUSIC=[],mEditId=null;
async function loadMusic(){var p=$("p-music");p.innerHTML='<p class="m">Loading…</p>';
 var r=await db.from("music_library").select("*").order("display_order",{ascending:true});
 if(r.error){p.innerHTML='<p class="m">Could not load the music library: '+esc(r.error.message)+'. Have you run music-library-setup.sql?</p>';return}
 MUSIC=r.data;
 p.innerHTML='<div class="grid two"><div class="c"><h2 id="mTitle">Add a song</h2>'
 +'<label>Title<input id="mTitleIn" placeholder="Song title"></label>'
 +'<label>Artist <span class="m">(optional)</span><input id="mArtist" placeholder="Artist name"></label>'
 +'<label>MP3 file<input type="file" id="mFile" accept="audio/*"></label><p class="hint">Uploads to the templates storage bucket. Leave empty when editing to keep the current file.</p>'
 +'<div class="grid two"><label>Display order<input id="mOrder" type="number" value="0"></label><label>Active<select id="mActive"><option value="true">Yes — customers can pick it</option><option value="false">No — hidden</option></select></label></div>'
 +'<p class="m" id="mErr" style="color:#a3262e"></p>'
 +'<button class="b" id="mSave">Save song</button> <button class="b-ghost" id="mCancel" hidden>Cancel</button></div>'
 +'<div id="mList" class="grid"></div></div>';
 $("mCancel").onclick=resetMusic;$("mSave").onclick=saveMusic;
 drawMusic()}
function drawMusic(){$("mList").innerHTML=MUSIC.map(function(t){
 return'<div class="c" data-id="'+t.id+'"><div class="row"><b>'+esc(t.title)+(t.artist?' — '+esc(t.artist):'')+'</b><span class="tag '+(t.is_active?'on':'off')+'">'+(t.is_active?"Active":"Hidden")+'</span></div>'
 +'<audio controls style="width:100%;margin-top:8px" src="'+esc(t.file_url)+'"></audio>'
 +'<p class="m" style="margin-top:6px">Order '+t.display_order+'</p>'
 +'<div class="row" style="margin-top:8px"><button class="b-ghost me">Edit</button><button class="b-danger md">Delete</button></div></div>'}).join("")||'<p class="m">No songs yet — add your first one on the left.</p>'}
document.addEventListener("click",function(e){
 if(e.target.classList.contains("me")){var row=MUSIC.find(function(r){return r.id===e.target.closest(".c[data-id]").dataset.id});if(row)editMusic(row)}
 if(e.target.classList.contains("md")){var id=e.target.closest(".c[data-id]").dataset.id;if(confirm("Delete this song? Builds already using it will keep playing it, it just won't show as a pick anymore."))deleteMusic(id)}});
function editMusic(row){mEditId=row.id;$("mTitle").textContent="Edit song";$("mTitleIn").value=row.title||"";$("mArtist").value=row.artist||"";
 $("mOrder").value=row.display_order||0;$("mActive").value=row.is_active?"true":"false";$("mSave").textContent="Update song";$("mCancel").hidden=false;
 window.scrollTo({top:0,behavior:"smooth"})}
function resetMusic(){mEditId=null;$("mTitleIn").value="";$("mArtist").value="";$("mFile").value="";$("mOrder").value=0;$("mActive").value="true";
 $("mTitle").textContent="Add a song";$("mSave").textContent="Save song";$("mCancel").hidden=true;$("mErr").textContent=""}
async function deleteMusic(id){var r=await db.from("music_library").delete().eq("id",id);if(r.error){alert("Could not delete: "+r.error.message);return}loadMusic()}
async function saveMusic(){$("mErr").textContent="";var btn=$("mSave");btn.disabled=true;var orig=btn.textContent;btn.textContent="Saving…";
 try{
  var title=$("mTitleIn").value.trim();if(!title)throw new Error("Add a title before saving.");
  var fileUrl=mEditId?(MUSIC.find(function(r){return r.id===mEditId})||{}).file_url:null;
  var f=$("mFile").files[0];
  if(f){var path=Date.now()+"_"+f.name.replace(/\s+/g,"_");
   var up=await db.storage.from("music-library").upload(path,f,{contentType:f.type});if(up.error)throw up.error;
   fileUrl=db.storage.from("music-library").getPublicUrl(path).data.publicUrl}
  if(!fileUrl)throw new Error("Choose an MP3 file.");
  var payload={title:title,artist:$("mArtist").value.trim()||null,file_url:fileUrl,
   display_order:parseInt($("mOrder").value,10)||0,is_active:$("mActive").value==="true"};
  var r=mEditId?await db.from("music_library").update(payload).eq("id",mEditId):await db.from("music_library").insert([payload]);
  if(r.error)throw r.error;
  resetMusic();loadMusic();
 }catch(err){$("mErr").textContent=err.message||"Something went wrong saving this song."}
 finally{btn.disabled=false;btn.textContent=orig}}

/* ---------------- Funnel: where people go + landing prices ---------------- */
var FUNNEL_DEFAULTS={price_page:"20",price_was:"200",price_custom:"50","route_chasing-her":"payment","route_memories":"payment","route_custom":"payment"};
async function loadFunnel(){var p=$("p-funnel");p.innerHTML='<p class="m">Loading…</p>';
 var r=await db.from("settings").select("key,value").in("key",Object.keys(FUNNEL_DEFAULTS));
 if(r.error){p.innerHTML='<p class="m">Could not load funnel settings: '+esc(r.error.message)+'</p>';return}
 var v=Object.assign({},FUNNEL_DEFAULTS);r.data.forEach(function(x){if(x.value!=null&&x.value!=="")v[x.key]=x.value});
 function sel(key,opts){return'<select data-k="'+key+'">'+opts.map(function(o){return'<option value="'+o[0]+'"'+(v[key]===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'}
 var std=[["payment","Straight to payment, then their account"],["builder","Builder first, then payment"]];
 p.innerHTML='<div class="grid two"><div class="c"><h2>After the landing form</h2><p class="m">Where each choice sends people. Takes effect immediately.</p>'
  +'<label>Chasing Her'+sel("route_chasing-her",std)+'</label>'
  +'<label>Memories'+sel("route_memories",std)+'</label>'
  +'<label>Custom build'+sel("route_custom",[["payment","Straight to payment, then their account"],["brief","Brief form first, then payment"]])+'</label>'
  +'<p class="hint">After payment, Selfany should send people to thank-you.html (set that in Selfany). That page forwards them to their account automatically. If a product has no payment link yet (Payments tab), people go to the builder so nobody hits a dead end.</p>'
  +'<button class="b sv3">Save routes</button> <span class="m ok"></span></div>'
  +'<div class="c"><h2>Landing page prices (GHC)</h2><p class="m">Used everywhere on the landing page. The countdown is automatic: it ends at midnight GMT every day, then starts again.</p>'
  +'<label>Today\'s price (the page)<input type="number" min="0" data-k="price_page" value="'+esc(v.price_page)+'"></label>'
  +'<label>Crossed-out regular price<input type="number" min="0" data-k="price_was" value="'+esc(v.price_was)+'"></label>'
  +'<label>Custom build price<input type="number" min="0" data-k="price_custom" value="'+esc(v.price_custom)+'"></label>'
  +'<p class="hint">Only show a crossed-out price you really charge or have charged.</p>'
  +'<button class="b sv3">Save prices</button> <span class="m ok"></span></div></div>'}
document.addEventListener("click",async function(e){if(!e.target.classList||!e.target.classList.contains("sv3"))return;
 var c=e.target.closest(".c"),rows=[];c.querySelectorAll("[data-k]").forEach(function(el){rows.push({key:el.dataset.k,value:String(el.value).trim()})});
 var s=e.target.nextElementSibling,r=await db.from("settings").upsert(rows,{onConflict:"key"});
 s.textContent=r.error?"Failed: "+r.error.message:"Saved. Live immediately"});

/* ---------------- Storage pools: extra Supabase projects for uploads ---------------- */
var POOLS=[],poolEditId=null;
var POOL_KINDS=[["images","Images (photos, flowers)"],["voice","Voice notes"],["music","Music"]];
function mb(n){return(Number(n)/1048576).toFixed(1)}
async function loadStorage(){var p=$("p-storage");p.innerHTML='<p class="m">Loading…</p>';
 var r=await db.from("storage_pools").select("*").order("kind").order("sort_order").order("created_at");
 if(r.error){p.innerHTML='<p class="m">Could not load storage projects: '+esc(r.error.message)+'. Run funnel-and-storage-setup.sql first.</p>';return}
 POOLS=r.data;
 p.innerHTML='<div class="grid two"><div class="c"><h2 id="spTitle">Add a storage project</h2>'
 +'<p class="m">Your current project stays as the general store: it keeps everything already uploaded and the default flower pictures. Projects added here take new uploads, one type each, used in order until they fill up. Then the next one takes over.</p>'
 +'<label>What it stores<select id="spKind">'+POOL_KINDS.map(function(k){return'<option value="'+k[0]+'">'+k[1]+'</option>'}).join('')+'</select></label>'
 +'<label>Name<input id="spLabel" placeholder="e.g. Images 2"></label>'
 +'<label>Supabase project URL<input id="spUrl" inputmode="url" placeholder="https://xxxx.supabase.co"></label>'
 +'<label>Publishable (anon) key<input id="spKey" placeholder="sb_publishable_…"></label>'
 +'<label>Bucket name<input id="spBucket" value="uploads"></label>'
 +'<div class="grid two"><label>Size limit (MB)<input id="spCap" type="number" min="0" value="1000"></label><label>Order (lowest first)<input id="spOrder" type="number" value="0"></label></div>'
 +'<p class="hint">Run storage-pool-project-setup.sql once in each new Supabase project first. It creates the bucket and permissions.</p>'
 +'<p class="m" id="spMsg"></p>'
 +'<button class="b" id="spTest">Test connection</button> <button class="b" id="spSave">Save</button> <button class="b-ghost" id="spCancel" hidden>Cancel</button></div>'
 +'<div id="spList" class="grid"></div></div>';
 $("spTest").onclick=testPoolForm;$("spSave").onclick=savePool;$("spCancel").onclick=resetPool;drawPools()}
function drawPools(){
 var html='<div class="c"><b>General project (current)</b><p class="m">Always the fallback, and the home of the default flower pictures. Nothing here changes.</p></div>';
 POOL_KINDS.forEach(function(k){
  var rows=POOLS.filter(function(x){return x.kind===k[0]});
  html+='<h2 style="margin-top:6px">'+k[1]+'</h2>';
  if(!rows.length)html+='<p class="m">No extra project yet, so these go to the general project.</p>';
  rows.forEach(function(x){
   var cap=x.capacity_mb?x.capacity_mb*1048576:0,pct=cap?Math.min(100,Math.round(Number(x.used_bytes||0)/cap*100)):0,full=cap&&pct>=98,warn=cap&&pct>=80;
   var host="";try{host=new URL(x.supabase_url).host}catch(e){host=x.supabase_url}
   html+='<div class="c sp-card" data-id="'+x.id+'"><div class="row"><b>'+esc(x.label||x.kind)+'</b><span class="tag '+(x.is_active&&!full?'on':'off')+'">'+(full?"Full":x.is_active?"Active":"Paused")+'</span></div>'
   +'<p class="m">'+esc(host)+' · bucket '+esc(x.bucket)+' · order '+(x.sort_order||0)+'</p>'
   +(cap?'<div style="height:8px;background:#EFE9E2;border-radius:100px;margin:8px 0"><div style="height:8px;width:'+pct+'%;background:'+(warn?'#B23B3B':'#5A1A2C')+';border-radius:100px"></div></div><p class="m">'+mb(x.used_bytes||0)+' MB of '+x.capacity_mb+' MB counted'+(warn&&!full?' · nearly full, add another project':'')+'</p>':'<p class="m">'+mb(x.used_bytes||0)+' MB counted, no limit set</p>')
   +'<div class="row" style="margin-top:6px"><button class="b-ghost sp-toggle">'+(x.is_active?"Pause":"Activate")+'</button><button class="b-ghost sp-edit">Edit</button><button class="b-ghost sp-reset">Reset count</button><button class="b-danger sp-del">Remove</button></div></div>'});
 });
 html+='<p class="hint">The count only includes files uploaded through the builders. Supabase does not share exact storage use with this page, so check Supabase > Storage now and then and use Edit to adjust.</p>';
 $("spList").innerHTML=html}
async function testPool(url,key,bucket){
 var c=supabase.createClient(url,key),path="_test/"+Date.now()+".txt";
 var up=await c.storage.from(bucket).upload(path,new Blob(["ok"],{type:"text/plain"}),{upsert:true});
 if(up.error)throw new Error("Upload failed: "+up.error.message);
 var pub=c.storage.from(bucket).getPublicUrl(path).data.publicUrl,ok=false;
 try{var f=await fetch(pub);ok=f.ok}catch(x){}
 try{await c.storage.from(bucket).remove([path])}catch(x){}
 if(!ok)throw new Error("Uploaded, but the file is not publicly readable. Make the bucket public.");
 return"Working. Uploaded and read back a test file."}
function poolForm(){return{kind:$("spKind").value,label:$("spLabel").value.trim(),supabase_url:$("spUrl").value.trim().replace(/\/+$/,""),anon_key:$("spKey").value.trim(),bucket:$("spBucket").value.trim(),
 capacity_mb:parseInt($("spCap").value,10)||null,sort_order:parseInt($("spOrder").value,10)||0}}
async function testPoolForm(){var f=poolForm(),m=$("spMsg");m.style.color="";
 if(!f.supabase_url||!f.anon_key||!f.bucket){m.style.color="#a3262e";m.textContent="Fill in the URL, key and bucket first.";return}
 m.textContent="Testing…";try{m.textContent=await testPool(f.supabase_url,f.anon_key,f.bucket)}catch(e){m.style.color="#a3262e";m.textContent=e.message}}
async function savePool(){var f=poolForm(),m=$("spMsg");m.style.color="#a3262e";
 if(!f.label||!f.supabase_url||!f.anon_key||!f.bucket){m.textContent="Fill in the name, URL, key and bucket.";return}
 m.style.color="";m.textContent="Checking the connection…";
 try{await testPool(f.supabase_url,f.anon_key,f.bucket)}catch(e){m.style.color="#a3262e";m.textContent="Not saved. "+e.message;return}
 var r=poolEditId?await db.from("storage_pools").update(f).eq("id",poolEditId):await db.from("storage_pools").insert([Object.assign({is_active:true},f)]);
 if(r.error){m.style.color="#a3262e";m.textContent=r.error.message;return}
 poolEditId=null;loadStorage()}
function editPool(x){poolEditId=x.id;$("spTitle").textContent="Edit storage project";$("spKind").value=x.kind;$("spLabel").value=x.label||"";$("spUrl").value=x.supabase_url||"";$("spKey").value=x.anon_key||"";
 $("spBucket").value=x.bucket||"";$("spCap").value=x.capacity_mb||"";$("spOrder").value=x.sort_order||0;$("spCancel").hidden=false;window.scrollTo({top:0,behavior:"smooth"})}
function resetPool(){poolEditId=null;loadStorage()}
document.addEventListener("click",async function(e){var t=e.target;if(!t.classList)return;var card=t.closest(".sp-card");if(!card)return;
 var id=card.dataset.id,row=POOLS.find(function(x){return x.id===id});if(!row)return;var r;
 if(t.classList.contains("sp-toggle")){r=await db.from("storage_pools").update({is_active:!row.is_active}).eq("id",id);if(r.error){alert(r.error.message);return}loadStorage()}
 if(t.classList.contains("sp-edit"))editPool(row);
 if(t.classList.contains("sp-reset")&&confirm("Reset the usage count to 0? Do this only after checking real usage in Supabase.")){r=await db.from("storage_pools").update({used_bytes:0}).eq("id",id);if(r.error){alert(r.error.message);return}loadStorage()}
 if(t.classList.contains("sp-del")&&confirm("Remove this project from the list? Files already stored there keep working.")){r=await db.from("storage_pools").delete().eq("id",id);if(r.error){alert(r.error.message);return}loadStorage()}});

if(sessionStorage.getItem("orders_unlocked"))unlock();
</script></body></html>
