<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My site — Chasing Her</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,400&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FBF3EA;--deep:#F5E9DC;--blush:#F5DAD5;--wine:#5A1A2C;--ink:#33101B;--gold:#DCC397;--brown:#7A5A47;--ok:#2E7D4F}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:#2B1710;font:16px/1.6 Manrope,system-ui,sans-serif}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:500;color:var(--ink);margin:0;line-height:1.15}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 110px}
.brand{display:flex;align-items:center;gap:8px;font-family:Fraunces,serif;font-size:18px;color:var(--wine);margin-bottom:28px}
.card{background:#FFFDFB;border:1px solid var(--deep);border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 16px 36px -24px rgba(90,26,44,.35)}
input{width:100%;font:inherit;padding:14px 16px;border:1.5px solid var(--gold);border-radius:14px;background:#fff;margin:14px 0 12px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:15px 20px;border:0;border-radius:100px;background:var(--wine);color:var(--ivory);font:700 16px Manrope,sans-serif;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--gold)}
.muted{color:var(--brown);font-size:14.5px}.err{color:#a3262e;font-size:14px;min-height:20px}
ol{list-style:none;margin:18px 0 0;padding:0}
li{position:relative;padding:0 0 18px 34px;color:var(--brown)}
li::before{content:"";position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:50%;border:2px solid var(--gold);background:#fff}
li::after{content:"";position:absolute;left:8px;top:23px;bottom:0;width:2px;background:var(--gold)}li:last-child::after{display:none}
li.done{color:#2B1710}li.done::before{background:var(--ok);border-color:var(--ok)}
li.now{color:var(--ink);font-weight:700}li.now::before{border-color:var(--wine);background:var(--blush);box-shadow:0 0 0 4px rgba(90,26,44,.12)}
li small{display:block;font-weight:400;color:var(--brown)}
.tag{display:inline-block;background:var(--blush);color:var(--ink);font-size:13px;font-weight:700;padding:4px 12px;border-radius:100px}
.tag.ok{background:#DDF1E4;color:#1d5a37}
.note{background:var(--deep);border-radius:12px;padding:12px 14px;margin-top:6px;font-size:15px}
.wa{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--ivory) 30%)}
.wa .btn{max-width:524px;margin:0 auto;background:#1FA855}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
:focus-visible{outline:2.5px solid var(--wine);outline-offset:3px}
</style></head><body><div class="wrap">
<div class="brand">♥ Chasing Her</div>
<div id="login"><h1>See how your site is coming along</h1>
<p class="muted" style="margin-top:10px">Enter the email you used when you started your site.</p>
<input id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="you@example.com" aria-label="Email address">
<p class="err" id="err" role="alert"></p><button class="btn" id="go">View my site</button></div>
<div id="app" hidden></div></div>
<div class="wa"><a class="btn" id="wa" target="_blank" rel="noopener">Chat with us on WhatsApp</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var URL_="https://zxnqoxyyzspvznehdpnj.supabase.co",KEY="sb_publishable_u3seCQ2HMrlAC9gSjQ7DOw_Eo4Qg2Kc";
var WA="2348094169489",PAYMENT_URL="https://YOUR-PAYMENT-LINK";
var db=supabase.createClient(URL_,KEY),$=function(i){return document.getElementById(i)};
var STEPS=[["received","Order received","We have your details."],["building","We're building it","Your site is being put together."],["review","Final checks","Nearly there."],["hosted","Live","Your site is ready to open."]];
var NAMES={"chasing-her":"Chasing Her","memories":"Memories","custom":"Custom build"};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function wa(t){$("wa").href="https://wa.me/"+WA+"?text="+encodeURIComponent(t)}
wa("Hi! I need help with my site.");
function card(o){
  var cur=o.hosted_url?3:Math.max(0,STEPS.findIndex(function(s){return s[0]===o.progress}));
  var pay=o.status==="pending_payment";
  var h='<div class="card"><div class="row"><h2>'+esc(NAMES[o.product]||o.product)+'</h2><span class="tag'+(cur===3?' ok':'')+'">'+esc(STEPS[cur][1])+'</span></div>';
  if(pay)h+='<p class="muted" style="margin-top:10px">Payment isn\'t confirmed yet.</p><a class="btn" style="margin-top:12px" href="'+PAYMENT_URL+'" target="_blank" rel="noopener">Complete payment</a>';
  h+='<ol>'+STEPS.map(function(s,i){return'<li class="'+(i<cur?'done':i===cur?'now':'')+'">'+s[1]+'<small>'+(i===cur?s[2]:'')+'</small></li>'}).join('')+'</ol>';
  if(o.progress_note)h+='<p class="note">'+esc(o.progress_note)+'</p>';
  if(o.hosted_url)h+='<a class="btn" style="margin-top:14px" href="'+esc(o.hosted_url)+'" target="_blank" rel="noopener">Open my site</a>';
  return h+'</div>';
}
async function show(email){
  var r=await db.rpc("customer_lookup",{p_email:email});
  if(r.error){$("err").textContent="We couldn't load your site. Check your connection and try again.";return}
  if(!r.data.length){$("err").textContent="We can't find that email. Use the same email you entered when you started.";return}
  localStorage.setItem("cust_email",email);
  $("login").hidden=true;$("app").hidden=false;
  $("app").innerHTML='<h1>Hi '+esc((r.data[0].full_name||"there").split(" ")[0])+'</h1><p class="muted" style="margin-top:8px">'+esc(email)+' · <a href="#" id="out" style="color:var(--wine)">Not you?</a></p>'+r.data.map(card).join('');
  $("out").onclick=function(e){e.preventDefault();localStorage.removeItem("cust_email");location.href=location.pathname};
  wa("Hi! I'm "+(r.data[0].full_name||"a customer")+" ("+email+"). I need help with my site.");
}
$("go").onclick=function(){var e=$("em").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e)){$("err").textContent="Enter a valid email address.";return}$("err").textContent="";show(e)};
$("em").onkeydown=function(e){if(e.key==="Enter")$("go").click()};
var q=new URLSearchParams(location.search).get("email")||localStorage.getItem("cust_email");
if(q){$("em").value=q;show(q)}
</script></body></html>
