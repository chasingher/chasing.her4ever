<style>
  /* Boot splash (B3): plain CSS in the head so it paints before any script has loaded. */
  html,body{margin:0}
  #boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;
    background:#fdf6ee;color:#7a6a62;font:400 15px/1.5 'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  #boot p{margin:0}
  #boot .boot-heart{width:56px;height:56px;color:#c2185b;filter:drop-shadow(0 10px 16px rgba(194,24,91,.3));animation:bootPulse 2.4s ease-in-out infinite}
  #boot .boot-slow{font-size:14px}
  @keyframes bootPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @media (prefers-reduced-motion:reduce){#boot .boot-heart{animation:none}}
</style>
<noscript><style>#boot .boot-heart,#boot .boot-text{display:none}</style></noscript>



</head>
<body>
<div id="root"><div id="boot" role="status" aria-live="polite">
  <svg class="boot-heart" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27.5s-11-7-11-14.6C5 8.4 8.2 5 12 5c1.9 0 3.6.9 4.6 2.4C17.6 5.9 19.3 5 21.2 5 25 5 28 8.4 28 12.9c0 7.6-11 14.6-11 14.6z" fill="currentColor"/></svg>
  <p class="boot-text">Getting your builder ready…</p>
  <p class="boot-slow" id="boot-slow" hidden>Still loading. Slow connection? Hang tight.</p>
  <noscript><p>This builder needs JavaScript to run. Please turn it on in your browser settings, or open this page in a different browser.</p></noscript>
</div></div>
<script>setTimeout(function(){var s=document.getElementById("boot-slow");if(s)s.hidden=false;},Math.max(0,8000-(window.performance&&performance.now?performance.now():0)));</script>

<style>
  :root{
    --ink: #241010;
    --ink-soft: #7a6a62;
    --panel: #fdf6ee;
    --panel-soft: #f6ead9;
    --line: rgba(36,16,16,.12);
    --accent: #c2185b;
    --accent-deep: #96123f;
    --gold: #cf9f4e;
    --gold-soft: #e0b975;
    --good: #3d7a4f;
    --bad: #b23b3b;
    --font-display: 'Dancing Script', cursive;
    --font-ui: 'Poppins', sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; }
  body{ font-family: var(--font-ui); background: var(--ink); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; }
  #root{ min-height:100%; }
  ::selection{ background: var(--accent); color:#fff; }
  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- Gate screen ---------- */
  .gate{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:40px 20px; text-align:center;
    background: radial-gradient(circle at 50% 20%, #3a1414 0%, var(--ink) 65%);
    color: #f3e3d3;
  }
  .gate-mark{ font-family:var(--font-display); font-size:2.6rem; color:#f3e3d3; text-shadow: 0 4px 20px rgba(194,24,91,.4); }
  .gate-sub{ font-size:.85rem; letter-spacing:.04em; color:#c9ab98; max-width:360px; line-height:1.5; }
  .gate form{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .gate input{
    padding:12px 16px; border-radius:10px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06); color:#fff; font-size:.95rem; min-width:220px;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .gate input:focus{
    outline:none; border-color: var(--gold); background:rgba(255,255,255,.09);
    box-shadow: 0 0 0 3px rgba(232,194,122,.16);
  }
  .gate input::placeholder{ color:rgba(255,255,255,.4); }
  .gate button{
    padding:12px 22px; border-radius:10px; border:none;
    background: linear-gradient(155deg, var(--accent), var(--accent-deep)); color:#fff;
    font-weight:600; font-size:.9rem; letter-spacing:.02em;
    box-shadow: 0 8px 20px rgba(194,24,91,.35);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .gate button:hover{ transform: translateY(-2px); box-shadow: 0 12px 26px rgba(194,24,91,.45); }
  .gate-error{ color:#ff9f9f; font-size:.85rem; min-height:1em; }

  /* ---------- Setup notice ---------- */
  .setup-notice{
    max-width:560px; margin:60px auto; background:var(--panel); border-radius:16px; padding:32px 36px;
    box-shadow:0 20px 50px rgba(0,0,0,.35); line-height:1.6;
  }
  .setup-notice h1{ font-family:var(--font-display); font-size:2rem; margin:0 0 6px; color:var(--accent-deep); }
  .setup-notice code{ background:var(--panel-soft); padding:2px 6px; border-radius:6px; font-size:.85em; }

  /* ---------- App shell ---------- */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:280px; flex:0 0 280px; background: linear-gradient(180deg,#2c1212,#1c0b0b);
    color:#f3e3d3; padding:26px 18px; display:flex; flex-direction:column; gap:18px;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; padding:0 6px 14px; border-bottom:1px solid rgba(255,255,255,.1); }
  .brand-mark{ font-family:var(--font-display); font-size:1.8rem; text-shadow: 0 2px 12px rgba(194,24,91,.35); }
  .brand-sub{ font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:#c9ab98; }

  .new-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 14px; border-radius:10px; border:1px dashed rgba(255,255,255,.35);
    background:transparent; color:#f3e3d3; font-size:.88rem; font-weight:500;
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .new-btn:hover{ background:rgba(255,255,255,.07); border-color:var(--gold); transform: translateY(-1px); }

  .project-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin:0 -6px; padding:0 6px; }
  .project-item{
    text-align:left; padding:10px 12px; border-radius:10px; border:1px solid transparent;
    background:transparent; color:#e9d6c6; font-size:.86rem; display:flex; flex-direction:column; gap:2px;
    transition: background .16s ease, border-color .16s ease;
  }
  .project-item:hover{ background:rgba(255,255,255,.07); }
  .project-item.active{ background:rgba(194,24,91,.24); border-color:rgba(194,24,91,.55); }
  .project-item .slug{ font-weight:600; color:#fff; }
  .project-item .meta{ font-size:.72rem; color:#b79a89; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .project-empty{ font-size:.8rem; color:#a98b7c; padding:10px 6px; line-height:1.5; }

  .sidebar-foot{ font-size:.68rem; color:#8a6f62; line-height:1.5; padding:0 6px; }

  .main{ flex:1; overflow-y:auto; background: var(--ink); }
  .main-inner{ max-width:800px; margin:0 auto; padding:40px 32px 140px; }

  .topline{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
  .topline h1{ font-family:var(--font-display); font-size:2.1rem; color:#f3e3d3; margin:0; }
  .topline .status{ font-size:.78rem; color:#c9ab98; }
  .topline .status.err{ color:#ff9f9f; }
  .topline .status.ok{ color:#8fd19e; }

  .fix-banner{
    background:#3a1414; border:1px solid #c2185b; border-radius:14px;
    padding:18px 20px; margin-bottom:22px; color:#ffe3e3;
  }
  .fix-banner-text{ font-size:.86rem; line-height:1.5; margin-bottom:10px; }
  .fix-banner-sql{
    display:block; background:#1c0b0b; border-radius:8px; padding:10px 12px;
    font-size:.78rem; color:#ffd3a8; overflow-x:auto; white-space:pre; margin-bottom:10px;
  }
  .fix-banner-actions{ display:flex; gap:10px; }
  .fix-banner-check{
    background: var(--accent); border:1px solid var(--accent); color:#fff;
    border-radius:8px; padding:6px 14px; font-size:.76rem; font-weight:600;
    transition: background .16s ease;
  }
  .fix-banner-check:hover{ background: var(--accent-deep); }
  .fix-banner-check:disabled{ opacity:.6; cursor:default; }
  .fix-banner-dismiss{
    background:transparent; border:1px solid rgba(255,255,255,.3); color:#ffe3e3;
    border-radius:8px; padding:6px 14px; font-size:.76rem;
  }
  .fix-banner-dismiss:hover{ border-color:#ff9f9f; }

  .card{
    background:var(--panel); border-radius:16px; padding:26px 28px; margin-bottom:20px;
    box-shadow:0 14px 34px rgba(0,0,0,.28);
    border:1px solid rgba(36,16,16,.05);
  }
  .card h2{ margin:0 0 4px; font-size:1.05rem; color:var(--accent-deep); display:flex; align-items:center; gap:8px; }
  .card h2::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--gold); flex-shrink:0; }
  .card .hint{ margin:0 0 18px; font-size:.8rem; color:var(--ink-soft); line-height:1.5; }

  .field{ margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:.78rem; font-weight:600; color:var(--ink); margin-bottom:6px; letter-spacing:.01em; }
  .field .field-hint{ font-size:.72rem; color:var(--ink-soft); margin-top:5px; }
  .field input[type=text], .field input[type=password], .field input[type=number], .field textarea{
    width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line); background:#fff;
    font-size:.9rem; color:var(--ink); resize:vertical;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--accent);
    box-shadow: 0 0 0 3px rgba(194,24,91,.12);
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px){ .row2{ grid-template-columns:1fr; } }

  /* Songs */
  .song-row{
    display:grid; grid-template-columns: 1.3fr 1.1fr .6fr 1.3fr auto auto auto; gap:8px; align-items:center;
    padding:10px; border-radius:10px; background:var(--panel-soft); margin-bottom:8px;
  }
  @media (max-width:680px){ .song-row{ grid-template-columns:1fr 1fr; } }
  .song-row input[type=text]{
    padding:8px 10px; border-radius:7px; border:1px solid var(--line); font-size:.82rem; min-width:0;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .song-row input[type=text]:focus{
    outline:none; border-color:var(--accent); box-shadow: 0 0 0 3px rgba(194,24,91,.1);
  }
  .song-row label.chk{ display:flex; align-items:center; gap:5px; font-size:.72rem; color:var(--ink-soft); white-space:nowrap; }
  .row-moves{ display:flex; gap:4px; }
  .icon-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; color:var(--bad); font-size:.9rem; flex-shrink:0;
    transition: background .16s ease, border-color .16s ease;
  }
  .icon-btn:hover{ background:#fdeaea; border-color:rgba(178,59,59,.4); }
  .icon-btn.neutral{ color:var(--ink-soft); }
  .icon-btn.neutral:hover{ background:var(--panel-soft); border-color:var(--line); }
  .add-row-btn{
    padding:9px 16px; border-radius:9px; border:1px dashed var(--accent); background:transparent;
    color:var(--accent-deep); font-size:.82rem; font-weight:600;
    transition: background .16s ease, transform .16s ease;
  }
  .add-row-btn:hover{ background:#fdeef3; transform: translateY(-1px); }

  /* Photos */
  .photo-drop{
    border:2px dashed var(--line); border-radius:14px; padding:26px; text-align:center; cursor:pointer;
    color:var(--ink-soft); font-size:.85rem; margin-bottom:18px;
    transition: border-color .2s ease, background .2s ease, color .2s ease;
  }
  .photo-drop:hover, .photo-drop.drag{ border-color:var(--accent); background:#fdeef3; color:var(--accent-deep); }
  .photo-drop input{ display:none; }

  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:16px; }
  .photo-card{
    background:#fff; border-radius:4px; padding:8px 8px 12px; box-shadow:0 6px 16px rgba(0,0,0,.18);
    transform:rotate(var(--tilt,-2deg)); transition: transform .2s ease, box-shadow .2s ease; position:relative;
  }
  .photo-card:hover{ transform:rotate(0deg) scale(1.03); box-shadow:0 10px 24px rgba(0,0,0,.26); }
  .photo-card .thumb{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:2px; background:var(--panel-soft); display:block;
  }
  .photo-card .ord{
    position:absolute; top:12px; left:12px; background:rgba(36,16,16,.72); color:#fff;
    font-size:.62rem; border-radius:999px; padding:2px 8px;
  }
  .photo-card input{
    width:100%; margin-top:8px; border:none; border-bottom:1px solid var(--line); font-size:.72rem;
    padding:4px 2px; text-align:center; font-family:var(--font-ui); color:var(--ink-soft); background:transparent;
  }
  .photo-card .moves{ display:flex; gap:4px; margin-top:6px; }
  .photo-card .moves button{
    flex:1; border:1px solid var(--line); background:#fff; border-radius:6px; font-size:.65rem;
    color:var(--ink-soft); padding:3px 0;
  }
  .photo-card .remove{
    margin-top:6px; width:100%; border:none; background:none; color:var(--bad); font-size:.68rem;
    letter-spacing:.03em; text-transform:uppercase; padding:2px;
  }
  .photo-card .remove:hover{ text-decoration:underline; }
  .photo-uploading{ font-size:.75rem; color:var(--accent-deep); margin-bottom:10px; }

  /* Audio rows */
  .audio-row{
    display:flex; align-items:center; gap:8px; background:var(--panel-soft);
    border-radius:8px; padding:8px 10px; flex-wrap:wrap;
  }
  .audio-row.in-use{ background:#fbe3ec; box-shadow: inset 0 0 0 1px rgba(194,24,91,.35); }
  .audio-name{ flex:1; min-width:120px; }
  .audio-name .n{ font-size:.82rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .audio-name .m{ font-size:.68rem; color:var(--ink-soft); }
  .scrub{ width:100%; margin:10px 0 4px; accent-color: var(--accent); }
  .trim-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .mini-btn{
    border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 11px;
    font-size:.74rem; color:var(--ink);
  }
  .mini-btn:hover{ background:var(--panel-soft); }
  .mini-btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .mini-btn.primary:hover{ background:var(--accent-deep); }
  .mini-btn.danger{ color:var(--bad); }
  .time-chip{ font-variant-numeric:tabular-nums; font-size:.76rem; color:var(--ink-soft); }

  .live-link-box{
    background: linear-gradient(155deg, rgba(63,122,79,.12), rgba(63,122,79,.05));
    border:1px solid rgba(61,122,79,.35); border-radius:14px;
    padding:16px 18px; margin-bottom:18px;
  }
  .live-link-label{
    font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--good);
    font-weight:600; margin-bottom:6px;
  }
  .live-link-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .live-link-url{
    color:var(--ink); font-size:.88rem; font-weight:600; word-break:break-all;
    text-decoration:none; border-bottom:1px solid transparent;
  }
  .live-link-url:hover{ border-bottom-color: var(--ink); }
  .copy-link-btn{
    background:#fff; border:1px solid rgba(61,122,79,.4); color:var(--good);
    padding:6px 14px; border-radius:8px; font-size:.76rem; font-weight:600;
    transition: background .16s ease, transform .16s ease; flex-shrink:0;
  }
  .copy-link-btn:hover{ background:#effaf1; transform: translateY(-1px); }

  /* Action bar */
  .action-bar{
    position:sticky; bottom:0; left:0; right:0; background:linear-gradient(0deg,var(--ink) 60%,rgba(36,16,16,0));
    padding:26px 0 10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  .btn{
    padding:14px 24px; border-radius:100px; border:none; font-size:.9rem; font-weight:700; letter-spacing:.01em;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn svg{ width:17px; height:17px; flex-shrink:0; }
  .btn-primary{
    background: linear-gradient(155deg, var(--accent), var(--accent-deep)); color:#fff;
    box-shadow: 0 10px 26px -6px rgba(194,24,91,.5);
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 14px 32px -6px rgba(194,24,91,.6); }
  .btn-gold{
    background: linear-gradient(155deg, var(--gold-soft), var(--gold)); color:#3a2405;
    box-shadow: 0 8px 20px rgba(207,159,78,.32);
  }
  .btn-gold:hover{ transform: translateY(-2px); box-shadow: 0 12px 28px rgba(207,159,78,.42); }
  .btn:disabled{ opacity:.5; cursor:default; transform:none !important; box-shadow:none !important; }
  .btn-outline{ background:rgba(255,255,255,.05); border:1.5px solid rgba(255,255,255,.28); color:#f3e3d3; }
  .btn-outline:hover{ background:rgba(255,255,255,.1); border-color:var(--gold); color:#fff; transform: translateY(-2px); }

  .slug-locked{ opacity:.6; }

  /* ---------- customer build page (mobile-first) ---------- */
  .build-shell{ min-height:100vh; background:
      radial-gradient(circle at 15% 0%, rgba(194,24,91,.16), transparent 45%),
      radial-gradient(circle at 90% 12%, rgba(232,194,122,.10), transparent 40%),
      var(--ink); }
  .build-inner{ max-width:640px; margin:0 auto; padding:18px 16px 110px; }

  .back-link{ display:inline-flex; align-items:center; gap:7px; color:#e9d3be; text-decoration:none;
    font-size:13px; font-weight:700; letter-spacing:.01em; padding:9px 16px 9px 12px; border-radius:100px;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.04); margin-bottom:20px;
    transition: background .2s ease, border-color .2s ease, transform .2s ease; }
  .back-link svg{ width:15px; height:15px; transition: transform .2s ease; }
  .back-link:hover{ background:rgba(255,255,255,.1); border-color:var(--gold); color:#fff; }
  .back-link:hover svg{ transform: translateX(-3px); }

  .build-head{ margin-bottom:20px; text-align:center; }
  .build-eyebrow{ font-family:"Dancing Script", cursive; font-size:22px; color:var(--gold); display:flex;
    align-items:center; justify-content:center; gap:8px; }
  .build-eyebrow::before, .build-eyebrow::after{ content:""; height:1px; width:30px;
    background:linear-gradient(90deg, transparent, rgba(232,194,122,.6)); }
  .build-eyebrow::after{ transform:scaleX(-1); }
  .build-head h1{ font-size:clamp(22px,6vw,30px); margin:6px 0 10px; }
  .build-head .status{ display:block; }

  .steps-card .steps-list{ margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px; }
  .steps-list li{ line-height:1.5; }

  .notice-card{ border:1px solid var(--accent); background:#fbe7ee !important; }
  .notice-card h2{ color:var(--accent-deep); }
  .notice-list{ margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px; line-height:1.5; color:var(--ink) !important; }
  .notice-list li{ color:var(--ink); }
  .notice-list strong{ color:var(--accent-deep); }

  .action-bar{ position:sticky; bottom:0; left:0; right:0; margin:28px -16px 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(0deg, var(--ink) 55%, rgba(36,16,16,0)); display:flex; gap:12px; }
  @media (max-width:640px){
    .action-bar{ flex-direction:column; }
    .action-bar .btn{ width:100%; }
    .card{ padding:16px; }
  }

  .preview-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200;
    display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:720px){ .preview-backdrop{ align-items:center; } }
  .preview-modal{ background:#fff; width:100%; max-width:420px; height:88vh; max-height:820px;
    border-radius:18px 18px 0 0; display:flex; flex-direction:column; overflow:hidden; }
  @media (min-width:720px){ .preview-modal{ border-radius:18px; } }
  .preview-modal-head{ display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; background:var(--panel-soft); font-weight:600; color:var(--ink); }
  .preview-close{ background:none; border:none; font-weight:700; color:var(--ink); cursor:pointer; padding:6px 8px; }
  .preview-frame{ flex:1; width:100%; border:none; background:#fff; }

  /* ---------- header colours (the h1 and status text had no colour set here, so they inherited dark ink on the dark shell) ---------- */
  .build-head h1{ color:#fff; }
  .build-head .status{ color:#c9ab98; font-size:.78rem; }
  .build-head .status.err{ color:#ff9f9f; }
  .build-head .status.ok{ color:#8fd19e; }

  /* ---------- save status pill (B4) ---------- */
  .save-pill-slot{ min-height:32px; display:flex; justify-content:center; align-items:center; margin-bottom:4px; }
  .save-pill{ display:inline-flex; align-items:center; gap:8px; padding:5px 13px; border-radius:999px; font-size:.78rem; font-weight:500;
    border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#e9d3be; }
  .save-pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }
  .save-pill.saving .dot{ animation:bhPulse 1.2s ease-in-out infinite; }
  .save-pill.saved{ color:#8fd19e; border-color:rgba(143,209,158,.4); }
  button.save-pill.error{ color:#ffb3b3; border-color:rgba(255,159,159,.55); cursor:pointer; font-family:inherit; }
  button.save-pill.error:hover{ background:rgba(255,159,159,.12); }
  @keyframes bhPulse{ 0%,100%{ opacity:1 } 50%{ opacity:.3 } }

  /* ---------- "Save and continue later" button: under the header on desktop, below the progress card on mobile ---------- */
  .save-later{ margin:0 0 20px; }
  .save-later .btn{ width:100%; }
  .save-later--below{ display:none; }
  @media (max-width:640px){
    .save-later--top{ display:none; }
    .save-later--below{ display:block; }
  }

  /* ---------- progress checklist (B2) ---------- */
  .progress-card{ scroll-margin-top:12px; }
  .progress-card .p-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .progress-card .p-head h2{ margin:0; }
  .progress-card .p-count{ font-size:.85rem; font-weight:600; color:var(--accent-deep); white-space:nowrap; }
  .p-bar{ height:6px; border-radius:99px; background:rgba(224,185,117,.4); overflow:hidden; }
  .p-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .35s ease; }
  .p-list{ list-style:none; margin:10px 0 0; padding:0; }
  .p-row + .p-row{ border-top:1px solid var(--line); }
  .p-row button{ display:flex; align-items:center; gap:12px; width:100%; padding:9px 2px; background:none; border:none; border-radius:10px;
    text-align:left; font-size:15px; color:var(--ink); min-height:46px; }
  .p-row button:hover{ background:rgba(36,16,16,.04); }
  .p-circle{ flex:none; width:28px; height:28px; border-radius:50%; border:2px solid rgba(36,16,16,.28); display:flex; align-items:center; justify-content:center; color:#fff; transition:background .2s ease, border-color .2s ease; }
  .p-circle svg{ width:15px; height:15px; }
  .p-row.done .p-circle{ background:var(--good); border-color:var(--good); }
  .p-label{ flex:1; min-width:0; }
  .p-opt{ flex:none; font-size:.72rem; color:var(--ink-soft); }
  .sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  [id^="sec-"]{ scroll-margin-top:12px; }

  /* ---------- modals (B1, B4) ---------- */
  .bmodal-backdrop{ position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:18px; }
  .bmodal{ width:100%; max-width:420px; background:#fff; color:var(--ink); border-radius:18px; padding:26px 22px 20px; box-shadow:0 30px 70px rgba(0,0,0,.45); text-align:center; }
  .bmodal h2{ margin:0 0 8px; font-size:1.2rem; color:var(--ink); }
  .bmodal p{ margin:0; font-size:.9rem; line-height:1.55; color:var(--ink-soft); }
  .bm-actions{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .bm-primary, .bm-outline{ display:flex; align-items:center; justify-content:center; min-height:48px; padding:12px 18px; border-radius:999px; font-size:.95rem; font-weight:600; text-decoration:none; cursor:pointer; }
  .bm-primary{ background:var(--accent); color:#fff; border:none; }
  .bm-primary:hover{ background:var(--accent-deep); }
  .bm-outline{ background:#fff; color:var(--accent-deep); border:1.5px solid var(--accent); }
  .bm-outline:hover{ background:#fbe7ee; }
  .bm-text{ background:none; border:none; padding:10px; color:var(--ink-soft); font-size:.9rem; font-weight:600; }
  .bm-text:hover{ color:var(--ink); text-decoration:underline; }
  .bm-link{ width:100%; margin-top:16px; padding:12px 14px; font-size:.85rem; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:10px; text-overflow:ellipsis; }
  @media (prefers-reduced-motion:reduce){ .p-fill, .p-circle{ transition:none; } .save-pill.saving .dot{ animation:none; } }
</style>

function slugify(s) {
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function fmtTime(sec) {
  if (sec == null || isNaN(sec)) return "--:--";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
/* Photos are resized and re-encoded in the browser before they go up, and
   several upload at once. A polaroid in the marquee renders about 132px wide
   and the backdrop is a blurred full-screen wash, so 1400px is already more
   than either needs — and it cuts a 4 MB phone photo to a few hundred KB,
   which the visitor's browser then has to download only once. */
const PHOTO_MAX_DIM = 1400;
const FLOWER_MAX_DIM = 900;

async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;
      out[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.max(1, Math.min(limit, items.length)) }, worker));
  return out;
}

async function compressImage(file, maxDim, quality) {
  if (!file.type || !file.type.startsWith("image/") || file.type === "image/gif") return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    if (scale === 1 && file.size < 350 * 1024) { if (bitmap.close) bitmap.close(); return file; }
    const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
    if (bitmap.close) bitmap.close();
    const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", quality || 0.82));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch (e) {
    return file; // unusual format (HEIC, etc.) — send the original rather than fail
  }
}

async function uploadOne(file, slug, folder) {
  const ext = (file.name.match(/\.[^.]+$/) || [""])[0];
  const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "file";
  const path = `${slug}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${base}${ext}`;
  const { error: upErr } = await supabaseClient.storage.from("photos").upload(path, file, { upsert: true, cacheControl: "31536000" });
  if (upErr) throw upErr;
  const { data } = supabaseClient.storage.from("photos").getPublicUrl(path);
  return data.publicUrl;
}

function prettyName(filename) {
  return String(filename || "").replace(/\.[^.]+$/, "").replace(/^\d{10,}-/, "").replace(/[-_]+/g, " ").trim();
}

/* These two live at module scope on purpose — githubUpsertFile below needs
   utf8ToBase64, and buildSiteHtml needs base64ToUtf8. */
function base64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach((b) => { binary += String.fromCharCode(b); });
  return btoa(binary);
}

function buildSiteHtml(slug, projectForm) {
  const templateHtml = base64ToUtf8(TEMPLATE_B64);
  const snapshot = {
    pin: projectForm.pin,
    intro_message: projectForm.intro_message,
    letter_title: projectForm.letter_title,
    letter_body: projectForm.letter_body,
    final_message: projectForm.final_message,
    photos: projectForm.photos,
    flower_images: projectForm.flower_images,
    songs: projectForm.songs
  };
  const startMarker = "/* DEFAULT_CONFIG:START */";
  const endMarker = "/* DEFAULT_CONFIG:END */";
  const startIdx = templateHtml.indexOf(startMarker);
  const endIdx = templateHtml.indexOf(endMarker);
  if (startIdx === -1 || endIdx === -1) throw new Error("Template markers not found.");
  const before = templateHtml.slice(0, startIdx);
  const after = templateHtml.slice(endIdx + endMarker.length);
  const middle = startMarker + "\nconst DEFAULT_CONFIG = " + JSON.stringify(snapshot, null, 2) + ";\n" + endMarker;

  let output = before + middle + after;
  output = output.split('"YOUR_SUPABASE_URL"').join(JSON.stringify(SUPABASE_URL));
  output = output.split('"YOUR_SUPABASE_ANON_KEY"').join(JSON.stringify(SUPABASE_ANON_KEY));
  output = output.split('"YOUR_PROJECT_SLUG"').join(JSON.stringify(slug));
  output = output.split('"YOUR_ORDER_PAGE_URL"').join(JSON.stringify(orderPageUrl()));

  // The music player goes inside <body>, not after the closing </html>, so
  // the browser doesn't have to guess where it belongs.
  const musicBlock = buildMusicBlock(slug, projectForm);
  const bodyClose = output.lastIndexOf("</body>");
  output = bodyClose === -1
    ? output + musicBlock
    : output.slice(0, bodyClose) + musicBlock + "\n" + output.slice(bodyClose);
  return output;
}

async function githubRequest(path, options) {
  options = options || {};
  const res = await fetch("https://api.github.com" + path, {
    ...options,
    headers: {
      Authorization: "Bearer " + GITHUB_TOKEN,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    let message = "GitHub API error (" + res.status + ")";
    try { const body = await res.json(); if (body && body.message) message = body.message; } catch (e) {}
    throw new Error(message);
  }
  if (res.status === 204) return null;
  return res.json();
}
async function githubGetUsername() { const user = await githubRequest("/user"); return user.login; }
async function githubCreateRepo(name) {
  return githubRequest("/user/repos", {
    method: "POST",
    body: JSON.stringify({ name, description: "A little something, built with Backstage.", private: false, auto_init: true })
  });
}
async function githubGetRepo(owner, repo) { return githubRequest("/repos/" + owner + "/" + repo); }
async function githubGetFileSha(owner, repo, path, branch) {
  try {
    const data = await githubRequest("/repos/" + owner + "/" + repo + "/contents/" + path + "?ref=" + encodeURIComponent(branch));
    return data.sha;
  } catch (e) { return null; }
}
async function githubUpsertFile(owner, repo, path, content, message, sha, branch) {
  const body = { message, content: utf8ToBase64(content), branch };
  if (sha) body.sha = sha;
  return githubRequest("/repos/" + owner + "/" + repo + "/contents/" + path, { method: "PUT", body: JSON.stringify(body) });
}
async function githubEnablePages(owner, repo, branch) {
  try {
    await githubRequest("/repos/" + owner + "/" + repo + "/pages", {
      method: "POST", body: JSON.stringify({ source: { branch, path: "/" } })
    });
  } catch (e) { /* likely already enabled — fine to ignore */ }
}
