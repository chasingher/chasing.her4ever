--------------------------------------------------------------------- */
const POLAROID_TILTS = [-3, 2, -2, 3, -4, 1.5, -1.5, 2.5];

function ImageUploader({ slug, folder, items, onChange, withCaption, dropLabel, missingSlugLabel, orderNote }) {
  const [uploading, setUploading] = React.useState(false);
  const [progress, setProgress] = React.useState(null);
  const [dragOver, setDragOver] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInput = React.useRef(null);

  async function handleFiles(fileList) {
    setError("");
    if (!slug) { setError(missingSlugLabel || "Give the project a slug first (above) — uploads are filed under it."); return; }
    if (!supabaseClient) { setError("Connect Supabase first (see SETUP.md)."); return; }
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setUploading(true);
    setProgress({ done: 0, total: files.length });
    let done = 0;
    const maxDim = folder === "flowers" ? FLOWER_MAX_DIM : PHOTO_MAX_DIM;
    const results = await mapLimit(files, 4, async (file) => {
      try {
        const small = await compressImage(file, maxDim);
        const url = await uploadOne(small, slug, folder);
        done++; setProgress({ done, total: files.length });
        return { url, caption: "" };
      } catch (e) {
        setError("Some images didn't upload: " + (e.message || e));
        done++; setProgress({ done, total: files.length });
        return null;
      }
    });
    onChange([...items, ...results.filter(Boolean)]);
    setUploading(false);
    setProgress(null);
  }

  function updateCaption(i, caption) {
    const next = items.slice();
    next[i] = { ...next[i], caption };
    onChange(next);
  }
  function remove(i) { onChange(items.filter((_, idx) => idx !== i)); }
  function move(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= items.length) return;
    const next = items.slice();
    const tmp = next[i]; next[i] = next[j]; next[j] = tmp;
    onChange(next);
  }

  return (
    <div>
      <div className={"photo-drop" + (dragOver ? " drag" : "")}
        onClick={() => fileInput.current && fileInput.current.click()}
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); }}>
        <input ref={fileInput} type="file" accept="image/*" multiple onChange={(e) => handleFiles(e.target.files)} />
        {uploading
          ? `Shrinking and uploading ${progress ? progress.done + " of " + progress.total : ""}…`
          : (dropLabel || "Click to choose images, or drag them in")}
      </div>
      {error && <div className="photo-uploading" style={{ color: "var(--bad)" }}>{error}</div>}
      {!!items.length && orderNote && <div className="field-hint" style={{ marginBottom: 10 }}>{orderNote}</div>}
      {!!items.length && (
        <div className="photo-grid">
          {items.map((p, i) => (
            <div className="photo-card" key={p.url + i} style={{ "--tilt": POLAROID_TILTS[i % POLAROID_TILTS.length] + "deg" }}>
              <img className="thumb" src={p.url} alt="" />
              <span className="ord">{i + 1}</span>
              {withCaption && (
                <input type="text" placeholder="caption (optional)" value={p.caption || ""}
                  onChange={(e) => updateCaption(i, e.target.value)} />
              )}
              <div className="moves">
                <button type="button" onClick={() => move(i, -1)} title="Move earlier">↑</button>
                <button type="button" onClick={() => move(i, 1)} title="Move later">↓</button>
              </div>
              <button type="button" className="remove" onClick={() => remove(i)}>Remove</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------
   Music: upload, library (preview / rename / delete), and trimming
--------------------------------------------------------------------- */
function MusicUploader({ slug, value, onChange, onUploaded }) {
  const [uploading, setUploading] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInput = React.useRef(null);

  async function handleFile(file) {
    setError("");
    if (!file) return;
    if (!slug) { setError("Give the project a slug first (above) — uploads are filed under it."); return; }
    if (!supabaseClient) { setError("Connect Supabase first (see SETUP.md)."); return; }
    setUploading(true);
    try {
      const ext = (file.name.match(/\.[^.]+$/) || [".mp3"])[0];
      const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "song";
      const path = `${slug}/music/${Date.now()}-${base}${ext}`;
      const { error: upErr } = await supabaseClient.storage.from("photos").upload(path, file, { upsert: true });
      if (upErr) throw upErr;
      const { data } = supabaseClient.storage.from("photos").getPublicUrl(path);
      onChange(data.publicUrl);
      if (onUploaded) onUploaded();
    } catch (e) {
      setError("Couldn't upload: " + (e.message || e));
    }
    setUploading(false);
  }

  return (
    <div className="field">
      <label>Upload a song file</label>
      <div className="photo-drop" onClick={() => fileInput.current && fileInput.current.click()}>
        <input ref={fileInput} type="file" accept="audio/*" onChange={(e) => handleFile(e.target.files[0])} />
        {uploading ? "Uploading…" : value ? "Replace the current song" : "Click to choose an audio file"}
      </div>
      {error && <div className="photo-uploading" style={{ color: "var(--bad)" }}>{error}</div>}
    </div>
  );
}

function AllSongsManager({ currentUrl, onPick, onCurrentDeleted, refreshKey }) {
  const [songs, setSongs] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState("");
  const [renamingPath, setRenamingPath] = React.useState(null);
  const [renameValue, setRenameValue] = React.useState("");
  const [busyPath, setBusyPath] = React.useState(null);
  const [durations, setDurations] = React.useState({});
  const previewRef = React.useRef(null);
  const [previewingPath, setPreviewingPath] = React.useState(null);

  const refresh = React.useCallback(async () => {
    if (!supabaseClient) { setSongs([]); return; }
    setLoading(true); setError("");
    try {
      const { data: topLevel, error: topErr } = await supabaseClient.storage.from("photos").list("", { limit: 200 });
      if (topErr) throw topErr;
      const folders = (topLevel || []).filter((item) => item.id === null);
      const all = [];
      for (const folder of folders) {
        const slug = folder.name;
        try {
          const { data: files } = await supabaseClient.storage.from("photos").list(`${slug}/music`, { limit: 200 });
          (files || []).forEach((f) => {
            if (!f.name || f.id === null) return;
            const path = `${slug}/music/${f.name}`;
            const { data: pub } = supabaseClient.storage.from("photos").getPublicUrl(path);
            all.push({ slug, name: f.name, path, url: pub.publicUrl });
          });
        } catch (e) { /* no music folder in this project — skip */ }
      }
      all.sort((a, b) => (a.slug + a.name).localeCompare(b.slug + b.name));
      setSongs(all);
    } catch (e) {
      setError("Couldn't load your uploaded songs: " + (e.message || e));
    }
    setLoading(false);
  }, []);

  React.useEffect(() => { refresh(); }, [refresh, refreshKey]);
  React.useEffect(() => () => { if (previewRef.current) previewRef.current.pause(); }, []);

  function stopPreview() {
    if (previewRef.current) { previewRef.current.pause(); previewRef.current = null; }
    setPreviewingPath(null);
  }
  function togglePreview(song) {
    if (previewingPath === song.path) { stopPreview(); return; }
    stopPreview();
    const a = new Audio(song.url);
    a.addEventListener("loadedmetadata", () => setDurations((d) => ({ ...d, [song.path]: a.duration })));
    a.addEventListener("ended", () => setPreviewingPath(null));
    a.play().catch(() => setError("Couldn't play that file."));
    previewRef.current = a;
    setPreviewingPath(song.path);
  }

  async function handleDelete(song) {
    if (!window.confirm(`Delete "${prettyName(song.name)}" from ${song.slug}? Any published site using it will lose its music.`)) return;
    if (previewingPath === song.path) stopPreview();
    setBusyPath(song.path);
    try {
      const { error: delErr } = await supabaseClient.storage.from("photos").remove([song.path]);
      if (delErr) throw delErr;
      if (song.url === currentUrl && onCurrentDeleted) onCurrentDeleted();
      await refresh();
    } catch (e) { setError("Couldn't delete: " + (e.message || e)); }
    setBusyPath(null);
  }

  function startRename(song) {
    setRenamingPath(song.path);
    setRenameValue(prettyName(song.name));
  }

  async function confirmRename(song) {
    const dot = song.name.lastIndexOf(".");
    const ext = dot > 0 ? song.name.slice(dot) : "";
    const cleanBase = slugify(renameValue);
    if (!cleanBase) { setError("Give it a name first."); return; }
    const newPath = `${song.slug}/music/${cleanBase}${ext}`;
    if (newPath === song.path) { setRenamingPath(null); return; }
    setBusyPath(song.path);
    try {
      const { error: moveErr } = await supabaseClient.storage.from("photos").move(song.path, newPath);
      if (moveErr) throw moveErr;
      if (song.url === currentUrl && onPick) {
        const { data: pub } = supabaseClient.storage.from("photos").getPublicUrl(newPath);
        onPick(pub.publicUrl);
      }
      setRenamingPath(null);
      await refresh();
    } catch (e) {
      setError("Couldn't rename: " + (e.message || e) + " — you may need the storage update policy noted at the top of this file.");
    }
    setBusyPath(null);
  }

  return (
    <div className="field">
      <label>Songs uploaded across all your projects</label>
      {error && <div className="field-hint" style={{ color: "var(--bad)" }}>{error}</div>}
      {loading && <div className="field-hint">Loading…</div>}
      {!loading && !songs.length && <div className="field-hint">No songs uploaded yet.</div>}
      {!!songs.length && (
        <div style={{ display: "flex", flexDirection: "column", gap: "6px", maxHeight: "300px", overflowY: "auto" }}>
          {songs.map((s) => {
            const inUse = s.url === currentUrl;
            return (
              <div key={s.path} className={"audio-row" + (inUse ? " in-use" : "")}>
                {renamingPath === s.path ? (
                  <React.Fragment>
                    <input type="text" value={renameValue} autoFocus
                      onChange={(e) => setRenameValue(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") confirmRename(s); if (e.key === "Escape") setRenamingPath(null); }}
                      style={{ flex: 1, minWidth: 120, padding: "6px 8px", borderRadius: "6px", border: "1px solid var(--line)", fontSize: ".8rem" }} />
                    <button type="button" className="mini-btn primary" onClick={() => confirmRename(s)} disabled={busyPath === s.path}>Save name</button>
                    <button type="button" className="mini-btn" onClick={() => setRenamingPath(null)}>Cancel</button>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <button type="button" className="icon-btn neutral" style={{ color: "var(--accent-deep)" }}
                      onClick={() => togglePreview(s)} disabled={busyPath === s.path}
                      title={previewingPath === s.path ? "Stop preview" : "Preview"}>
                      {previewingPath === s.path ? "❚❚" : "▶"}
                    </button>
                    <div className="audio-name">
                      <div className="n">{prettyName(s.name)}</div>
                      <div className="m">
                        {durations[s.path] ? fmtTime(durations[s.path]) + " · " : ""}from {s.slug}{inUse ? " · in use now" : ""}
                      </div>
                    </div>
                    {!inUse && <button type="button" className="mini-btn primary" onClick={() => onPick(s.url)} disabled={busyPath === s.path}>Use this</button>}
                    <button type="button" className="mini-btn" onClick={() => startRename(s)} disabled={busyPath === s.path}>Rename</button>
                    <button type="button" className="mini-btn danger" onClick={() => handleDelete(s)} disabled={busyPath === s.path}>Delete</button>
                  </React.Fragment>
                )}
              </div>
            );
          })}
        </div>
      )}
      <button type="button" onClick={refresh}
        style={{ border: "none", background: "none", color: "var(--ink-soft)", cursor: "pointer", fontSize: ".72rem", marginTop: "8px", padding: 0, textDecoration: "underline" }}>
        ↻ Refresh this list
      </button>
    </div>
  );
}

/* Play the song, scrub through it, and set the start and end points from
   wherever the playhead happens to be — trimming by ear rather than by
   guessing numbers. */
function MusicRangeEditor({ url, start, end, onChangeStart, onChangeEnd }) {
  const audioRef = React.useRef(null);
  const [duration, setDuration] = React.useState(null);
  const [time, setTime] = React.useState(0);
  const [playing, setPlaying] = React.useState(false);
  const [error, setError] = React.useState("");
  const trimmingRef = React.useRef(false);

  React.useEffect(() => {
    setDuration(null); setTime(0); setPlaying(false); setError("");
    if (!url) return;
    const a = new Audio(url);
    a.preload = "metadata";
    audioRef.current = a;
    const onMeta = () => setDuration(a.duration);
    const onTime = () => {
      setTime(a.currentTime);
      const stopAt = end && end > (start || 0) ? end : null;
      if (trimmingRef.current && stopAt && a.currentTime >= stopAt) {
        a.pause(); setPlaying(false); trimmingRef.current = false;
      }
    };
    const onEnd = () => { setPlaying(false); trimmingRef.current = false; };
    const onErr = () => setError("Couldn't read this song — the link may be wrong.");
    a.addEventListener("loadedmetadata", onMeta);
    a.addEventListener("timeupdate", onTime);
    a.addEventListener("ended", onEnd);
    a.addEventListener("error", onErr);
    return () => {
      a.pause();
      a.removeEventListener("loadedmetadata", onMeta);
      a.removeEventListener("timeupdate", onTime);
      a.removeEventListener("ended", onEnd);
      a.removeEventListener("error", onErr);
    };
  }, [url, start, end]);

  function toggle() {
    const a = audioRef.current; if (!a) return;
    if (playing) { a.pause(); setPlaying(false); trimmingRef.current = false; }
    else { a.play().then(() => setPlaying(true)).catch(() => {}); }
  }
  function playTrimmed() {
    const a = audioRef.current; if (!a) return;
    try { a.currentTime = start || 0; } catch (e) {}
    trimmingRef.current = true;
    a.play().then(() => setPlaying(true)).catch(() => {});
  }
  function seek(v) {
    const a = audioRef.current; if (!a) return;
    try { a.currentTime = v; setTime(v); } catch (e) {}
  }

  if (!url) return null;

  return (
    <div className="field">
      <label>Which part of the song should play?</label>
      {error && <div className="field-hint" style={{ color: "var(--bad)" }}>{error}</div>}
      <div className="trim-row">
        <button type="button" className="mini-btn primary" onClick={toggle}>{playing ? "Pause" : "Play"}</button>
        <button type="button" className="mini-btn" onClick={playTrimmed}>Play the trimmed part</button>
        <span className="time-chip">{fmtTime(time)} / {fmtTime(duration)}</span>
      </div>
      <input className="scrub" type="range" min="0" max={duration || 0} step="0.1" value={time}
        onChange={(e) => seek(Number(e.target.value))} aria-label="Scrub through the song" />
      <div className="trim-row">
        <button type="button" className="mini-btn" onClick={() => onChangeStart(Math.floor(time))}>
          Start here ({fmtTime(start || 0)})
        </button>
        <button type="button" className="mini-btn" onClick={() => onChangeEnd(Math.ceil(time))}>
          End here ({end ? fmtTime(end) : "song end"})
        </button>
        {(start || end) ? (
          <button type="button" className="mini-btn danger" onClick={() => { onChangeStart(0); onChangeEnd(null); }}>Clear trim</button>
        ) : null}
      </div>
      <div className="row2">
        <div>
          <label style={{ fontWeight: 400, fontSize: ".72rem" }}>Start at (seconds)</label>
          <input type="number" min="0" step="1" value={start || 0}
            onChange={(e) => onChangeStart(Math.max(0, Number(e.target.value) || 0))} />
        </div>
        <div>
          <label style={{ fontWeight: 400, fontSize: ".72rem" }}>End at (seconds, blank = to the end)</label>
          <input type="number" min="0" step="1" value={end || ""} placeholder={duration ? String(Math.floor(duration)) : ""}
            onChange={(e) => onChangeEnd(e.target.value === "" ? null : Number(e.target.value))} />
        </div>
      </div>
      <div className="field-hint">
        Full length {duration ? fmtTime(duration) : "loading…"} — playing from {fmtTime(start || 0)} to {fmtTime(end || duration)}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   Dashboard
--------------------------------------------------------------------- */
/* =====================================================================
   Autosave, resume link, leave warning and progress checklist
   ---------------------------------------------------------------------
   Drafts are saved through two Supabase functions, save_draft and
   load_draft (see funnel-migration.sql). The public key can only read a
   draft by its exact token, never list them, and the token is 128 bits of
   randomness, so a resume link cannot be guessed.
===================================================================== */
const DRAFT_DEBOUNCE_MS = 2000;
const BUILDER_FILES = { "chasing-her": "build-chasingher.html", "memories": "build-memories.html" };

/* Where the "Made with Chasing Her" link on finished sites points. Leave it empty to use the folder
   this builder is served from (the funnel's home page), or paste the full order-page URL here. */
const ORDER_PAGE_URL = "";
function orderPageUrl() {
  if (ORDER_PAGE_URL) return ORDER_PAGE_URL;
  try { if (/^https?:$/.test(window.location.protocol)) return new URL("./", window.location.href).href; } catch (e) {}
  return "";
}

function newDraftToken(name) {
  const bytes = new Uint8Array(16);
  (window.crypto || window.msCrypto).getRandomValues(bytes);
  const rand = Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
  const base = (slugify(name || "") || "guest").slice(0, 20).replace(/-+$/, "") || "guest";
  return base + "-" + rand;
}
function isDraftToken(t) { return /^[a-z0-9-]{20,96}$/.test(t || ""); }
// "+" in a hand-typed link decodes to a space, so put it back
function normalizeWa(raw) { raw = raw || ""; return /^\s/.test(raw) ? "+" + raw.trim() : raw.trim(); }

function snapOf(f, pinTouched) {
  const { slug, ...rest } = f;
  return JSON.stringify({ f: rest, p: !!pinTouched });
}

function relativeSaved(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return "Saved just now";
  const m = Math.round(s / 60);
  if (m < 60) return "Saved " + m + " min ago";
  const h = Math.round(m / 60);
  if (h < 24) return "Saved " + h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24);
  return "Saved " + d + (d === 1 ? " day ago" : " days ago");
}

async function loadDraftFromServer(token) {
  try {
    const { data, error } = await supabaseClient.rpc("load_draft", { p_token: token });
    if (error || !data) return null;
    return data;
  } catch (e) { return null; }
}

function useDraft({ product, form, setForm, paramName, paramWa, setStatus, onToken }) {
  const [ready, setReady] = React.useState(false);
  const [lead, setLead] = React.useState({ name: paramName, wa: paramWa });
  const [pinTouched, setPinTouched] = React.useState(false);
  const [saveState, setSaveState] = React.useState("idle"); // idle | saving | saved | error
  const [savedAt, setSavedAt] = React.useState(0);
  const [savedSnap, setSavedSnap] = React.useState(null);
  const [, setTick] = React.useState(0);

  const baseSnap = React.useMemo(() => snapOf(blankProject(), false), []);
  const latest = React.useRef({ form, pinTouched, lead });
  latest.current = { form, pinTouched, lead };
  const savedSnapRef = React.useRef(null);
  const inflight = React.useRef(null);
  const unsavedRef = React.useRef(false);

  const snapNow = snapOf(form, pinTouched);
  const reference = savedSnap == null ? baseSnap : savedSnap;
  const unsaved = ready && snapNow !== reference;
  const pristine = savedSnap == null && snapNow === baseSnap;
  unsavedRef.current = unsaved;

  const saveNow = React.useCallback(async () => {
    if (!supabaseClient) return false;
    while (inflight.current) { try { await inflight.current; } catch (e) {} }
    const sent = latest.current;
    if (!sent.form.slug) return false;
    const sentSnap = snapOf(sent.form, sent.pinTouched);
    if (savedSnapRef.current === sentSnap) return true;
    const p = (async () => {
      setSaveState("saving");
      const { error } = await supabaseClient.rpc("save_draft", {
        p_token: sent.form.slug,
        p_product: product,
        p_data: { form: sent.form, meta: { pinTouched: !!sent.pinTouched } },
        p_name: sent.lead.name || null,
        p_wa: sent.lead.wa || null
      });
      if (error) throw error;
      savedSnapRef.current = sentSnap;
      setSavedSnap(sentSnap);
      setSavedAt(Date.now());
      setSaveState("saved");
      // keep the address bar on the resume link so a refresh brings everything back
      try { window.history.replaceState(null, "", window.location.pathname + "?resume=" + encodeURIComponent(sent.form.slug)); } catch (e) {}
    })();
    inflight.current = p;
    try { await p; return true; }
    catch (e) { console.warn("Draft save failed", e); setSaveState("error"); return false; }
    finally { inflight.current = null; }
  }, []);

  // 1) On load: restore the draft named in ?resume=, or start a fresh one with a random token.
  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      const resume = new URLSearchParams(window.location.search).get("resume");
      if (resume && isDraftToken(resume) && supabaseClient) {
        const row = await loadDraftFromServer(resume);
        if (cancelled) return;
        if (row && row.product && row.product !== product && BUILDER_FILES[row.product]) {
          window.location.replace(BUILDER_FILES[row.product] + "?resume=" + encodeURIComponent(resume));
          return;
        }
        if (row && row.data && row.data.form) {
          const restored = { ...blankProject(), ...row.data.form, slug: resume };
          const pt = !!(row.data.meta && row.data.meta.pinTouched);
          const restoredLead = { name: paramName || row.full_name || "", wa: paramWa || normalizeWa(row.whatsapp) };
          setForm(restored);
          setPinTouched(pt);
          setLead(restoredLead);
          const sn = snapOf(restored, pt);
          savedSnapRef.current = sn;
          setSavedSnap(sn);
          setSavedAt(row.updated_at ? Date.parse(row.updated_at) || Date.now() : Date.now());
          setSaveState("saved");
          if (onToken) onToken(resume);
          setStatus({ text: "Welcome back. We restored your draft.", kind: "ok" });
          setReady(true);
          return;
        }
        setStatus({ text: "We couldn't find that saved draft. It may have expired, so you can start a new one here.", kind: "err" });
      }
      const token = newDraftToken(paramName);
      setForm((f) => ({ ...f, slug: token }));
      if (onToken) onToken(token);
      setReady(true);
    })();
    return () => { cancelled = true; };
  }, []);

  // 2) Save about 2 seconds after any change (uploads change the form too).
  React.useEffect(() => {
    if (!ready || !unsaved) return;
    const t = setTimeout(() => { saveNow(); }, DRAFT_DEBOUNCE_MS);
    return () => clearTimeout(t);
  }, [ready, unsaved, snapNow]);

  // 3) Save straight away when the tab is hidden (phones kill background tabs) or the connection comes back.
  React.useEffect(() => {
    const onHide = () => { if (document.visibilityState === "hidden" && unsavedRef.current) saveNow(); };
    const onOnline = () => { if (unsavedRef.current) saveNow(); };
    document.addEventListener("visibilitychange", onHide);
    window.addEventListener("online", onOnline);
    return () => { document.removeEventListener("visibilitychange", onHide); window.removeEventListener("online", onOnline); };
  }, []);

  // keep "Saved 3 min ago" fresh
  React.useEffect(() => {
    const i = setInterval(() => setTick((t) => t + 1), 30000);
    return () => clearInterval(i);
  }, []);

  let pill = null;
  if (ready && !pristine) {
    if (saveState === "error") pill = { kind: "error", text: "Couldn’t save. Retry" };
    else if (unsaved || saveState === "saving") pill = { kind: "saving", text: "Saving…" };
    else if (savedSnap != null) pill = { kind: "saved", text: relativeSaved(savedAt) };
  }

  const resumeLink = form.slug
    ? window.location.origin + window.location.pathname + "?resume=" + encodeURIComponent(form.slug)
    : "";

  return {
    ready, lead, pill, saveState, unsaved, unsavedRef, pristine,
    hasSaved: savedSnap != null, saveNow, resumeLink, setPinTouched, pinTouched
  };
}

function SavePill({ pill, onRetry }) {
  if (!pill) return <div className="save-pill-slot" />;
  const inner = (<React.Fragment><span className="dot" aria-hidden="true"></span>{pill.text}</React.Fragment>);
  return (
    <div className="save-pill-slot" role="status" aria-live="polite">
      {pill.kind === "error"
        ? <button type="button" className="save-pill error" onClick={onRetry}>{inner}</button>
        : <span className={"save-pill " + pill.kind}>{inner}</span>}
    </div>
  );
}

function ProgressCard({ rows, onRowClick }) {
  const counted = rows.filter((r) => !r.optional);
  const done = counted.filter((r) => r.done).length;
  const pct = counted.length ? Math.round((done / counted.length) * 100) : 0;
  return (
    <div className="card progress-card">
      <div className="p-head">
        <h2>Your progress</h2>
        <span className="p-count" aria-live="polite">{done} of {counted.length} done</span>
      </div>
      <div className="p-bar" role="progressbar" aria-valuemin="0" aria-valuemax={counted.length} aria-valuenow={done} aria-label="Progress">
        <div className="p-fill" style={{ width: pct + "%" }}></div>
      </div>
      <ul className="p-list">
        {rows.map((r) => (
          <li key={r.id} className={"p-row" + (r.done ? " done" : "")}>
            <button type="button" onClick={() => onRowClick(r)}>
              <span className="p-circle" aria-hidden="true">
                {r.done && (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5" /></svg>)}
              </span>
              <span className="p-label">{r.label}</span>
              {r.optional && <span className="p-opt">Optional</span>}
              <span className="sr-only">{r.done ? " (done)" : " (not done yet)"}</span>
            </button>
          </li>
        ))}
      </ul>
    </div>
  );
}

function BModal({ onClose, labelledBy, children }) {
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, []);
  return (
    <div className="bmodal-backdrop" onClick={onClose}>
      <div className="bmodal" role="dialog" aria-modal="true" aria-labelledby={labelledBy} onClick={(e) => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

function LeaveModal({ onStay, onLeave }) {
  return (
    <BModal onClose={onStay} labelledBy="leave-title">
      <h2 id="leave-title">Leave without saving?</h2>
      <p>Your photos and words on this page will be lost.</p>
      <div className="bm-actions">
        <button type="button" className="bm-primary" autoFocus onClick={onStay}>Stay and keep building</button>
        <button type="button" className="bm-text" onClick={onLeave}>Leave anyway</button>
      </div>
    </BModal>
  );
}

async function copyText(text, inputEl) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try { if (inputEl) { inputEl.focus(); inputEl.select(); } return document.execCommand("copy"); } catch (e) { return false; }
}

function SaveLaterModal({ state, link, waHref, copied, onCopy, onRetry, onClose }) {
  const inputRef = React.useRef(null);
  return (
    <BModal onClose={onClose} labelledBy="later-title">
      {state === "saving" && (
        <React.Fragment>
          <h2 id="later-title">Saving your progress…</h2>
          <p>One moment.</p>
        </React.Fragment>
      )}
      {state === "error" && (
        <React.Fragment>
          <h2 id="later-title">We couldn’t save just now</h2>
          <p>Please check your connection and try again. Your work is still on this page.</p>
          <div className="bm-actions">
            <button type="button" className="bm-primary" autoFocus onClick={onRetry}>Try again</button>
            <button type="button" className="bm-text" onClick={onClose}>Close</button>
          </div>
        </React.Fragment>
      )}
      {state === "ready" && (
        <React.Fragment>
          <h2 id="later-title">Your progress is saved</h2>
          <p>Open this link on any device to pick up where you left off. Anyone with the link can edit your draft, so keep it to yourself.</p>
          <input ref={inputRef} className="bm-link" type="text" readOnly value={link} aria-label="Resume link" onFocus={(e) => e.target.select()} />
          <div className="bm-actions">
            <a className="bm-primary" href={waHref} target="_blank" rel="noopener" autoFocus>Send to my WhatsApp</a>
            <button type="button" className="bm-outline" onClick={() => onCopy(inputRef.current)}>{copied ? "Copied ✓" : "Copy link"}</button>
            <button type="button" className="bm-text" onClick={onClose}>Close</button>
          </div>
        </React.Fragment>
      )}
    </BModal>
  );
}

function BuildTool() {
  const params = new URLSearchParams(window.location.search);
  const paramName = params.get("name") || "";
  const paramWa = normalizeWa(params.get("wa"));

  const [currentSlug, setCurrentSlug] = React.useState(null); // null = new project
  const [form, setForm] = React.useState(blankProject());
  const [submitting, setSubmitting] = React.useState(false);
  const [status, setStatus] = React.useState({ text: "", kind: "" });
  const [songListKey, setSongListKey] = React.useState(0);
  const [previewOpen, setPreviewOpen] = React.useState(false);
  const [previewHtml, setPreviewHtml] = React.useState("");
  const [submitted, setSubmitted] = React.useState(false);


  const [previewed, setPreviewed] = React.useState(false);
  const [leaveOpen, setLeaveOpen] = React.useState(false);
  const [laterOpen, setLaterOpen] = React.useState(false);
  const [laterState, setLaterState] = React.useState("saving");
  const [copied, setCopied] = React.useState(false);
  const allowLeave = React.useRef(false);

  // Autosave, resume link and the draft's random reference (B4). Replaces the old name+timestamp reference.
  const draft = useDraft({ product: "chasing-her", form, setForm, paramName, paramWa, setStatus, onToken: setCurrentSlug });
  const leadName = draft.lead.name;
  const leadWa = draft.lead.wa;

  // Browser's own prompt for tab close / reload, only while there are changes that are not saved yet (B1).
  React.useEffect(() => {
    const onBeforeUnload = (e) => {
      if (allowLeave.current || !draft.unsavedRef.current) return;
      e.preventDefault();
      e.returnValue = "";
      return "";
    };
    window.addEventListener("beforeunload", onBeforeUnload);
    return () => window.removeEventListener("beforeunload", onBeforeUnload);
  }, []);

  function onBackClick(e) {
    if (draft.unsavedRef.current) { e.preventDefault(); setLeaveOpen(true); }
  }
  function leaveAnyway() {
    allowLeave.current = true;
    window.location.href = "select-product.html";
  }

  function scrollToId(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }
  function onRowClick(r) {
    if (r.action === "preview") { previewSite(); return; }
    if (r.target) scrollToId(r.target);
  }

  async function openSaveLater() {
    if (draft.pristine) {
      setStatus({ text: "Add a photo or some words first, then you can save and come back to it.", kind: "" });
      return;
    }
    setCopied(false);
    setLaterOpen(true);
    setLaterState("saving");
    const ok = (draft.unsavedRef.current || draft.saveState === "error" || !draft.hasSaved) ? await draft.saveNow() : true;
    setLaterState(ok ? "ready" : "error");
  }
  async function retrySaveLater() {
    setLaterState("saving");
    setLaterState((await draft.saveNow()) ? "ready" : "error");
  }
  async function copyLink(inputEl) {
    const ok = await copyText(draft.resumeLink, inputEl);
    setCopied(ok);
    if (ok) setTimeout(() => setCopied(false), 2200);
  }
  const waDigits = String(leadWa || "").replace(/\D/g, "");
  const waHref = "https://wa.me/" + waDigits + "?text=" + encodeURIComponent(
    "Here is my Chasing Her builder link. Open it to keep building where I left off: " + draft.resumeLink);

  const buildRows = () => {
    const pinDone = draft.pinTouched || form.pin !== blankProject().pin;
    const rows = [
      { id: "pin", label: "Unlock code", done: pinDone && !!String(form.pin || "").trim(), target: "sec-pin" },
      { id: "message", label: "Your message", done: !!String(form.letter_body || "").trim(), target: "sec-message" },
      { id: "songs", label: "Songs", optional: true, done: (form.songs || []).length > 0, target: "sec-songs" },
      { id: "photos", label: "Photos", done: (form.photos || []).length >= 1, target: "sec-photos" },
      { id: "music", label: "Background music", optional: true, done: !!String(form.music_url || "").trim(), target: "sec-music" },
      { id: "preview", label: "Preview your site", done: previewed, action: "preview" },
      { id: "continue", label: "Continue to pay", done: submitted, target: "sec-continue" }
    ];
    return rows;
  };

  function startNew() {
    setForm((f) => ({ ...blankProject(), slug: f.slug }));
    setStatus({ text: "", kind: "" });
  }

  function set(field, value) {
    if (field === "pin") draft.setPinTouched(true);
    setForm((f) => ({ ...f, [field]: value }));
  }

  // Sends people who want us to build it for them to the custom-build thank-you page.
  async function goCustomBuild() {
    if (!draft.pristine) {
      // make sure the latest changes are in the draft before asking
      const saved = draft.unsavedRef.current ? await draft.saveNow() : true;
      const msg = saved
        ? "Switch to a custom build? Your progress is saved as a draft for 48 hours, so you can still come back to it. Continue to the custom-build page?"
        : "We couldn't save your latest changes, so leaving now will lose them. Continue to the custom-build page anyway?";
      if (!window.confirm(msg)) return;
    }
    allowLeave.current = true;
    const qs = new URLSearchParams();
    if (leadName) qs.set("name", leadName);
    if (leadWa) qs.set("wa", leadWa);
    qs.set("product", "chasing-her");
    window.location.href = "thankyou-custom.html?" + qs.toString();
  }

  // Preview happens right here on the page, in a small screen — never a
  // separate tab and never a link the customer could copy and send around.
  function previewSite() {
    try {
      const output = buildSiteHtml(form.slug || "preview", form);
      setPreviewHtml(output);
      setPreviewOpen(true);
      setPreviewed(true);
    } catch (e) {
      setStatus({ text: "Couldn't build the preview: " + e.message, kind: "err" });
    }
  }

  // "I'm happy with it" — build the final file, hand a copy to the admin
  // (Supabase), then take them to WhatsApp to pay. Until now the work
  // only lived in the draft (see useDraft), and the customer never gets a link to the file.
  async function submitAndContinue() {
    const slug = slugify(form.slug) || ("guest-" + Date.now().toString(36));
    setSubmitting(true);
    setStatus({ text: "Getting your site ready…", kind: "" });
    try {
      const output = buildSiteHtml(slug, form);
      let htmlUrl = "";
      if (supabaseClient) {
        // 1) Save the full project data itself, so this can be reopened and
        //    edited later in the regular Backstage builder (admin.html) —
        //    same table, same shape as a normal saved project.
        await supabaseClient.from("projects").upsert(
          { ...form, slug, updated_at: new Date().toISOString() },
          { onConflict: "slug" }
        );

        // 2) Also generate and store the finished HTML file, for a quick
        //    download without having to reopen the builder.
        const path = "chasing-her/" + slug + ".html";
        const blob = new Blob([output], { type: "text/html;charset=utf-8" });
        const { error: upErr } = await supabaseClient.storage.from("submissions")
          .upload(path, blob, { upsert: true, contentType: "text/html" });
        if (upErr) throw upErr;
        const { data: pub } = supabaseClient.storage.from("submissions").getPublicUrl(path);
        htmlUrl = pub.publicUrl;

        // 3) A row in "submissions" is what orders-admin.html lists — it
        //    points at both the saved project (by slug) and the HTML file.
        await supabaseClient.from("submissions").insert([{
          slug, product: "chasing-her", full_name: leadName || null, whatsapp: leadWa || null,
          pin: form.pin, html_path: path, html_url: htmlUrl, status: "pending_payment"
        }]);
      }
      setSubmitted(true);
      setStatus({ text: "", kind: "" });
      // Land on the thank-you page first; its WhatsApp button carries the message. The reference goes in
      // sessionStorage, not the address bar: the Meta Pixel on that page sends the URL to Facebook, and the
      // reference is private (it is also the key to this draft).
      try {
        sessionStorage.setItem("chasing_her_order", JSON.stringify({ ref: slug, product: "chasing-her", name: leadName || "" }));
      } catch (e) { /* storage blocked: the thank-you page still works, just without the reference in the message */ }
      allowLeave.current = true;
      window.location.href = "thank-you.html?product=chasing-her";
    } catch (e) {
      setStatus({ text: "Something went wrong saving your work: " + e.message + " — please try again.", kind: "err" });
    }
    setSubmitting(false);
  }

  return (
    <div className="build-shell">
      <div className="build-inner">
        <a className="back-link" href="select-product.html" onClick={onBackClick}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          Back
        </a>

        <div className="build-head">
          <div className="build-eyebrow">Chasing Her</div>
          <h1>Let's put your site together</h1>
          <SavePill pill={draft.pill} onRetry={draft.saveNow} />
          <span className={"status " + status.kind}>{status.text}</span>
        </div>

        <div className="save-later save-later--top">
          <button type="button" className="btn btn-outline" onClick={openSaveLater}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
            Save and continue later
          </button>
        </div>
        <ProgressCard rows={buildRows()} onRowClick={onRowClick} />
        <div className="save-later save-later--below">
          <button type="button" className="btn btn-outline" onClick={openSaveLater}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
            Save and continue later
          </button>
        </div>

        <div className="card" id="sec-pin">
          <h2>Your unlock code</h2>
          <p className="hint">
            This is the code the person you send it to will type in to open your site.
            Pick numbers that are easy for them to guess — like a date that means something to both of you.
          </p>
          <div className="field">
            <label>PIN code</label>
            <input type="text" value={form.pin} onChange={(e) => set("pin", e.target.value)} placeholder="123456" inputMode="numeric" />
          </div>
        </div>

        <div className="card" id="sec-message">
          <h2>Your message</h2>
          <p className="hint">
            Write what you want them to read. It appears a little at a time, like someone is writing it in front of them.
          </p>
          <div className="field">
            <label>Short line at the top</label>
            <input type="text" value={form.intro_message} onChange={(e) => set("intro_message", e.target.value)} />
          </div>
          <div className="field">
            <label>How your letter starts (e.g. "My Dearest,")</label>
            <input type="text" value={form.letter_title} onChange={(e) => set("letter_title", e.target.value)} />
          </div>
          <div className="field">
            <label>Your letter</label>
            <textarea rows={7} value={form.letter_body} onChange={(e) => set("letter_body", e.target.value)} />
            <div className="field-hint">Leave a blank line whenever you want to start a new paragraph. As long a letter as you want is fine.</div>
          </div>
          <div className="field">
            <label>Last line they'll see</label>
            <input type="text" value={form.final_message} onChange={(e) => set("final_message", e.target.value)} />
          </div>
        </div>

        <div className="card" id="sec-songs">
          <h2>Your favourite songs</h2>
          <p className="hint">
            Copy a song's link from the Spotify app and paste it below — make sure it's a link to one <strong>song</strong>,
            not a whole playlist or artist page. If you skip this, your site still works fine.
          </p>
          <SongsEditor songs={form.songs} onChange={(v) => set("songs", v)} />
        </div>

        <div className="card" id="sec-photos">
          <h2>Your photos</h2>
          <p className="hint">
            Add the pictures you want them to see. Put your favourite ones first — those are the ones that show up biggest.
          </p>
          <ImageUploader
            slug={slugify(form.slug)} folder="photos" items={form.photos}
            onChange={(v) => set("photos", v)} withCaption={true}
            dropLabel="Tap to choose photos from your phone"
            missingSlugLabel="One moment — setting things up…"
            orderNote="Your first five photos also drift slowly behind your last message."
          />
        </div>

        <div className="card" id="sec-music">
          <h2>Background music (optional)</h2>
          <p className="hint">
            To have music quietly playing on your site, you need an actual music file (an mp3), not just a link to a
            streaming app. The easiest way: find the song on YouTube, use a "YouTube to mp3" site to save it as an mp3
            file, then upload that file below.
          </p>
          <p className="hint">
            Don't want to do that yourself? You can ask us to add the music for you for a small extra fee — just mention
            it when you message us on WhatsApp.
          </p>
          <div className="field">
            <label>Or paste a direct link to an mp3 file, if you already have one</label>
            <input type="text" value={form.music_url} onChange={(e) => set("music_url", e.target.value)} placeholder="https://…/song.mp3" />
          </div>
          <MusicUploader slug={slugify(form.slug)} value={form.music_url}
            onChange={(v) => set("music_url", v)} onUploaded={() => setSongListKey((k) => k + 1)} />
          <MusicRangeEditor url={form.music_url} start={form.music_start} end={form.music_end}
            onChangeStart={(v) => set("music_start", v)} onChangeEnd={(v) => set("music_end", v)} />
        </div>

        <div className="card notice-card" id="sec-continue">
          <h2>Before you continue</h2>
          <ul className="notice-list">
            <li>Tapping the WhatsApp button below does not publish your site yet — it only takes you to us so you can pay.</li>
            <li>Once you pay, we host your site and it becomes a real, working link you can share.</li>
            <li>Your work saves automatically as a draft, so you can leave and come back with your resume link. If you don't pay within <strong>48 hours</strong> of your last change, your draft is deleted from our system and you'd need to start again.</li>
          </ul>
        </div>

        <div className="card">
          <h2>Prefer we build it for you?</h2>
          <p className="hint">
            Not up for building it yourself? We can do a custom build of this site for you instead.
            You send us the photos and words, and we put it all together.
          </p>
          <button type="button" className="btn btn-gold" style={{ width: "100%" }} onClick={goCustomBuild}>
            I want a custom build instead
          </button>
        </div>

        <div className="action-bar">
          <button className="btn btn-outline" onClick={previewSite}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            Preview my site
          </button>
          <button className="btn btn-primary" onClick={submitAndContinue} disabled={submitting || submitted}>
            {!submitting && !submitted && (
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 4L9 15l-5-5"/></svg>
            )}
            {submitting ? "Getting it ready…" : submitted ? "Sent — check WhatsApp" : "I'm happy with it — continue to pay"}
          </button>
        </div>
      </div>

      {leaveOpen && <LeaveModal onStay={() => setLeaveOpen(false)} onLeave={leaveAnyway} />}
      {laterOpen && (
        <SaveLaterModal state={laterState} link={draft.resumeLink} waHref={waHref} copied={copied}
          onCopy={copyLink} onRetry={retrySaveLater} onClose={() => setLaterOpen(false)} />
      )}

      {previewOpen && (
        <div className="preview-backdrop" onClick={() => setPreviewOpen(false)}>
          <div className="preview-modal" onClick={(e) => e.stopPropagation()}>
            <div className="preview-modal-head">
              <span>Your preview</span>
              <button type="button" className="preview-close" onClick={() => setPreviewOpen(false)}>Close ✕</button>
            </div>
            <iframe className="preview-frame" title="Site preview" srcDoc={previewHtml}></iframe>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  if (!supabaseClient) return <SetupNotice />;
  return <BuildTool />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
