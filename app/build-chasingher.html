<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#241010" />
<title>Build your Chasing Her site</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%8E%9E%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --ink: #241010;
    --ink-soft: #7a6a62;
    --panel: #fdf6ee;
    --panel-soft: #f6ead9;
    --line: rgba(36,16,16,.12);
    --accent: #c2185b;
    --accent-deep: #96123f;
    --gold: #cf9f4e;
    --gold-soft: #e0b975;
    --good: #3d7a4f;
    --bad: #b23b3b;
    --font-display: 'Dancing Script', cursive;
    --font-ui: 'Poppins', sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; }
  body{ font-family: var(--font-ui); background: var(--ink); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; }
  #root{ min-height:100%; }
  ::selection{ background: var(--accent); color:#fff; }
  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- Gate screen ---------- */
  .gate{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:40px 20px; text-align:center;
    background: radial-gradient(circle at 50% 20%, #3a1414 0%, var(--ink) 65%);
    color: #f3e3d3;
  }
  .gate-mark{ font-family:var(--font-display); font-size:2.6rem; color:#f3e3d3; text-shadow: 0 4px 20px rgba(194,24,91,.4); }
  .gate-sub{ font-size:.85rem; letter-spacing:.04em; color:#c9ab98; max-width:360px; line-height:1.5; }
  .gate form{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .gate input{
    padding:12px 16px; border-radius:10px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06); color:#fff; font-size:.95rem; min-width:220px;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .gate input:focus{
    outline:none; border-color: var(--gold); background:rgba(255,255,255,.09);
    box-shadow: 0 0 0 3px rgba(232,194,122,.16);
  }
  .gate input::placeholder{ color:rgba(255,255,255,.4); }
  .gate button{
    padding:12px 22px; border-radius:10px; border:none;
    background: linear-gradient(155deg, var(--accent), var(--accent-deep)); color:#fff;
    font-weight:600; font-size:.9rem; letter-spacing:.02em;
    box-shadow: 0 8px 20px rgba(194,24,91,.35);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .gate button:hover{ transform: translateY(-2px); box-shadow: 0 12px 26px rgba(194,24,91,.45); }
  .gate-error{ color:#ff9f9f; font-size:.85rem; min-height:1em; }

  /* ---------- Setup notice ---------- */
  .setup-notice{
    max-width:560px; margin:60px auto; background:var(--panel); border-radius:16px; padding:32px 36px;
    box-shadow:0 20px 50px rgba(0,0,0,.35); line-height:1.6;
  }
  .setup-notice h1{ font-family:var(--font-display); font-size:2rem; margin:0 0 6px; color:var(--accent-deep); }
  .setup-notice code{ background:var(--panel-soft); padding:2px 6px; border-radius:6px; font-size:.85em; }

  /* ---------- App shell ---------- */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:280px; flex:0 0 280px; background: linear-gradient(180deg,#2c1212,#1c0b0b);
    color:#f3e3d3; padding:26px 18px; display:flex; flex-direction:column; gap:18px;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; padding:0 6px 14px; border-bottom:1px solid rgba(255,255,255,.1); }
  .brand-mark{ font-family:var(--font-display); font-size:1.8rem; text-shadow: 0 2px 12px rgba(194,24,91,.35); }
  .brand-sub{ font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:#c9ab98; }

  .new-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 14px; border-radius:10px; border:1px dashed rgba(255,255,255,.35);
    background:transparent; color:#f3e3d3; font-size:.88rem; font-weight:500;
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .new-btn:hover{ background:rgba(255,255,255,.07); border-color:var(--gold); transform: translateY(-1px); }

  .project-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin:0 -6px; padding:0 6px; }
  .project-item{
    text-align:left; padding:10px 12px; border-radius:10px; border:1px solid transparent;
    background:transparent; color:#e9d6c6; font-size:.86rem; display:flex; flex-direction:column; gap:2px;
    transition: background .16s ease, border-color .16s ease;
  }
  .project-item:hover{ background:rgba(255,255,255,.07); }
  .project-item.active{ background:rgba(194,24,91,.24); border-color:rgba(194,24,91,.55); }
  .project-item .slug{ font-weight:600; color:#fff; }
  .project-item .meta{ font-size:.72rem; color:#b79a89; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .project-empty{ font-size:.8rem; color:#a98b7c; padding:10px 6px; line-height:1.5; }

  .sidebar-foot{ font-size:.68rem; color:#8a6f62; line-height:1.5; padding:0 6px; }

  .main{ flex:1; overflow-y:auto; background: var(--ink); }
  .main-inner{ max-width:800px; margin:0 auto; padding:40px 32px 140px; }

  .topline{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
  .topline h1{ font-family:var(--font-display); font-size:2.1rem; color:#f3e3d3; margin:0; }
  .topline .status{ font-size:.78rem; color:#c9ab98; }
  .topline .status.err{ color:#ff9f9f; }
  .topline .status.ok{ color:#8fd19e; }

  .fix-banner{
    background:#3a1414; border:1px solid #c2185b; border-radius:14px;
    padding:18px 20px; margin-bottom:22px; color:#ffe3e3;
  }
  .fix-banner-text{ font-size:.86rem; line-height:1.5; margin-bottom:10px; }
  .fix-banner-sql{
    display:block; background:#1c0b0b; border-radius:8px; padding:10px 12px;
    font-size:.78rem; color:#ffd3a8; overflow-x:auto; white-space:pre; margin-bottom:10px;
  }
  .fix-banner-actions{ display:flex; gap:10px; }
  .fix-banner-check{
    background: var(--accent); border:1px solid var(--accent); color:#fff;
    border-radius:8px; padding:6px 14px; font-size:.76rem; font-weight:600;
    transition: background .16s ease;
  }
  .fix-banner-check:hover{ background: var(--accent-deep); }
  .fix-banner-check:disabled{ opacity:.6; cursor:default; }
  .fix-banner-dismiss{
    background:transparent; border:1px solid rgba(255,255,255,.3); color:#ffe3e3;
    border-radius:8px; padding:6px 14px; font-size:.76rem;
  }
  .fix-banner-dismiss:hover{ border-color:#ff9f9f; }

  .card{
    background:var(--panel); border-radius:16px; padding:26px 28px; margin-bottom:20px;
    box-shadow:0 14px 34px rgba(0,0,0,.28);
    border:1px solid rgba(36,16,16,.05);
  }
  .card h2{ margin:0 0 4px; font-size:1.05rem; color:var(--accent-deep); display:flex; align-items:center; gap:8px; }
  .card h2::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--gold); flex-shrink:0; }
  .card .hint{ margin:0 0 18px; font-size:.8rem; color:var(--ink-soft); line-height:1.5; }

  .field{ margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:.78rem; font-weight:600; color:var(--ink); margin-bottom:6px; letter-spacing:.01em; }
  .field .field-hint{ font-size:.72rem; color:var(--ink-soft); margin-top:5px; }
  .field input[type=text], .field input[type=password], .field input[type=number], .field textarea{
    width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line); background:#fff;
    font-size:.9rem; color:var(--ink); resize:vertical;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--accent);
    box-shadow: 0 0 0 3px rgba(194,24,91,.12);
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px){ .row2{ grid-template-columns:1fr; } }

  /* Songs */
  .song-row{
    display:grid; grid-template-columns: 1.3fr 1.1fr .6fr 1.3fr auto auto auto; gap:8px; align-items:center;
    padding:10px; border-radius:10px; background:var(--panel-soft); margin-bottom:8px;
  }
  @media (max-width:680px){ .song-row{ grid-template-columns:1fr 1fr; } }
  .song-row input[type=text]{
    padding:8px 10px; border-radius:7px; border:1px solid var(--line); font-size:.82rem; min-width:0;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .song-row input[type=text]:focus{
    outline:none; border-color:var(--accent); box-shadow: 0 0 0 3px rgba(194,24,91,.1);
  }
  .song-row label.chk{ display:flex; align-items:center; gap:5px; font-size:.72rem; color:var(--ink-soft); white-space:nowrap; }
  .row-moves{ display:flex; gap:4px; }
  .icon-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; color:var(--bad); font-size:.9rem; flex-shrink:0;
    transition: background .16s ease, border-color .16s ease;
  }
  .icon-btn:hover{ background:#fdeaea; border-color:rgba(178,59,59,.4); }
  .icon-btn.neutral{ color:var(--ink-soft); }
  .icon-btn.neutral:hover{ background:var(--panel-soft); border-color:var(--line); }
  .add-row-btn{
    padding:9px 16px; border-radius:9px; border:1px dashed var(--accent); background:transparent;
    color:var(--accent-deep); font-size:.82rem; font-weight:600;
    transition: background .16s ease, transform .16s ease;
  }
  .add-row-btn:hover{ background:#fdeef3; transform: translateY(-1px); }

  /* Photos */
  .photo-drop{
    border:2px dashed var(--line); border-radius:14px; padding:26px; text-align:center; cursor:pointer;
    color:var(--ink-soft); font-size:.85rem; margin-bottom:18px;
    transition: border-color .2s ease, background .2s ease, color .2s ease;
  }
  .photo-drop:hover, .photo-drop.drag{ border-color:var(--accent); background:#fdeef3; color:var(--accent-deep); }
  .photo-drop input{ display:none; }

  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:16px; }
  .photo-card{
    background:#fff; border-radius:4px; padding:8px 8px 12px; box-shadow:0 6px 16px rgba(0,0,0,.18);
    transform:rotate(var(--tilt,-2deg)); transition: transform .2s ease, box-shadow .2s ease; position:relative;
  }
  .photo-card:hover{ transform:rotate(0deg) scale(1.03); box-shadow:0 10px 24px rgba(0,0,0,.26); }
  .photo-card .thumb{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:2px; background:var(--panel-soft); display:block;
  }
  .photo-card .ord{
    position:absolute; top:12px; left:12px; background:rgba(36,16,16,.72); color:#fff;
    font-size:.62rem; border-radius:999px; padding:2px 8px;
  }
  .photo-card input{
    width:100%; margin-top:8px; border:none; border-bottom:1px solid var(--line); font-size:.72rem;
    padding:4px 2px; text-align:center; font-family:var(--font-ui); color:var(--ink-soft); background:transparent;
  }
  .photo-card .moves{ display:flex; gap:4px; margin-top:6px; }
  .photo-card .moves button{
    flex:1; border:1px solid var(--line); background:#fff; border-radius:6px; font-size:.65rem;
    color:var(--ink-soft); padding:3px 0;
  }
  .photo-card .remove{
    margin-top:6px; width:100%; border:none; background:none; color:var(--bad); font-size:.68rem;
    letter-spacing:.03em; text-transform:uppercase; padding:2px;
  }
  .photo-card .remove:hover{ text-decoration:underline; }
  .photo-uploading{ font-size:.75rem; color:var(--accent-deep); margin-bottom:10px; }

  /* Audio rows */
  .audio-row{
    display:flex; align-items:center; gap:8px; background:var(--panel-soft);
    border-radius:8px; padding:8px 10px; flex-wrap:wrap;
  }
  .audio-row.in-use{ background:#fbe3ec; box-shadow: inset 0 0 0 1px rgba(194,24,91,.35); }
  .audio-name{ flex:1; min-width:120px; }
  .audio-name .n{ font-size:.82rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .audio-name .m{ font-size:.68rem; color:var(--ink-soft); }
  .scrub{ width:100%; margin:10px 0 4px; accent-color: var(--accent); }
  .trim-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .mini-btn{
    border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 11px;
    font-size:.74rem; color:var(--ink);
  }
  .mini-btn:hover{ background:var(--panel-soft); }
  .mini-btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .mini-btn.primary:hover{ background:var(--accent-deep); }
  .mini-btn.danger{ color:var(--bad); }
  .time-chip{ font-variant-numeric:tabular-nums; font-size:.76rem; color:var(--ink-soft); }

  .live-link-box{
    background: linear-gradient(155deg, rgba(63,122,79,.12), rgba(63,122,79,.05));
    border:1px solid rgba(61,122,79,.35); border-radius:14px;
    padding:16px 18px; margin-bottom:18px;
  }
  .live-link-label{
    font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--good);
    font-weight:600; margin-bottom:6px;
  }
  .live-link-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .live-link-url{
    color:var(--ink); font-size:.88rem; font-weight:600; word-break:break-all;
    text-decoration:none; border-bottom:1px solid transparent;
  }
  .live-link-url:hover{ border-bottom-color: var(--ink); }
  .copy-link-btn{
    background:#fff; border:1px solid rgba(61,122,79,.4); color:var(--good);
    padding:6px 14px; border-radius:8px; font-size:.76rem; font-weight:600;
    transition: background .16s ease, transform .16s ease; flex-shrink:0;
  }
  .copy-link-btn:hover{ background:#effaf1; transform: translateY(-1px); }

  /* Action bar */
  .action-bar{
    position:sticky; bottom:0; left:0; right:0; background:linear-gradient(0deg,var(--ink) 60%,rgba(36,16,16,0));
    padding:26px 0 10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  .btn{
    padding:13px 22px; border-radius:11px; border:none; font-size:.88rem; font-weight:600; letter-spacing:.01em;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn-primary{
    background: linear-gradient(155deg, var(--accent), var(--accent-deep)); color:#fff;
    box-shadow: 0 8px 20px rgba(194,24,91,.32);
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 12px 28px rgba(194,24,91,.42); }
  .btn-gold{
    background: linear-gradient(155deg, var(--gold-soft), var(--gold)); color:#3a2405;
    box-shadow: 0 8px 20px rgba(207,159,78,.32);
  }
  .btn-gold:hover{ transform: translateY(-2px); box-shadow: 0 12px 28px rgba(207,159,78,.42); }
  .btn:disabled{ opacity:.5; cursor:default; transform:none !important; box-shadow:none !important; }
  .btn-outline{ background:transparent; border:1px solid rgba(255,255,255,.3); color:#f3e3d3; }
  .btn-outline:hover{ border-color:var(--gold); color:#fff; transform: translateY(-2px); }

  .slug-locked{ opacity:.6; }

  /* ---------- customer build page (mobile-first) ---------- */
  .build-shell{ min-height:100vh; }
  .build-inner{ max-width:640px; margin:0 auto; padding:22px 16px 90px; }
  .build-head{ margin-bottom:18px; }
  .build-eyebrow{ font-family:"Dancing Script", cursive; font-size:20px; color:var(--gold); }
  .build-head h1{ font-size:clamp(22px,6vw,30px); margin:4px 0 8px; }

  .steps-card .steps-list{ margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px; }
  .steps-list li{ line-height:1.5; }

  .notice-card{ border:1px solid rgba(194,24,91,.35); background:rgba(194,24,91,.06); }
  .notice-list{ margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px; line-height:1.5; }

  .action-bar{ position:sticky; bottom:0; background:var(--panel); padding-top:14px; margin-top:4px; }
  @media (max-width:640px){
    .action-bar{ flex-direction:column; }
    .action-bar .btn{ width:100%; }
    .card{ padding:16px; }
  }

  .preview-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200;
    display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:720px){ .preview-backdrop{ align-items:center; } }
  .preview-modal{ background:#fff; width:100%; max-width:420px; height:88vh; max-height:820px;
    border-radius:18px 18px 0 0; display:flex; flex-direction:column; overflow:hidden; }
  @media (min-width:720px){ .preview-modal{ border-radius:18px; } }
  .preview-modal-head{ display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; background:var(--panel-soft); font-weight:600; color:var(--ink); }
  .preview-close{ background:none; border:none; font-weight:700; color:var(--ink); cursor:pointer; padding:6px 8px; }
  .preview-frame{ flex:1; width:100%; border:none; background:#fff; }
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="text/babel" data-presets="react">
/* =====================================================================
   CONFIGURE ME
   ---------------------------------------------------------------------
   Paste the SAME Supabase project URL + anon key you use in the site
   template here. This tool reads and writes the `projects` table and
   uploads to the `photos` storage bucket — see SETUP.md.

   ADMIN_PASSWORD is a light deterrent, not real security: anyone who
   has this file and the password can read/write your Supabase data,
   because there's no server involved. Keep this file private (don't

   Renaming an uploaded song needs an UPDATE policy on storage.objects
   for the `photos` bucket. If renaming fails with a permissions error:

   create policy "rename photos" on storage.objects for update
     using (bucket_id = 'photos') with check (bucket_id = 'photos');
===================================================================== */
const SUPABASE_URL = "https://zxnqoxyyzspvznehdpnj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_u3seCQ2HMrlAC9gSjQ7DOw_Eo4Qg2Kc";
const ADMIN_PASSWORD = "150406";

/* The visitor-facing site template, base64-encoded so it can be stored

function slugify(s) {
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function fmtTime(sec) {
  if (sec == null || isNaN(sec)) return "--:--";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
/* Photos are resized and re-encoded in the browser before they go up, and
   several upload at once. A polaroid in the marquee renders about 132px wide
   and the backdrop is a blurred full-screen wash, so 1400px is already more
   than either needs — and it cuts a 4 MB phone photo to a few hundred KB,
   which the visitor's browser then has to download only once. */
const PHOTO_MAX_DIM = 1400;
const FLOWER_MAX_DIM = 900;

async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;
      out[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.max(1, Math.min(limit, items.length)) }, worker));
  return out;
}

async function compressImage(file, maxDim, quality) {
  if (!file.type || !file.type.startsWith("image/") || file.type === "image/gif") return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    if (scale === 1 && file.size < 350 * 1024) { if (bitmap.close) bitmap.close(); return file; }
    const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
    if (bitmap.close) bitmap.close();
    const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", quality || 0.82));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch (e) {
    return file; // unusual format (HEIC, etc.) — send the original rather than fail
  }
}

async function uploadOne(file, slug, folder) {
  const ext = (file.name.match(/\.[^.]+$/) || [""])[0];
  const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "file";
  const path = `${slug}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${base}${ext}`;
  const { error: upErr } = await supabaseClient.storage.from("photos").upload(path, file, { upsert: true, cacheControl: "31536000" });
  if (upErr) throw upErr;
  const { data } = supabaseClient.storage.from("photos").getPublicUrl(path);
  return data.publicUrl;
}

function prettyName(filename) {
  return String(filename || "").replace(/\.[^.]+$/, "").replace(/^\d{10,}-/, "").replace(/[-_]+/g, " ").trim();
}

/* These two live at module scope on purpose — githubUpsertFile below needs
   utf8ToBase64, and buildSiteHtml needs base64ToUtf8. */
function base64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach((b) => { binary += String.fromCharCode(b); });
  return btoa(binary);
}

function buildSiteHtml(slug, projectForm) {
  const templateHtml = base64ToUtf8(TEMPLATE_B64);
  const snapshot = {
    pin: projectForm.pin,
    intro_message: projectForm.intro_message,
    letter_title: projectForm.letter_title,
    letter_body: projectForm.letter_body,
    final_message: projectForm.final_message,
    photos: projectForm.photos,
    flower_images: projectForm.flower_images,
    songs: projectForm.songs
  };
  const startMarker = "/* DEFAULT_CONFIG:START */";
  const endMarker = "/* DEFAULT_CONFIG:END */";
  const startIdx = templateHtml.indexOf(startMarker);
  const endIdx = templateHtml.indexOf(endMarker);
  if (startIdx === -1 || endIdx === -1) throw new Error("Template markers not found.");
  const before = templateHtml.slice(0, startIdx);
  const after = templateHtml.slice(endIdx + endMarker.length);
  const middle = startMarker + "\nconst DEFAULT_CONFIG = " + JSON.stringify(snapshot, null, 2) + ";\n" + endMarker;

  let output = before + middle + after;
  output = output.split('"YOUR_SUPABASE_URL"').join(JSON.stringify(SUPABASE_URL));
  output = output.split('"YOUR_SUPABASE_ANON_KEY"').join(JSON.stringify(SUPABASE_ANON_KEY));
  output = output.split('"YOUR_PROJECT_SLUG"').join(JSON.stringify(slug));

  // The music player goes inside <body>, not after the closing </html>, so
  // the browser doesn't have to guess where it belongs.
  const musicBlock = buildMusicBlock(slug, projectForm);
  const bodyClose = output.lastIndexOf("</body>");
  output = bodyClose === -1
    ? output + musicBlock
    : output.slice(0, bodyClose) + musicBlock + "\n" + output.slice(bodyClose);
  return output;
}

async function githubRequest(path, options) {
  options = options || {};
  const res = await fetch("https://api.github.com" + path, {
    ...options,
    headers: {
      Authorization: "Bearer " + GITHUB_TOKEN,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    let message = "GitHub API error (" + res.status + ")";
    try { const body = await res.json(); if (body && body.message) message = body.message; } catch (e) {}
    throw new Error(message);
  }
  if (res.status === 204) return null;
  return res.json();
}
async function githubGetUsername() { const user = await githubRequest("/user"); return user.login; }
async function githubCreateRepo(name) {
  return githubRequest("/user/repos", {

  });

async function githubGetRepo(owner, repo) { return githubRequest("/repos/" + owner + "/" + repo); }
async function githubGetFileSha(owner, repo, path, branch) {
  try {
    const data = await githubRequest("/repos/" + owner + "/" + repo + "/contents/" + path + "?ref=" + encodeURIComponent(branch));
    return data.sha;

}
async function githubUpsertFile(owner, repo, path, content, message, sha, branch) {
  const body = { message, content: utf8ToBase64(content), branch };
  if (sha) body.sha = sha;
  return githubRequest("/repos/" + owner + "/" + repo + "/contents/" + path, { method: "PUT", body: JSON.stringify(body) });
}
async function githubEnablePages(owner, repo, branch) {
  try {
    await githubRequest("/repos/" + owner + "/" + repo + "/pages", {
      method: "POST", body: JSON.stringify({ source: { branch, path: "/" } })
    });
  } catch (e) { /* likely already enabled — fine to ignore */ }
}

function ImageUploader({ slug, folder, items, onChange, withCaption, dropLabel, missingSlugLabel, orderNote }) {
  const [uploading, setUploading] = React.useState(false);
  const [progress, setProgress] = React.useState(null);
  const [dragOver, setDragOver] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInput = React.useRef(null);

  async function handleFiles(fileList) {
    setError("");
    if (!slug) { setError(missingSlugLabel || "Give the project a slug first (above) — uploads are filed under it."); return; }
    if (!supabaseClient) { setError("Connect Supabase first (see SETUP.md)."); return; }
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setUploading(true);
    setProgress({ done: 0, total: files.length });
    let done = 0;
    const maxDim = folder === "flowers" ? FLOWER_MAX_DIM : PHOTO_MAX_DIM;
    const results = await mapLimit(files, 4, async (file) => {
      try {
        const small = await compressImage(file, maxDim);
        const url = await uploadOne(small, slug, folder);
        done++; setProgress({ done, total: files.length });
        return { url, caption: "" };
      } catch (e) {
        setError("Some images didn't upload: " + (e.message || e));
        done++; setProgress({ done, total: files.length });
        return null;
      }
    });
    onChange([...items, ...results.filter(Boolean)]);
    setUploading(false);
    setProgress(null);
  }

  function updateCaption(i, caption) {
    const next = items.slice();
    next[i] = { ...next[i], caption };
    onChange(next);
  }
  function remove(i) { onChange(items.filter((_, idx) => idx !== i)); }
  function move(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= items.length) return;
    const next = items.slice();
    const tmp = next[i]; next[i] = next[j]; next[j] = tmp;
    onChange(next);
  }

  return (
    <div>
      <div className={"photo-drop" + (dragOver ? " drag" : "")}
        onClick={() => fileInput.current && fileInput.current.click()}
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); }}>
        <input ref={fileInput} type="file" accept="image/*" multiple onChange={(e) => handleFiles(e.target.files)} />
        {uploading
          ? `Shrinking and uploading ${progress ? progress.done + " of " + progress.total : ""}…`
          : (dropLabel || "Click to choose images, or drag them in")}
      </div>
      {error && <div className="photo-uploading" style={{ color: "var(--bad)" }}>{error}</div>}
      {!!items.length && orderNote && <div className="field-hint" style={{ marginBottom: 10 }}>{orderNote}</div>}
      {!!items.length && (
        <div className="photo-grid">
          {items.map((p, i) => (
            <div className="photo-card" key={p.url + i} style={{ "--tilt": POLAROID_TILTS[i % POLAROID_TILTS.length] + "deg" }}>
              <img className="thumb" src={p.url} alt="" />
              <span className="ord">{i + 1}</span>
              {withCaption && (
                <input type="text" placeholder="caption (optional)" value={p.caption || ""}
                  onChange={(e) => updateCaption(i, e.target.value)} />
              )}
              <div className="moves">
                <button type="button" onClick={() => move(i, -1)} title="Move earlier">↑</button>
                <button type="button" onClick={() => move(i, 1)} title="Move later">↓</button>
              </div>
              <button type="button" className="remove" onClick={() => remove(i)}>Remove</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MusicUploader({ slug, value, onChange, onUploaded }) {
  const [uploading, setUploading] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInput = React.useRef(null);

  async function handleFile(file) {
    setError("");
    if (!file) return;
    if (!slug) { setError("Give the project a slug first (above) — uploads are filed under it."); return; }
    if (!supabaseClient) { setError("Connect Supabase first (see SETUP.md)."); return; }
    setUploading(true);
    try {
      const ext = (file.name.match(/\.[^.]+$/) || [".mp3"])[0];
      const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "song";
      const path = `${slug}/music/${Date.now()}-${base}${ext}`;
      const { error: upErr } = await supabaseClient.storage.from("photos").upload(path, file, { upsert: true });
      if (upErr) throw upErr;
      const { data } = supabaseClient.storage.from("photos").getPublicUrl(path);
      onChange(data.publicUrl);
      if (onUploaded) onUploaded();
    } catch (e) {
      setError("Couldn't upload: " + (e.message || e));
    }
    setUploading(false);
  }

  return (
    <div className="field">
      <label>Upload a song file</label>
      <div className="photo-drop" onClick={() => fileInput.current && fileInput.current.click()}>
        <input ref={fileInput} type="file" accept="audio/*" onChange={(e) => handleFile(e.target.files[0])} />
        {uploading ? "Uploading…" : value ? "Replace the current song" : "Click to choose an audio file"}
      </div>
      {error && <div className="photo-uploading" style={{ color: "var(--bad)" }}>{error}</div>}
    </div>
  );
}

function AllSongsManager({ currentUrl, onPick, onCurrentDeleted, refreshKey }) {
  const [songs, setSongs] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState("");
  const [renamingPath, setRenamingPath] = React.useState(null);
  const [renameValue, setRenameValue] = React.useState("");
  const [busyPath, setBusyPath] = React.useState(null);
  const [durations, setDurations] = React.useState({});
  const previewRef = React.useRef(null);
  const [previewingPath, setPreviewingPath] = React.useState(null);

  const refresh = React.useCallback(async () => {
    if (!supabaseClient) { setSongs([]); return; }
    setLoading(true); setError("");
    try {
      const { data: topLevel, error: topErr } = await supabaseClient.storage.from("photos").list("", { limit: 200 });
      if (topErr) throw topErr;
      const folders = (topLevel || []).filter((item) => item.id === null);
      const all = [];
      for (const folder of folders) {
        const slug = folder.name;
        try {
          const { data: files } = await supabaseClient.storage.from("photos").list(`${slug}/music`, { limit: 200 });
          (files || []).forEach((f) => {
            if (!f.name || f.id === null) return;
            const path = `${slug}/music/${f.name}`;
            const { data: pub } = supabaseClient.storage.from("photos").getPublicUrl(path);
            all.push({ slug, name: f.name, path, url: pub.publicUrl });
          });
        } catch (e) { /* no music folder in this project — skip */ }
      }
      all.sort((a, b) => (a.slug + a.name).localeCompare(b.slug + b.name));
      setSongs(all);
    } catch (e) {
      setError("Couldn't load your uploaded songs: " + (e.message || e));
    }
    setLoading(false);
  }, []);

  React.useEffect(() => { refresh(); }, [refresh, refreshKey]);
  React.useEffect(() => () => { if (previewRef.current) previewRef.current.pause(); }, []);

  function stopPreview() {
    if (previewRef.current) { previewRef.current.pause(); previewRef.current = null; }
    setPreviewingPath(null);
  }
  function togglePreview(song) {
    if (previewingPath === song.path) { stopPreview(); return; }
    stopPreview();
    const a = new Audio(song.url);
    a.addEventListener("loadedmetadata", () => setDurations((d) => ({ ...d, [song.path]: a.duration })));
    a.addEventListener("ended", () => setPreviewingPath(null));
    a.play().catch(() => setError("Couldn't play that file."));
    previewRef.current = a;
    setPreviewingPath(song.path);
  }

  async function handleDelete(song) {
    if (!window.confirm(`Delete "${prettyName(song.name)}" from ${song.slug}? Any published site using it will lose its music.`)) return;
    if (previewingPath === song.path) stopPreview();
    setBusyPath(song.path);
    try {
      const { error: delErr } = await supabaseClient.storage.from("photos").remove([song.path]);
      if (delErr) throw delErr;
      if (song.url === currentUrl && onCurrentDeleted) onCurrentDeleted();
      await refresh();
    } catch (e) { setError("Couldn't delete: " + (e.message || e)); }
    setBusyPath(null);
  }

  function startRename(song) {
    setRenamingPath(song.path);
    setRenameValue(prettyName(song.name));
  }

  async function confirmRename(song) {
    const dot = song.name.lastIndexOf(".");
    const ext = dot > 0 ? song.name.slice(dot) : "";
    const cleanBase = slugify(renameValue);
    if (!cleanBase) { setError("Give it a name first."); return; }
    const newPath = `${song.slug}/music/${cleanBase}${ext}`;
    if (newPath === song.path) { setRenamingPath(null); return; }
    setBusyPath(song.path);
    try {
      const { error: moveErr } = await supabaseClient.storage.from("photos").move(song.path, newPath);
      if (moveErr) throw moveErr;
      if (song.url === currentUrl && onPick) {
        const { data: pub } = supabaseClient.storage.from("photos").getPublicUrl(newPath);
        onPick(pub.publicUrl);
      }
      setRenamingPath(null);
      await refresh();
    } catch (e) {
      setError("Couldn't rename: " + (e.message || e) + " — you may need the storage update policy noted at the top of this file.");
    }
    setBusyPath(null);
  }

  return (
    <div className="field">
      <label>Songs uploaded across all your projects</label>
      {error && <div className="field-hint" style={{ color: "var(--bad)" }}>{error}</div>}
      {loading && <div className="field-hint">Loading…</div>}
      {!loading && !songs.length && <div className="field-hint">No songs uploaded yet.</div>}
      {!!songs.length && (
        <div style={{ display: "flex", flexDirection: "column", gap: "6px", maxHeight: "300px", overflowY: "auto" }}>
          {songs.map((s) => {
            const inUse = s.url === currentUrl;
            return (
              <div key={s.path} className={"audio-row" + (inUse ? " in-use" : "")}>
                {renamingPath === s.path ? (
                  <React.Fragment>
                    <input type="text" value={renameValue} autoFocus
                      onChange={(e) => setRenameValue(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") confirmRename(s); if (e.key === "Escape") setRenamingPath(null); }}
                      style={{ flex: 1, minWidth: 120, padding: "6px 8px", borderRadius: "6px", border: "1px solid var(--line)", fontSize: ".8rem" }} />
                    <button type="button" className="mini-btn primary" onClick={() => confirmRename(s)} disabled={busyPath === s.path}>Save name</button>
                    <button type="button" className="mini-btn" onClick={() => setRenamingPath(null)}>Cancel</button>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <button type="button" className="icon-btn neutral" style={{ color: "var(--accent-deep)" }}
                      onClick={() => togglePreview(s)} disabled={busyPath === s.path}
                      title={previewingPath === s.path ? "Stop preview" : "Preview"}>
                      {previewingPath === s.path ? "❚❚" : "▶"}
                    </button>
                    <div className="audio-name">
                      <div className="n">{prettyName(s.name)}</div>
                      <div className="m">
                        {durations[s.path] ? fmtTime(durations[s.path]) + " · " : ""}from {s.slug}{inUse ? " · in use now" : ""}
                      </div>
                    </div>
                    {!inUse && <button type="button" className="mini-btn primary" onClick={() => onPick(s.url)} disabled={busyPath === s.path}>Use this</button>}
                    <button type="button" className="mini-btn" onClick={() => startRename(s)} disabled={busyPath === s.path}>Rename</button>
                    <button type="button" className="mini-btn danger" onClick={() => handleDelete(s)} disabled={busyPath === s.path}>Delete</button>
                  </React.Fragment>
                )}
              </div>
            );
          })}
        </div>
      )}
      <button type="button" onClick={refresh}
        style={{ border: "none", background: "none", color: "var(--ink-soft)", cursor: "pointer", fontSize: ".72rem", marginTop: "8px", padding: 0, textDecoration: "underline" }}>
        ↻ Refresh this list
      </button>
    </div>
  );
}

/* Play the song, scrub through it, and set the start and end points from
   wherever the playhead happens to be — trimming by ear rather than by
   guessing numbers. */
function MusicRangeEditor({ url, start, end, onChangeStart, onChangeEnd }) {
  const audioRef = React.useRef(null);
  const [duration, setDuration] = React.useState(null);
  const [time, setTime] = React.useState(0);
  const [playing, setPlaying] = React.useState(false);
  const [error, setError] = React.useState("");
  const trimmingRef = React.useRef(false);

  React.useEffect(() => {
    setDuration(null); setTime(0); setPlaying(false); setError("");
    if (!url) return;
    const a = new Audio(url);
    a.preload = "metadata";
    audioRef.current = a;
    const onMeta = () => setDuration(a.duration);
    const onTime = () => {
      setTime(a.currentTime);
      const stopAt = end && end > (start || 0) ? end : null;
      if (trimmingRef.current && stopAt && a.currentTime >= stopAt) {
        a.pause(); setPlaying(false); trimmingRef.current = false;
      }
    };
    const onEnd = () => { setPlaying(false); trimmingRef.current = false; };
    const onErr = () => setError("Couldn't read this song — the link may be wrong.");
    a.addEventListener("loadedmetadata", onMeta);
    a.addEventListener("timeupdate", onTime);
    a.addEventListener("ended", onEnd);
    a.addEventListener("error", onErr);
    return () => {
      a.pause();
      a.removeEventListener("loadedmetadata", onMeta);
      a.removeEventListener("timeupdate", onTime);
      a.removeEventListener("ended", onEnd);
      a.removeEventListener("error", onErr);
    };
  }, [url, start, end]);

  function toggle() {
    const a = audioRef.current; if (!a) return;
    if (playing) { a.pause(); setPlaying(false); trimmingRef.current = false; }
    else { a.play().then(() => setPlaying(true)).catch(() => {}); }
  }
  function playTrimmed() {
    const a = audioRef.current; if (!a) return;
    try { a.currentTime = start || 0; } catch (e) {}
    trimmingRef.current = true;
    a.play().then(() => setPlaying(true)).catch(() => {});
  }
  function seek(v) {
    const a = audioRef.current; if (!a) return;
    try { a.currentTime = v; setTime(v); } catch (e) {}
  }

  if (!url) return null;

  return (
    <div className="field">
      <label>Which part of the song should play?</label>
      {error && <div className="field-hint" style={{ color: "var(--bad)" }}>{error}</div>}
      <div className="trim-row">
        <button type="button" className="mini-btn primary" onClick={toggle}>{playing ? "Pause" : "Play"}</button>
        <button type="button" className="mini-btn" onClick={playTrimmed}>Play the trimmed part</button>
        <span className="time-chip">{fmtTime(time)} / {fmtTime(duration)}</span>
      </div>
      <input className="scrub" type="range" min="0" max={duration || 0} step="0.1" value={time}
        onChange={(e) => seek(Number(e.target.value))} aria-label="Scrub through the song" />
      <div className="trim-row">
        <button type="button" className="mini-btn" onClick={() => onChangeStart(Math.floor(time))}>
          Start here ({fmtTime(start || 0)})
        </button>
        <button type="button" className="mini-btn" onClick={() => onChangeEnd(Math.ceil(time))}>
          End here ({end ? fmtTime(end) : "song end"})
        </button>
        {(start || end) ? (
          <button type="button" className="mini-btn danger" onClick={() => { onChangeStart(0); onChangeEnd(null); }}>Clear trim</button>
        ) : null}
      </div>
      <div className="row2">
        <div>
          <label style={{ fontWeight: 400, fontSize: ".72rem" }}>Start at (seconds)</label>
          <input type="number" min="0" step="1" value={start || 0}
            onChange={(e) => onChangeStart(Math.max(0, Number(e.target.value) || 0))} />
        </div>
        <div>
          <label style={{ fontWeight: 400, fontSize: ".72rem" }}>End at (seconds, blank = to the end)</label>
          <input type="number" min="0" step="1" value={end || ""} placeholder={duration ? String(Math.floor(duration)) : ""}
            onChange={(e) => onChangeEnd(e.target.value === "" ? null : Number(e.target.value))} />
        </div>
      </div>
      <div className="field-hint">
        Full length {duration ? fmtTime(duration) : "loading…"} — playing from {fmtTime(start || 0)} to {fmtTime(end || duration)}
      </div>
    </div>
  );
}

function BuildTool() {
  const params = new URLSearchParams(window.location.search);
  const leadName = params.get("name") || "";
  const leadWa = params.get("wa") || "";

  const [currentSlug, setCurrentSlug] = React.useState(null); // null = new project
  const [form, setForm] = React.useState(blankProject());
  const [submitting, setSubmitting] = React.useState(false);
  const [status, setStatus] = React.useState({ text: "", kind: "" });
  const [songListKey, setSongListKey] = React.useState(0);
  const [previewOpen, setPreviewOpen] = React.useState(false);
  const [previewHtml, setPreviewHtml] = React.useState("");
  const [submitted, setSubmitted] = React.useState(false);

  // Give this project a hidden, unique reference so uploaded photos/music
  // have somewhere to live — the customer never sees or edits this.
  React.useEffect(() => {
    const base = slugify(leadName) || "guest";
    const ref = base + "-" + Date.now().toString(36);
    setForm((f) => ({ ...f, slug: ref }));
    setCurrentSlug(ref);
  }, []);

  function startNew() {
    setForm((f) => ({ ...blankProject(), slug: f.slug }));
    setStatus({ text: "", kind: "" });
  }

  async function openProject(slug) {
    setStatus({ text: "Loading…", kind: "" });
    const { data, error } = await supabaseClient.from("projects").select("*").eq("slug", slug).single();
    if (error || !data) { setStatus({ text: "Couldn't load that project.", kind: "err" }); return; }
    setCurrentSlug(slug);
    setForm({
      slug: data.slug,
      pin: data.pin || "123456",
      intro_message: data.intro_message || "",
      letter_title: data.letter_title || "",
      letter_body: data.letter_body || "",
      final_message: data.final_message || "",
      photos: data.photos || [],
      flower_images: data.flower_images || [],
      songs: data.songs || [],
      music_url: data.music_url || "",
      music_start: data.music_start || 0,
      music_end: data.music_end != null ? data.music_end : null,
      github_repo: data.github_repo || "",
      published_url: data.published_url || ""
    });
    setStatus({ text: "", kind: "" });
  }

  function set(field, value) { setForm((f) => ({ ...f, [field]: value })); }

  // Preview happens right here on the page, in a small screen — never a
  // separate tab and never a link the customer could copy and send around.
  function previewSite() {
    try {
      const output = buildSiteHtml(form.slug || "preview", form);
      setPreviewHtml(output);
      setPreviewOpen(true);
    } catch (e) {
      setStatus({ text: "Couldn't build the preview: " + e.message, kind: "err" });
    }
  }

  // "I'm happy with it" — build the final file, hand a copy to the admin
  // (Supabase), then take them to WhatsApp to pay. Nothing is saved before
  // this point, and the customer never gets a link to the file.
  async function submitAndContinue() {
    const slug = slugify(form.slug) || ("guest-" + Date.now().toString(36));
    setSubmitting(true);
    setStatus({ text: "Getting your site ready…", kind: "" });
    try {
      const output = buildSiteHtml(slug, form);

        //    edited later in the regular Backstage builder (admin.html) —
        //    same table, same shape as a normal saved project.
        await supabaseClient.from("projects").upsert(
          { ...form, slug, updated_at: new Date().toISOString() },
          { onConflict: "slug" }
        );

        // 2) Also generate and store the finished HTML file, for a quick
        //    download without having to reopen the builder.
        const path = "chasing-her/" + slug + ".html";
        const blob = new Blob([output], { type: "text/html;charset=utf-8" });

      setStatus({ text: "Something went wrong saving your work: " + e.message + " — please try again.", kind: "err" });

          </div>
          <MusicUploader slug={slugify(form.slug)} value={form.music_url}
            onChange={(v) => set("music_url", v)} onUploaded={() => setSongListKey((k) => k + 1)} />
          <MusicRangeEditor url={form.music_url} start={form.music_start} end={form.music_end}
            onChangeStart={(v) => set("music_start", v)} onChangeEnd={(v) => set("music_end", v)} />
        </div>

        <div className="card notice-card">
          <h2>Before you continue</h2>
          <ul className="notice-list">
            <li>Tapping the WhatsApp button below does not publish your site yet — it only takes you to us so you can pay.</li>
            <li>Once you pay, we host your site and it becomes a real, working link you can share.</li>
            <li>If you don't pay within <strong>48 hours</strong>, your work is deleted from our system and you'd need to start again.</li>
          </ul>
        </div>

        <div className="action-bar">
          <button className="btn btn-outline" onClick={previewSite}>Preview my site</button>
          <button className="btn btn-primary" onClick={submitAndContinue} disabled={submitting || submitted}>
            {submitting ? "Getting it ready…" : submitted ? "Sent — check WhatsApp" : "I'm happy with it — continue to pay"}
          </button>
        </div>
      </div>

      {previewOpen && (
        <div className="preview-backdrop" onClick={() => setPreviewOpen(false)}>
          <div className="preview-modal" onClick={(e) => e.stopPropagation()}>
            <div className="preview-modal-head">
              <span>Your preview</span>
              <button type="button" className="preview-close" onClick={() => setPreviewOpen(false)}>Close ✕</button>
            </div>
            <iframe className="preview-frame" title="Site preview" srcDoc={previewHtml}></iframe>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  if (!supabaseClient) return <SetupNotice />;
  return <BuildTool />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
