<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#241010" />
<title>Backstage — Orders</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root{ --ink:#241010; --ink-soft:#7a6a62; --panel:#fdf6ee; --panel-soft:#f6ead9; --line:rgba(36,16,16,.12);
    --accent:#c2185b; --accent-deep:#96123f; --gold:#cf9f4e; --good:#3d7a4f; --bad:#b23b3b;
    --font-display:'Dancing Script',cursive; --font-ui:'Poppins',sans-serif; }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ font-family:var(--font-ui); background:var(--ink); color:#f3e3d3; }
  button, input, select{ font-family:inherit; }

  .gate{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:40px 20px; text-align:center; }
  .gate-mark{ font-family:var(--font-display); font-size:40px; color:var(--gold); }
  .gate-sub{ color:var(--ink-soft); max-width:320px; }
  .gate form{ display:flex; gap:8px; }
  .gate input{ padding:12px 14px; border-radius:10px; border:1px solid var(--line); font-size:15px; width:180px; }
  .gate button{ padding:12px 18px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
  .gate-error{ color:var(--bad); font-size:13px; min-height:18px; }

  .wrap{ max-width:1000px; margin:0 auto; padding:28px 16px 80px; }
  .head{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
  .head h1{ font-family:var(--font-display); font-size:32px; color:#fff; margin:0; }
  .refresh-btn{ background:none; border:1px solid rgba(255,255,255,.3); color:#f3e3d3; padding:9px 16px;
    border-radius:100px; cursor:pointer; font-size:13.5px; }
  .subhead{ color:var(--ink-soft); font-size:13.5px; margin-bottom:20px; }

  .filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .filters button{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); color:#f3e3d3;
    padding:7px 14px; border-radius:100px; font-size:13px; cursor:pointer; }
  .filters button.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .order-card{ background:var(--panel); color:var(--ink); border-radius:16px; padding:18px 18px 16px; margin-bottom:14px;
    box-shadow:0 14px 30px -18px rgba(0,0,0,.5); }
  .order-top{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .order-name{ font-weight:700; font-size:16.5px; }
  .order-meta{ color:var(--ink-soft); font-size:12.5px; margin-top:2px; }
  .badge{ display:inline-block; padding:4px 11px; border-radius:100px; font-size:11.5px; font-weight:700; letter-spacing:.02em; }
  .badge-pending{ background:#fdeccb; color:#8a5a10; }
  .badge-paid{ background:#dcf2e1; color:#1f6b3a; }
  .badge-hosted{ background:#dfe8fd; color:#28409e; }
  .badge-expired{ background:#f8dada; color:#9c2d2d; }

  .order-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .order-row .field{ flex:1 1 140px; }
  .order-row label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:3px; }
  .order-row .value{ font-size:14px; }
  .order-row select{ padding:6px 8px; border-radius:8px; border:1px solid var(--line); font-size:13px; }
  .order-row input[type="text"]{ padding:7px 9px; border-radius:8px; border:1px solid var(--line); font-size:13.5px; width:100%; }
  .order-card select, .order-card input[type="text"]{ font-family:inherit; }

  .order-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .mini-btn{ padding:9px 14px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--ink);
    font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; }
  .mini-btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .mini-btn.danger{ color:var(--bad); }

  .empty{ text-align:center; color:var(--ink-soft); padding:60px 20px; }
  .loading{ text-align:center; color:var(--ink-soft); padding:60px 20px; }
</style>
</head>

function base64ToUtf8CH(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

(function(){

  var PROJECT_SLUG = ${JSON.stringify(slug)};
  var DEFAULT_MUSIC_URL = ${JSON.stringify(musicUrl)};
  var DEFAULT_MUSIC_START = ${JSON.stringify(musicStart)};
  var DEFAULT_MUSIC_END = ${JSON.stringify(musicEnd)};

  function boot(url, startSec, endSec){
    if (!url) return;
    function init(){
      var audio = new Audio(url);
      audio.loop = false;
      audio.preload = "auto";
      audio.muted = true;
      audio.volume = 0;
      var START = Math.max(0, startSec || 0);
      var END = (endSec !== null && endSec !== undefined && endSec > START) ? endSec : null;
      var metaReady = false, seeked = false;
      var VOLUME_STEPS = [0.15, 0.35, 0.55, 0.75, 1];
      var stepIndex = 1, ended = false, fadeTimer = null;

      audio.addEventListener("loadedmetadata", function(){
        metaReady = true;
        if (END === null || END > audio.duration) END = audio.duration;
        if (!seeked){ try { audio.currentTime = START; } catch(e){} seeked = true; }
      });

      function endPoint(){ return END !== null ? END : (audio.duration || 0); }
      function target(){ return audio.muted ? 0 : VOLUME_STEPS[stepIndex]; }
      function fadeTo(vol, ms){
        if (fadeTimer) clearInterval(fadeTimer);
        var from = audio.volume, t0 = Date.now();
        fadeTimer = setInterval(function(){
          var t = Math.min(1, (Date.now()-t0)/ms);
          audio.volume = from + (vol-from)*t;
          if (t>=1) clearInterval(fadeTimer);
        }, 40);
      }
      function seekToStart(){ try { audio.currentTime = START; } catch(e){} seeked = true; }
      function tryStart(){
        if (metaReady && !seeked) seekToStart();
        audio.play().catch(function(){});
      }
      audio.play().catch(function(){});

      audio.addEventListener("timeupdate", function(){
        if (!metaReady) return;
        var ep = endPoint();
        if (!ep || isNaN(ep)) return;
        var remaining = ep - audio.currentTime;
        if (!audio.muted && remaining <= 4 && remaining >= 0){
          audio.volume = Math.max(0, VOLUME_STEPS[stepIndex] * (remaining/4));
        }
        if (audio.currentTime >= ep - 0.05 && !ended){
          audio.pause();
          ended = true;
          updateUI();
        }
      });
      audio.addEventListener("ended", function(){ ended = true; updateUI(); });

      function unlockAudio(){
        tryStart();
        hintEl.classList.remove("bs-hint-show");
        if (audio.muted){ audio.muted = false; audio.volume = 0; fadeTo(target(), 2600); updateUI(); }
        document.removeEventListener("click", unlockAudio);
        document.removeEventListener("keydown", unlockAudio);
        document.removeEventListener("touchstart", unlockAudio);
      }
      document.addEventListener("click", unlockAudio);
      document.addEventListener("keydown", unlockAudio);
      document.addEventListener("touchstart", unlockAudio);

      var wrap = document.createElement("div");
      wrap.id = "bs-music-player";
      wrap.innerHTML =
        '<div class="bs-hint" id="bs-hint">tap anywhere to let the music in</div>' +
        '<div class="bs-note" id="bs-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M9 17.5a2.5 2.5 0 11-2.5-2.5A2.5 2.5 0 019 17.5zm9-2a2.5 2.5 0 11-2.5-2.5 2.5 2.5 0 012.5 2.5zM9 17.5V6l9-2v9.5" stroke-linejoin="round"/></svg></div>' +
        '<button type="button" id="bs-mute" aria-label="Mute or unmute the music"></button>' +
        '<button type="button" id="bs-vol" aria-label="Raise the volume"><span class="bs-vol-label" id="bs-vol-label">35%</span></button>' +
        '<button type="button" id="bs-restart" aria-label="Restart the song"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 102.13-9.36L1 10"></path></svg></button>';
      document.body.appendChild(wrap);

      var hintEl = wrap.querySelector("#bs-hint");
      var muteBtn = wrap.querySelector("#bs-mute");
      var volBtn = wrap.querySelector("#bs-vol");
      var volLabel = wrap.querySelector("#bs-vol-label");
      var restartBtn = wrap.querySelector("#bs-restart");
      var noteEl = wrap.querySelector("#bs-note");
      var SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9"></polygon><path d="M16 8a5 5 0 010 8"></path></svg>';
      var SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9"></polygon><line x1="16" y1="9" x2="21" y2="14"></line><line x1="21" y1="9" x2="16" y2="14"></line></svg>';

      function updateUI(){
        muteBtn.innerHTML = audio.muted ? SOUND_OFF : SOUND_ON;
        volLabel.textContent = Math.round(VOLUME_STEPS[stepIndex]*100) + "%";
        noteEl.classList.toggle("bs-spin", !audio.paused && !audio.muted);
      }
      updateUI();
      setTimeout(function(){ wrap.classList.add("bs-show"); }, 1200);
      setTimeout(function(){ if (audio.muted) hintEl.classList.add("bs-hint-show"); }, 2000);
      setTimeout(function(){ hintEl.classList.remove("bs-hint-show"); }, 9000);

      muteBtn.addEventListener("click", function(){
        audio.muted = !audio.muted;
        if (!audio.muted){ tryStart(); fadeTo(target(), 1200); }
        updateUI();
      });
      volBtn.addEventListener("click", function(){
        stepIndex = (stepIndex + 1) % VOLUME_STEPS.length;
        if (audio.muted) audio.muted = false;
        tryStart();
        fadeTo(target(), 400);
        updateUI();
      });
      restartBtn.addEventListener("click", function(){
        ended = false;
        seekToStart();
        if (audio.muted) audio.muted = false;
        tryStart();
        fadeTo(target(), 900);
        updateUI();
      });
      setInterval(updateUI, 1000);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  }

  if (SUPABASE_URL.indexOf("http") === 0) {
    fetch(SUPABASE_URL + "/rest/v1/projects?slug=eq." + encodeURIComponent(PROJECT_SLUG) + "&select=music_url,music_start,music_end", {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
    }).then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        var row = rows && rows[0];
        boot(
          (row && row.music_url) || DEFAULT_MUSIC_URL,
          (row && row.music_start != null) ? row.music_start : DEFAULT_MUSIC_START,
          (row && row.music_end != null) ? row.music_end : DEFAULT_MUSIC_END
        );
      })
      .catch(function(){ boot(DEFAULT_MUSIC_URL, DEFAULT_MUSIC_START, DEFAULT_MUSIC_END); });
  } else {
    boot(DEFAULT_MUSIC_URL, DEFAULT_MUSIC_START, DEFAULT_MUSIC_END);
  }
})();
<\/script>

}


function buildSiteHtmlChasingHer(slug, projectForm) {
  const templateHtml = base64ToUtf8CH(TEMPLATE_B64_CH);
  const snapshot = {
    pin: projectForm.pin,
    intro_message: projectForm.intro_message,
    letter_title: projectForm.letter_title,
    letter_body: projectForm.letter_body,
    final_message: projectForm.final_message,
    photos: projectForm.photos,
    flower_images: projectForm.flower_images,
    songs: projectForm.songs
  };
  const startMarker = "/* DEFAULT_CONFIG:START */";
  const endMarker = "/* DEFAULT_CONFIG:END */";
  const startIdx = templateHtml.indexOf(startMarker);
  const endIdx = templateHtml.indexOf(endMarker);
  if (startIdx === -1 || endIdx === -1) throw new Error("Template markers not found.");
  const before = templateHtml.slice(0, startIdx);
  const after = templateHtml.slice(endIdx + endMarker.length);
  const middle = startMarker + "\nconst DEFAULT_CONFIG = " + JSON.stringify(snapshot, null, 2) + ";\n" + endMarker;

  let output = before + middle + after;
  output = output.split('"YOUR_SUPABASE_URL"').join(JSON.stringify(SUPABASE_URL));
  output = output.split('"YOUR_SUPABASE_ANON_KEY"').join(JSON.stringify(SUPABASE_ANON_KEY));
  output = output.split('"YOUR_PROJECT_SLUG"').join(JSON.stringify(slug));

  // The music player goes inside <body>, not after the closing </html>, so
  // the browser doesn't have to guess where it belongs.
  const musicBlock = buildMusicBlockCH(slug, projectForm);
  const bodyClose = output.lastIndexOf("</body>");
  output = bodyClose === -1
    ? output + musicBlock
    : output.slice(0, bodyClose) + musicBlock + "\n" + output.slice(bodyClose);

function base64ToUtf8MEM(b64){ const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder("utf-8").decode(bytes); }


function buildSiteHtmlMemories(slug, form) {
  const templateHtml = base64ToUtf8MEM(TEMPLATE_B64_MEM);
  const snapshot = {
    pin: form.pin,
    hero_title: form.hero_title,
    hero_subtitle: form.hero_subtitle,
    collage_names: form.collage_names,
    collage_day: form.collage_day,
    collage_month: form.collage_month,
    collage_year: form.collage_year,
    collage_quote: form.collage_quote,
    mosaic_images: form.mosaic_images,
    letter_title: form.letter_title,
    letter_body: form.letter_body,
    final_message: form.final_message,
    memories: form.memories,
    flower_images: form.flower_images,
    music_url: form.music_url,
    music_start: form.music_start,
    music_end: form.music_end,
    voice_url: form.voice_url
  };
  const startMarker = "/* DEFAULT_CONFIG:START */";
  const endMarker = "/* DEFAULT_CONFIG:END */";
  const startIdx = templateHtml.indexOf(startMarker);
  const endIdx = templateHtml.indexOf(endMarker);
  if (startIdx === -1 || endIdx === -1) throw new Error("Template markers not found — check TEMPLATE_B64.");
  const before = templateHtml.slice(0, startIdx);
  const after = templateHtml.slice(endIdx + endMarker.length);
  const middle = startMarker + "\nconst DEFAULT_CONFIG = " + JSON.stringify(snapshot, null, 2) + ";\n" + endMarker;
  let output = before + middle + after;
  output = output.split('"YOUR_SUPABASE_URL"').join(JSON.stringify(SUPABASE_URL));
  output = output.split('"YOUR_SUPABASE_ANON_KEY"').join(JSON.stringify(SUPABASE_ANON_KEY));
  output = output.split('"YOUR_PROJECT_SLUG"').join(JSON.stringify(slug));
  return output;
}


function buildSiteHtmlFor(product, slug, form) {
  return product === "memories" ? buildSiteHtmlMemories(slug, form) : buildSiteHtmlChasingHer(slug, form);
}
const PROJECT_TABLE = { "chasing-her": "projects", "memories": "memory_projects" };

function slugify(s) {
  return (s || "").toString().trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}


function Gate({ onUnlock }) {
  const [value, setValue] = React.useState("");
  const [error, setError] = React.useState("");
  function submit(e) {
    e.preventDefault();
    if (value === ADMIN_PASSWORD) { sessionStorage.setItem("orders_unlocked", "1"); onUnlock(); }
    else setError("That's not it — try again.");
  }
  return (
    <div className="gate">
      <div className="gate-mark">Backstage</div>
      <div className="gate-sub">Orders — everyone who reached WhatsApp to pay.</div>
      <form onSubmit={submit}>
        <input type="password" placeholder="Password" value={value}
          onChange={(e) => { setValue(e.target.value); setError(""); }} autoFocus />
        <button type="submit">Enter</button>
      </form>
      <div className="gate-error">{error}</div>
    </div>
  );
}

function timeLeft(expiresAt) {
  const ms = new Date(expiresAt).getTime() - Date.now();
  if (ms <= 0) return "expired";
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  return h + "h " + m + "m left";
}

function OrderCard({ order, onChanged }) {
  const [busy, setBusy] = React.useState(false);

  async function setStatus(status) {
    setBusy(true);
    await supabaseClient.from("submissions").update({ status }).eq("id", order.id);
    setBusy(false);
    onChanged();
  }

  async function remove() {
    if (!window.confirm("Delete this order? This removes it from the list and deletes the saved HTML file. It does NOT delete the editable project.")) return;
    setBusy(true);
    await supabaseClient.storage.from("submissions").remove([order.html_path]);
    await supabaseClient.from("submissions").delete().eq("id", order.id);
    setBusy(false);
    onChanged();
  }

  const badgeClass = "badge badge-" + (order.status === "pending_payment" ? "pending" : order.status);
  const waLink = order.whatsapp ? "https://wa.me/" + order.whatsapp.replace(/[^0-9]/g, "") : null;

  return (
    <div className="order-card">
      <div className="order-top">
        <div>
          <div className="order-name">{order.full_name || "(no name given)"}</div>
          <div className="order-meta">{PRODUCT_LABEL[order.product] || order.product} · {order.slug}</div>
        </div>
        <span className={badgeClass}>{(order.status || "").replace("_", " ")}</span>
      </div>

      <div className="order-row">
        <div className="field">
          <label>WhatsApp</label>
          <div className="value">{waLink ? <a href={waLink} target="_blank" rel="noreferrer">{order.whatsapp}</a> : "—"}</div>
        </div>
        <div className="field">
          <label>PIN</label>
          <div className="value">{order.pin || "—"}</div>
        </div>
        <div className="field">
          <label>Submitted</label>
          <div className="value">{new Date(order.created_at).toLocaleString()}</div>
        </div>
        <div className="field">
          <label>If unpaid</label>
          <div className="value">{order.status === "pending_payment" ? timeLeft(order.expires_at) : "—"}</div>
        </div>
      </div>

      <div className="order-actions">
        <a className="mini-btn primary" href={order.html_url} target="_blank" rel="noreferrer" download>Download HTML</a>
        <a className="mini-btn" href={(BUILDER_PATH[order.product] || "admin.html") + "?slug=" + encodeURIComponent(order.slug)} target="_blank" rel="noreferrer">Edit project</a>
        {order.status !== "paid" && <button className="mini-btn" disabled={busy} onClick={() => setStatus("paid")}>Mark paid</button>}
        {order.status === "paid" && <button className="mini-btn" disabled={busy} onClick={() => setStatus("hosted")}>Mark hosted</button>}
        <button className="mini-btn danger" disabled={busy} onClick={remove}>Delete</button>
      </div>
    </div>
  );
}

function TemplateRow({ tmpl, onChanged }) {
  const [busy, setBusy] = React.useState(false);
  async function toggleActive() {
    setBusy(true);
    await supabaseClient.from("templates").update({ is_active: !tmpl.is_active }).eq("id", tmpl.id);
    setBusy(false);
    onChanged();
  }
  async function remove() {
    if (!window.confirm("Delete this template?")) return;
    setBusy(true);
    await supabaseClient.storage.from("templates").remove([tmpl.html_path]).catch(() => {});
    await supabaseClient.from("templates").delete().eq("id", tmpl.id);
    setBusy(false);
    onChanged();
  }
  return (
    <div className="order-card">
      <div className="order-top">
        <div>
          <div className="order-name">{tmpl.label}</div>
          <div className="order-meta">{PRODUCT_LABEL[tmpl.product] || tmpl.product} · PIN {tmpl.pin}</div>
        </div>
        <span className={"badge " + (tmpl.is_active ? "badge-paid" : "badge-expired")}>
          {tmpl.is_active ? "active" : "hidden"}
        </span>
      </div>
      <div className="order-actions">
        <a className="mini-btn primary" href={tmpl.html_url} target="_blank" rel="noreferrer">Preview</a>
        <button className="mini-btn" disabled={busy} onClick={toggleActive}>{tmpl.is_active ? "Hide" : "Show"}</button>
        <button className="mini-btn danger" disabled={busy} onClick={remove}>Delete</button>
      </div>
    </div>
  );
}

function NewTemplateForm({ onCreated }) {
  const [product, setProduct] = React.useState("chasing-her");
  const [slug, setSlug] = React.useState("");
  const [label, setLabel] = React.useState("");
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState({ text: "", kind: "" });

  async function create(e) {
    e.preventDefault();
    if (!slug.trim()) { setMsg({ text: "Enter the slug of an existing project.", kind: "err" }); return; }
    setBusy(true);
    setMsg({ text: "Loading that project…", kind: "" });
    try {
      const table = PROJECT_TABLE[product];
      const { data, error } = await supabaseClient.from(table).select("*").eq("slug", slug.trim()).single();
      if (error || !data) throw new Error("Couldn't find a " + PRODUCT_LABEL[product] + " project with that slug.");

      setMsg({ text: "Building the demo page…", kind: "" });
      const html = buildSiteHtmlFor(product, data.slug, data);

      const path = product + "/" + slugify(label || data.slug) + "-" + Date.now().toString(36) + ".html";
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const { error: upErr } = await supabaseClient.storage.from("templates").upload(path, blob, { upsert: true, contentType: "text/html" });
      if (upErr) throw upErr;
      const { data: pub } = supabaseClient.storage.from("templates").getPublicUrl(path);

      const { error: insErr } = await supabaseClient.from("templates").insert([{
        product, label: label.trim() || data.slug, pin: data.pin || "123456",
        html_path: path, html_url: pub.publicUrl, is_active: true, sort_order: 0
      }]);
      if (insErr) throw insErr;

      setMsg({ text: "Template created.", kind: "ok" });
      setSlug(""); setLabel("");
      onCreated();
    } catch (e2) {
      setMsg({ text: e2.message || "Something went wrong.", kind: "err" });
    }
    setBusy(false);
  }

  return (
    <form className="order-card" onSubmit={create}>
      <div className="order-name" style={{ marginBottom: 10 }}>Add a template</div>
      <p style={{ fontSize: 13, color: "var(--ink-soft)", marginBottom: 12 }}>
        Build a demo project as usual in {product === "memories" ? "memories-admin.html" : "admin.html"} first,
        then enter its slug here — the finished page gets generated and uploaded automatically.
      </p>
      <div className="order-row">
        <div className="field">
          <label>Product</label>
          <select value={product} onChange={(e) => setProduct(e.target.value)}>
            <option value="chasing-her">Chasing Her</option>
            <option value="memories">Memories</option>
          </select>
        </div>
        <div className="field">
          <label>Project slug</label>
          <input type="text" value={slug} onChange={(e) => setSlug(e.target.value)} placeholder="e.g. demo-anniversary" />
        </div>
        <div className="field">
          <label>Label shown to customers</label>
          <input type="text" value={label} onChange={(e) => setLabel(e.target.value)} placeholder="e.g. Anniversary example" />
        </div>
      </div>
      <div className="order-actions">
        <button className="mini-btn primary" type="submit" disabled={busy}>{busy ? "Working…" : "Create template"}</button>
      </div>
      {msg.text && <div style={{ marginTop: 10, fontSize: 13, color: msg.kind === "err" ? "var(--bad)" : "var(--good)" }}>{msg.text}</div>}
    </form>
  );
}

function TemplatesPanel() {
  const [templates, setTemplates] = React.useState([]);
  const [loading, setLoading] = React.useState(true);

  const load = React.useCallback(async () => {
    if (!supabaseClient) { setLoading(false); return; }
    setLoading(true);
    const { data, error } = await supabaseClient.from("templates").select("*").order("product").order("sort_order");
    if (!error && data) setTemplates(data);
    setLoading(false);
  }, []);
  React.useEffect(() => { load(); }, [load]);

  return (
    <div>
      <div className="subhead">These show up on select-product.html's "see a finished example" links.</div>
      <NewTemplateForm onCreated={load} />
      {loading && <div className="loading">Loading…</div>}
      {!loading && !templates.length && <div className="empty">No templates yet.</div>}
      {!loading && templates.map((t) => <TemplateRow key={t.id} tmpl={t} onChanged={load} />)}
    </div>
  );
}

    setLoading(true);
    const { data, error } = await supabaseClient.from("submissions").select("*").order("created_at", { ascending: false });
    if (!error && data) setOrders(data);
    setLoading(false);
  }, []);

  React.useEffect(() => { if (unlocked) load(); }, [unlocked, load]);

  if (!unlocked) return <Gate onUnlock={() => setUnlocked(true)} />;

  const shown = filter === "all" ? orders : orders.filter((o) => o.status === filter);

  return (
    <div className="wrap">
      <div className="head">
        <h1>{tab === "orders" ? "Orders" : "Templates"}</h1>
        {tab === "orders" && <button className="refresh-btn" onClick={load}>Refresh</button>}
      </div>

      <div className="filters" style={{ marginBottom: 18 }}>
        <button className={tab === "orders" ? "active" : ""} onClick={() => setTab("orders")}>Orders</button>
        <button className={tab === "templates" ? "active" : ""} onClick={() => setTab("templates")}>Templates</button>
      </div>

      {tab === "orders" && (
        <React.Fragment>
          <div className="subhead">Everyone who finished building and tapped through to WhatsApp to pay.</div>
          <div className="filters">
            {["all", "pending_payment", "paid", "hosted", "expired"].map((f) => (
              <button key={f} className={filter === f ? "active" : ""} onClick={() => setFilter(f)}>
                {f === "all" ? "All" : f.replace("_", " ")}
              </button>
            ))}
          </div>
          {loading && <div className="loading">Loading…</div>}
          {!loading && !shown.length && <div className="empty">Nothing here yet.</div>}
          {!loading && shown.map((o) => <OrderCard key={o.id} order={o} onChanged={load} />)}
        </React.Fragment>
      )}

      {tab === "templates" && <TemplatesPanel />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
