<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#241010" />
<title>Backstage — Memories Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#241010; --ink-soft:#7a6a62; --panel:#fdf6ee; --panel-soft:#f6ead9; --line:rgba(36,16,16,.12);
    --accent:#c2185b; --accent-deep:#96123f; --gold:#cf9f4e; --good:#3d7a4f; --bad:#b23b3b;
    --font-display:'Dancing Script',cursive; --font-ui:'Poppins',sans-serif; }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font-ui);background:var(--ink);color:var(--ink)}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  #root{min-height:100%}

  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 20px;text-align:center;
    background:radial-gradient(circle at 50% 20%,#3a1414 0%,var(--ink) 65%);color:#f3e3d3}
  .gate-mark{font-family:var(--font-display);font-size:2.6rem}
  .gate input{padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;min-width:220px}
  .gate button{padding:12px 22px;border-radius:10px;border:none;background:linear-gradient(155deg,var(--accent),var(--accent-deep));color:#fff;font-weight:600}
  .gate-error{color:#ff9f9f;font-size:.85rem;min-height:1em}
  .gate form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  .shell{display:flex;min-height:100vh}
  .sidebar{width:280px;flex:0 0 280px;background:linear-gradient(180deg,#2c1212,#1c0b0b);color:#f3e3d3;padding:26px 18px;display:flex;flex-direction:column;gap:18px}
  .brand-mark{font-family:var(--font-display);font-size:1.8rem}
  .brand-sub{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#c9ab98}
  .new-btn{padding:11px 14px;border-radius:10px;border:1px dashed rgba(255,255,255,.35);background:transparent;color:#f3e3d3;font-size:.88rem}
  .project-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .project-item{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:transparent;color:#e9d6c6;font-size:.86rem}
  .project-item:hover{background:rgba(255,255,255,.07)}
  .project-item.active{background:rgba(194,24,91,.24);border-color:rgba(194,24,91,.55)}
  .project-item .slug{font-weight:600;color:#fff;display:block}
  .sidebar-foot{font-size:.68rem;color:#8a6f62;line-height:1.5}

  .main{flex:1;overflow-y:auto;background:var(--ink)}
  .main-inner{max-width:820px;margin:0 auto;padding:40px 32px 140px}
  .topline{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .topline h1{font-family:var(--font-display);font-size:2.1rem;color:#f3e3d3;margin:0}
  .status{font-size:.78rem;color:#c9ab98}
  .status.ok{color:#8fd19e} .status.err{color:#ff9f9f}

  .card{background:var(--panel);border-radius:16px;padding:26px 28px;margin-bottom:20px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
  .card h2{margin:0 0 4px;font-size:1.05rem;color:var(--accent-deep)}
  .card .hint{margin:0 0 18px;font-size:.8rem;color:var(--ink-soft);line-height:1.5}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.78rem;font-weight:600;margin-bottom:6px}
  .field input[type=text],.field textarea,.field select{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:.9rem}
  .field .field-hint{font-size:.72rem;color:var(--ink-soft);margin-top:5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:560px){.row2{grid-template-columns:1fr}}

  .memory-item{background:var(--panel-soft);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:14px}
  .memory-thumb{width:90px;height:90px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#ddd;display:flex;align-items:center;justify-content:center}
  .memory-thumb img,.memory-thumb video{width:100%;height:100%;object-fit:cover}
  .memory-fields{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .memory-fields input,.memory-fields select{padding:8px 10px;border-radius:7px;border:1px solid var(--line);font-size:.8rem}
  .memory-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--bad);font-size:.9rem}
  .icon-btn.up-down{color:var(--ink)}
  .chk{display:flex;align-items:center;gap:5px;font-size:.75rem;grid-column:span 2}

  .photo-drop{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;cursor:pointer;color:var(--ink-soft);font-size:.85rem;margin-bottom:16px}
  .photo-drop:hover{border-color:var(--accent);background:#fdeef3;color:var(--accent-deep)}
  .photo-drop input{display:none}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .photo-card{background:#fff;border-radius:6px;padding:6px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .photo-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:4px}
  .photo-card .remove{margin-top:6px;width:100%;border:none;background:none;color:var(--bad);font-size:.65rem;text-transform:uppercase}
  .pick-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
  .pick-thumb{width:76px;height:76px;border-radius:8px;overflow:hidden;flex-shrink:0;border:2px solid transparent;cursor:pointer}
  .pick-thumb.selected{border-color:var(--accent)}
  .pick-thumb img{width:100%;height:100%;object-fit:cover}

  .action-bar{position:sticky;bottom:0;background:linear-gradient(0deg,var(--ink) 60%,rgba(36,16,16,0));padding:26px 0 10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn{padding:13px 22px;border-radius:11px;border:none;font-size:.88rem;font-weight:600}
  .btn-primary{background:linear-gradient(155deg,var(--accent),var(--accent-deep));color:#fff}
  .btn-gold{background:linear-gradient(155deg,#e0b975,var(--gold));color:#3a2405}
  .btn-outline{background:transparent;border:1px solid rgba(255,255,255,.3);color:#f3e3d3}
  .btn:disabled{opacity:.5}
  .setup-notice{max-width:560px;margin:60px auto;background:var(--panel);border-radius:16px;padding:32px 36px;box-shadow:0 20px 50px rgba(0,0,0,.35);line-height:1.6}
  .fix-banner{background:#3a1414;border:1px solid #c2185b;border-radius:14px;padding:16px 18px;margin-bottom:20px;color:#ffe3e3;font-size:.85rem}
  .fix-banner code{display:block;background:#1c0b0b;border-radius:8px;padding:10px 12px;font-size:.76rem;color:#ffd3a8;margin:10px 0;white-space:pre}
</style>
</head>

function base64ToUtf8(b64){ const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder("utf-8").decode(bytes); }

    memories: [],
    flower_images: [],
    github_repo: "", published_url: ""
  };
}

/* ---------------------------------------------------------------------
   Gate + setup notice
--------------------------------------------------------------------- */
function Gate({ onUnlock }) {
  const [value, setValue] = React.useState("");
  const [error, setError] = React.useState("");
  function submit(e){ e.preventDefault();
    if (value === ADMIN_PASSWORD){ sessionStorage.setItem("memories_unlocked","1"); onUnlock(); }
    else setError("That's not it — try again.");
  }
  return (
    <div className="gate">
      <div className="gate-mark">Backstage — Memories</div>
      <form onSubmit={submit}>
        <input type="password" placeholder="Password" value={value}
          onChange={(e)=>{setValue(e.target.value);setError("");}} autoFocus />
        <button type="submit">Enter</button>
      </form>
      <div className="gate-error">{error}</div>
    </div>
  );
}
function SetupNotice(){
  return (
    <div className="setup-notice">
      <h1 style={{fontFamily:"var(--font-display)",color:"var(--accent-deep)"}}>Almost there</h1>
      <p>This tool needs your Supabase project URL and anon key filled in at the top of the script — the same values used by the other Backstage builder. It also needs the <code>memory_projects</code> table created (SQL is in a comment near the top of this file).</p>
    </div>
  );
}

/* ---------------------------------------------------------------------
   Reusable-flower picker — lists images already sitting in the shared
   `photos` bucket (any project's `flowers/` folder) so they can be
   reused here without re-uploading, plus a normal upload option.
--------------------------------------------------------------------- */
function FlowerPicker({ slug, items, onChange }) {
  const [available, setAvailable] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [uploading, setUploading] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInput = React.useRef(null);

  const refresh = React.useCallback(async () => {
    if (!supabaseClient) return;
    setLoading(true);
    try {
      const { data: top } = await supabaseClient.storage.from("photos").list("", { limit: 200 });
      const folders = (top || []).filter((i) => i.id === null);
      const all = [];
      for (const folder of folders) {
        try {
          const { data: files } = await supabaseClient.storage.from("photos").list(`${folder.name}/flowers`, { limit: 200 });
          (files || []).forEach((f) => {
            if (!f.name || f.id === null) return;
            const path = `${folder.name}/flowers/${f.name}`;
            const { data: pub } = supabaseClient.storage.from("photos").getPublicUrl(path);
            all.push({ url: pub.publicUrl, from: folder.name });
          });
        } catch (e) {}
      }
      setAvailable(all);
    } catch (e) { setError("Couldn't load existing flower images: " + (e.message || e)); }
    setLoading(false);
  }, []);
  React.useEffect(() => { refresh(); }, [refresh]);

  function toggle(url) {
    const exists = items.some((it) => (it.url || it) === url);
    if (exists) onChange(items.filter((it) => (it.url || it) !== url));
    else onChange([...items, { url }]);
  }

  async function handleUpload(fileList) {
    setError("");
    if (!slug) { setError("Give the project a slug first."); return; }
    if (!supabaseClient) { setError("Connect Supabase first."); return; }
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setUploading(true);
    const uploaded = [];
    for (const file of files) {
      try {
        const ext = (file.name.match(/\.[^.]+$/) || [""])[0];
        const base = slugify(file.name.replace(/\.[^.]+$/, ""));
        const path = `${slug}/flowers/${Date.now()}-${base}${ext}`;
        const { error: upErr } = await supabaseClient.storage.from("photos").upload(path, file, { upsert: true });
        if (upErr) throw upErr;
        const { data } = supabaseClient.storage.from("photos").getPublicUrl(path);
        uploaded.push({ url: data.publicUrl });
      } catch (e) { setError("Some images didn't upload: " + (e.message || e)); }
    }
    onChange([...items, ...uploaded]);
    setUploading(false);
    refresh();
  }

  return (
    <div>
      <div className="field-hint" style={{marginBottom:8}}>
        Pick from flower images already uploaded (across all your projects), or upload new ones below.
      </div>
      {loading && <div className="field-hint">Loading existing images…</div>}
      {error && <div className="field-hint" style={{color:"var(--bad)"}}>{error}</div>}
      {!!available.length && (
        <div className="pick-strip">
          {available.map((a, i) => {
            const selected = items.some((it) => (it.url || it) === a.url);
            return (
              <div key={a.url+i} className={"pick-thumb" + (selected ? " selected" : "")} title={"from: " + a.from} onClick={() => toggle(a.url)}>
                <img src={a.url} alt="" />
              </div>
            );
          })}
        </div>
      )}
      <div className="photo-drop" onClick={() => fileInput.current && fileInput.current.click()}>
        <input ref={fileInput} type="file" accept="image/*" multiple onChange={(e)=>handleUpload(e.target.files)} />
        {uploading ? "Uploading…" : "Click to upload new flower images"}
      </div>
      {!!items.length && (
        <div className="photo-grid">
          {items.map((it, i) => (
            <div className="photo-card" key={(it.url||it)+i}>
              <img src={it.url || it} alt="" />
              <button type="button" className="remove" onClick={() => onChange(items.filter((_, idx) => idx !== i))}>Remove</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------
   Memory items manager (photos + videos, transitions, mute-by-default)
--------------------------------------------------------------------- */
function MemoriesEditor({ slug, items, onChange }) {
  const [uploading, setUploading] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInput = React.useRef(null);

  async function handleFiles(fileList) {
    setError("");
    if (!slug) { setError("Give the project a slug first."); return; }
    if (!supabaseClient) { setError("Connect Supabase first."); return; }
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setUploading(true);
    const uploaded = [];
    for (const file of files) {
      try {
        const isVideo = file.type.startsWith("video/");
        const ext = (file.name.match(/\.[^.]+$/) || [""])[0];
        const base = slugify(file.name.replace(/\.[^.]+$/, ""));
        const path = `${slug}/memories/${Date.now()}-${base}${ext}`;
        const { error: upErr } = await supabaseClient.storage.from("photos").upload(path, file, { upsert: true });
        if (upErr) throw upErr;
        const { data } = supabaseClient.storage.from("photos").getPublicUrl(path);
        uploaded.push({
          type: isVideo ? "video" : "photo",
          url: data.publicUrl,
          caption: "", date: "", place: "",
          muted: isVideo ? true : undefined,
          transition: ""
        });
      } catch (e) { setError("Some files didn't upload: " + (e.message || e)); }
    }
    onChange([...items, ...uploaded]);
    setUploading(false);
  }

  function update(i, field, value) {
    const next = items.slice();
    next[i] = { ...next[i], [field]: value };
    onChange(next);
  }
  function remove(i) { onChange(items.filter((_, idx) => idx !== i)); }
  function move(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= items.length) return;
    const next = items.slice();
    const tmp = next[i]; next[i] = next[j]; next[j] = tmp;
    onChange(next);
  }

  return (
    <div>
      <div className="photo-drop" onClick={() => fileInput.current && fileInput.current.click()}>
        <input ref={fileInput} type="file" accept="image/*,video/*" multiple onChange={(e)=>handleFiles(e.target.files)} />
        {uploading ? "Uploading…" : "Click to add photos or videos, or drag them in"}
      </div>
      {error && <div className="field-hint" style={{color:"var(--bad)",marginBottom:10}}>{error}</div>}
      {items.map((item, i) => (
        <div className="memory-item" key={item.url + i}>
          <div className="memory-thumb">
            {item.type === "video"
              ? <video src={item.url} muted />
              : <img src={item.url} alt="" />}
          </div>
          <div className="memory-fields">
            <input type="text" placeholder="Caption" value={item.caption || ""} onChange={(e)=>update(i,"caption",e.target.value)} />
            <input type="text" placeholder="Date (e.g. June 2024)" value={item.date || ""} onChange={(e)=>update(i,"date",e.target.value)} />
            <input type="text" placeholder="Place" value={item.place || ""} onChange={(e)=>update(i,"place",e.target.value)} />
            <select value={item.transition || ""} onChange={(e)=>update(i,"transition",e.target.value)}>
              {TRANSITION_OPTIONS.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
            {item.type === "video" && (
              <label className="chk">
                <input type="checkbox" checked={item.muted !== false} onChange={(e)=>update(i,"muted",e.target.checked)} />
                Muted by default (visitor can tap to unmute)
              </label>
            )}
          </div>
          <div className="memory-actions">
            <button type="button" className="icon-btn up-down" onClick={() => move(i,-1)} title="Move up">↑</button>
            <button type="button" className="icon-btn up-down" onClick={() => move(i,1)} title="Move down">↓</button>
            <button type="button" className="icon-btn" onClick={() => remove(i)} title="Remove">✕</button>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------------
   buildSiteHtml — same seam pattern as the other Backstage builder
--------------------------------------------------------------------- */
function buildSiteHtml(slug, form) {
  const templateHtml = base64ToUtf8(TEMPLATE_B64);
  const snapshot = {
    pin: form.pin,
    hero_title: form.hero_title,
    hero_subtitle: form.hero_subtitle,
    letter_title: form.letter_title,
    letter_body: form.letter_body,
    final_message: form.final_message,
    memories: form.memories,
    flower_images: form.flower_images
  };
  const startMarker = "/* DEFAULT_CONFIG:START */";
  const endMarker = "/* DEFAULT_CONFIG:END */";
  const startIdx = templateHtml.indexOf(startMarker);
  const endIdx = templateHtml.indexOf(endMarker);
  if (startIdx === -1 || endIdx === -1) throw new Error("Template markers not found — check TEMPLATE_B64.");
  const before = templateHtml.slice(0, startIdx);
  const after = templateHtml.slice(endIdx + endMarker.length);
  const middle = startMarker + "\nconst DEFAULT_CONFIG = " + JSON.stringify(snapshot, null, 2) + ";\n" + endMarker;
  let output = before + middle + after;
  output = output.split('"YOUR_SUPABASE_URL"').join(JSON.stringify(SUPABASE_URL));
  output = output.split('"YOUR_SUPABASE_ANON_KEY"').join(JSON.stringify(SUPABASE_ANON_KEY));
  output = output.split('"YOUR_PROJECT_SLUG"').join(JSON.stringify(slug));
  return output;
}

/* ---------------------------------------------------------------------
   Minimal GitHub publish (optional — same pattern as the other builder)
--------------------------------------------------------------------- */
async function githubRequest(path, options) {
  options = options || {};
  const res = await fetch("https://api.github.com" + path, {
    ...options,
    headers: { Authorization: "Bearer " + GITHUB_TOKEN, Accept: "application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(options.headers||{}) }
  });
  if (!res.ok) {
    let message = "GitHub API error (" + res.status + ")";
    try { const body = await res.json(); if (body && body.message) message = body.message; } catch(e){}
    throw new Error(message);
  }
  if (res.status === 204) return null;
  return res.json();
}
async function githubGetUsername(){ const u = await githubRequest("/user"); return u.login; }
async function githubCreateRepo(name){
  return githubRequest("/user/repos", { method:"POST", body: JSON.stringify({ name, description:"Made with Backstage — Memories.", private:false, auto_init:true }) });
}
async function githubGetRepo(owner, repo){ return githubRequest("/repos/"+owner+"/"+repo); }
async function githubGetFileSha(owner, repo, path, branch){
  try { const data = await githubRequest("/repos/"+owner+"/"+repo+"/contents/"+path+"?ref="+encodeURIComponent(branch)); return data.sha; }
  catch(e){ return null; }
}
async function githubUpsertFile(owner, repo, path, content, message, sha, branch){
  const body = { message, content: utf8ToBase64(content), branch };
  if (sha) body.sha = sha;
  return githubRequest("/repos/"+owner+"/"+repo+"/contents/"+path, { method:"PUT", body: JSON.stringify(body) });
}
async function githubEnablePages(owner, repo, branch){
  try { await githubRequest("/repos/"+owner+"/"+repo+"/pages", { method:"POST", body: JSON.stringify({ source:{ branch, path:"/" } }) }); } catch(e){}
}

/* ---------------------------------------------------------------------
   Dashboard
--------------------------------------------------------------------- */
function Dashboard() {
  const [projects, setProjects] = React.useState([]);
  const [loadingList, setLoadingList] = React.useState(true);
  const [currentSlug, setCurrentSlug] = React.useState(null);
  const [form, setForm] = React.useState(blankProject());
  const [saving, setSaving] = React.useState(false);
  const [generating, setGenerating] = React.useState(false);
  const [publishing, setPublishing] = React.useState(false);
  const [status, setStatus] = React.useState({ text:"", kind:"" });
  const [fixBanner, setFixBanner] = React.useState(null);

  const refreshList = React.useCallback(async () => {
    if (!supabaseClient) { setLoadingList(false); return; }
    setLoadingList(true);
    const { data, error } = await supabaseClient.from("memory_projects").select("slug, hero_title, updated_at").order("updated_at", { ascending:false });
    if (!error && data) setProjects(data);
    else if (error && /does not exist/i.test(error.message||"")) {
      setFixBanner({ text: "The memory_projects table doesn't exist yet. Run this once in Supabase's SQL editor, then reload this page:",
        sql: "create table if not exists memory_projects (\n  slug text primary key,\n  pin text default '123456',\n  hero_title text default 'For You',\n  hero_subtitle text default 'I made something for you... tap to begin.',\n  letter_title text default 'My Dearest,',\n  letter_body text default '',\n  final_message text default 'I love you, to the moon and back.',\n  memories jsonb default '[]',\n  flower_images jsonb default '[]',\n  github_repo text,\n  published_url text,\n  updated_at timestamptz default now()\n);" });
    }
    setLoadingList(false);
  }, []);
  React.useEffect(() => { refreshList(); }, [refreshList]);

  function startNew(){ setCurrentSlug(null); setForm(blankProject()); setStatus({text:"",kind:""}); }

  async function openProject(slug){
    setStatus({text:"Loading…",kind:""});
    const { data, error } = await supabaseClient.from("memory_projects").select("*").eq("slug", slug).single();
    if (error || !data) { setStatus({text:"Couldn't load that project.",kind:"err"}); return; }
    setCurrentSlug(slug);
    setForm({
      slug: data.slug, pin: data.pin || "123456",
      hero_title: data.hero_title || "For You",
      hero_subtitle: data.hero_subtitle || "",
      letter_title: data.letter_title || "",
      letter_body: data.letter_body || "",
      final_message: data.final_message || "",
      memories: data.memories || [],
      flower_images: data.flower_images || [],
      github_repo: data.github_repo || "",
      published_url: data.published_url || ""
    });
    setStatus({text:"",kind:""});
  }

  function set(field, value){ setForm((f) => ({...f, [field]: value})); }

  async function saveProject(){
    const slug = slugify(form.slug);
    if (!slug) { setStatus({text:"Give the project a slug before saving.",kind:"err"}); return; }
    if (!supabaseClient) { setStatus({text:"Connect Supabase first.",kind:"err"}); return; }
    setSaving(true); setStatus({text:"Saving…",kind:""});
    const payload = { ...form, slug, updated_at: new Date().toISOString() };
    const { error } = await supabaseClient.from("memory_projects").upsert(payload, { onConflict:"slug" });
    setSaving(false);
    if (error) { setStatus({text:"Couldn't save: " + error.message, kind:"err"}); return; }
    setForm((f)=>({...f, slug})); setCurrentSlug(slug);
    setStatus({text:"Saved.",kind:"ok"});
    refreshList();
  }

  function downloadFile(){
    const slug = slugify(form.slug);
    if (!slug) { setStatus({text:"Give the project a slug first.",kind:"err"}); return; }
    setGenerating(true);
    try {
      const output = buildSiteHtml(slug, form);
      const blob = new Blob([output], { type:"text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = slug + ".html";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus({text:"Downloaded " + slug + ".html", kind:"ok"});
    } catch(e){ setStatus({text:"Couldn't generate the file: " + e.message, kind:"err"}); }
    setGenerating(false);
  }

  async function publishLive(){
    const slug = slugify(form.slug);
    if (!slug) { setStatus({text:"Give the project a slug first.",kind:"err"}); return; }
    if (!GITHUB_READY) { setStatus({text:"Paste a GitHub token at the top of this file to enable publishing.",kind:"err"}); return; }
    setPublishing(true); setStatus({text: form.github_repo ? "Publishing changes…" : "Publishing for the first time…", kind:""});
    try {
      const output = buildSiteHtml(slug, form);
      const owner = await githubGetUsername();
      const repoName = form.github_repo || slug;
      let branch = "main", sha = null;
      if (!form.github_repo) {
        const repo = await githubCreateRepo(repoName);
        branch = repo.default_branch || "main";
        await new Promise((r)=>setTimeout(r,1500));
      } else {
        const repo = await githubGetRepo(owner, repoName);
        branch = repo.default_branch || "main";
        sha = await githubGetFileSha(owner, repoName, "index.html", branch);
      }
      await githubUpsertFile(owner, repoName, "index.html", output, sha ? "Update site" : "Publish site", sha, branch);
      if (!form.github_repo) await githubEnablePages(owner, repoName, branch);
      const liveUrl = "https://" + owner + ".github.io/" + repoName + "/";
      const updated = { ...form, slug, github_repo: repoName, published_url: liveUrl };
      setForm(updated); setCurrentSlug(slug);
      if (supabaseClient) { await supabaseClient.from("memory_projects").upsert({...updated, updated_at:new Date().toISOString()}, {onConflict:"slug"}); refreshList(); }
      setStatus({text:"Published!",kind:"ok"});
    } catch(e){ setStatus({text:"Couldn't publish: " + e.message, kind:"err"}); }
    setPublishing(false);
  }

  const isNew = currentSlug === null;

  return (
    <div className="shell">
      <div className="sidebar">
        <div className="brand-mark">Backstage</div>
        <div className="brand-sub">Memories builder</div>
        <button className="new-btn" onClick={startNew}>+ New project</button>
        <div className="project-list">
          {loadingList && <div style={{fontSize:".8rem",color:"#a98b7c"}}>Loading…</div>}
          {!loadingList && !projects.length && <div style={{fontSize:".8rem",color:"#a98b7c"}}>No projects yet.</div>}
          {projects.map((p) => (
            <button key={p.slug} className={"project-item" + (p.slug===currentSlug?" active":"")} onClick={()=>openProject(p.slug)}>
              <span className="slug">{p.slug}</span>
            </button>
          ))}
        </div>
        <div className="sidebar-foot">Uses the same Supabase project as your other Backstage site — flower images can be reused across both.</div>
      </div>

      <div className="main">
        <div className="main-inner">
          {fixBanner && (
            <div className="fix-banner">
              {fixBanner.text}
              <code>{fixBanner.sql}</code>
            </div>
          )}
          <div className="topline">
            <h1>{isNew ? "New project" : form.slug}</h1>
            <span className={"status " + status.kind}>{status.text}</span>
          </div>

          <div className="card">
            <h2>Basics</h2>
            <div className="row2">
              <div className="field">
                <label>Slug</label>
                <input type="text" value={form.slug} disabled={!isNew} placeholder="e.g. for-sarah-2026" onChange={(e)=>set("slug",e.target.value)} />
              </div>
              <div className="field">
                <label>PIN</label>
                <input type="text" value={form.pin} onChange={(e)=>set("pin",e.target.value)} />
              </div>
            </div>
            <div className="field"><label>Opening screen title</label><input type="text" value={form.hero_title} onChange={(e)=>set("hero_title",e.target.value)} /></div>
            <div className="field"><label>Opening screen subtitle</label><input type="text" value={form.hero_subtitle} onChange={(e)=>set("hero_subtitle",e.target.value)} /></div>
          </div>

          <div className="card">
            <h2>Memories (photos & videos)</h2>
            <p className="hint">
              These form the heart-shaped photo collage at the start, then play as the slideshow after the flower transition.
              Pick a transition per item from the dropdown — leave it on "Default" and it crossfades automatically.
              Videos get a mute toggle the visitor can tap; set whether they start muted below.
            </p>
            <MemoriesEditor slug={slugify(form.slug)} items={form.memories} onChange={(v)=>set("memories",v)} />
          </div>

          <div className="card">
            <h2>Flower burst</h2>
            <p className="hint">The images that fly outward when the heart "explodes" — reuse ones already stored in Supabase from your other project, or upload new ones.</p>
            <FlowerPicker slug={slugify(form.slug)} items={form.flower_images} onChange={(v)=>set("flower_images",v)} />
          </div>

          <div className="card">
            <h2>The letter</h2>
            <p className="hint">
              Revealed after the visitor taps and opens the on-screen envelope — drawn with CSS, no image needed.
              If you'd rather use a real photo of an envelope or a wax-seal image, tell me and I'll wire it in;
              otherwise the built-in version needs nothing extra from you.
            </p>
            <div className="field"><label>Letter title</label><input type="text" value={form.letter_title} onChange={(e)=>set("letter_title",e.target.value)} /></div>
            <div className="field"><label>Letter body</label><textarea rows={7} value={form.letter_body} onChange={(e)=>set("letter_body",e.target.value)} /></div>
            <div className="field"><label>Signature line</label><input type="text" value={form.final_message} onChange={(e)=>set("final_message",e.target.value)} /></div>
          </div>

          <div className="action-bar">
            <button className="btn btn-primary" onClick={saveProject} disabled={saving}>{saving ? "Saving…" : "Save project"}</button>
            <button className="btn btn-gold" onClick={publishLive} disabled={publishing}>{publishing ? "Publishing…" : (form.github_repo ? "Publish changes" : "Publish live")}</button>
            <button className="btn btn-outline" onClick={downloadFile} disabled={generating}>{generating ? "Generating…" : "Download file instead"}</button>
            {!isNew && <button className="btn btn-outline" onClick={startNew}>Start a new project</button>}
          </div>
          {form.published_url && (
            <p style={{color:"#c9ab98",fontSize:".85rem"}}>Live at: <a href={form.published_url} target="_blank" rel="noreferrer" style={{color:"#fff"}}>{form.published_url}</a></p>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [unlocked, setUnlocked] = React.useState(() => sessionStorage.getItem("memories_unlocked") === "1");
  if (!unlocked) return <Gate onUnlock={() => setUnlocked(true)} />;
  if (!supabaseClient) return <SetupNotice />;
  return <Dashboard />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
