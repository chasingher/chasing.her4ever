<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#380000" />
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --cream:#fdf1e7; --cream-deep:#f7ddc9;
  --rose:#c2185b; --rose-deep:#96123f;
  --maroon-900:#200000; --maroon-800:#380000; --maroon-700:#4a0909;
  --gold:#e8c27a;
  --cream-text:#fdf3ea;
  --font-script:'Dancing Script',cursive; --font-hand:'Caveat',cursive;
  --font-serif:'Cormorant Garamond',serif; --font-ui:'Poppins',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-ui);background:var(--maroon-800);color:var(--cream-text);overflow-x:hidden}
#root{min-height:100%}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
::selection{background:var(--rose);color:#fff}

/* ---------- Loading gate ---------- */
.loading-gate{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:38px;padding:40px 20px;text-align:center;overflow:hidden;
  background:radial-gradient(circle at 50% 15%,#fffaf5 0%,var(--cream) 55%,var(--cream-deep) 100%);}
.loading-gate::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 42%,rgba(232,135,159,.16),transparent 58%)}
.loading-heart-wrap{position:relative;width:104px;height:90px;perspective:700px;animation:pulseHeartSlow 2.6s ease-in-out infinite}
.loading-heart-wrap::before{content:"";position:absolute;inset:-34px;border-radius:50%;border:1px solid rgba(194,24,91,.3);
  animation:heartRing 2.6s ease-out infinite;pointer-events:none}
@keyframes heartRing{0%{transform:scale(.75);opacity:.5}70%{opacity:0}100%{transform:scale(1.7);opacity:0}}
.loading-heart-wrap.impact{animation:none;transform:scale(1.28);transition:transform .38s cubic-bezier(.34,1.56,.64,1)}
.heart-half{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 2000ms cubic-bezier(.16,1,.3,1), opacity 1200ms ease 400ms}
.heart-half svg{width:100%;height:100%;filter:drop-shadow(0 14px 24px rgba(194,24,91,.4))}
.heart-half-left{clip-path:inset(0 50% 0 0);transform-origin:right center}
.heart-half-right{clip-path:inset(0 0 0 50%);transform-origin:left center}
.heart-open .heart-half-left{transform:rotateY(-120deg) translateX(-8px);opacity:0}
.heart-open .heart-half-right{transform:rotateY(120deg) translateX(8px);opacity:0}
.loading-arrow-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:visible}
.cupid-arrow{animation:arrowFly 1350ms cubic-bezier(.22,1,.36,1) forwards;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.3)) drop-shadow(0 0 10px rgba(232,194,122,.55))}
@keyframes arrowFly{0%{transform:translate(80vw,-52vh) rotate(-40deg) scale(.7);opacity:0}10%{opacity:1}
  60%{transform:translate(19vw,-9vh) rotate(-31deg) scale(.94);opacity:1}100%{transform:translate(0,0) rotate(-27deg) scale(1);opacity:1}}
.loading-text{font-family:var(--font-hand);font-weight:600;font-size:clamp(1.1rem,3vw,1.45rem);color:var(--rose-deep);min-height:1.8em;max-width:340px}
.tw-cursor{animation:blinkCursor 1s step-start infinite}
@keyframes blinkCursor{50%{opacity:0}}
@keyframes pulseHeartSlow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shakeX{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}

/* ---------- PIN gate ---------- */
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:40px 20px;
  background:radial-gradient(circle at 50% 15%,#fffaf5 0%,var(--cream) 55%,var(--cream-deep) 100%);
  transition:opacity 900ms ease, transform 900ms ease;}
.login-screen.fading-out{opacity:0;transform:scale(1.06);pointer-events:none}
.login-heart svg{width:70px;height:70px;filter:drop-shadow(0 12px 20px rgba(194,24,91,.35));animation:pulseHeartSlow 2.4s ease-in-out infinite}
.login-heart.shake svg{animation:shakeX .5s ease}
.login-heart.success svg{animation:burstHeart .6s ease}
@keyframes burstHeart{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1.05)}}
.pin-dots{display:flex;gap:14px}
.pin-dots.shake{animation:shakeX .5s ease}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--rose);transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.dot.filled{background:var(--rose);transform:scale(1.15)}
.dot.success{background:#4c9a52;border-color:#4c9a52}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:18px 22px}
.key{width:72px;height:72px;border-radius:50%;border:none;background:#fff;color:#3a1220;font-size:1.5rem;font-weight:500;
  box-shadow:0 6px 16px rgba(120,60,60,.12);transition:transform .18s ease, box-shadow .18s ease}
.key:hover{transform:translateY(-2px)}
.key:active{transform:translateY(0) scale(.93)}
.key-alt{background:#fbdce6;color:var(--rose-deep)}
.key-alt svg{width:20px;height:20px}

/* ---------- Intro ---------- */
.intro-screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:radial-gradient(circle at 50% 40%,var(--maroon-700),var(--maroon-900) 80%);text-align:center;padding:20px;
  transition:opacity 1100ms ease;}
.intro-screen.hide{opacity:0;pointer-events:none}
.intro-title{font-family:var(--font-script);font-weight:700;font-size:clamp(1.9rem,6vw,3rem);color:var(--cream-text);
  text-shadow:0 4px 24px rgba(0,0,0,.4)}
.intro-play{position:relative;width:126px;height:114px;background:none;border:none;display:flex;align-items:center;justify-content:center}
.intro-play svg{width:100%;height:100%;animation:pulseHeartSlow 2.8s ease-in-out infinite;filter:drop-shadow(0 12px 28px rgba(194,24,91,.5))}
.intro-play .play-glyph{position:absolute;color:#fff}
.intro-play .play-glyph svg{width:26px;height:26px;animation:none;filter:none}
.intro-sub{font-family:var(--font-hand);font-weight:600;font-size:1.25rem;color:#e9cdbf;max-width:380px}

/* ---------- Heart mosaic ---------- */
.collage-screen{position:fixed;inset:0;z-index:15;background:radial-gradient(circle at 50% 42%,var(--maroon-700),var(--maroon-900) 78%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:26px 16px;overflow:hidden;transition:opacity 900ms ease}
.collage-screen.leaving{opacity:0}
.collage-title{font-family:var(--font-script);font-weight:700;color:var(--cream-text);font-size:clamp(1.7rem,5vw,2.5rem);
  text-align:center;opacity:0;transform:translateY(-12px);transition:opacity 1200ms ease, transform 1200ms ease;flex-shrink:0;
  text-shadow:0 3px 18px rgba(0,0,0,.45)}
.collage-title.in{opacity:1;transform:translateY(0)}
.collage-stage{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.collage-glow{position:absolute;left:50%;top:50%;width:150%;height:150%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle,rgba(232,135,159,.34),rgba(232,135,159,0) 62%);opacity:0;transition:opacity 1200ms ease}
.collage-glow.on{opacity:1}
.collage-glow.beating{animation:glowBeat 3200ms cubic-bezier(.4,0,.3,1) forwards}
@keyframes glowBeat{0%{opacity:.5;transform:translate(-50%,-50%) scale(1)}
  15%{opacity:.85;transform:translate(-50%,-50%) scale(1.08)}22%{opacity:.55;transform:translate(-50%,-50%) scale(1)}
  45%{opacity:.95;transform:translate(-50%,-50%) scale(1.14)}54%{opacity:.6;transform:translate(-50%,-50%) scale(1)}
  78%{opacity:1;transform:translate(-50%,-50%) scale(1.26)}100%{opacity:.9;transform:translate(-50%,-50%) scale(1.1)}}
.collage-heart{position:relative;transform-origin:50% 52%}
.collage-heart.beating{animation:heartTriple 3200ms cubic-bezier(.4,0,.3,1) forwards}
@keyframes heartTriple{
  0%{transform:scale(1)}5%{transform:scale(1.035)}10%{transform:scale(1.005)}15%{transform:scale(1.05)}22%{transform:scale(1)}
  35%{transform:scale(1.055)}40%{transform:scale(1.012)}45%{transform:scale(1.08)}54%{transform:scale(1.002)}
  68%{transform:scale(1.085)}73%{transform:scale(1.02)}78%{transform:scale(1.135)}92%{transform:scale(1.03)}100%{transform:scale(1.07)}}
.collage-tile{position:absolute;border-radius:4px;overflow:hidden;background:#3a1414;
  box-shadow:0 10px 22px rgba(0,0,0,.5);border:3px solid #fdf1e7;opacity:0;will-change:transform,opacity}
.collage-tile img{width:100%;height:100%;object-fit:cover}
.collage-tile .tile-empty{width:100%;height:100%;background:linear-gradient(135deg,#7d3c46,#4a1f27)}
.shockwave{position:absolute;left:50%;top:52%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
  border:2px solid rgba(255,240,230,.9);opacity:0;pointer-events:none}
.shockwave.go{animation:shock 1100ms cubic-bezier(.16,1,.3,1) forwards}
@keyframes shock{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:scale(26)}}
.collage-note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-3deg) scale(.86);
  background:#fdf8ef;color:#3a2418;padding:16px 22px;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.45);
  text-align:center;max-width:min(56vw,250px);opacity:0;
  transition:opacity 1100ms ease, transform 1100ms cubic-bezier(.34,1.2,.6,1);z-index:999}
.collage-note.in{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
.collage-note.out{opacity:0;transform:translate(-50%,-50%) rotate(-3deg) scale(1.6);transition:opacity 700ms ease, transform 900ms ease}
.collage-note-quote{font-family:var(--font-hand);font-weight:600;font-size:clamp(1rem,2.8vw,1.35rem);line-height:1.4}
.collage-note-date{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;
  font-family:var(--font-serif);font-size:.95rem;letter-spacing:.06em;color:#8a6a5e}
.collage-note-date .date-heart{width:11px;height:11px;color:var(--rose);display:flex}
.collage-note-date .date-heart svg{width:100%;height:100%}
.collage-caption{font-family:var(--font-hand);font-size:1.1rem;color:#dcb9a8;opacity:0;transition:opacity 900ms ease;flex-shrink:0}
.collage-caption.in{opacity:.9}

/* ---------- Flower reveal ---------- */
.flower-overlay{position:fixed;inset:0;z-index:9999;background-color:var(--cream);overflow:hidden;contain:layout style;
  transition:background-color 2000ms ease .3s}
.flower-overlay.revealing{background-color:transparent;pointer-events:none}
.flower-ambient-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(232,135,159,.28),rgba(232,135,159,0) 62%);
  animation:ambientGlowPulse 4.6s ease-in-out infinite;pointer-events:none}
@keyframes ambientGlowPulse{0%,100%{opacity:.55}50%{opacity:1}}
.flower-sparkles{position:absolute;inset:0;pointer-events:none}
.sparkle{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff8ec 0%,rgba(255,248,236,0) 72%);
  animation-name:twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.flower-wrap{position:absolute;top:50%;left:50%;width:0;height:0;will-change:transform,opacity}
.flower-self{position:absolute;left:0;top:0;transform:translate(-50%,-50%);animation-name:selfSpin;animation-timing-function:linear;
  animation-iteration-count:infinite;filter:drop-shadow(0 3px 10px rgba(194,24,91,.4));will-change:transform;backface-visibility:hidden}
@keyframes selfSpin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ---------- Ambient hearts ---------- */
.floating-hearts{position:fixed;inset:0;z-index:5;overflow:hidden;pointer-events:none}
.floating-heart{position:absolute;top:-8%;opacity:0;animation-name:heartFall;animation-timing-function:linear;animation-iteration-count:infinite}
.floating-heart svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.18)) drop-shadow(0 0 7px currentColor)}
@keyframes heartFall{0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0}8%{opacity:.8}
  50%{transform:translateY(56vh) translateX(var(--drift)) rotate(180deg)}92%{opacity:.8}
  100%{transform:translateY(112vh) translateX(0) rotate(360deg);opacity:0}}

/* ---------- Memories slideshow ---------- */
.memories-screen{min-height:100vh;background:linear-gradient(180deg,var(--maroon-700),var(--maroon-900));
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 18px 96px;position:relative;overflow:hidden}
.memories-head{text-align:center;margin-bottom:28px;position:relative;z-index:2}
.memories-head h2{font-family:var(--font-script);font-weight:700;font-size:clamp(2rem,5.4vw,3rem);margin:0;color:var(--cream-text)}
.memories-sub{font-family:var(--font-serif);font-style:italic;font-size:1.15rem;color:#e0bfae;margin-top:6px}
.section-flourish{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;opacity:.85}
.section-flourish .fl-line{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.section-flourish .fl-line.right{background:linear-gradient(90deg,var(--gold),transparent)}
.section-flourish svg{width:12px;height:12px;color:var(--gold)}
.slide-stage{position:relative;width:min(760px,94vw);height:min(74vh,540px);border-radius:20px;overflow:hidden;
  background:#140505;box-shadow:0 34px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(232,194,122,.28);z-index:2}
.slide-item{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0e0303;overflow:hidden}
.slide-item img,.slide-item video{width:100%;height:100%;object-fit:cover}
.slide-item.kb-in img,.slide-item.kb-in video{animation:kenIn ease-out both}
.slide-item.kb-out img,.slide-item.kb-out video{animation:kenOut ease-out both}
@keyframes kenIn{from{transform:scale(1) translate(0,0)}to{transform:scale(1.11) translate(-1.2%,-1%)}}
@keyframes kenOut{from{transform:scale(1.11) translate(1.2%,1%)}to{transform:scale(1) translate(0,0)}}
.slide-stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:20px;
  box-shadow:inset 0 0 110px rgba(0,0,0,.6)}
.slide-caption{position:absolute;left:0;right:0;bottom:0;padding:44px 28px 22px;z-index:3;
  background:linear-gradient(0deg,rgba(0,0,0,.78),rgba(0,0,0,.25) 55%,transparent);color:#fff;text-align:left}
.slide-caption .cap-text{font-family:var(--font-hand);font-size:clamp(1.25rem,3.2vw,1.6rem);font-weight:600;line-height:1.3}
.slide-caption .cap-meta{display:flex;align-items:center;gap:8px;font-family:var(--font-serif);font-size:.95rem;
  letter-spacing:.04em;opacity:.8;margin-top:6px}
.slide-caption .cap-meta svg{width:10px;height:10px;color:var(--gold)}
.cap-rise{animation:capRise 1200ms cubic-bezier(.16,1,.3,1) both;animation-delay:420ms}
@keyframes capRise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.slide-progress{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.12);z-index:4}
.slide-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));width:0}
.slide-progress i.run{animation:progFill linear forwards}
@keyframes progFill{from{width:0}to{width:100%}}
.slide-nav{display:flex;align-items:center;gap:18px;margin-top:22px;position:relative;z-index:2;flex-wrap:wrap;justify-content:center}
.slide-arrow{width:44px;height:44px;border-radius:50%;border:1px solid rgba(232,194,122,.45);background:rgba(255,255,255,.06);
  color:var(--cream-text);display:flex;align-items:center;justify-content:center;transition:background .2s ease, transform .2s ease}
.slide-arrow:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.slide-arrow svg{width:16px;height:16px}
.slide-dots{display:flex;gap:9px;max-width:60vw;flex-wrap:wrap;justify-content:center}
.slide-dot{width:11px;height:11px;display:flex;color:rgba(255,255,255,.3);transition:color .3s ease, transform .3s ease;
  background:none;border:none;padding:0}
.slide-dot svg{width:100%;height:100%}
.slide-dot.active{color:var(--gold);transform:scale(1.35)}
.slide-count{font-family:var(--font-serif);font-size:.95rem;color:#c9ab98;letter-spacing:.08em}

/* slide transition effects */
.fx-fade-enter{animation:fxFade 1200ms ease both}
@keyframes fxFade{from{opacity:0}to{opacity:1}}
.fx-slide-left-enter{animation:fxSlideLeft 1100ms cubic-bezier(.16,1,.3,1) both}
@keyframes fxSlideLeft{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:translateX(0)}}
.fx-slide-up-enter{animation:fxSlideUp 1100ms cubic-bezier(.16,1,.3,1) both}
@keyframes fxSlideUp{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:translateY(0)}}
.fx-zoom-in-enter{animation:fxZoomIn 1150ms cubic-bezier(.16,1,.3,1) both}
@keyframes fxZoomIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.fx-zoom-out-enter{animation:fxZoomOut 1150ms cubic-bezier(.16,1,.3,1) both}
@keyframes fxZoomOut{from{opacity:0;transform:scale(1.16)}to{opacity:1;transform:scale(1)}}
.fx-blur-focus-enter{animation:fxBlur 1300ms ease both}
@keyframes fxBlur{from{opacity:0;filter:blur(18px)}to{opacity:1;filter:blur(0)}}
.fx-polaroid-enter{animation:fxPolaroid 1250ms cubic-bezier(.34,1.05,.64,1) both}
@keyframes fxPolaroid{from{opacity:0;transform:translateY(-34px) rotate(-6deg)}to{opacity:1;transform:translateY(0) rotate(0)}}
.fx-circular-enter{animation:fxCircular 1300ms ease both}
@keyframes fxCircular{from{opacity:0;clip-path:circle(0% at 50% 50%)}to{opacity:1;clip-path:circle(75% at 50% 50%)}}
.fx-heartbeat-enter{animation:fxHeartbeat 1300ms cubic-bezier(.3,1.1,.5,1) both}
@keyframes fxHeartbeat{0%{opacity:0;transform:scale(.9)}45%{opacity:1;transform:scale(1.04)}70%{transform:scale(.99)}100%{opacity:1;transform:scale(1)}}

/* ---------- Scroll invitation ---------- */
.scroll-invite{position:fixed;left:50%;bottom:26px;z-index:60;display:flex;align-items:center;gap:16px;
  padding:14px 16px 14px 24px;border-radius:999px;max-width:min(92vw,580px);
  background:rgba(52,8,8,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(232,194,122,.55);
  opacity:0;transform:translate(-50%,28px);pointer-events:none;
  transition:opacity 900ms ease, transform 900ms cubic-bezier(.16,1,.3,1)}
.scroll-invite.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;
  animation:invitePulse 2.8s ease-in-out 1.2s infinite}
@keyframes invitePulse{
  0%,100%{box-shadow:0 18px 44px rgba(0,0,0,.55), 0 0 26px rgba(232,135,159,.16)}
  50%{box-shadow:0 18px 44px rgba(0,0,0,.55), 0 0 50px rgba(232,135,159,.45)}}
.scroll-invite-text{font-family:var(--font-hand);font-size:clamp(1.1rem,3.4vw,1.35rem);color:#ffeede;line-height:1.3}
.scroll-invite-btn{display:flex;align-items:center;gap:9px;flex-shrink:0;border:none;color:#fff;
  background:linear-gradient(155deg,var(--rose),var(--rose-deep));
  padding:12px 22px;border-radius:999px;box-shadow:0 8px 18px rgba(194,24,91,.45);
  transition:transform .2s ease, box-shadow .2s ease}
.scroll-invite-btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(194,24,91,.55)}
.scroll-invite-btn svg{width:18px;height:18px;animation:scrollBounce 1.6s ease-in-out infinite}
.scroll-invite-btn .label{font-family:var(--font-serif);font-size:1.02rem;letter-spacing:.05em;white-space:nowrap}
@keyframes scrollBounce{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(6px);opacity:1}}
@media (max-width:620px){
  .scroll-invite{flex-direction:column;gap:12px;padding:18px 22px;text-align:center;bottom:18px;left:12px;right:12px;
    transform:translateY(28px);max-width:none}
  .scroll-invite.show{transform:translateY(0)}
}

/* ---------- Letter ---------- */
.letter-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding:70px 20px;background:radial-gradient(circle at 50% 22%,var(--maroon-700),var(--maroon-900) 78%);text-align:center;
  position:relative;overflow:hidden}
.letter-eyebrow{font-family:var(--font-serif);font-style:italic;font-size:1.15rem;color:rgba(255,235,220,.62);position:relative;z-index:2}
.envelope{position:relative;width:268px;height:176px;cursor:pointer;perspective:1000px;z-index:2}
.envelope-body{position:absolute;inset:0;background:linear-gradient(155deg,#f3e6d6,#e3cdae);border-radius:6px;
  box-shadow:0 22px 44px rgba(0,0,0,.45)}
.envelope-flap{position:absolute;top:0;left:0;right:0;height:0;border-left:134px solid transparent;border-right:134px solid transparent;

function preloadImages(urls, maxWaitMs){
  const list = Array.from(new Set((urls||[]).filter(Boolean)));
  if (!list.length) return Promise.resolve();
  const loadAll = Promise.all(list.map((u) => new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve();
    img.onerror = () => resolve();
    img.src = u;
  })));
  if (!maxWaitMs) return loadAll;
  const timeout = new Promise((resolve) => setTimeout(resolve, maxWaitMs));
  return Promise.race([loadAll, timeout]);
}

function Typewriter({ text, speed = 40, delay = 0 }) {
  const [display, setDisplay] = React.useState("");
  const [done, setDone] = React.useState(false);
  React.useEffect(() => {
    let interval, idx = 0;
    setDisplay(""); setDone(false);
    const startTimeout = setTimeout(() => {
      interval = setInterval(() => {
        idx++; setDisplay(text.slice(0, idx));
        if (idx >= text.length) { clearInterval(interval); setDone(true); }
      }, speed);
    }, delay);
    return () => { clearTimeout(startTimeout); clearInterval(interval); };
  }, [text, speed, delay]);
  return (<React.Fragment>{display}{!done && <span className="tw-cursor">|</span>}</React.Fragment>);
}

/* ---------------- Voice note + music duet ----------------
   The voice note is the dominant sound; the music plays underneath it,
   ducked quieter. Both start together on the intro "Begin" tap. */
function fadeAudioTo(audio, target, ms) {
  const from = audio.volume, t0 = Date.now();
  const iv = setInterval(() => {
    const t = Math.min(1, (Date.now()-t0)/ms);
    audio.volume = from + (target-from)*t;
    if (t >= 1) clearInterval(iv);
  }, 45);
}
const MUSIC_DUCK_VOL = 0.24;
const MUSIC_FULL_VOL = 0.62;

function useDuet(voiceUrl, musicUrl, musicStart, musicEnd) {
  const voiceRef = React.useRef(null);
  const musicRef = React.useRef(null);
  const [started, setStarted] = React.useState(false);
  const [musicMuted, setMusicMuted] = React.useState(false);
  const [musicPlaying, setMusicPlaying] = React.useState(false);

  React.useEffect(() => {
    if (voiceUrl) {
      const v = new Audio(voiceUrl);
      v.preload = "auto";
      voiceRef.current = v;
    }
    if (musicUrl) {
      const m = new Audio(musicUrl);
      m.preload = "auto";
      m.loop = false;
      musicRef.current = m;
      const seek = () => { try { m.currentTime = musicStart || 0; } catch (e) {} };
      if (m.readyState >= 1) seek(); else m.addEventListener("loadedmetadata", seek, { once: true });
    }
    return () => {
      if (voiceRef.current) voiceRef.current.pause();
      if (musicRef.current) musicRef.current.pause();
    };
  }, [voiceUrl, musicUrl]);

  function start() {
    setStarted(true);
    const v = voiceRef.current, m = musicRef.current;
    if (v) {
      v.currentTime = 0;
      v.volume = 1;
      v.play().catch(() => {});
      v.addEventListener("ended", () => {
        if (m && !m.paused) fadeAudioTo(m, MUSIC_FULL_VOL, 1800);
      }, { once: true });
    }
    if (m) {
      try { m.currentTime = musicStart || 0; } catch (e) {}
      m.muted = false;
      m.volume = v ? MUSIC_DUCK_VOL : MUSIC_FULL_VOL;
      m.play().then(() => setMusicPlaying(true)).catch(() => {});
      const onTime = () => {
        const ep = (musicEnd && musicEnd > (musicStart||0)) ? musicEnd : m.duration;
        if (!ep || isNaN(ep)) return;
        const remaining = ep - m.currentTime;
        const target = (v && !v.ended) ? MUSIC_DUCK_VOL : MUSIC_FULL_VOL;
        if (!m.muted && remaining <= 3 && remaining >= 0) m.volume = Math.max(0, target * (remaining/3));
        if (m.currentTime >= ep - 0.05) { m.pause(); setMusicPlaying(false); }
      };
      m.addEventListener("timeupdate", onTime);
    }
  }

  function toggleMusicMute() {
    const m = musicRef.current; if (!m) return;
    m.muted = !m.muted;
    setMusicMuted(m.muted);
  }
  function restartMusic() {
    const m = musicRef.current, v = voiceRef.current; if (!m) return;
    try { m.currentTime = musicStart || 0; } catch (e) {}
    m.muted = false; setMusicMuted(false);
    m.volume = (v && !v.ended) ? MUSIC_DUCK_VOL : MUSIC_FULL_VOL;
    m.play().then(() => setMusicPlaying(true)).catch(() => {});
  }

  return { start, started, hasMusic: !!musicUrl, musicMuted, musicPlaying, toggleMusicMute, restartMusic };
}

function MusicControl({ duet }) {

/* ---------------- Loading gate ---------------- */
const LOADING_MESSAGES = [
  "Gathering every little memory…",
  "Wrapping this up with care…",
  "Almost ready, my love…",
  "Something sweet is coming…",
  "This one's just for you…"
];
function LoadingGate({ imagesReady, onDone }) {
  const prefersReduced = React.useMemo(() => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches), []);
  const [phase, setPhase] = React.useState("waiting");
  const [msgIndex, setMsgIndex] = React.useState(0);
  const startedAt = React.useRef(Date.now());

  React.useEffect(() => {
    if (phase !== "waiting") return;
    const t = setTimeout(() => setMsgIndex((i) => (i+1) % LOADING_MESSAGES.length), 2600);
    return () => clearTimeout(t);
  }, [phase, msgIndex]);

  React.useEffect(() => {
    if (!imagesReady || phase !== "waiting") return;
    if (prefersReduced) { onDone(); return; }
    const elapsed = Date.now() - startedAt.current;
    const t = setTimeout(() => setPhase("arrow"), Math.max(0, 1700 - elapsed));
    return () => clearTimeout(t);
  }, [imagesReady, phase, prefersReduced]);

  React.useEffect(() => {
    if (phase === "arrow") { const t = setTimeout(() => setPhase("impact"), 1350); return () => clearTimeout(t); }
    if (phase === "impact") { const t = setTimeout(() => setPhase("opening"), 380); return () => clearTimeout(t); }
    if (phase === "opening") { const t = setTimeout(() => onDone(), 1450); return () => clearTimeout(t); }
  }, [phase]);

  return (
    <div className={`loading-gate ${phase === "opening" ? "heart-open" : ""}`}>
      <div className={`loading-heart-wrap ${phase === "impact" ? "impact" : ""}`}>
        <div className="heart-half heart-half-left"><HeartIcon /></div>
        <div className="heart-half heart-half-right"><HeartIcon /></div>
        {(phase === "arrow" || phase === "impact") && (
          <div className="loading-arrow-layer"><CupidArrow /></div>
        )}
      </div>
      {phase === "waiting" && (
        <div className="loading-text"><Typewriter key={msgIndex} text={LOADING_MESSAGES[msgIndex]} speed={42} /></div>
      )}
    </div>
  );
}

/* ---------------- Heart photo mosaic ----------------
   A FIXED layout of slots (position, size, rotation), planned row by row
   against the exact heart curve (x²+y²−1)³ − x²y³ ≤ 0 — not randomly
   scattered — so the outline actually reads as a heart: two lobes with a
   notch at the top, tapering to a single point at the bottom. Tiles mix
   squares with wide and tall rectangles for a scrapbook feel.

   Row by row (9 cols × 7 rows, 34 slots):
     ..##.##..   ← two lobes with the notch between them
     .#######.
     .#######.
     .#######.
     ..#####..
     ...###...
     ....#....   ← tapers to a single point
*/
function insideHeart(x, y) {
  const v = Math.pow(x*x + y*y - 1, 3) - x*x*y*y*y;
  return v <= 0;
}
function seededJitter(id) {
  const s = Math.sin(id * 12.9898) * 43758.5453;
  return s - Math.floor(s);
}
/* Mostly square tiles, with a deliberate minority of wide/tall rectangles
   mixed in for visual variety — the same idea as a hand-cut scrapbook page. */
function slotShape(id) {
  const r = seededJitter(id * 7 + 3);
  if (r < 0.58) return { wMul: 1, hMul: 1 };
  if (r < 0.80) return { wMul: 1.42, hMul: 1 };
  return { wMul: 1, hMul: 1.42 };
}
const MOSAIC_COLS = 9;
const MOSAIC_ROWS = 7;
/* Tiles near the middle are the biggest; the ones on the rim shrink so the
   silhouette stays crisp instead of squaring off at the shoulders. */
const TILE_EDGE = 1.02;
const TILE_CENTER = 1.72;
const TILE_DEPTH_REF = 0.46;
function heartDepth(x, y) {
  const maxd = 0.62, steps = 22, dirs = 16;
  let best = maxd;
  for (let k = 0; k < dirs; k++) {
    const a = (2 * Math.PI * k) / dirs, dx = Math.cos(a), dy = Math.sin(a);
    let d = maxd;
    for (let s = 1; s <= steps; s++) {
      const t = (maxd * s) / steps;
      if (!insideHeart(x + dx * t, y + dy * t)) { d = t; break; }
    }
    if (d < best) best = d;
  }
  return best;
}
function buildHeartLayout(cols, rows) {
  const xscale = 2.9, xshift = 1.45, yscale = 2.497, yshift = 1.328;
  const slots = [];
  let id = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const nx = ((c + 0.5) / cols) * xscale - xshift;
      const ny = yshift - ((r + 0.5) / rows) * yscale;
      if (!insideHeart(nx, ny)) continue;
      const j1 = seededJitter(id * 2 + 1);
      const j2 = seededJitter(id * 2 + 2);
      const shape = slotShape(id);
      const dep = Math.min(1, heartDepth(nx, ny) / TILE_DEPTH_REF);
      const spread = TILE_EDGE + (TILE_CENTER - TILE_EDGE) * Math.pow(dep, 0.85);
      const base = (1 / cols) * (spread + j1 * 0.14);
      const xPct = (nx + xshift) / xscale;
      const yPct = (yshift - ny) / yscale;
      slots.push({
        id, row: r, col: c, xPct, yPct,
        widthPct: base * shape.wMul,
        heightPct: base * shape.hMul,
        rotate: (j2 - 0.5) * 15,
        z: id,
        dist: Math.sqrt(Math.pow(xPct - 0.5, 2) + Math.pow((yPct - 0.46) * 1.1, 2))
      });
      id++;
    }
  }
  // Grow from the middle outward — the heart builds itself from its center.
  const order = slots.slice().sort((a, b) => a.dist - b.dist);
  order.forEach((s, i) => { s.order = i; });
  return slots;
}
const MOSAIC_LAYOUT = buildHeartLayout(MOSAIC_COLS, MOSAIC_ROWS);
const MOSAIC_SLOT_COUNT = MOSAIC_LAYOUT.length;
const MOSAIC_MIN_PHOTOS = 14;

const TILE_STAGGER_MS = 78;
const NOTE_DELAY_MS = 700;
const BEAT_DELAY_MS = 1500;
const BEAT_DURATION_MS = 3200;

function CollageScreen({ images, names, day, month, year, quote, onDone }) {
  const [dims, setDims] = React.useState({ d: 340 });
  const [placedCount, setPlacedCount] = React.useState(0);
  const [phase, setPhase] = React.useState("placing"); // placing -> settled -> beating -> exploding
  const [titleIn, setTitleIn] = React.useState(false);
  const [noteIn, setNoteIn] = React.useState(false);
  const [leaving, setLeaving] = React.useState(false);
  const dateParts = [day, month, year].filter(Boolean);

  React.useLayoutEffect(() => {
    function measure() {
      const d = Math.min(window.innerWidth * 0.92, window.innerHeight * 0.6, 620);
      setDims({ d });
    }
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, []);

  React.useEffect(() => { const t = setTimeout(() => setTitleIn(true), 260); return () => clearTimeout(t); }, []);

  React.useEffect(() => {
    let i = 0;
    const timers = [];
    const timer = setInterval(() => {
      i++;
      setPlacedCount(i);
      if (i >= MOSAIC_SLOT_COUNT) {
        clearInterval(timer);
        timers.push(setTimeout(() => { setPhase("settled"); setNoteIn(true); }, NOTE_DELAY_MS));
        timers.push(setTimeout(() => setPhase("beating"), NOTE_DELAY_MS + BEAT_DELAY_MS));
        timers.push(setTimeout(() => setPhase("exploding"), NOTE_DELAY_MS + BEAT_DELAY_MS + BEAT_DURATION_MS - 60));
        timers.push(setTimeout(() => setLeaving(true), NOTE_DELAY_MS + BEAT_DELAY_MS + BEAT_DURATION_MS + 600));
        timers.push(setTimeout(() => onDone(), NOTE_DELAY_MS + BEAT_DELAY_MS + BEAT_DURATION_MS + 1000));
      }
    }, TILE_STAGGER_MS);
    return () => { clearInterval(timer); timers.forEach(clearTimeout); };
  }, []);

  const list = (images || []).filter(Boolean);
  const exploding = phase === "exploding";

  function tileStyle(slot) {
    const w = slot.widthPct * dims.d, h = slot.heightPct * dims.d;
    const base = {
      left: slot.xPct * dims.d - w/2,
      top: slot.yPct * dims.d - h/2,
      width: w, height: h, zIndex: slot.z
    };
    if (exploding) {
      const vx = (slot.xPct - 0.5), vy = (slot.yPct - 0.52);
      const len = Math.max(0.08, Math.sqrt(vx*vx + vy*vy));
      const reach = Math.max(window.innerWidth, window.innerHeight) * 1.25;
      const dx = (vx/len) * reach, dy = (vy/len) * reach;
      const spin = (seededJitter(slot.id * 3 + 5) - 0.5) * 220;
      return {
        ...base, opacity: 0,
        transform: `translate(${dx}px, ${dy}px) rotate(${slot.rotate + spin}deg) scale(1.25)`,
        transition: `transform 1100ms cubic-bezier(.22,.65,.3,1) ${slot.dist * 160}ms, opacity 900ms ease ${300 + slot.dist * 160}ms`
      };
    }
    const placed = slot.order < placedCount;
    if (placed) {
      return {
        ...base, opacity: 1,
        transform: `translate(0,0) rotate(${slot.rotate}deg) scale(1)`,
        transition: `transform 900ms cubic-bezier(.19,1.16,.36,1), opacity 520ms ease`
      };
    }
    const a = seededJitter(slot.id * 5 + 9) * Math.PI * 2;
    const flyIn = dims.d * 0.9;
    return {
      ...base, opacity: 0,
      transform: `translate(${Math.cos(a)*flyIn}px, ${Math.sin(a)*flyIn - dims.d*0.25}px) rotate(${slot.rotate*2.4}deg) scale(.55)`,
      transition: "transform 900ms cubic-bezier(.19,1.16,.36,1), opacity 520ms ease"
    };
  }

  return (
    <div className={`collage-screen ${leaving ? "leaving" : ""}`}>
      {names ? <div className={`collage-title ${titleIn ? "in" : ""}`}>{names}</div> : <div style={{height:8}} />}
      <div className="collage-stage" style={{ width: dims.d, height: dims.d }}>
        <div className={`collage-glow ${phase !== "placing" ? "on" : ""} ${phase === "beating" ? "beating" : ""}`} />
        <div className={`shockwave ${exploding ? "go" : ""}`} />
        <div className={`collage-heart ${phase === "beating" ? "beating" : ""}`} style={{ width: dims.d, height: dims.d }}>
          {MOSAIC_LAYOUT.map((slot) => {
            const img = list.length ? urlOf(list[slot.id % list.length]) : null;
            return (
              <div key={slot.id} className="collage-tile" style={tileStyle(slot)}>
                {img ? <img src={img} alt="" decoding="async" /> : <div className="tile-empty" />}
              </div>
            );
          })}
          {(quote || !!dateParts.length) && (
            <div className={`collage-note ${noteIn ? "in" : ""} ${exploding ? "out" : ""}`}>
              {quote && <div className="collage-note-quote">{quote}</div>}
              {!!dateParts.length && (
                <div className="collage-note-date">
                  {dateParts.map((part, i) => (
                    <React.Fragment key={i}>
                      <span>{part}</span>
                      {i < dateParts.length - 1 && <span className="date-heart"><MiniHeart /></span>}
                    </React.Fragment>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function FlowerBurst({ images, onDone }) {

  const flowers = React.useMemo(() => {

    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
      const jx=(Math.random()-0.5)*cellW*0.35, jy=(Math.random()-0.5)*cellH*0.35;
      const px=(c+0.5)*cellW+jx, py=(r+0.5)*cellH+jy;
      const dx=px-w/2, dy=py-h/2, dist=Math.sqrt(dx*dx+dy*dy);
      const size = Math.max(cellW,cellH)*(1.55+Math.random()*0.65);
      const palette = FLOWER_PALETTES[Math.floor(Math.random()*FLOWER_PALETTES.length)];
      const raw = images && images.length ? images[Math.floor(Math.random()*images.length)] : null;
      arr.push({ id:i, dx, dy, dist, size, palette, image: urlOf(raw), spinDur: 14+Math.random()*10, spinDir: Math.random()<0.5?"normal":"reverse" });
      i++;
    }
    arr.sort((a,b)=>a.dist-b.dist);
    const gap = prefersReduced ? 0 : 66;
    arr.forEach((f, idx) => {
      f.packDelay = prefersReduced ? 0 : idx*gap + Math.random()*60;
      f.packDuration = prefersReduced ? 1 : 680+Math.random()*420;
      const side = f.dx>=0?1:-1;
      f.exitDx = f.dx + side*(w*0.85 + Math.abs(f.dx)*0.15);
      f.exitDy = f.dy + (Math.random()-0.5)*160;
      f.exitRotate = side*(30+Math.random()*70);
      f.exitDelay = prefersReduced?0:Math.random()*450;
      f.exitDuration = prefersReduced?1:1800+Math.random()*700;
    });
    return arr;
  }, []);

  const [phase, setPhase] = React.useState("start");
  React.useEffect(() => {
    const raf1 = requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(()=>setPhase("packed"),60)));
    return () => cancelAnimationFrame(raf1);
  }, []);
  React.useEffect(() => {
    if (phase !== "packed") return;
    const maxEnd = flowers.reduce((m,f)=>Math.max(m,f.packDelay+f.packDuration),0);
    const t = setTimeout(()=>setPhase("parting"), maxEnd + (prefersReduced?0:1600));
    return () => clearTimeout(t);
  }, [phase]);
  React.useEffect(() => {
    if (phase !== "parting") return;
    const maxEnd = flowers.reduce((m,f)=>Math.max(m,f.exitDelay+f.exitDuration),0);
    const t = setTimeout(onDone, maxEnd + 150);
    return () => clearTimeout(t);
  }, [phase]);

  function wrapStyle(f){
    if (phase==="start") return { transform:"scale(0)", opacity:0, transition:"none" };
    if (phase==="packed") return {
      transform:`translate(${f.dx}px,${f.dy}px) scale(1)`, opacity:1,
      transition:`transform ${f.packDuration}ms cubic-bezier(.16,1,.3,1) ${f.packDelay}ms, opacity ${Math.min(f.packDuration,500)}ms ease ${f.packDelay}ms`
    };
    return {
      transform:`translate(${f.exitDx}px,${f.exitDy}px) rotate(${f.exitRotate}deg) scale(.82)`, opacity:1,
      transition:`transform ${f.exitDuration}ms cubic-bezier(.4,0,.3,1) ${f.exitDelay}ms`
    };
  }

  return (
    <div className={`flower-overlay ${phase==="parting"?"revealing":""}`}>
      <div className="flower-ambient-glow" />
      <FlowerSparkles count={16} />
      {flowers.map((f) => (
        <div key={f.id} className="flower-wrap" style={wrapStyle(f)}>
          <div className="flower-self" style={{ width:f.size, height:f.size, animationDuration:f.spinDur+"s", animationDirection:f.spinDir }}>
            {f.image ? <img src={f.image} alt="" style={{width:"100%",height:"100%",objectFit:"contain"}} /> : <FlowerGraphic palette={f.palette} />}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------------- Memory slideshow ---------------- */
const EFFECTS = ["fade","slide-left","slide-up","zoom-in","zoom-out","blur-focus","polaroid","circular","heartbeat"];
function effectClass(effect){
  const e = EFFECTS.includes(effect) ? effect : "fade";
  return "fx-" + e + "-enter";
}
const PHOTO_DWELL_MS = 6500;
const VIDEO_FALLBACK_MS = 20000;

function MemorySlide({ item, index, active, near, onVideoEnded, dwellMs }) {
  const videoRef = React.useRef(null);
  const [muted, setMuted] = React.useState(item.muted !== false);
  React.useEffect(() => {
    if (item.type === "video" && videoRef.current) {
      if (active) { videoRef.current.currentTime = 0; videoRef.current.play().catch(()=>{}); }
      else videoRef.current.pause();
    }
  }, [active]);
  // A long slideshow used to put every photo in the DOM at once, so the
  // browser fetched all of them before the first one had finished. Only the
  // current slide and the one either side are mounted now.
  if (!active && !near) return null;
  const kb = index % 2 === 0 ? "kb-in" : "kb-out";
  const driftMs = item.type === "video" ? 16000 : Math.max(dwellMs, 4000) + 1200;
  const mediaStyle = active ? { animationDuration: driftMs + "ms" } : undefined;
  return (
    <div className={`slide-item ${active ? effectClass(item.transition) + " " + kb : ""}`}
      style={{ display: active ? "flex" : "none" }}>
      {item.type === "video" ? (
        <video ref={videoRef} src={item.url} style={mediaStyle} muted={muted} playsInline controls={false} onEnded={onVideoEnded} />
      ) : (
        <img src={item.url} style={mediaStyle} decoding="async" alt={item.caption || ""} />
      )}
      {item.type === "video" && (
        <button type="button" onClick={() => setMuted((m) => !m)} aria-label={muted ? "Unmute this video" : "Mute this video"}
          style={{position:"absolute",top:16,right:16,zIndex:4,width:38,height:38,borderRadius:"50%",border:"1px solid rgba(255,255,255,.4)",
            background:"rgba(0,0,0,.45)",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center"}}>
          {muted ? <SoundOff/> : <SoundOn/>}
        </button>
      )}
      {(item.caption || item.date || item.place) && (
        <div className="slide-caption">
          {item.caption && <div className="cap-text cap-rise">{item.caption}</div>}
          {(item.date || item.place) && (
            <div className="cap-meta cap-rise">
              {item.date && <span>{item.date}</span>}
              {item.date && item.place && <MiniHeart />}
              {item.place && <span>{item.place}</span>}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function SectionMemories({ memories, onFinished }) {
  const list = memories && memories.length ? memories : [];
  const [idx, setIdx] = React.useState(0);
  const [paused, setPaused] = React.useState(false);
  const [finished, setFinished] = React.useState(false);
  const timerRef = React.useRef(null);
  const sectionRef = React.useRef(null);

  const current = list[idx];
  const dwellMs = current && current.duration ? Math.max(1500, Number(current.duration) * 1000) : PHOTO_DWELL_MS;

  const advance = React.useCallback(() => {
    setIdx((i) => {
      if (i + 1 >= list.length) { setTimeout(() => setFinished(true), 600); return i; }
      return i + 1;
    });
  }, [list.length]);

  React.useEffect(() => {
    if (!list.length) { setFinished(true); return; }
    clearTimeout(timerRef.current);
    if (paused || !current) return;
    if (current.type !== "video") timerRef.current = setTimeout(advance, dwellMs);
    else timerRef.current = setTimeout(advance, VIDEO_FALLBACK_MS);
    return () => clearTimeout(timerRef.current);
  }, [idx, list, paused, dwellMs]);

  React.useEffect(() => { if (finished && onFinished) onFinished(); }, [finished]);

  // Fade the invitation once they've actually started scrolling past this section.
  React.useEffect(() => {
    if (!finished) return;
    function onScroll() {
      const el = sectionRef.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      if (rect.bottom < window.innerHeight * 0.55) setFinished("scrolled");
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, [finished]);

  function goToLetter() {
    const el = document.getElementById("letter");
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  if (!list.length) return null;

  return (
    <div className="memories-screen" ref={sectionRef}>
      <FloatingHearts count={10} />
      <div className="memories-head">
        <h2>Our Memories Together</h2>
        <div className="memories-sub">Every picture holds a moment. Every moment holds a story.</div>
        <div className="section-flourish" aria-hidden="true">
          <span className="fl-line" /><MiniHeart /><span className="fl-line right" />
        </div>
      </div>
      <div className="slide-stage">
        <div className="slide-progress">
          <i key={idx + "-" + paused} className={!paused && current && current.type !== "video" ? "run" : ""}
             style={{ animationDuration: dwellMs + "ms" }} />
        </div>
        {list.map((item, i) => (
          <MemorySlide key={i} item={item} index={i} active={i === idx} dwellMs={dwellMs}
            near={Math.abs(i - idx) <= 1 || (idx === list.length - 1 && i === 0)}
            onVideoEnded={() => { clearTimeout(timerRef.current); advance(); }} />
        ))}
      </div>
      <div className="slide-nav">
        <button className="slide-arrow" onClick={() => setIdx((i) => Math.max(0, i - 1))} aria-label="Previous memory"><ChevronLeft /></button>
        <button className="slide-arrow" onClick={() => setPaused((p) => !p)} aria-label={paused ? "Play the slideshow" : "Pause the slideshow"}>
          {paused ? <PlayGlyph /> : <PauseGlyph />}
        </button>
        <div className="slide-dots">
          {list.map((_, i) => (
            <button key={i} className={`slide-dot ${i === idx ? "active" : ""}`} onClick={() => setIdx(i)} aria-label={`Memory ${i+1}`}><MiniHeart /></button>
          ))}
        </div>
        <button className="slide-arrow" onClick={advance} aria-label="Next memory"><ChevronRight /></button>
      </div>
      <div className={`scroll-invite ${finished === true ? "show" : ""}`}>
        <div className="scroll-invite-text">I wrote you something too — it's waiting just below.</div>
        <button type="button" className="scroll-invite-btn" onClick={goToLetter}>
          <span className="label">Take me there</span>
          <ChevronDown />
        </button>
      </div>
    </div>
  );
}

/* ---------------- Envelope + letter ---------------- */
function SectionLetter({ title, body, signature }) {
  const [open, setOpen] = React.useState(false);
  const [showCard, setShowCard] = React.useState(false);
  function handleOpen() {
    setOpen(true);
    setTimeout(() => setShowCard(true), 800);
  }
  return (
    <div className="letter-screen" id="letter">
      <FloatingHearts count={8} />
      <div className="letter-eyebrow">One last thing…</div>
      {!showCard && (
        <React.Fragment>
          <div className={`envelope ${open ? "open" : ""}`} onClick={handleOpen} role="button" tabIndex={0}
            onKeyDown={(e)=>{ if(e.key==="Enter"||e.key===" ") handleOpen(); }}>
            <div className="envelope-body" />
            <div className="envelope-seal"><SealIcon /></div>
            <div className="envelope-flap" />
          </div>
          <div className="envelope-hint">Tap the envelope to open it</div>
        </React.Fragment>
      )}
      <div className={`letter-card ${showCard ? "show" : ""}`}>
        {showCard && (
          <React.Fragment>
            <div className="letter-title"><Typewriter text={title} speed={60} /></div>
            <div className="section-flourish" aria-hidden="true">
              <span className="fl-line" /><MiniHeart /><span className="fl-line right" />
            </div>
            <div className="letter-body"><Typewriter text={body} speed={24} delay={title.length * 60 + 500} /></div>
            <div className="letter-sign">{signature}</div>
            <button type="button" className="replay-btn" onClick={() => window.location.reload()}>Replay our story</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

/* ---------------- App root ---------------- */
function App() {
  const [stage, setStage] = React.useState("preload");
  const [config, setConfig] = React.useState(DEFAULT_CONFIG);
  const [imagesReady, setImagesReady] = React.useState(false);
  const duet = useDuet(config.voice_url, config.music_url, config.music_start, config.music_end);

  React.useEffect(() => {
    loadConfig().then((c) => {
      setConfig(c);
      // Only the heart has to be ready before the gate opens. The flowers get
      // a head start in the background, and the slideshow loads as it plays —
      // waiting on all three was what made the opening feel so slow.
      const mosaicUrls = (c.mosaic_images || []).map(urlOf).filter(Boolean);
      const flowerUrls = (c.flower_images || []).map(urlOf).filter(Boolean);
      const laterUrls = (c.memories || []).slice(0, 3).filter((m) => m.type !== "video").map((m) => m.url);
      preloadImages(mosaicUrls, 6000).then(() => setImagesReady(true));
      preloadImages([...flowerUrls, ...laterUrls], 20000);
    });
  }, []);

  const hasMosaicImages = React.useMemo(() => (config.mosaic_images || []).some(Boolean), [config.mosaic_images]);

  function handleBegin() {
    duet.start();
    setStage(hasMosaicImages ? "collage" : "flowers");
  }

  return (
    <React.Fragment>
      <MusicControl duet={duet} />
      {stage === "preload" && (
        <LoadingGate imagesReady={imagesReady} onDone={() => setStage("login")} />
      )}
      {stage === "login" && (
        <LoginScreen correctPin={config.pin} onCorrect={() => setStage("intro")} />
      )}
      {stage === "intro" && (
        <IntroScreen title={config.hero_title} subtitle={config.hero_subtitle} onBegin={handleBegin} />
      )}
      {stage === "collage" && (
        <CollageScreen
          images={config.mosaic_images}
          names={config.collage_names}
          day={config.collage_day} month={config.collage_month} year={config.collage_year}
          quote={config.collage_quote}
          onDone={() => setStage("flowers")}
        />
      )}
      {stage === "flowers" && (
        <FlowerBurst images={config.flower_images} onDone={() => setStage("memories")} />
      )}
      {stage === "memories" && (
        <React.Fragment>
          <SectionMemories memories={config.memories} />
          <SectionLetter title={config.letter_title} body={config.letter_body} signature={config.final_message} />
        </React.Fragment>
      )}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
