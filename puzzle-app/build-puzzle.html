<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#241010" />
<title>Build your Puzzle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" /></noscript>
<style>
  html,body{ margin:0; }
  #boot{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center;
    background:#fdf6ee; color:#7a6a62; font:400 15px/1.5 'Poppins',system-ui,sans-serif; }
  #boot .boot-mark{ font-size:2rem; }
  :root{
    --ink:#241010; --ink-soft:#7a6a62; --panel:#fdf6ee; --panel-soft:#f6ead9; --line:rgba(36,16,16,.12);
    --accent:#c2185b; --accent-deep:#96123f; --gold:#cf9f4e; --gold-soft:#e0b975; --good:#3d7a4f; --bad:#b23b3b;
    --font-display:'Dancing Script',cursive; --font-ui:'Poppins',sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ font-family:var(--font-ui); background:var(--ink); color:var(--ink); -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; cursor:pointer; }
  input,textarea,select{ font-family:inherit; }
  #root{ min-height:100%; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .build-shell{ min-height:100vh; background:radial-gradient(circle at 15% 0%,rgba(194,24,91,.16),transparent 45%),radial-gradient(circle at 90% 12%,rgba(232,194,122,.10),transparent 40%),var(--ink); }
  .build-inner{ max-width:640px; margin:0 auto; padding:18px 16px 110px; }
  .back-link{ display:inline-flex; align-items:center; gap:7px; color:#e9d3be; text-decoration:none; font-size:13px; font-weight:700;
    padding:9px 16px 9px 12px; border-radius:100px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.04); margin-bottom:20px; }
  .back-link svg{ width:15px; height:15px; }
  .build-head{ margin-bottom:20px; text-align:center; }
  .build-eyebrow{ font-family:var(--font-display); font-size:22px; color:var(--gold); }
  .build-head h1{ font-size:clamp(22px,6vw,30px); margin:6px 0 10px; color:#fff; }
  .status{ display:block; font-size:.78rem; color:#c9ab98; }
  .status.err{ color:#ff9f9f; } .status.ok{ color:#8fd19e; }

  .save-pill-slot{ min-height:32px; display:flex; justify-content:center; align-items:center; margin-bottom:4px; }
  .save-pill{ display:inline-flex; align-items:center; gap:8px; padding:5px 13px; border-radius:999px; font-size:.78rem; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#e9d3be; }
  .save-pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }
  .save-pill.saving .dot{ animation:bhPulse 1.2s ease-in-out infinite; }
  .save-pill.saved{ color:#8fd19e; border-color:rgba(143,209,158,.4); }
  button.save-pill.error{ color:#ffb3b3; border-color:rgba(255,159,159,.55); }
  @keyframes bhPulse{ 0%,100%{opacity:1} 50%{opacity:.3} }

  .save-later{ margin:0 0 20px; } .save-later .btn{ width:100%; } .save-later--below{ display:none; }
  @media (max-width:640px){ .save-later--top{ display:none; } .save-later--below{ display:block; } }

  .progress-card .p-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .progress-card .p-head h2{ margin:0; }
  .progress-card .p-count{ font-size:.85rem; font-weight:600; color:var(--accent-deep); white-space:nowrap; }
  .p-bar{ height:6px; border-radius:99px; background:rgba(224,185,117,.4); overflow:hidden; }
  .p-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .35s ease; }
  .p-list{ list-style:none; margin:10px 0 0; padding:0; }
  .p-row + .p-row{ border-top:1px solid var(--line); }
  .p-row button{ display:flex; align-items:center; gap:12px; width:100%; padding:9px 2px; background:none; border:none; text-align:left; font-size:15px; color:var(--ink); min-height:46px; }
  .p-circle{ flex:none; width:28px; height:28px; border-radius:50%; border:2px solid rgba(36,16,16,.28); display:flex; align-items:center; justify-content:center; color:#fff; }
  .p-circle svg{ width:15px; height:15px; }
  .p-row.done .p-circle{ background:var(--good); border-color:var(--good); }
  .p-label{ flex:1; min-width:0; } .p-opt{ flex:none; font-size:.72rem; color:var(--ink-soft); }
  [id^="sec-"]{ scroll-margin-top:12px; }

  .card{ background:var(--panel); border-radius:16px; padding:22px 24px; margin-bottom:20px; box-shadow:0 14px 34px rgba(0,0,0,.28); }
  .card h2{ margin:0 0 4px; font-size:1.05rem; color:var(--accent-deep); display:flex; align-items:center; gap:8px; }
  .card h2::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--gold); flex-shrink:0; }
  .card .hint{ margin:0 0 16px; font-size:.8rem; color:var(--ink-soft); line-height:1.5; }
  .notice-card{ border:1px solid var(--accent); background:#fbe7ee !important; }
  .notice-card h2{ color:var(--accent-deep); }
  .notice-list{ margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px; line-height:1.5; color:var(--ink); }

  .field{ margin-bottom:16px; } .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:.78rem; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .field .field-hint{ font-size:.72rem; color:var(--ink-soft); margin-top:5px; }
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:.9rem; color:var(--ink); resize:vertical; }
  .field input:focus,.field textarea:focus,.field select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(194,24,91,.12); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; } .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  @media (max-width:640px){ .row2,.row3{ grid-template-columns:1fr; } .card{ padding:16px; } }

  .icon-btn{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--bad); font-size:.9rem; flex-shrink:0; }
  .icon-btn.neutral{ color:var(--ink-soft); }
  .photo-drop{ border:2px dashed var(--line); border-radius:14px; padding:20px; text-align:center; cursor:pointer; color:var(--ink-soft); font-size:.82rem; margin-bottom:10px; }
  .photo-drop input{ display:none; }
  .single-preview{ display:flex; align-items:center; gap:12px; background:var(--panel-soft); border-radius:10px; padding:8px; margin-bottom:10px; }
  .single-preview img{ width:56px; height:56px; object-fit:cover; border-radius:6px; flex-shrink:0; }
  .single-preview .name{ flex:1; font-size:.78rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px; }
  .photo-card{ background:#fff; border-radius:4px; padding:6px 6px 10px; box-shadow:0 6px 16px rgba(0,0,0,.18); position:relative; }
  .photo-card .thumb{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:2px; }
  .photo-card .ord{ position:absolute; top:10px; left:10px; background:rgba(36,16,16,.72); color:#fff; font-size:.6rem; border-radius:999px; padding:2px 7px; }
  .photo-card .remove{ margin-top:6px; width:100%; border:none; background:none; color:var(--bad); font-size:.66rem; text-transform:uppercase; }
  .photo-uploading{ font-size:.75rem; color:var(--accent-deep); margin-bottom:10px; }
  .add-row-btn{ padding:9px 16px; border-radius:9px; border:1px dashed var(--accent); background:transparent; color:var(--accent-deep); font-size:.82rem; font-weight:600; }

  .puzzle-item{ border:1px solid var(--line); border-radius:14px; padding:18px 18px 6px; margin-bottom:16px; background:#fffdf9; }
  .puzzle-item-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .puzzle-item-head .num{ width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; font-size:.78rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .puzzle-item-head input[type=text]{ flex:1; font-weight:600; }
  .reveal-fields{ background:var(--panel-soft); border-radius:10px; padding:14px; margin-top:6px; }

  .mini-btn{ border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 11px; font-size:.74rem; color:var(--ink); }
  .mini-btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .mini-btn.danger{ color:var(--bad); }
  .time-chip{ font-variant-numeric:tabular-nums; font-size:.76rem; color:var(--ink-soft); }
  .scrub{ width:100%; margin:10px 0 4px; accent-color:var(--accent); }
  .trim-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }

  .action-bar{ position:sticky; bottom:0; left:0; right:0; margin:28px -16px 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(0deg,var(--ink) 55%,rgba(36,16,16,0)); display:flex; gap:12px; }
  @media (max-width:640px){ .action-bar{ flex-direction:column; } .action-bar .btn{ width:100%; } }
  .btn{ padding:14px 24px; border-radius:100px; border:none; font-size:.9rem; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn svg{ width:17px; height:17px; }
  .btn-primary{ background:linear-gradient(155deg,var(--accent),var(--accent-deep)); color:#fff; box-shadow:0 10px 26px -6px rgba(194,24,91,.5); }
  .btn-gold{ background:linear-gradient(155deg,var(--gold-soft),var(--gold)); color:#3a2405; }
  .btn-outline{ background:rgba(255,255,255,.05); border:1.5px solid rgba(255,255,255,.28); color:#f3e3d3; }
  .btn:disabled{ opacity:.5; }

  .preview-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:720px){ .preview-backdrop{ align-items:center; } }
  .preview-modal{ background:#fff; width:100%; max-width:420px; height:88vh; max-height:820px; border-radius:18px 18px 0 0; display:flex; flex-direction:column; overflow:hidden; }
  @media (min-width:720px){ .preview-modal{ border-radius:18px; } }
  .preview-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--panel-soft); font-weight:600; color:var(--ink); }
  .preview-close{ background:none; border:none; font-weight:700; color:var(--ink); }
  .preview-frame{ flex:1; width:100%; border:none; background:#fff; }

  .bmodal-backdrop{ position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:18px; }
  .bmodal{ width:100%; max-width:420px; background:#fff; color:var(--ink); border-radius:18px; padding:26px 22px 20px; box-shadow:0 30px 70px rgba(0,0,0,.45); text-align:center; }
  .bmodal h2{ margin:0 0 8px; font-size:1.2rem; } .bmodal p{ margin:0; font-size:.9rem; line-height:1.55; color:var(--ink-soft); }
  .bm-actions{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .bm-primary,.bm-outline{ display:flex; align-items:center; justify-content:center; min-height:48px; padding:12px 18px; border-radius:999px; font-size:.95rem; font-weight:600; text-decoration:none; }
  .bm-primary{ background:var(--accent); color:#fff; border:none; }
  .bm-outline{ background:#fff; color:var(--accent-deep); border:1.5px solid var(--accent); }
  .bm-text{ background:none; border:none; padding:10px; color:var(--ink-soft); font-size:.9rem; font-weight:600; }
  .bm-link{ width:100%; margin-top:16px; padding:12px 14px; font-size:.85rem; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:10px; }
</style>
</head>

/* ---------------------------------------------------------------- helpers (same as admin-puzzle.html) */
function slugify(s) { return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }
function fmtTime(sec) { if (sec == null || isNaN(sec)) return "--:--"; const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ":" + String(s).padStart(2, "0"); }
function base64ToUtf8(b64) { const binary = atob(b64); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i); return new TextDecoder("utf-8").decode(bytes); }
function newPuzzleId() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function prettyName(filename) { return String(filename || "").replace(/\.[^.]+$/, "").replace(/^\d{10,}-/, "").replace(/[-_]+/g, " ").trim(); }

const PHOTO_MAX_DIM = 1400;
async function compressImage(file, maxDim, quality) {
  if (!file.type || !file.type.startsWith("image/") || file.type === "image/gif") return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    if (scale === 1 && file.size < 350 * 1024) { if (bitmap.close) bitmap.close(); return file; }
    const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
    const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
    if (bitmap.close) bitmap.close();
    const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", quality || 0.86));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch (e) { return file; }
}
async function uploadOne(file, slug, folder) {
  const ext = (file.name.match(/\.[^.]+$/) || [""])[0];
  const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "file";
  const path = `${slug}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${base}${ext}`;
  const { error } = await supabaseClient.storage.from("photos").upload(path, file, { upsert: true, cacheControl: "31536000" });
  if (error) throw error;
  const { data } = supabaseClient.storage.from("photos").getPublicUrl(path);
  return data.publicUrl;
}

  function boot(url,startSec,endSec){
    if(!url) return;
    function init(){
      var audio=new Audio(url); audio.loop=false; audio.muted=true; audio.volume=0;
      var START=Math.max(0,startSec||0), END=(endSec!=null&&endSec>START)?endSec:null, seeked=false, vol=0.45;
      audio.addEventListener("loadedmetadata",function(){ if(END===null||END>audio.duration) END=audio.duration; if(!seeked){ try{audio.currentTime=START;}catch(e){} seeked=true; } });

      audio.addEventListener("timeupdate",function(){ if(END!=null && audio.currentTime>=END-0.05){ audio.pause(); } });

      .catch(function(){ boot(DEFAULT_URL,DEFAULT_START,DEFAULT_END); });
  } else boot(DEFAULT_URL,DEFAULT_START,DEFAULT_END);
})();
<\/script>`;

   Autosave / resume / leave-warning / progress checklist
   Reuses the same save_draft / load_draft RPCs as your Chasing Her

===================================================================== */
const DRAFT_DEBOUNCE_MS = 2000;
function newDraftToken(name) {
  const bytes = new Uint8Array(16); (window.crypto || window.msCrypto).getRandomValues(bytes);
  const rand = Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");

function isDraftToken(t) { return /^[a-z0-9-]{20,96}$/.test(t || ""); }
function normalizeWa(raw) { raw = raw || ""; return /^\s/.test(raw) ? "+" + raw.trim() : raw.trim(); }
function snapOf(f) { const { slug, ...rest } = f; return JSON.stringify({ f: rest }); }

  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return "Saved just now";
  const m = Math.round(s / 60); if (m < 60) return "Saved " + m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return "Saved " + h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24); return "Saved " + d + (d === 1 ? " day ago" : " days ago");
}
async function loadDraftFromServer(token) {
  try { const { data, error } = await supabaseClient.rpc("load_draft", { p_token: token }); if (error || !data) return null; return data; }
  catch (e) { return null; }
}
function useDraft({ form, setForm, paramName, paramWa, setStatus, onToken }) {
  const [ready, setReady] = React.useState(false);
  const [lead, setLead] = React.useState({ name: paramName, wa: paramWa });
  const [saveState, setSaveState] = React.useState("idle");
  const [savedAt, setSavedAt] = React.useState(0);
  const [savedSnap, setSavedSnap] = React.useState(null);
  const [, setTick] = React.useState(0);
  const baseSnap = React.useMemo(() => snapOf(blankProject()), []);
  const latest = React.useRef({ form, lead }); latest.current = { form, lead };
  const savedSnapRef = React.useRef(null); const inflight = React.useRef(null); const unsavedRef = React.useRef(false);

  const snapNow = snapOf(form);

  const unsaved = ready && snapNow !== reference;
  const pristine = savedSnap == null && snapNow === baseSnap;
  unsavedRef.current = unsaved;

  const saveNow = React.useCallback(async () => {
    if (!supabaseClient) return false;
    while (inflight.current) { try { await inflight.current; } catch (e) {} }
    const sent = latest.current;
    if (!sent.form.slug) return false;
    const sentSnap = snapOf(sent.form);
    if (savedSnapRef.current === sentSnap) return true;
    const p = (async () => {
      setSaveState("saving");
      const { error } = await supabaseClient.rpc("save_draft", {
        p_token: sent.form.slug, p_product: "puzzle", p_data: { form: sent.form },
        p_name: sent.lead.name || null, p_wa: sent.lead.wa || null
      });
      if (error) throw error;
      savedSnapRef.current = sentSnap; setSavedSnap(sentSnap); setSavedAt(Date.now()); setSaveState("saved");
      try { window.history.replaceState(null, "", window.location.pathname + "?resume=" + encodeURIComponent(sent.form.slug)); } catch (e) {}
    })();
    inflight.current = p;
    try { await p; return true; } catch (e) { console.warn("Draft save failed", e); setSaveState("error"); return false; } finally { inflight.current = null; }
  }, []);

  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      const resume = new URLSearchParams(window.location.search).get("resume");
      if (resume && isDraftToken(resume) && supabaseClient) {
        const row = await loadDraftFromServer(resume);
        if (cancelled) return;
        if (row && row.data && row.data.form) {
          const restored = { ...blankProject(), ...row.data.form, slug: resume };
          const restoredLead = { name: paramName || row.full_name || "", wa: paramWa || normalizeWa(row.whatsapp) };
          setForm(restored); setLead(restoredLead);
          const sn = snapOf(restored);
          savedSnapRef.current = sn; setSavedSnap(sn);
          setSavedAt(row.updated_at ? Date.parse(row.updated_at) || Date.now() : Date.now());
          setSaveState("saved"); if (onToken) onToken(resume);
          setStatus({ text: "Welcome back. We restored your draft.", kind: "ok" });
          setReady(true); return;
        }
        setStatus({ text: "We couldn't find that saved draft — you can start a new one here.", kind: "err" });
      }
      const token = newDraftToken(paramName);
      setForm((f) => ({ ...f, slug: token }));
      if (onToken) onToken(token);
      setReady(true);
    })();
    return () => { cancelled = true; };
  }, []);

  React.useEffect(() => {
    if (!ready || !unsaved) return;
    const t = setTimeout(() => { saveNow(); }, DRAFT_DEBOUNCE_MS);
    return () => clearTimeout(t);
  }, [ready, unsaved, snapNow]);

  React.useEffect(() => {
    const onHide = () => { if (document.visibilityState === "hidden" && unsavedRef.current) saveNow(); };
    const onOnline = () => { if (unsavedRef.current) saveNow(); };
    document.addEventListener("visibilitychange", onHide); window.addEventListener("online", onOnline);
    return () => { document.removeEventListener("visibilitychange", onHide); window.removeEventListener("online", onOnline); };
  }, []);
  React.useEffect(() => { const i = setInterval(() => setTick((t) => t + 1), 30000); return () => clearInterval(i); }, []);

  let pill = null;
  if (ready && !pristine) {
    if (saveState === "error") pill = { kind: "error", text: "Couldn't save. Retry" };
    else if (unsaved || saveState === "saving") pill = { kind: "saving", text: "Saving…" };
    else if (savedSnap != null) pill = { kind: "saved", text: relativeSaved(savedAt) };
  }
  const resumeLink = form.slug ? window.location.origin + window.location.pathname + "?resume=" + encodeURIComponent(form.slug) : "";
  return { ready, lead, pill, unsavedRef, pristine, hasSaved: savedSnap != null, saveNow, resumeLink };
}

    {state === "ready" && (<React.Fragment><h2 id="later-title">Your progress is saved</h2>
      <p>Open this link on any device to pick up where you left off. Anyone with the link can edit your draft, so keep it to yourself.</p>
      <input ref={inputRef} className="bm-link" type="text" readOnly value={link} onFocus={(e) => e.target.select()} />
      <div className="bm-actions">
        <a className="bm-primary" href={waHref} target="_blank" rel="noopener" autoFocus>Send to my WhatsApp</a>
        <button type="button" className="bm-outline" onClick={() => onCopy(inputRef.current)}>{copied ? "Copied ✓" : "Copy link"}</button>
        <button type="button" className="bm-text" onClick={onClose}>Close</button>
      </div>
    </React.Fragment>)}
  </BModal>);
}

/* ---------------------------------------------------------------------
   Build tool
--------------------------------------------------------------------- */
function BuildTool() {
  const params = new URLSearchParams(window.location.search);
  const paramName = params.get("name") || "";
  const paramWa = normalizeWa(params.get("wa"));

  const [form, setForm] = React.useState(blankProject());
  const [submitting, setSubmitting] = React.useState(false);
  const [status, setStatus] = React.useState({ text: "", kind: "" });
  const [previewOpen, setPreviewOpen] = React.useState(false);
  const [previewHtml, setPreviewHtml] = React.useState("");
  const [submitted, setSubmitted] = React.useState(false);
  const [previewed, setPreviewed] = React.useState(false);
  const [leaveOpen, setLeaveOpen] = React.useState(false);
  const [laterOpen, setLaterOpen] = React.useState(false);
  const [laterState, setLaterState] = React.useState("saving");
  const [copied, setCopied] = React.useState(false);
  const allowLeave = React.useRef(false);

  const draft = useDraft({ form, setForm, paramName, paramWa, setStatus, onToken: () => {} });
  const leadName = draft.lead.name, leadWa = draft.lead.wa;

  React.useEffect(() => {
    const onBeforeUnload = (e) => { if (allowLeave.current || !draft.unsavedRef.current) return; e.preventDefault(); e.returnValue = ""; return ""; };
    window.addEventListener("beforeunload", onBeforeUnload);
    return () => window.removeEventListener("beforeunload", onBeforeUnload);
  }, []);
  function onBackClick(e) { if (draft.unsavedRef.current) { e.preventDefault(); setLeaveOpen(true); } }
  function leaveAnyway() { allowLeave.current = true; window.location.href = "select-product.html"; }
  function scrollToId(id) { const el = document.getElementById(id); if (!el) return; el.scrollIntoView({ behavior: "smooth", block: "start" }); }
  function onRowClick(r) { if (r.action === "preview") { previewSite(); return; } if (r.target) scrollToId(r.target); }

  async function openSaveLater() {
    if (draft.pristine) { setStatus({ text: "Add a photo or a puzzle first, then you can save and come back to it.", kind: "" }); return; }
    setCopied(false); setLaterOpen(true); setLaterState("saving");
    const ok = (draft.unsavedRef.current || !draft.hasSaved) ? await draft.saveNow() : true;
    setLaterState(ok ? "ready" : "error");
  }
  async function retrySaveLater() { setLaterState("saving"); setLaterState((await draft.saveNow()) ? "ready" : "error"); }
  async function copyLink(inputEl) { const ok = await copyText(draft.resumeLink, inputEl); setCopied(ok); if (ok) setTimeout(() => setCopied(false), 2200); }
  const waDigits = String(leadWa || "").replace(/\D/g, "");
  const waHref = "https://wa.me/" + waDigits + "?text=" + encodeURIComponent("Here is my Puzzle builder link. Open it to keep building where I left off: " + draft.resumeLink);

  function set(field, value) { setForm((f) => ({ ...f, [field]: value })); }

  const filledPuzzles = (form.puzzles || []).filter((p) => p.image_url).length;
  const buildRows = () => ([
    { id: "pin", label: "Unlock code", done: form.pin !== blankProject().pin, target: "sec-pin" },
    { id: "message", label: "Your opening & closing lines", done: !!String(form.intro_message || "").trim() && !!String(form.final_message || "").trim(), target: "sec-message" },
    { id: "puzzles", label: "Puzzles (photo for each)", done: filledPuzzles >= 3 && filledPuzzles === (form.puzzles || []).length, target: "sec-puzzles" },
    { id: "photos", label: "Final-screen photos", optional: true, done: (form.photos || []).length > 0, target: "sec-photos" },
    { id: "music", label: "Background music", optional: true, done: !!String(form.music_url || "").trim(), target: "sec-music" },
    { id: "preview", label: "Preview your puzzle", done: previewed, action: "preview" },
    { id: "continue", label: "Continue to pay", done: submitted, target: "sec-continue" }
  ]);

  async function goCustomBuild() {
    if (!draft.pristine) {
      const saved = draft.unsavedRef.current ? await draft.saveNow() : true;
      const msg = saved
        ? "Switch to a custom build? Your progress is saved as a draft, so you can still come back to it. Continue?"
        : "We couldn't save your latest changes, so leaving now will lose them. Continue anyway?";
      if (!window.confirm(msg)) return;
    }
    allowLeave.current = true;
    const qs = new URLSearchParams(); if (leadName) qs.set("name", leadName); if (leadWa) qs.set("wa", leadWa); qs.set("product", "puzzle");
    window.location.href = "thankyou-custom.html?" + qs.toString();
  }

  function previewSite() {
    try { setPreviewHtml(buildSiteHtml(form.slug || "preview", form)); setPreviewOpen(true); setPreviewed(true); }
    catch (e) { setStatus({ text: "Couldn't build the preview: " + e.message, kind: "err" }); }
  }

  async function submitAndContinue() {
    const slug = slugify(form.slug) || ("guest-" + Date.now().toString(36));
    setSubmitting(true); setStatus({ text: "Getting your puzzle ready…", kind: "" });
    try {
      const output = buildSiteHtml(slug, form);
      let htmlUrl = "";
      if (supabaseClient) {
        await supabaseClient.from("puzzle_projects").upsert({ ...form, slug, updated_at: new Date().toISOString() }, { onConflict: "slug" });
        const path = "puzzle/" + slug + ".html";
        const blob = new Blob([output], { type: "text/html;charset=utf-8" });
        const { error: upErr } = await supabaseClient.storage.from("submissions").upload(path, blob, { upsert: true, contentType: "text/html" });
        if (upErr) throw upErr;
        const { data: pub } = supabaseClient.storage.from("submissions").getPublicUrl(path);
        htmlUrl = pub.publicUrl;
        await supabaseClient.from("submissions").insert([{ slug, product: "puzzle", full_name: leadName || null, whatsapp: leadWa || null, pin: form.pin, html_path: path, html_url: htmlUrl, status: "pending_payment" }]);
      }
      setSubmitted(true); setStatus({ text: "", kind: "" });
      try { sessionStorage.setItem("puzzle_order", JSON.stringify({ ref: slug, product: "puzzle", name: leadName || "" })); } catch (e) {}
      allowLeave.current = true;
      window.location.href = "thank-you.html?product=puzzle";
    } catch (e) { setStatus({ text: "Something went wrong saving your work: " + e.message + " — please try again.", kind: "err" }); }
    setSubmitting(false);
  }

  return (
    <div className="build-shell">
      <div className="build-inner">
        <a className="back-link" href="select-product.html" onClick={onBackClick}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6" /></svg>Back
        </a>
        <div className="build-head">
          <div className="build-eyebrow">Puzzle</div>
          <h1>Let's put your puzzle together</h1>
          <SavePill pill={draft.pill} onRetry={draft.saveNow} />
          <span className={"status " + status.kind}>{status.text}</span>
        </div>

        <div className="save-later save-later--top">
          <button type="button" className="btn btn-outline" onClick={openSaveLater}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z" /><path d="M17 21v-8H7v8M7 3v5h8" /></svg>
            Save and continue later
          </button>
        </div>
        <ProgressCard rows={buildRows()} onRowClick={onRowClick} />
        <div className="save-later save-later--below">
          <button type="button" className="btn btn-outline" onClick={openSaveLater}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z" /><path d="M17 21v-8H7v8M7 3v5h8" /></svg>
            Save and continue later
          </button>
        </div>

        <div className="card" id="sec-pin">
          <h2>Your unlock code</h2>
          <p className="hint">The code the person you send it to will type in to open your puzzle. Pick something easy for them to guess — like a date that means something to both of you.</p>
          <div className="field"><label>PIN code</label><input type="text" value={form.pin} onChange={(e) => set("pin", e.target.value)} inputMode="numeric" /></div>
        </div>

        <div className="card" id="sec-message">
          <h2>Opening & closing lines</h2>
          <div className="field"><label>What they see before the first puzzle</label><input type="text" value={form.intro_message} onChange={(e) => set("intro_message", e.target.value)} /></div>
          <div className="field"><label>What they see after the last puzzle is solved</label><input type="text" value={form.final_message} onChange={(e) => set("final_message", e.target.value)} /></div>
        </div>

        <div className="card" id="sec-puzzles">
          <h2>Your puzzles</h2>
          <p className="hint">We've started you off with three — feel free to add more. Each one needs its own photo. Give each puzzle a time limit if you want to add a little pressure, or set it to 0 for no limit.</p>
          <PuzzlesEditor slug={slugify(form.slug)} puzzles={form.puzzles} onChange={(v) => set("puzzles", v)} />
        </div>

        <div className="card" id="sec-photos">
          <h2>Final-screen photos (optional)</h2>
          <p className="hint">A slow, soft crossfade of photos behind your very last message.</p>
          <PhotoGridUploader slug={slugify(form.slug)} items={form.photos} onChange={(v) => set("photos", v)} />
        </div>

        <div className="card" id="sec-music">
          <h2>Background music (optional)</h2>
          <p className="hint">Find your song on YouTube, use a "YouTube to mp3" site to save it, then upload that file below — or ask us to add it for a small extra fee on WhatsApp.</p>
          <div className="field"><label>Or paste a direct link to an mp3 file</label><input type="text" value={form.music_url} onChange={(e) => set("music_url", e.target.value)} placeholder="https://…/song.mp3" /></div>
          <MusicUploader slug={slugify(form.slug)} value={form.music_url} onChange={(v) => set("music_url", v)} />
          <MusicRangeEditor url={form.music_url} start={form.music_start} end={form.music_end} onChangeStart={(v) => set("music_start", v)} onChangeEnd={(v) => set("music_end", v)} />
        </div>

        <div className="card notice-card" id="sec-continue">
          <h2>Before you continue</h2>
          <ul className="notice-list">
            <li>Tapping the WhatsApp button below doesn't publish your puzzle yet — it takes you to us so you can pay.</li>
            <li>Once you pay, we host it and it becomes a real, working link you can share.</li>
            <li>Your work saves automatically as a draft, so you can leave and come back with your resume link.</li>
          </ul>
        </div>

        <div className="card">
          <h2>Prefer we build it for you?</h2>
          <p className="hint">Send us the photos and words, and we'll put the whole puzzle together for you.</p>
          <button type="button" className="btn btn-gold" style={{ width: "100%" }} onClick={goCustomBuild}>I want a custom build instead</button>
        </div>

        <div className="action-bar">
          <button className="btn btn-outline" onClick={previewSite}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" /><circle cx="12" cy="12" r="3" /></svg>
            Preview my puzzle
          </button>
          <button className="btn btn-primary" onClick={submitAndContinue} disabled={submitting || submitted}>
            {!submitting && !submitted && (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 4L9 15l-5-5" /></svg>)}
            {submitting ? "Getting it ready…" : submitted ? "Sent — check WhatsApp" : "I'm happy with it — continue to pay"}
          </button>
        </div>
      </div>

      {leaveOpen && <LeaveModal onStay={() => setLeaveOpen(false)} onLeave={leaveAnyway} />}
      {laterOpen && <SaveLaterModal state={laterState} link={draft.resumeLink} waHref={waHref} copied={copied} onCopy={copyLink} onRetry={retrySaveLater} onClose={() => setLaterOpen(false)} />}
      {previewOpen && (
        <div className="preview-backdrop" onClick={() => setPreviewOpen(false)}>
          <div className="preview-modal" onClick={(e) => e.stopPropagation()}>
            <div className="preview-modal-head"><span>Your preview</span><button type="button" className="preview-close" onClick={() => setPreviewOpen(false)}>Close ✕</button></div>
            <iframe className="preview-frame" title="Puzzle preview" srcDoc={previewHtml}></iframe>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  if (!supabaseClient) return (<div className="setup-notice" style={{ maxWidth: 560, margin: "60px auto", background: "#fdf6ee", borderRadius: 16, padding: "32px 36px" }}><h1>One moment</h1><p>This page needs Supabase configured to work — please try again shortly.</p></div>);
  return <BuildTool />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
