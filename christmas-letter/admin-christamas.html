<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#241010" />
<title>Backstage — Puzzle Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#241010; --ink-soft:#7a6a62; --panel:#fdf6ee; --panel-soft:#f6ead9; --line:rgba(36,16,16,.12);
    --accent:#c2185b; --accent-deep:#96123f; --gold:#cf9f4e; --gold-soft:#e0b975; --good:#3d7a4f; --bad:#b23b3b;
    --font-display:'Dancing Script',cursive; --font-ui:'Poppins',sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; }
  body{ font-family:var(--font-ui); background:var(--ink); color:var(--ink); -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; cursor:pointer; }
  input,textarea,select{ font-family:inherit; }
  #root{ min-height:100%; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .gate{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:40px 20px; text-align:center;
    background:radial-gradient(circle at 50% 20%,#3a1414 0%,var(--ink) 65%); color:#f3e3d3; }
  .gate-mark{ font-family:var(--font-display); font-size:2.6rem; }
  .gate-sub{ font-size:.85rem; color:#c9ab98; max-width:360px; line-height:1.5; }
  .gate form{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .gate input{ padding:12px 16px; border-radius:10px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#fff; font-size:.95rem; min-width:220px; }
  .gate input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(232,194,122,.16); }
  .gate button{ padding:12px 22px; border-radius:10px; border:none; background:linear-gradient(155deg,var(--accent),var(--accent-deep)); color:#fff; font-weight:600; font-size:.9rem; }
  .gate-error{ color:#ff9f9f; font-size:.85rem; min-height:1em; }

  .setup-notice{ max-width:560px; margin:60px auto; background:var(--panel); border-radius:16px; padding:32px 36px; box-shadow:0 20px 50px rgba(0,0,0,.35); line-height:1.6; }
  .setup-notice h1{ font-family:var(--font-display); font-size:2rem; margin:0 0 6px; color:var(--accent-deep); }
  .setup-notice code{ background:var(--panel-soft); padding:2px 6px; border-radius:6px; font-size:.85em; }

  .shell{ display:flex; min-height:100vh; }
  .sidebar{ width:280px; flex:0 0 280px; background:linear-gradient(180deg,#2c1212,#1c0b0b); color:#f3e3d3; padding:26px 18px; display:flex; flex-direction:column; gap:18px; }
  .brand{ display:flex; flex-direction:column; gap:2px; padding:0 6px 14px; border-bottom:1px solid rgba(255,255,255,.1); }
  .brand-mark{ font-family:var(--font-display); font-size:1.8rem; }
  .brand-sub{ font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:#c9ab98; }
  .new-btn{ display:flex; align-items:center; justify-content:center; gap:8px; padding:11px 14px; border-radius:10px; border:1px dashed rgba(255,255,255,.35);
    background:transparent; color:#f3e3d3; font-size:.88rem; font-weight:500; }
  .new-btn:hover{ background:rgba(255,255,255,.07); border-color:var(--gold); }
  .project-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin:0 -6px; padding:0 6px; }
  .project-item{ text-align:left; padding:10px 12px; border-radius:10px; border:1px solid transparent; background:transparent; color:#e9d6c6; font-size:.86rem;
    display:flex; flex-direction:column; gap:2px; }
  .project-item:hover{ background:rgba(255,255,255,.07); }
  .project-item.active{ background:rgba(194,24,91,.24); border-color:rgba(194,24,91,.55); }
  .project-item .slug{ font-weight:600; color:#fff; }
  .project-item .meta{ font-size:.72rem; color:#b79a89; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .project-empty{ font-size:.8rem; color:#a98b7c; padding:10px 6px; line-height:1.5; }
  .sidebar-foot{ font-size:.68rem; color:#8a6f62; line-height:1.5; padding:0 6px; }

  .main{ flex:1; overflow-y:auto; background:var(--ink); }
  .main-inner{ max-width:820px; margin:0 auto; padding:40px 32px 140px; }
  .topline{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
  .topline h1{ font-family:var(--font-display); font-size:2.1rem; color:#f3e3d3; margin:0; }
  .topline .status{ font-size:.78rem; color:#c9ab98; }
  .topline .status.err{ color:#ff9f9f; }
  .topline .status.ok{ color:#8fd19e; }

  .fix-banner{ background:#3a1414; border:1px solid #c2185b; border-radius:14px; padding:18px 20px; margin-bottom:22px; color:#ffe3e3; }
  .fix-banner-text{ font-size:.86rem; line-height:1.5; margin-bottom:10px; }
  .fix-banner-sql{ display:block; background:#1c0b0b; border-radius:8px; padding:10px 12px; font-size:.78rem; color:#ffd3a8; overflow-x:auto; white-space:pre; margin-bottom:10px; }
  .fix-banner-actions{ display:flex; gap:10px; }
  .fix-banner-check{ background:var(--accent); border:1px solid var(--accent); color:#fff; border-radius:8px; padding:6px 14px; font-size:.76rem; font-weight:600; }
  .fix-banner-check:disabled{ opacity:.6; }
  .fix-banner-dismiss{ background:transparent; border:1px solid rgba(255,255,255,.3); color:#ffe3e3; border-radius:8px; padding:6px 14px; font-size:.76rem; }

  .card{ background:var(--panel); border-radius:16px; padding:26px 28px; margin-bottom:20px; box-shadow:0 14px 34px rgba(0,0,0,.28); border:1px solid rgba(36,16,16,.05); }
  .card h2{ margin:0 0 4px; font-size:1.05rem; color:var(--accent-deep); display:flex; align-items:center; gap:8px; }
  .card h2::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--gold); flex-shrink:0; }
  .card .hint{ margin:0 0 18px; font-size:.8rem; color:var(--ink-soft); line-height:1.5; }

  .field{ margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:.78rem; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .field .field-hint{ font-size:.72rem; color:var(--ink-soft); margin-top:5px; }
  .field input[type=text],.field input[type=password],.field input[type=number],.field textarea,.field select{
    width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:.9rem; color:var(--ink); resize:vertical; }
  .field input:focus,.field textarea:focus,.field select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(194,24,91,.12); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  @media (max-width:640px){ .row2,.row3{ grid-template-columns:1fr; } }

  .icon-btn{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center;
    color:var(--bad); font-size:.9rem; flex-shrink:0; }
  .icon-btn:hover{ background:#fdeaea; border-color:rgba(178,59,59,.4); }
  .icon-btn.neutral{ color:var(--ink-soft); }
  .icon-btn.neutral:hover{ background:var(--panel-soft); border-color:var(--line); }

  .photo-drop{ border:2px dashed var(--line); border-radius:14px; padding:20px; text-align:center; cursor:pointer; color:var(--ink-soft); font-size:.82rem; margin-bottom:10px; }
  .photo-drop:hover,.photo-drop.drag{ border-color:var(--accent); background:#fdeef3; color:var(--accent-deep); }
  .photo-drop input{ display:none; }
  .single-preview{ display:flex; align-items:center; gap:12px; background:var(--panel-soft); border-radius:10px; padding:8px; margin-bottom:10px; }
  .single-preview img{ width:56px; height:56px; object-fit:cover; border-radius:6px; flex-shrink:0; }
  .single-preview .name{ flex:1; font-size:.78rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; }
  .photo-card{ background:#fff; border-radius:4px; padding:6px 6px 10px; box-shadow:0 6px 16px rgba(0,0,0,.18); position:relative; }
  .photo-card .thumb{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:2px; background:var(--panel-soft); display:block; }
  .photo-card .ord{ position:absolute; top:10px; left:10px; background:rgba(36,16,16,.72); color:#fff; font-size:.6rem; border-radius:999px; padding:2px 7px; }
  .photo-card .remove{ margin-top:6px; width:100%; border:none; background:none; color:var(--bad); font-size:.66rem; letter-spacing:.03em; text-transform:uppercase; padding:2px; }
  .photo-uploading{ font-size:.75rem; color:var(--accent-deep); margin-bottom:10px; }

  .add-row-btn{ padding:9px 16px; border-radius:9px; border:1px dashed var(--accent); background:transparent; color:var(--accent-deep); font-size:.82rem; font-weight:600; }
  .add-row-btn:hover{ background:#fdeef3; }

  /* Puzzles editor */
  .puzzle-item{ border:1px solid var(--line); border-radius:14px; padding:18px 18px 6px; margin-bottom:16px; background:#fffdf9; }
  .puzzle-item-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .puzzle-item-head .num{ width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; font-size:.78rem; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .puzzle-item-head input[type=text]{ flex:1; font-weight:600; }
  .puzzle-item-actions{ display:flex; gap:4px; }
  .reveal-fields{ background:var(--panel-soft); border-radius:10px; padding:14px; margin-top:6px; }

  .audio-row{ display:flex; align-items:center; gap:8px; background:var(--panel-soft); border-radius:8px; padding:8px 10px; flex-wrap:wrap; }
  .audio-row.in-use{ background:#fbe3ec; box-shadow:inset 0 0 0 1px rgba(194,24,91,.35); }
  .audio-name{ flex:1; min-width:120px; }
  .audio-name .n{ font-size:.82rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .audio-name .m{ font-size:.68rem; color:var(--ink-soft); }
  .scrub{ width:100%; margin:10px 0 4px; accent-color:var(--accent); }
  .trim-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .mini-btn{ border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 11px; font-size:.74rem; color:var(--ink); }
  .mini-btn:hover{ background:var(--panel-soft); }
  .mini-btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .mini-btn.danger{ color:var(--bad); }
  .time-chip{ font-variant-numeric:tabular-nums; font-size:.76rem; color:var(--ink-soft); }

  .live-link-box{ background:linear-gradient(155deg,rgba(63,122,79,.12),rgba(63,122,79,.05)); border:1px solid rgba(61,122,79,.35); border-radius:14px; padding:16px 18px; margin-bottom:18px; }
  .live-link-label{ font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--good); font-weight:600; margin-bottom:6px; }
  .live-link-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .live-link-url{ color:var(--ink); font-size:.88rem; font-weight:600; word-break:break-all; text-decoration:none; }
  .copy-link-btn{ background:#fff; border:1px solid rgba(61,122,79,.4); color:var(--good); padding:6px 14px; border-radius:8px; font-size:.76rem; font-weight:600; }

  .action-bar{ position:sticky; bottom:0; left:0; right:0; background:linear-gradient(0deg,var(--ink) 60%,rgba(36,16,16,0)); padding:26px 0 10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .btn{ padding:13px 22px; border-radius:11px; border:none; font-size:.88rem; font-weight:600; }
  .btn-primary{ background:linear-gradient(155deg,var(--accent),var(--accent-deep)); color:#fff; box-shadow:0 8px 20px rgba(194,24,91,.32); }
  .btn-gold{ background:linear-gradient(155deg,var(--gold-soft),var(--gold)); color:#3a2405; box-shadow:0 8px 20px rgba(207,159,78,.32); }
  .btn:disabled{ opacity:.5; }
  .btn-outline{ background:transparent; border:1px solid rgba(255,255,255,.3); color:#f3e3d3; }
  .slug-locked{ opacity:.6; }
</style>
</head>

/* ---------------------------------------------------------------- helpers */
function slugify(s) { return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }
function fmtTime(sec) {
  if (sec == null || isNaN(sec)) return "--:--";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function base64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = ""; bytes.forEach((b) => { binary += String.fromCharCode(b); });
  return btoa(binary);
}
function newPuzzleId() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function prettyName(filename) {
  return String(filename || "").replace(/\.[^.]+$/, "").replace(/^\d{10,}-/, "").replace(/[-_]+/g, " ").trim();
}

const PHOTO_MAX_DIM = 1400;
async function compressImage(file, maxDim, quality) {
  if (!file.type || !file.type.startsWith("image/") || file.type === "image/gif") return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    if (scale === 1 && file.size < 350 * 1024) { if (bitmap.close) bitmap.close(); return file; }
    const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
    if (bitmap.close) bitmap.close();
    const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", quality || 0.86));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch (e) { return file; }
}
async function uploadOne(file, slug, folder) {
  const ext = (file.name.match(/\.[^.]+$/) || [""])[0];
  const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "file";
  const path = `${slug}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${base}${ext}`;
  const { error } = await supabaseClient.storage.from("photos").upload(path, file, { upsert: true, cacheControl: "31536000" });
  if (error) throw error;
  const { data } = supabaseClient.storage.from("photos").getPublicUrl(path);
  return data.publicUrl;
}

  }
  if(SUPABASE_URL.indexOf("http")===0){

      .then(function(r){ return r.ok?r.json():[]; })
      .then(function(rows){ var row=rows&&rows[0]; boot((row&&row.music_url)||DEFAULT_URL,(row&&row.music_start!=null)?row.music_start:DEFAULT_START,(row&&row.music_end!=null)?row.music_end:DEFAULT_END); })
      .catch(function(){ boot(DEFAULT_URL,DEFAULT_START,DEFAULT_END); });
  } else boot(DEFAULT_URL,DEFAULT_START,DEFAULT_END);

}

function buildSiteHtml(slug, form) {
  const templateHtml = base64ToUtf8(TEMPLATE_B64);
  const snapshot = {
    pin: form.pin, intro_message: form.intro_message, final_message: form.final_message,
    puzzles: form.puzzles, photos: form.photos
  };
  const startMarker = "/* DEFAULT_CONFIG:START */", endMarker = "/* DEFAULT_CONFIG:END */";
  const s = templateHtml.indexOf(startMarker), e = templateHtml.indexOf(endMarker);
  if (s === -1 || e === -1) throw new Error("Template markers not found — re-generate TEMPLATE_B64 from the latest template-puzzle.html.");
  const middle = startMarker + "\nconst DEFAULT_CONFIG = " + JSON.stringify(snapshot, null, 2) + ";\n" + endMarker;
  let output = templateHtml.slice(0, s) + middle + templateHtml.slice(e + endMarker.length);
  output = output.split('"YOUR_SUPABASE_URL"').join(JSON.stringify(SUPABASE_URL));
  output = output.split('"YOUR_SUPABASE_ANON_KEY"').join(JSON.stringify(SUPABASE_ANON_KEY));
  output = output.split('"YOUR_PROJECT_SLUG"').join(JSON.stringify(slug));
  const musicBlock = buildMusicBlock(slug, form);
  const bodyClose = output.lastIndexOf("</body>");
  output = bodyClose === -1 ? output + musicBlock : output.slice(0, bodyClose) + musicBlock + "\n" + output.slice(bodyClose);
  return output;
}

   GitHub publishing (identical pattern to your Chasing Her tool)
--------------------------------------------------------------------- */
async function githubRequest(path, options) {
  options = options || {};
  const res = await fetch("https://api.github.com" + path, {
    ...options,
    headers: { Authorization: "Bearer " + GITHUB_TOKEN, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(options.headers || {}) }
  });
  if (!res.ok) {
    let message = "GitHub API error (" + res.status + ")";
    try { const body = await res.json(); if (body && body.message) message = body.message; } catch (e) {}
    throw new Error(message);
  }
  if (res.status === 204) return null;
  return res.json();
}
async function githubGetUsername() { const u = await githubRequest("/user"); return u.login; }
async function githubCreateRepo(name) {
  return githubRequest("/user/repos", { method: "POST", body: JSON.stringify({ name, description: "A puzzle, built with Backstage.", private: false, auto_init: true }) });
}
async function githubGetRepo(owner, repo) { return githubRequest("/repos/" + owner + "/" + repo); }
async function githubGetFileSha(owner, repo, path, branch) {
  try { const d = await githubRequest("/repos/" + owner + "/" + repo + "/contents/" + path + "?ref=" + encodeURIComponent(branch)); return d.sha; }
  catch (e) { return null; }
}
async function githubUpsertFile(owner, repo, path, content, message, sha, branch) {
  const body = { message, content: utf8ToBase64(content), branch };
  if (sha) body.sha = sha;
  return githubRequest("/repos/" + owner + "/" + repo + "/contents/" + path, { method: "PUT", body: JSON.stringify(body) });
}
async function githubEnablePages(owner, repo, branch) {
  try { await githubRequest("/repos/" + owner + "/" + repo + "/pages", { method: "POST", body: JSON.stringify({ source: { branch, path: "/" } }) }); } catch (e) {}
}

function MusicRangeEditor({ url, start, end, onChangeStart, onChangeEnd }) {
  const audioRef = React.useRef(null);
  const [duration, setDuration] = React.useState(null); const [time, setTime] = React.useState(0); const [playing, setPlaying] = React.useState(false);
  React.useEffect(() => {
    setDuration(null); setTime(0); setPlaying(false);
    if (!url) return;
    const a = new Audio(url); a.preload = "metadata"; audioRef.current = a;
    const onMeta = () => setDuration(a.duration); const onTime = () => setTime(a.currentTime); const onEnd = () => setPlaying(false);
    a.addEventListener("loadedmetadata", onMeta); a.addEventListener("timeupdate", onTime); a.addEventListener("ended", onEnd);
    return () => { a.pause(); a.removeEventListener("loadedmetadata", onMeta); a.removeEventListener("timeupdate", onTime); a.removeEventListener("ended", onEnd); };
  }, [url]);
  function toggle() { const a = audioRef.current; if (!a) return; if (playing) { a.pause(); setPlaying(false); } else { a.play().then(() => setPlaying(true)).catch(() => {}); } }
  function seek(v) { const a = audioRef.current; if (!a) return; try { a.currentTime = v; setTime(v); } catch (e) {} }
  if (!url) return null;
  return (
    <div className="field">
      <label>Which part of the song should play?</label>
      <div className="trim-row">
        <button type="button" className="mini-btn primary" onClick={toggle}>{playing ? "Pause" : "Play"}</button>
        <span className="time-chip">{fmtTime(time)} / {fmtTime(duration)}</span>
      </div>
      <input className="scrub" type="range" min="0" max={duration || 0} step="0.1" value={time} onChange={(e) => seek(Number(e.target.value))} />
      <div className="trim-row">
        <button type="button" className="mini-btn" onClick={() => onChangeStart(Math.floor(time))}>Start here ({fmtTime(start || 0)})</button>
        <button type="button" className="mini-btn" onClick={() => onChangeEnd(Math.ceil(time))}>End here ({end ? fmtTime(end) : "song end"})</button>
        {(start || end) ? <button type="button" className="mini-btn danger" onClick={() => { onChangeStart(0); onChangeEnd(null); }}>Clear trim</button> : null}
      </div>
    </div>
  );
}

      let branch = "main", sha = null;
      if (!form.github_repo) { const repo = await githubCreateRepo(repoName); branch = repo.default_branch || "main"; await new Promise((r) => setTimeout(r, 1500)); }
      else { const repo = await githubGetRepo(owner, repoName); branch = repo.default_branch || "main"; sha = await githubGetFileSha(owner, repoName, "index.html", branch); }
      await githubUpsertFile(owner, repoName, "index.html", output, sha ? "Update puzzle" : "Publish puzzle", sha, branch);
      if (!form.github_repo) await githubEnablePages(owner, repoName, branch);
      const liveUrl = "https://" + owner + ".github.io/" + repoName + "/";
      const updated = { ...form, slug, github_repo: repoName, published_url: liveUrl };
      setForm(updated); setCurrentSlug(slug);
      if (supabaseClient) { await supabaseClient.from("puzzle_projects").upsert({ ...updated, updated_at: new Date().toISOString() }, { onConflict: "slug" }); refreshList(); }
      setStatus({ text: "Published! Your link is ready below.", kind: "ok" });
    } catch (e) { setStatus({ text: "Couldn't publish: " + e.message, kind: "err" }); }
    setPublishing(false);
  }
  function copyLiveLink() {
    if (!form.published_url) return;
    navigator.clipboard.writeText(form.published_url).then(
      () => setStatus({ text: "Link copied.", kind: "ok" }),
      () => setStatus({ text: "Couldn't copy — copy it from the box above.", kind: "err" })
    );
  }

  const isNew = currentSlug === null;

  return (
    <div className="shell">
      <div className="sidebar">
        <div className="brand"><div className="brand-mark">Backstage</div><div className="brand-sub">Puzzle builder</div></div>
        <button className="new-btn" onClick={startNew}>+ New puzzle project</button>
        <div className="project-list">
          {loadingList && <div className="project-empty">Loading projects…</div>}
          {!loadingList && !projects.length && <div className="project-empty">No puzzle projects yet — create one above.</div>}
          {projects.map((p) => (
            <button key={p.slug} className={"project-item" + (p.slug === currentSlug ? " active" : "")} onClick={() => openProject(p.slug)}>
              <span className="slug">{p.slug}</span><span className="meta">{p.intro_message || "—"}</span>
            </button>
          ))}
        </div>
        <div className="sidebar-foot">Each project lives as one row in <code>puzzle_projects</code>. Saving updates the live site instantly.</div>
      </div>

      <div className="main">
        <div className="main-inner">
          <div className="topline"><h1>{isNew ? "New puzzle project" : form.slug}</h1><span className={"status " + status.kind}>{status.text}</span></div>

          <div className="card">
            <h2>Basics</h2>
            <div className="row2">
              <div className="field">
                <label>Slug</label>
                <input type="text" className={!isNew ? "slug-locked" : ""} value={form.slug} disabled={!isNew} placeholder="e.g. for-sarah-2026" onChange={(e) => set("slug", e.target.value)} />
                {!isNew && <div className="field-hint">Slugs can't be changed after the first save — start a new project instead.</div>}
              </div>
              <div className="field"><label>PIN</label><input type="text" value={form.pin} onChange={(e) => set("pin", e.target.value)} /></div>
            </div>
          </div>

          <div className="card">
            <h2>The message</h2>
            <div className="field"><label>Opening line (typed out before the first puzzle)</label><input type="text" value={form.intro_message} onChange={(e) => set("intro_message", e.target.value)} /></div>
            <div className="field"><label>Final message (after every puzzle is solved)</label><input type="text" value={form.final_message} onChange={(e) => set("final_message", e.target.value)} /></div>
          </div>

          <div className="card">
            <h2>The puzzles</h2>
            <p className="hint">Add three or more — they're solved in this order. Each one has its own photo, difficulty, countdown, and what it reveals once solved.</p>
            <PuzzlesEditor slug={slugify(form.slug)} puzzles={form.puzzles} onChange={(v) => set("puzzles", v)} />
          </div>

          <div className="card">
            <h2>Final-screen backdrop (optional)</h2>
            <p className="hint">A slow crossfade of photos behind the very last message.</p>
            <PhotoGridUploader slug={slugify(form.slug)} items={form.photos} onChange={(v) => set("photos", v)} />
          </div>

          <div className="card">
            <h2>Background music (optional)</h2>
            <div className="field"><label>Song URL (a direct .mp3/.m4a/.ogg link)</label><input type="text" value={form.music_url} onChange={(e) => set("music_url", e.target.value)} placeholder="https://…/song.mp3" /></div>
            <MusicUploader slug={slugify(form.slug)} value={form.music_url} onChange={(v) => set("music_url", v)} onUploaded={() => setSongListKey((k) => k + 1)} />
            <MusicRangeEditor url={form.music_url} start={form.music_start} end={form.music_end} onChangeStart={(v) => set("music_start", v)} onChangeEnd={(v) => set("music_end", v)} />
          </div>

          {form.published_url && (
            <div className="live-link-box">
              <div className="live-link-label">Live at</div>
              <div className="live-link-row">
                <a href={form.published_url} target="_blank" rel="noreferrer" className="live-link-url">{form.published_url}</a>
                <button type="button" className="copy-link-btn" onClick={copyLiveLink}>Copy link</button>
              </div>
            </div>
          )}

          <div className="action-bar">
            <button className="btn btn-primary" onClick={saveProject} disabled={saving}>{saving ? "Saving…" : "Save project"}</button>
            <button className="btn btn-gold" onClick={publishLive} disabled={publishing}>{publishing ? "Publishing…" : form.github_repo ? "Publish changes" : "Publish live"}</button>
            <button className="btn btn-outline" onClick={previewSite}>Preview it</button>
            <button className="btn btn-outline" onClick={downloadFile} disabled={generating}>{generating ? "Generating…" : "Download file"}</button>
            {!isNew && <button className="btn btn-outline" onClick={startNew}>Start a new project</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [unlocked, setUnlocked] = React.useState(() => sessionStorage.getItem("backstage_puzzle_unlocked") === "1");
  if (!unlocked) return <Gate onUnlock={() => setUnlocked(true)} />;
  if (!supabaseClient) return <SetupNotice />;
  return <Dashboard />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
