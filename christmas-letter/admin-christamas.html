<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#0b1a12" />
<title>Backstage Christmas — Project Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#1a1410; --ink-soft:#7a6a58; --panel:#fdf8ee; --panel-soft:#f3ead6;
  --line:rgba(26,20,16,.12); --accent:#8F1724; --accent-deep:#6b0f19; --gold:#b8944a; --gold-soft:#d9b86c;
  --good:#3d7a4f; --bad:#b23b3b; --font-display:'Mountains of Christmas',cursive; --font-ui:'Poppins',sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; padding:0; }
body{ font-family:var(--font-ui); background:#0b1a12; color:var(--ink); -webkit-font-smoothing:antialiased; }
button{ font-family:inherit; cursor:pointer; } input,textarea,select{ font-family:inherit; }
#root{ min-height:100%; } ::selection{ background:var(--accent); color:#fff; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

.gate{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:40px 20px; text-align:center; background:radial-gradient(circle at 50% 20%, #123024 0%, #0b1a12 65%); color:#f3ecd9; }
.gate-mark{ font-family:var(--font-display); font-size:2.6rem; color:#f3ecd9; text-shadow:0 4px 20px rgba(217,184,108,.4); }
.gate-sub{ font-size:.85rem; letter-spacing:.04em; color:#c9b998; max-width:360px; line-height:1.5; }
.gate form{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.gate input{ padding:12px 16px; border-radius:10px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#fff; font-size:.95rem; min-width:220px; transition:border-color .2s ease, background .2s ease, box-shadow .2s ease; }
.gate input:focus{ outline:none; border-color:var(--gold-soft); background:rgba(255,255,255,.09); box-shadow:0 0 0 3px rgba(217,184,108,.16); }
.gate input::placeholder{ color:rgba(255,255,255,.4); }
.gate button{ padding:12px 22px; border-radius:10px; border:none; background:linear-gradient(155deg,var(--accent),var(--accent-deep)); color:#fff; font-weight:600; font-size:.9rem; letter-spacing:.02em; box-shadow:0 8px 20px rgba(143,23,36,.35); transition:transform .18s ease, box-shadow .18s ease; }
.gate button:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(143,23,36,.45); }
.gate-error{ color:#ff9f9f; font-size:.85rem; min-height:1em; }

.setup-notice{ max-width:560px; margin:60px auto; background:var(--panel); border-radius:16px; padding:32px 36px; box-shadow:0 20px 50px rgba(0,0,0,.35); line-height:1.6; }
.setup-notice h1{ font-family:var(--font-display); font-size:2rem; margin:0 0 6px; color:var(--accent-deep); }
.setup-notice code{ background:var(--panel-soft); padding:2px 6px; border-radius:6px; font-size:.85em; }

.shell{ display:flex; min-height:100vh; }
.sidebar{ width:280px; flex:0 0 280px; background:linear-gradient(180deg,#123024,#0b1a12); color:#f3ecd9; padding:26px 18px; display:flex; flex-direction:column; gap:18px; }
.brand{ display:flex; flex-direction:column; gap:2px; padding:0 6px 14px; border-bottom:1px solid rgba(255,255,255,.1); }
.brand-mark{ font-family:var(--font-display); font-size:1.8rem; text-shadow:0 2px 12px rgba(217,184,108,.35); }
.brand-sub{ font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:#c9b998; }
.new-btn{ display:flex; align-items:center; justify-content:center; gap:8px; padding:11px 14px; border-radius:10px; border:1px dashed rgba(255,255,255,.35); background:transparent; color:#f3ecd9; font-size:.88rem; font-weight:500; transition:background .18s ease, border-color .18s ease, transform .18s ease; }
.new-btn:hover{ background:rgba(255,255,255,.07); border-color:var(--gold-soft); transform:translateY(-1px); }
.project-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin:0 -6px; padding:0 6px; }
.project-item{ text-align:left; padding:10px 12px; border-radius:10px; border:1px solid transparent; background:transparent; color:#e9dcc6; font-size:.86rem; display:flex; flex-direction:column; gap:2px; transition:background .16s ease, border-color .16s ease; }
.project-item:hover{ background:rgba(255,255,255,.07); }
.project-item.active{ background:rgba(143,23,36,.3); border-color:rgba(217,184,108,.4); }
.project-item .slug{ font-weight:600; color:#fff; }
.project-item .meta{ font-size:.72rem; color:#b7a689; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.project-empty{ font-size:.8rem; color:#a99a7c; padding:10px 6px; line-height:1.5; }
.sidebar-foot{ font-size:.68rem; color:#8a7a62; line-height:1.5; padding:0 6px; }

.main{ flex:1; overflow-y:auto; background:#0b1a12; }
.main-inner{ max-width:820px; margin:0 auto; padding:40px 32px 140px; }
.topline{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
.topline h1{ font-family:var(--font-display); font-size:2.1rem; color:#f3ecd9; margin:0; }
.topline .status{ font-size:.78rem; color:#c9b998; }
.topline .status.err{ color:#ff9f9f; } .topline .status.ok{ color:#8fd19e; }

.fix-banner{ background:#3a1414; border:1px solid var(--accent); border-radius:14px; padding:18px 20px; margin-bottom:22px; color:#ffe3e3; }
.fix-banner-text{ font-size:.86rem; line-height:1.5; margin-bottom:10px; }
.fix-banner-sql{ display:block; background:#1c0b0b; border-radius:8px; padding:10px 12px; font-size:.78rem; color:#ffd3a8; overflow-x:auto; white-space:pre; margin-bottom:10px; }
.fix-banner-actions{ display:flex; gap:10px; }
.fix-banner-check{ background:var(--accent); border:1px solid var(--accent); color:#fff; border-radius:8px; padding:6px 14px; font-size:.76rem; font-weight:600; transition:background .16s ease; }
.fix-banner-check:hover{ background:var(--accent-deep); } .fix-banner-check:disabled{ opacity:.6; cursor:default; }
.fix-banner-dismiss{ background:transparent; border:1px solid rgba(255,255,255,.3); color:#ffe3e3; border-radius:8px; padding:6px 14px; font-size:.76rem; }
.fix-banner-dismiss:hover{ border-color:#ff9f9f; }

.card{ background:var(--panel); border-radius:16px; padding:26px 28px; margin-bottom:20px; box-shadow:0 14px 34px rgba(0,0,0,.28); border:1px solid rgba(26,20,16,.05); }
.card.theme-card{ border:1px solid rgba(217,184,108,.5); background:linear-gradient(155deg,#fdf8ee,#f6ecd4); }
.card h2{ margin:0 0 4px; font-size:1.05rem; color:var(--accent-deep); display:flex; align-items:center; gap:8px; }
.card h2::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--gold); flex-shrink:0; }
.card .hint{ margin:0 0 18px; font-size:.8rem; color:var(--ink-soft); line-height:1.5; }

.field{ margin-bottom:16px; } .field:last-child{ margin-bottom:0; }
.field label{ display:block; font-size:.78rem; font-weight:600; color:var(--ink); margin-bottom:6px; letter-spacing:.01em; }
.field .field-hint{ font-size:.72rem; color:var(--ink-soft); margin-top:5px; }
.field input[type=text],.field input[type=password],.field input[type=number],.field textarea,.field select{ width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:.9rem; color:var(--ink); resize:vertical; transition:border-color .18s ease, box-shadow .18s ease; }
.field input:focus,.field textarea:focus,.field select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(143,23,36,.12); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
@media (max-width:620px){ .row2,.row3{ grid-template-columns:1fr; } }

.theme-swatches{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.theme-swatch{ flex:1; min-width:120px; border-radius:12px; padding:14px 14px 12px; cursor:pointer; border:2px solid transparent; transition:transform .16s ease, border-color .16s ease; color:#fff; }
.theme-swatch:hover{ transform:translateY(-2px); }
.theme-swatch.active{ border-color:var(--accent-deep); box-shadow:0 0 0 2px rgba(143,23,36,.15); }
.theme-swatch .name{ font-weight:600; font-size:.86rem; } .theme-swatch .desc{ font-size:.72rem; opacity:.85; margin-top:2px; }
.suggest-btn{ display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px dashed var(--gold); color:var(--accent-deep); font-size:.76rem; font-weight:600; padding:7px 12px; border-radius:8px; margin-bottom:14px; transition:background .16s ease; }
.suggest-btn:hover{ background:#fbf0da; }
.type-toggle{ display:flex; gap:8px; margin-bottom:16px; }
.type-toggle-btn{ flex:1; padding:11px 14px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); font-size:.85rem; font-weight:600; transition:background .16s ease, border-color .16s ease, color .16s ease; }
.type-toggle-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
.type-toggle-btn:not(.active):hover{ background:var(--panel-soft); }

.song-row{ display:grid; grid-template-columns:1.2fr 1fr .55fr 1.1fr 1.1fr auto auto; gap:8px; align-items:center; padding:10px; border-radius:10px; background:var(--panel-soft); margin-bottom:8px; }
@media (max-width:760px){ .song-row{ grid-template-columns:1fr 1fr; } }
.song-row input[type=text]{ padding:8px 10px; border-radius:7px; border:1px solid var(--line); font-size:.8rem; min-width:0; }
.song-row input[type=text]:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(143,23,36,.1); }
.row-moves{ display:flex; gap:4px; }
.icon-btn{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--bad); font-size:.9rem; flex-shrink:0; transition:background .16s ease, border-color .16s ease; }
.icon-btn:hover{ background:#fdeaea; border-color:rgba(178,59,59,.4); }
.icon-btn.neutral{ color:var(--ink-soft); } .icon-btn.neutral:hover{ background:var(--panel-soft); border-color:var(--line); }
.add-row-btn{ padding:9px 16px; border-radius:9px; border:1px dashed var(--accent); background:transparent; color:var(--accent-deep); font-size:.82rem; font-weight:600; transition:background .16s ease, transform .16s ease; }
.add-row-btn:hover{ background:#fdeef0; transform:translateY(-1px); }

.photo-drop{ border:2px dashed var(--line); border-radius:14px; padding:26px; text-align:center; cursor:pointer; color:var(--ink-soft); font-size:.85rem; margin-bottom:18px; transition:border-color .2s ease, background .2s ease, color .2s ease; }
.photo-drop:hover,.photo-drop.drag{ border-color:var(--accent); background:#fdeef0; color:var(--accent-deep); }
.photo-drop input{ display:none; }
.photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:16px; }
.photo-card{ background:#fff; border-radius:4px; padding:8px 8px 12px; box-shadow:0 6px 16px rgba(0,0,0,.18); transform:rotate(var(--tilt,-2deg)); transition:transform .2s ease, box-shadow .2s ease; position:relative; }
.photo-card:hover{ transform:rotate(0deg) scale(1.03); box-shadow:0 10px 24px rgba(0,0,0,.26); }
.photo-card .thumb{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:2px; background:var(--panel-soft); display:block; }
.photo-card video.thumb{ background:#111; }
.photo-card .ord{ position:absolute; top:12px; left:12px; background:rgba(26,20,16,.72); color:#fff; font-size:.62rem; border-radius:999px; padding:2px 8px; }
.photo-card .kind{ position:absolute; top:12px; right:12px; background:rgba(143,23,36,.85); color:#fff; font-size:.6rem; border-radius:999px; padding:2px 7px; text-transform:uppercase; letter-spacing:.03em; }
.photo-card input{ width:100%; margin-top:8px; border:none; border-bottom:1px solid var(--line); font-size:.72rem; padding:4px 2px; text-align:center; font-family:var(--font-ui); color:var(--ink-soft); background:transparent; }
.photo-card .moves{ display:flex; gap:4px; margin-top:6px; }
.photo-card .moves button{ flex:1; border:1px solid var(--line); background:#fff; border-radius:6px; font-size:.65rem; color:var(--ink-soft); padding:3px 0; }
.photo-card .remove{ margin-top:6px; width:100%; border:none; background:none; color:var(--bad); font-size:.68rem; letter-spacing:.03em; text-transform:uppercase; padding:2px; }
.photo-card .remove:hover{ text-decoration:underline; }
.photo-uploading{ font-size:.75rem; color:var(--accent-deep); margin-bottom:10px; }
.count-badge{ display:inline-block; font-size:.72rem; padding:2px 9px; border-radius:999px; background:var(--panel-soft); color:var(--ink-soft); margin-left:8px; }
.count-badge.warn{ background:#fbeadb; color:#a5641a; }

.audio-row{ display:flex; align-items:center; gap:8px; background:var(--panel-soft); border-radius:8px; padding:8px 10px; flex-wrap:wrap; }
.audio-row.in-use{ background:#fbe4e7; box-shadow:inset 0 0 0 1px rgba(143,23,36,.35); }
.audio-name{ flex:1; min-width:120px; } .audio-name .n{ font-size:.82rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.audio-name .m{ font-size:.68rem; color:var(--ink-soft); }
.scrub{ width:100%; margin:10px 0 4px; accent-color:var(--accent); }
.trim-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
.mini-btn{ border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 11px; font-size:.74rem; color:var(--ink); }
.mini-btn:hover{ background:var(--panel-soft); }
.mini-btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; } .mini-btn.primary:hover{ background:var(--accent-deep); }
.mini-btn.danger{ color:var(--bad); }
.time-chip{ font-variant-numeric:tabular-nums; font-size:.76rem; color:var(--ink-soft); }

.live-link-box{ background:linear-gradient(155deg,rgba(61,122,79,.12),rgba(61,122,79,.05)); border:1px solid rgba(61,122,79,.35); border-radius:14px; padding:16px 18px; margin-bottom:18px; }
.live-link-label{ font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--good); font-weight:600; margin-bottom:6px; }
.live-link-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.live-link-url{ color:var(--ink); font-size:.88rem; font-weight:600; word-break:break-all; text-decoration:none; border-bottom:1px solid transparent; }
.live-link-url:hover{ border-bottom-color:var(--ink); }
.copy-link-btn{ background:#fff; border:1px solid rgba(61,122,79,.4); color:var(--good); padding:6px 14px; border-radius:8px; font-size:.76rem; font-weight:600; transition:background .16s ease, transform .16s ease; flex-shrink:0; }
.copy-link-btn:hover{ background:#effaf1; transform:translateY(-1px); }

.action-bar{ position:sticky; bottom:0; left:0; right:0; background:linear-gradient(0deg,#0b1a12 60%,rgba(11,26,18,0)); padding:26px 0 10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.btn{ padding:13px 22px; border-radius:11px; border:none; font-size:.88rem; font-weight:600; letter-spacing:.01em; transition:transform .18s ease, box-shadow .18s ease, background .18s ease; }
.btn-primary{ background:linear-gradient(155deg,var(--accent),var(--accent-deep)); color:#fff; box-shadow:0 8px 20px rgba(143,23,36,.32); }
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(143,23,36,.42); }
.btn-gold{ background:linear-gradient(155deg,var(--gold-soft),var(--gold)); color:#2e2205; box-shadow:0 8px 20px rgba(184,148,74,.32); }
.btn-gold:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(184,148,74,.42); }
.btn:disabled{ opacity:.5; cursor:default; transform:none !important; box-shadow:none !important; }
.btn-outline{ background:transparent; border:1px solid rgba(255,255,255,.3); color:#f3ecd9; }
.btn-outline:hover{ border-color:var(--gold-soft); color:#fff; transform:translateY(-2px); }
.slug-locked{ opacity:.6; }
</style>
</head>

function slugify(s) { return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }
function fmtTime(sec) {
  if (sec == null || isNaN(sec)) return "--:--";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function prettyName(filename) {
  return String(filename || "").replace(/\.[^.]+$/, "").replace(/^\d{10,}-/, "").replace(/[-_]+/g, " ").trim();
}
function base64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach((b) => { binary += String.fromCharCode(b); });
  return btoa(binary);
}

const PHOTO_MAX_DIM = 1400;
const THEME_ASSET_MAX_DIM = 1600;

async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let next = 0;
  async function worker() { while (next < items.length) { const i = next++; out[i] = await fn(items[i], i); } }
  await Promise.all(Array.from({ length: Math.max(1, Math.min(limit, items.length)) }, worker));
  return out;
}

async function compressImage(file, maxDim, quality) {
  if (!file.type || !file.type.startsWith("image/") || file.type === "image/gif") return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    if (scale === 1 && file.size < 350 * 1024) { if (bitmap.close) bitmap.close(); return file; }
    const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const hasAlpha = file.type === "image/png";
    canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
    if (bitmap.close) bitmap.close();
    if (hasAlpha) {
      const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
      if (!blob || blob.size >= file.size) return file;
      return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".png", { type: "image/png" });
    }
    const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", quality || 0.82));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch (e) {
    return file;
  }
}

async function uploadOne(file, folder) {
  const ext = (file.name.match(/\.[^.]+$/) || [""])[0];
  const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "file";
  const path = folder + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 7) + "-" + base + ext;
  const { error: upErr } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(path, file, { upsert: true, cacheControl: "31536000" });
  if (upErr) throw upErr;
  const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

  var PROJECT_SLUG = ${JSON.stringify(slug)};
  var DEFAULT_MUSIC_URL = ${JSON.stringify(musicUrl)};
  var DEFAULT_MUSIC_START = ${JSON.stringify(musicStart)};
  var DEFAULT_MUSIC_END = ${JSON.stringify(musicEnd)};

  function boot(url, startSec, endSec){
    if (!url) return;
    function init(){
      var audio = new Audio(url);
      audio.loop = false; audio.preload = "auto"; audio.muted = true; audio.volume = 0;
      var START = Math.max(0, startSec || 0);
      var END = (endSec !== null && endSec !== undefined && endSec > START) ? endSec : null;
      var metaReady = false, seeked = false;
      var VOLUME_STEPS = [0.15, 0.35, 0.55, 0.75, 1];
      var stepIndex = 1, ended = false, fadeTimer = null;

      audio.addEventListener("loadedmetadata", function(){
        metaReady = true;
        if (END === null || END > audio.duration) END = audio.duration;
        if (!seeked){ try { audio.currentTime = START; } catch(e){} seeked = true; }
      });
      function endPoint(){ return END !== null ? END : (audio.duration || 0); }
      function target(){ return audio.muted ? 0 : VOLUME_STEPS[stepIndex]; }
      function fadeTo(vol, ms){
        if (fadeTimer) clearInterval(fadeTimer);
        var from = audio.volume, t0 = Date.now();
        fadeTimer = setInterval(function(){
          var t = Math.min(1, (Date.now()-t0)/ms);
          audio.volume = from + (vol-from)*t;
          if (t>=1) clearInterval(fadeTimer);
        }, 40);
      }
      function seekToStart(){ try { audio.currentTime = START; } catch(e){} seeked = true; }
      function tryStart(){ if (metaReady && !seeked) seekToStart(); audio.play().catch(function(){}); }
      audio.play().catch(function(){});

      audio.addEventListener("timeupdate", function(){
        if (!metaReady) return;
        var ep = endPoint();
        if (!ep || isNaN(ep)) return;
        var remaining = ep - audio.currentTime;
        if (!audio.muted && remaining <= 4 && remaining >= 0){
          audio.volume = Math.max(0, VOLUME_STEPS[stepIndex] * (remaining/4));
        }
        if (audio.currentTime >= ep - 0.05 && !ended){ audio.pause(); ended = true; updateUI(); }
      });
      audio.addEventListener("ended", function(){ ended = true; updateUI(); });

      function unlockAudio(){
        tryStart();
        hintEl.classList.remove("bs-hint-show");
        if (audio.muted){ audio.muted = false; audio.volume = 0; fadeTo(target(), 2600); updateUI(); }
        document.removeEventListener("click", unlockAudio);
        document.removeEventListener("keydown", unlockAudio);
        document.removeEventListener("touchstart", unlockAudio);
      }
      document.addEventListener("click", unlockAudio);
      document.addEventListener("keydown", unlockAudio);
      document.addEventListener("touchstart", unlockAudio);

      var wrap = document.createElement("div");
      wrap.id = "bs-music-player";
      wrap.innerHTML =
        '<div class="bs-hint" id="bs-hint">tap anywhere to let the music in</div>' +
        '<div class="bs-note" id="bs-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M9 17.5a2.5 2.5 0 11-2.5-2.5A2.5 2.5 0 019 17.5zm9-2a2.5 2.5 0 11-2.5-2.5 2.5 2.5 0 012.5 2.5zM9 17.5V6l9-2v9.5" stroke-linejoin="round"/></svg></div>' +
        '<button type="button" id="bs-mute" aria-label="Mute or unmute the music"></button>' +
        '<button type="button" id="bs-vol" aria-label="Raise the volume"><span class="bs-vol-label" id="bs-vol-label">35%</span></button>' +
        '<button type="button" id="bs-restart" aria-label="Restart the song"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 102.13-9.36L1 10"></path></svg></button>';
      document.body.appendChild(wrap);

      var hintEl = wrap.querySelector("#bs-hint");
      var muteBtn = wrap.querySelector("#bs-mute");
      var volBtn = wrap.querySelector("#bs-vol");
      var volLabel = wrap.querySelector("#bs-vol-label");
      var restartBtn = wrap.querySelector("#bs-restart");
      var noteEl = wrap.querySelector("#bs-note");
      var SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9"></polygon><path d="M16 8a5 5 0 010 8"></path></svg>';
      var SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9"></polygon><line x1="16" y1="9" x2="21" y2="14"></line><line x1="21" y1="9" x2="16" y2="14"></line></svg>';

      function updateUI(){
        muteBtn.innerHTML = audio.muted ? SOUND_OFF : SOUND_ON;
        volLabel.textContent = Math.round(VOLUME_STEPS[stepIndex]*100) + "%";
        noteEl.classList.toggle("bs-spin", !audio.paused && !audio.muted);
      }
      updateUI();
      setTimeout(function(){ wrap.classList.add("bs-show"); }, 1200);
      setTimeout(function(){ if (audio.muted) hintEl.classList.add("bs-hint-show"); }, 2000);
      setTimeout(function(){ hintEl.classList.remove("bs-hint-show"); }, 9000);

      muteBtn.addEventListener("click", function(){
        audio.muted = !audio.muted;
        if (!audio.muted){ tryStart(); fadeTo(target(), 1200); }
        updateUI();
      });
      volBtn.addEventListener("click", function(){
        stepIndex = (stepIndex + 1) % VOLUME_STEPS.length;
        if (audio.muted) audio.muted = false;
        tryStart(); fadeTo(target(), 400); updateUI();
      });
      restartBtn.addEventListener("click", function(){
        ended = false; seekToStart();
        if (audio.muted) audio.muted = false;
        tryStart(); fadeTo(target(), 900); updateUI();
      });
      setInterval(updateUI, 1000);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  }

  if (SUPABASE_URL.indexOf("http") === 0) {
    fetch(SUPABASE_URL + "/rest/v1/projects?slug=eq." + encodeURIComponent(PROJECT_SLUG) + "&select=music_url,music_start,music_end", {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
    }).then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        var row = rows && rows[0];
        boot(
          (row && row.music_url) || DEFAULT_MUSIC_URL,
          (row && row.music_start != null) ? row.music_start : DEFAULT_MUSIC_START,
          (row && row.music_end != null) ? row.music_end : DEFAULT_MUSIC_END
        );
      })
      .catch(function(){ boot(DEFAULT_MUSIC_URL, DEFAULT_MUSIC_START, DEFAULT_MUSIC_END); });
  } else {
    boot(DEFAULT_MUSIC_URL, DEFAULT_MUSIC_START, DEFAULT_MUSIC_END);
  }
})();
<\/script>
`;
}

function buildSiteHtml(slug, projectForm, themeAssetsForm) {
  const templateHtml = base64ToUtf8(TEMPLATE_B64);
  const snapshot = {
    pin: projectForm.pin, theme: projectForm.theme, recipient_name: projectForm.recipient_name, sender_name: projectForm.sender_name,
    opening_message: projectForm.opening_message, tree_caption: projectForm.tree_caption,
    message_line1: projectForm.message_line1, message_line2: projectForm.message_line2,
    letter_type: projectForm.letter_type, letter_title: projectForm.letter_title, letter_body: projectForm.letter_body, voice_note_url: projectForm.voice_note_url,
    gift_tag: projectForm.gift_tag, gift_message: projectForm.gift_message,
    final_line1: projectForm.final_line1, final_line2: projectForm.final_line2, final_line3: projectForm.final_line3,
    signoff: projectForm.signoff, tree_photos: projectForm.tree_photos, memories: projectForm.memories, songs: projectForm.songs
  };
  const assetsSnapshot = {
    village_landscape: themeAssetsForm.village_landscape || "", village_portrait: themeAssetsForm.village_portrait || "",
    ornament_bauble_green: themeAssetsForm.ornament_bauble_green || "", ornament_bauble_red: themeAssetsForm.ornament_bauble_red || "",
    ornament_tree: themeAssetsForm.ornament_tree || "", ornament_gingerbread: themeAssetsForm.ornament_gingerbread || "",
    ornament_snowflake: themeAssetsForm.ornament_snowflake || ""
  };

  function replaceBlock(html, marker, varName, value) {
    const startMarker = "/* " + marker + ":START */";
    const endMarker = "/* " + marker + ":END */";
    const startIdx = html.indexOf(startMarker);
    const endIdx = html.indexOf(endMarker);
    if (startIdx === -1 || endIdx === -1) throw new Error("Template marker " + marker + " not found.");
    const before = html.slice(0, startIdx);
    const after = html.slice(endIdx + endMarker.length);
    const middle = startMarker + "\nconst " + varName + " = " + JSON.stringify(value, null, 2) + ";\n" + endMarker;
    return before + middle + after;
  }

  let output = templateHtml;
  output = replaceBlock(output, "DEFAULT_CONFIG", "DEFAULT_CONFIG", snapshot);
  output = replaceBlock(output, "DEFAULT_THEME_ASSETS", "DEFAULT_THEME_ASSETS", assetsSnapshot);
  output = output.split('"YOUR_SUPABASE_URL"').join(JSON.stringify(SUPABASE_URL));
  output = output.split('"YOUR_SUPABASE_ANON_KEY"').join(JSON.stringify(SUPABASE_ANON_KEY));
  output = output.split('"YOUR_PROJECT_SLUG"').join(JSON.stringify(slug));

  const musicBlock = buildMusicBlock(slug, projectForm);
  const bodyClose = output.lastIndexOf("</body>");
  output = bodyClose === -1 ? output + musicBlock : output.slice(0, bodyClose) + musicBlock + "\n" + output.slice(bodyClose);
  return output;
}

/* ---------------------------------------------------------------------
   GitHub publishing (identical mechanism to Backstage's original)
--------------------------------------------------------------------- */
async function githubRequest(path, options) {
  options = options || {};
  const res = await fetch("https://api.github.com" + path, {
    ...options,
    headers: { Authorization: "Bearer " + GITHUB_TOKEN, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(options.headers || {}) }
  });
  if (!res.ok) {
    let message = "GitHub API error (" + res.status + ")";
    try { const body = await res.json(); if (body && body.message) message = body.message; } catch (e) {}
    throw new Error(message);
  }
  if (res.status === 204) return null;
  return res.json();
}
async function githubGetUsername() { const user = await githubRequest("/user"); return user.login; }
async function githubCreateRepo(name) {
  return githubRequest("/user/repos", { method: "POST", body: JSON.stringify({ name, description: "A little Christmas letter, built with Backstage.", private: false, auto_init: true }) });
}
async function githubGetRepo(owner, repo) { return githubRequest("/repos/" + owner + "/" + repo); }
async function githubGetFileSha(owner, repo, path, branch) {
  try { const data = await githubRequest("/repos/" + owner + "/" + repo + "/contents/" + path + "?ref=" + encodeURIComponent(branch)); return data.sha; }
  catch (e) { return null; }
}
async function githubUpsertFile(owner, repo, path, content, message, sha, branch) {
  const body = { message, content: utf8ToBase64(content), branch };
  if (sha) body.sha = sha;
  return githubRequest("/repos/" + owner + "/" + repo + "/contents/" + path, { method: "PUT", body: JSON.stringify(body) });
}
async function githubEnablePages(owner, repo, branch) {
  try { await githubRequest("/repos/" + owner + "/" + repo + "/pages", { method: "POST", body: JSON.stringify({ source: { branch, path: "/" } }) }); }
  catch (e) { /* likely already enabled */ }
}

   Songs editor
--------------------------------------------------------------------- */
function SongsEditor({ songs, onChange }) {
  function update(i, field, value) { const next = songs.slice(); next[i] = { ...next[i], [field]: value }; onChange(next); }
  function remove(i) { if (!window.confirm("Remove this song from the list?")) return; onChange(songs.filter((_, idx) => idx !== i)); }
  function move(i, dir) {
    const j = i + dir; if (j < 0 || j >= songs.length) return;
    const next = songs.slice(); const tmp = next[i]; next[i] = next[j]; next[j] = tmp; onChange(next);
  }
  function add() { onChange([...songs, { title: "", artist: "", duration: "", spotify_url: "", youtube_url: "" }]); }
  return (
    <div>
      {songs.map((s, i) => (
        <div className="song-row" key={i}>
          <input type="text" placeholder="Title" value={s.title || ""} onChange={(e) => update(i, "title", e.target.value)} />
          <input type="text" placeholder="Artist" value={s.artist || ""} onChange={(e) => update(i, "artist", e.target.value)} />
          <input type="text" placeholder="4:32" value={s.duration || ""} onChange={(e) => update(i, "duration", e.target.value)} />
          <input type="text" placeholder="Spotify TRACK link" value={s.spotify_url || ""} onChange={(e) => update(i, "spotify_url", e.target.value)} />
          <input type="text" placeholder="or a YouTube link" value={s.youtube_url || ""} onChange={(e) => update(i, "youtube_url", e.target.value)} />
          <div className="row-moves">
            <button type="button" className="icon-btn neutral" onClick={() => move(i, -1)} title="Move up">\u2191</button>
            <button type="button" className="icon-btn neutral" onClick={() => move(i, 1)} title="Move down">\u2193</button>
          </div>
          <button type="button" className="icon-btn" onClick={() => remove(i)} title="Remove song">\u2715</button>
        </div>
      ))}
      <button type="button" className="add-row-btn" onClick={add}>+ Add a song</button>
    </div>
  );
}

/* ---------------------------------------------------------------------
   Generic image uploader (photos: tree mosaic, or anything single-kind)
--------------------------------------------------------------------- */
const POLAROID_TILTS = [-3, 2, -2, 3, -4, 1.5, -1.5, 2.5];

function ImageUploader({ folder, items, onChange, withCaption, dropLabel, maxDim, min, max }) {
  const [uploading, setUploading] = React.useState(false);
  const [progress, setProgress] = React.useState(null);
  const [dragOver, setDragOver] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInput = React.useRef(null);

  async function handleFiles(fileList) {
    setError("");
    if (!supabaseClient) { setError("Connect Supabase first (see christmas_schema.sql / README)."); return; }
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setUploading(true); setProgress({ done: 0, total: files.length });
    let done = 0;
    const results = await mapLimit(files, 4, async (file) => {
      try {
        const small = await compressImage(file, maxDim || PHOTO_MAX_DIM);
        const url = await uploadOne(small, folder);
        done++; setProgress({ done, total: files.length });
        return { url, caption: "" };
      } catch (e) {
        setError("Some images didn't upload: " + (e.message || e));
        done++; setProgress({ done, total: files.length });
        return null;
      }
    });
    onChange([...items, ...results.filter(Boolean)]);
    setUploading(false); setProgress(null);
  }
  function updateCaption(i, caption) { const next = items.slice(); next[i] = { ...next[i], caption }; onChange(next); }
  function remove(i) { onChange(items.filter((_, idx) => idx !== i)); }
  function move(i, dir) {
    const j = i + dir; if (j < 0 || j >= items.length) return;
    const next = items.slice(); const tmp = next[i]; next[i] = next[j]; next[j] = tmp; onChange(next);
  }

  const countWarn = (min && items.length < min) || (max && items.length > max);

  return (
    <div>
      <div className={"photo-drop" + (dragOver ? " drag" : "")} onClick={() => fileInput.current && fileInput.current.click()}
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)}
        onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); }}>
        <input ref={fileInput} type="file" accept="image/*" multiple onChange={(e) => handleFiles(e.target.files)} />
        {uploading ? `Shrinking and uploading ${progress ? progress.done + " of " + progress.total : ""}\u2026` : (dropLabel || "Click to choose images, or drag them in")}
      </div>
      {(min || max) && (
        <span className={"count-badge" + (countWarn ? " warn" : "")}>{items.length} photo{items.length === 1 ? "" : "s"}{min ? " \u00b7 aim for " + min + "\u2013" + (max || "") : ""}</span>
      )}
      {error && <div className="photo-uploading" style={{ color: "var(--bad)" }}>{error}</div>}
      {!!items.length && (
        <div className="photo-grid" style={{ marginTop: 14 }}>
          {items.map((p, i) => (
            <div className="photo-card" key={p.url + i} style={{ "--tilt": POLAROID_TILTS[i % POLAROID_TILTS.length] + "deg" }}>
              <img className="thumb" src={p.url} alt="" />
              <span className="ord">{i + 1}</span>
              {withCaption && <input type="text" placeholder="caption (optional)" value={p.caption || ""} onChange={(e) => updateCaption(i, e.target.value)} />}
              <div className="moves">
                <button type="button" onClick={() => move(i, -1)} title="Move earlier">\u2191</button>
                <button type="button" onClick={() => move(i, 1)} title="Move later">\u2193</button>
              </div>
              <button type="button" className="remove" onClick={() => remove(i)}>Remove</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MemoriesUploader({ folder, items, onChange }) {
  const [uploading, setUploading] = React.useState(false);

      } catch (e) {
        setError("Some files didn't upload: " + (e.message || e));
        done++; setProgress({ done, total: files.length });
        return null;
      }
    });
    onChange([...items, ...results.filter(Boolean)]);
    setUploading(false); setProgress(null);
  }
  function updateCaption(i, caption) { const next = items.slice(); next[i] = { ...next[i], caption }; onChange(next); }
  function remove(i) { onChange(items.filter((_, idx) => idx !== i)); }
  function move(i, dir) {
    const j = i + dir; if (j < 0 || j >= items.length) return;

  return (

        <input ref={fileInput} type="file" accept="image/*,video/*" multiple onChange={(e) => handleFiles(e.target.files)} />

      </div>
      <span className="count-badge">{photoCount} photo{photoCount === 1 ? "" : "s"}</span>{" "}
      <span className="count-badge">{videoCount} video{videoCount === 1 ? "" : "s"}</span>
      {error && <div className="photo-uploading" style={{ color: "var(--bad)" }}>{error}</div>}
      {!!items.length && (
        <div className="photo-grid" style={{ marginTop: 14 }}>
          {items.map((m, i) => (
            <div className="photo-card" key={m.url + i} style={{ "--tilt": POLAROID_TILTS[i % POLAROID_TILTS.length] + "deg" }}>
              {m.type === "video" ? <video className="thumb" src={m.url} muted /> : <img className="thumb" src={m.url} alt="" />}
              <span className="ord">{i + 1}</span>
              <span className="kind">{m.type === "video" ? "clip" : "photo"}</span>
              <input type="text" placeholder="caption (optional)" value={m.caption || ""} onChange={(e) => updateCaption(i, e.target.value)} />
              <div className="moves">
                <button type="button" onClick={() => move(i, -1)} title="Move earlier">\u2191</button>
                <button type="button" onClick={() => move(i, 1)} title="Move later">\u2193</button>
              </div>
              <button type="button" className="remove" onClick={() => remove(i)}>Remove</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------
   Voice note uploader: a single audio file for the cassette player,
   simpler than the music uploader (no library, no trimming needed).
--------------------------------------------------------------------- */
function VoiceNoteUploader({ slug, value, onChange }) {
  const [uploading, setUploading] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInput = React.useRef(null);

  async function handleFile(file) {
    setError("");
    if (!file) return;
    if (!slug) { setError("Give the project a slug first (above) \u2014 uploads are filed under it."); return; }
    if (!supabaseClient) { setError("Connect Supabase first."); return; }
    if (file.size > 25 * 1024 * 1024) { setError("That file is over 25MB \u2014 try a shorter recording or a more compressed format."); return; }
    setUploading(true);
    try {
      const ext = (file.name.match(/\.[^.]+$/) || [".m4a"])[0];
      const path = slug + "/voice/" + Date.now() + "-note" + ext;
      const { error: upErr } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(path, file, { upsert: true });
      if (upErr) throw upErr;
      const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
      onChange(data.publicUrl);
    } catch (e) { setError("Couldn't upload: " + (e.message || e)); }
    setUploading(false);
  }

  return (
    <div className="field">
      <label>Voice recording</label>
      <div className="photo-drop" onClick={() => fileInput.current && fileInput.current.click()}>

      </div>

        <div className="audio-row in-use" style={{ marginTop: 10 }}>
          <div className="audio-name"><div className="n">Voice note uploaded</div><div className="m">Plays inside the cassette player on the site</div></div>
          <button type="button" className="mini-btn danger" onClick={() => onChange("")}>Remove</button>
        </div>
      )}

}

   Music: upload, library (preview / rename / delete), and trimming
   (same mechanics as Backstage's original tool, generalized to this

function MusicUploader({ slug, value, onChange, onUploaded }) {
  const [uploading, setUploading] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInput = React.useRef(null);

  async function handleFile(file) {
    setError("");
    if (!file) return;
    if (!slug) { setError("Give the project a slug first (above) \u2014 uploads are filed under it."); return; }
    if (!supabaseClient) { setError("Connect Supabase first."); return; }
    setUploading(true);
    try {
      const ext = (file.name.match(/\.[^.]+$/) || [".mp3"])[0];
      const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "song";
      const path = slug + "/music/" + Date.now() + "-" + base + ext;
      const { error: upErr } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(path, file, { upsert: true });
      if (upErr) throw upErr;
      const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
      onChange(data.publicUrl);
      if (onUploaded) onUploaded();
    } catch (e) { setError("Couldn't upload: " + (e.message || e)); }
    setUploading(false);
  }

  return (
    <div className="field">
      <label>Upload a song file</label>
      <div className="photo-drop" onClick={() => fileInput.current && fileInput.current.click()}>
        <input ref={fileInput} type="file" accept="audio/*" onChange={(e) => handleFile(e.target.files[0])} />
        {uploading ? "Uploading\u2026" : value ? "Replace the current song" : "Click to choose an audio file"}
      </div>
      {error && <div className="photo-uploading" style={{ color: "var(--bad)" }}>{error}</div>}
    </div>
  );
}

function AllSongsManager({ currentUrl, onPick, onCurrentDeleted, refreshKey }) {
  const [songs, setSongs] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState("");
  const [renamingPath, setRenamingPath] = React.useState(null);
  const [renameValue, setRenameValue] = React.useState("");
  const [busyPath, setBusyPath] = React.useState(null);
  const [durations, setDurations] = React.useState({});
  const previewRef = React.useRef(null);
  const [previewingPath, setPreviewingPath] = React.useState(null);

  const refresh = React.useCallback(async () => {
    if (!supabaseClient) { setSongs([]); return; }
    setLoading(true); setError("");
    try {
      const { data: topLevel, error: topErr } = await supabaseClient.storage.from(STORAGE_BUCKET).list("", { limit: 200 });
      if (topErr) throw topErr;
      const folders = (topLevel || []).filter((item) => item.id === null && item.name !== "_theme");
      const all = [];
      for (const folder of folders) {
        const slug = folder.name;
        try {
          const { data: files } = await supabaseClient.storage.from(STORAGE_BUCKET).list(slug + "/music", { limit: 200 });
          (files || []).forEach((f) => {
            if (!f.name || f.id === null) return;
            const path = slug + "/music/" + f.name;
            const { data: pub } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
            all.push({ slug, name: f.name, path, url: pub.publicUrl });
          });
        } catch (e) { /* no music folder in this project */ }
      }
      all.sort((a, b) => (a.slug + a.name).localeCompare(b.slug + b.name));
      setSongs(all);
    } catch (e) { setError("Couldn't load your uploaded songs: " + (e.message || e)); }
    setLoading(false);
  }, []);
  React.useEffect(() => { refresh(); }, [refresh, refreshKey]);
  React.useEffect(() => () => { if (previewRef.current) previewRef.current.pause(); }, []);

  function stopPreview() { if (previewRef.current) { previewRef.current.pause(); previewRef.current = null; } setPreviewingPath(null); }
  function togglePreview(song) {
    if (previewingPath === song.path) { stopPreview(); return; }
    stopPreview();
    const a = new Audio(song.url);
    a.addEventListener("loadedmetadata", () => setDurations((d) => ({ ...d, [song.path]: a.duration })));
    a.addEventListener("ended", () => setPreviewingPath(null));
    a.play().catch(() => setError("Couldn't play that file."));
    previewRef.current = a; setPreviewingPath(song.path);
  }
  async function handleDelete(song) {
    if (!window.confirm(`Delete "${prettyName(song.name)}" from ${song.slug}? Any published site using it will lose its music.`)) return;
    if (previewingPath === song.path) stopPreview();
    setBusyPath(song.path);
    try {
      const { error: delErr } = await supabaseClient.storage.from(STORAGE_BUCKET).remove([song.path]);
      if (delErr) throw delErr;
      if (song.url === currentUrl && onCurrentDeleted) onCurrentDeleted();
      await refresh();
    } catch (e) { setError("Couldn't delete: " + (e.message || e)); }
    setBusyPath(null);
  }
  function startRename(song) { setRenamingPath(song.path); setRenameValue(prettyName(song.name)); }
  async function confirmRename(song) {
    const dot = song.name.lastIndexOf(".");
    const ext = dot > 0 ? song.name.slice(dot) : "";
    const cleanBase = slugify(renameValue);
    if (!cleanBase) { setError("Give it a name first."); return; }
    const newPath = song.slug + "/music/" + cleanBase + ext;
    if (newPath === song.path) { setRenamingPath(null); return; }
    setBusyPath(song.path);
    try {
      const { error: moveErr } = await supabaseClient.storage.from(STORAGE_BUCKET).move(song.path, newPath);
      if (moveErr) throw moveErr;
      if (song.url === currentUrl && onPick) {
        const { data: pub } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(newPath);
        onPick(pub.publicUrl);
      }
      setRenamingPath(null); await refresh();
    } catch (e) { setError("Couldn't rename: " + (e.message || e) + " \u2014 you may need the storage update policy from christmas_schema.sql."); }
    setBusyPath(null);
  }

  return (
    <div className="field">
      <label>Songs uploaded across all your Christmas projects</label>
      {error && <div className="field-hint" style={{ color: "var(--bad)" }}>{error}</div>}
      {loading && <div className="field-hint">Loading\u2026</div>}
      {!loading && !songs.length && <div className="field-hint">No songs uploaded yet.</div>}
      {!!songs.length && (
        <div style={{ display: "flex", flexDirection: "column", gap: "6px", maxHeight: "300px", overflowY: "auto" }}>
          {songs.map((s) => {
            const inUse = s.url === currentUrl;
            return (
              <div key={s.path} className={"audio-row" + (inUse ? " in-use" : "")}>
                {renamingPath === s.path ? (
                  <React.Fragment>
                    <input type="text" value={renameValue} autoFocus onChange={(e) => setRenameValue(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") confirmRename(s); if (e.key === "Escape") setRenamingPath(null); }}
                      style={{ flex: 1, minWidth: 120, padding: "6px 8px", borderRadius: "6px", border: "1px solid var(--line)", fontSize: ".8rem" }} />
                    <button type="button" className="mini-btn primary" onClick={() => confirmRename(s)} disabled={busyPath === s.path}>Save name</button>
                    <button type="button" className="mini-btn" onClick={() => setRenamingPath(null)}>Cancel</button>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <button type="button" className="icon-btn neutral" style={{ color: "var(--accent-deep)" }} onClick={() => togglePreview(s)} disabled={busyPath === s.path}
                      title={previewingPath === s.path ? "Stop preview" : "Preview"}>{previewingPath === s.path ? "\u275A\u275A" : "\u25B6"}</button>
                    <div className="audio-name">
                      <div className="n">{prettyName(s.name)}</div>
                      <div className="m">{durations[s.path] ? fmtTime(durations[s.path]) + " \u00b7 " : ""}from {s.slug}{inUse ? " \u00b7 in use now" : ""}</div>
                    </div>
                    {!inUse && <button type="button" className="mini-btn primary" onClick={() => onPick(s.url)} disabled={busyPath === s.path}>Use this</button>}
                    <button type="button" className="mini-btn" onClick={() => startRename(s)} disabled={busyPath === s.path}>Rename</button>
                    <button type="button" className="mini-btn danger" onClick={() => handleDelete(s)} disabled={busyPath === s.path}>Delete</button>
                  </React.Fragment>
                )}
              </div>
            );
          })}
        </div>
      )}
      <button type="button" onClick={refresh} style={{ border: "none", background: "none", color: "var(--ink-soft)", cursor: "pointer", fontSize: ".72rem", marginTop: "8px", padding: 0, textDecoration: "underline" }}>
        \u21bb Refresh this list
      </button>
    </div>
  );
}

function MusicRangeEditor({ url, start, end, onChangeStart, onChangeEnd }) {
  const audioRef = React.useRef(null);
  const [duration, setDuration] = React.useState(null);
  const [time, setTime] = React.useState(0);
  const [playing, setPlaying] = React.useState(false);
  const [error, setError] = React.useState("");
  const trimmingRef = React.useRef(false);

  React.useEffect(() => {
    setDuration(null); setTime(0); setPlaying(false); setError("");
    if (!url) return;
    const a = new Audio(url); a.preload = "metadata"; audioRef.current = a;
    const onMeta = () => setDuration(a.duration);
    const onTime = () => {
      setTime(a.currentTime);
      const stopAt = end && end > (start || 0) ? end : null;
      if (trimmingRef.current && stopAt && a.currentTime >= stopAt) { a.pause(); setPlaying(false); trimmingRef.current = false; }
    };
    const onEnd = () => { setPlaying(false); trimmingRef.current = false; };
    const onErr = () => setError("Couldn't read this song \u2014 the link may be wrong.");
    a.addEventListener("loadedmetadata", onMeta); a.addEventListener("timeupdate", onTime);
    a.addEventListener("ended", onEnd); a.addEventListener("error", onErr);
    return () => { a.pause(); a.removeEventListener("loadedmetadata", onMeta); a.removeEventListener("timeupdate", onTime); a.removeEventListener("ended", onEnd); a.removeEventListener("error", onErr); };
  }, [url, start, end]);

  function toggle() { const a = audioRef.current; if (!a) return; if (playing) { a.pause(); setPlaying(false); trimmingRef.current = false; } else { a.play().then(() => setPlaying(true)).catch(() => {}); } }
  function playTrimmed() { const a = audioRef.current; if (!a) return; try { a.currentTime = start || 0; } catch (e) {} trimmingRef.current = true; a.play().then(() => setPlaying(true)).catch(() => {}); }
  function seek(v) { const a = audioRef.current; if (!a) return; try { a.currentTime = v; setTime(v); } catch (e) {} }
  if (!url) return null;

  return (
    <div className="field">
      <label>Which part of the song should play?</label>
      {error && <div className="field-hint" style={{ color: "var(--bad)" }}>{error}</div>}
      <div className="trim-row">
        <button type="button" className="mini-btn primary" onClick={toggle}>{playing ? "Pause" : "Play"}</button>
        <button type="button" className="mini-btn" onClick={playTrimmed}>Play the trimmed part</button>
        <span className="time-chip">{fmtTime(time)} / {fmtTime(duration)}</span>
      </div>
      <input className="scrub" type="range" min="0" max={duration || 0} step="0.1" value={time} onChange={(e) => seek(Number(e.target.value))} aria-label="Scrub through the song" />
      <div className="trim-row">
        <button type="button" className="mini-btn" onClick={() => onChangeStart(Math.floor(time))}>Start here ({fmtTime(start || 0)})</button>
        <button type="button" className="mini-btn" onClick={() => onChangeEnd(Math.ceil(time))}>End here ({end ? fmtTime(end) : "song end"})</button>
        {(start || end) ? <button type="button" className="mini-btn danger" onClick={() => { onChangeStart(0); onChangeEnd(null); }}>Clear trim</button> : null}
      </div>
      <div className="row2">
        <div><label style={{ fontWeight: 400, fontSize: ".72rem" }}>Start at (seconds)</label>
          <input type="number" min="0" step="1" value={start || 0} onChange={(e) => onChangeStart(Math.max(0, Number(e.target.value) || 0))} /></div>
        <div><label style={{ fontWeight: 400, fontSize: ".72rem" }}>End at (seconds, blank = to the end)</label>
          <input type="number" min="0" step="1" value={end || ""} placeholder={duration ? String(Math.floor(duration)) : ""} onChange={(e) => onChangeEnd(e.target.value === "" ? null : Number(e.target.value))} /></div>
      </div>
      <div className="field-hint">Full length {duration ? fmtTime(duration) : "loading\u2026"} \u2014 playing from {fmtTime(start || 0)} to {fmtTime(end || duration)}</div>
    </div>
  );
}

function ThemeAssetsLibrary({ assets, onChange }) {

  const [error, setError] = React.useState("");
  const fileInputs = React.useRef({});

  async function handleFile(key, maxDim, file) {
    setError("");
    if (!file) return;
    if (!supabaseClient) { setError("Connect Supabase first (see christmas_schema.sql / README)."); return; }
    setBusyKey(key);
    try {
      const small = await compressImage(file, maxDim, 0.85);
      const url = await uploadOne(small, "_theme/" + key);
      const next = { ...assets, [key]: url };
      const { error: upErr } = await supabaseClient.from("christmas_theme_assets").upsert({ id: "default", ...next, updated_at: new Date().toISOString() }, { onConflict: "id" });
      if (upErr) throw upErr;
      onChange(next);
    } catch (e) { setError("Couldn't save " + key + ": " + (e.message || e)); }
    setBusyKey(null);
  }

  return (
    <div className="card theme-card">

            <input ref={(el) => (fileInputs.current[slot.key] = el)} type="file" accept="image/*" style={{ display: "none" }}
              onChange={(e) => handleFile(slot.key, slot.maxDim, e.target.files[0])} />
            <div style={{ fontSize: ".74rem", fontWeight: 600, marginTop: 8 }}>{slot.label}</div>
            <div style={{ fontSize: ".66rem", color: "var(--ink-soft)", marginTop: 2, minHeight: "2.4em" }}>{slot.hint}</div>
            <button type="button" className="mini-btn" style={{ width: "100%", marginTop: 6 }} disabled={busyKey === slot.key}
              onClick={() => fileInputs.current[slot.key] && fileInputs.current[slot.key].click()}>
              {busyKey === slot.key ? "Uploading\u2026" : assets[slot.key] ? "Replace" : "Upload"}
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   Dashboard
--------------------------------------------------------------------- */
function Dashboard() {
  const [projects, setProjects] = React.useState([]);
  const [loadingList, setLoadingList] = React.useState(true);
  const [currentSlug, setCurrentSlug] = React.useState(null);
  const [form, setForm] = React.useState(blankProject());
  const [themeAssets, setThemeAssets] = React.useState({});
  const [saving, setSaving] = React.useState(false);
  const [generating, setGenerating] = React.useState(false);
  const [publishing, setPublishing] = React.useState(false);
  const [status, setStatus] = React.useState({ text: "", kind: "" });
  const [fixBanner, setFixBanner] = React.useState(null);
  const [checkingColumns, setCheckingColumns] = React.useState(false);
  const [songListKey, setSongListKey] = React.useState(0);

  const refreshList = React.useCallback(async () => {
    if (!supabaseClient) { setLoadingList(false); return; }
    setLoadingList(true);
    const { data, error } = await supabaseClient.from("christmas_projects").select("slug, recipient_name, theme, updated_at").order("updated_at", { ascending: false });
    if (!error && data) setProjects(data);
    setLoadingList(false);
  }, []);
  React.useEffect(() => { refreshList(); }, [refreshList]);

  React.useEffect(() => {
    if (!supabaseClient) return;
    supabaseClient.from("christmas_theme_assets").select("*").eq("id", "default").single().then(({ data }) => { if (data) setThemeAssets(data); });
  }, []);

  const checkRequiredColumns = React.useCallback(() => {
    if (!supabaseClient) return;
    setCheckingColumns(true);
    const checks = [
      { label: '"theme" column on christmas_projects', test: () => supabaseClient.from("christmas_projects").select("theme").limit(1) },
      { label: '"tree_photos" column on christmas_projects', test: () => supabaseClient.from("christmas_projects").select("tree_photos").limit(1) },
      { label: '"memories" column on christmas_projects', test: () => supabaseClient.from("christmas_projects").select("memories").limit(1) },
      { label: '"github_repo" / "published_url" columns on christmas_projects', test: () => supabaseClient.from("christmas_projects").select("github_repo,published_url").limit(1) },
      { label: '"christmas_theme_assets" table', test: () => supabaseClient.from("christmas_theme_assets").select("id").limit(1) },
      { label: '"christmas_visits" table', test: () => supabaseClient.from("christmas_visits").select("id").limit(1) }
    ];
    Promise.all(checks.map((c) => c.test().then(({ error }) => ({ ...c, missing: !!(error && /does not exist/i.test(error.message || "")) }))))
      .then((results) => {
        const missing = results.filter((r) => r.missing);
        setCheckingColumns(false);
        if (!missing.length) { setFixBanner(null); setStatus({ text: "All set \u2014 everything checks out.", kind: "ok" }); return; }
        setFixBanner({
          text: "Some setup is missing: " + missing.map((m) => m.label).join(", ") + ". Run christmas_schema.sql (in full \u2014 it's safe to re-run) in your Supabase project's SQL Editor, then click \"Check again\" below.",
          sql: "-- see christmas_schema.sql in your download \u2014 run the whole file"
        });
      });
  }, []);
  React.useEffect(() => { checkRequiredColumns(); }, [checkRequiredColumns]);

  function startNew() { setCurrentSlug(null); setForm(blankProject()); setStatus({ text: "", kind: "" }); }

  async function openProject(slug) {
    setStatus({ text: "Loading\u2026", kind: "" });
    const { data, error } = await supabaseClient.from("christmas_projects").select("*").eq("slug", slug).single();
    if (error || !data) { setStatus({ text: "Couldn't load that project.", kind: "err" }); return; }
    const blank = blankProject();
    const merged = { ...blank };
    Object.keys(blank).forEach((key) => { if (data[key] !== null && data[key] !== undefined) merged[key] = data[key]; });
    merged.slug = data.slug;
    setCurrentSlug(slug); setForm(merged); setStatus({ text: "", kind: "" });
  }

  function set(field, value) { setForm((f) => ({ ...f, [field]: value })); }
  function applyThemePreset(themeKey) {
    const preset = THEME_PRESETS[themeKey];
    if (!preset) return;
    setForm((f) => ({ ...f, theme: themeKey, message_line1: preset.message_line1, message_line2: preset.message_line2, signoff: preset.signoff }));
  }

  async function saveProject() {
    const slug = slugify(form.slug);
    if (!slug) { setStatus({ text: "Give the project a slug before saving.", kind: "err" }); return; }
    if (!supabaseClient) { setStatus({ text: "Connect Supabase first.", kind: "err" }); return; }
    setSaving(true); setStatus({ text: "Saving\u2026", kind: "" });
    const payload = { ...form, slug, updated_at: new Date().toISOString() };
    const { error } = await supabaseClient.from("christmas_projects").upsert(payload, { onConflict: "slug" });
    setSaving(false);
    if (error) {
      const msg = error.message || "";
      const missingColumn = msg.match(/column ['"]?([a-zA-Z_]+)['"]?[^a-zA-Z]*does not exist/i);
      if (missingColumn) {
        setFixBanner({
          text: `Nothing was saved just now because your Supabase table is missing the "${missingColumn[1]}" column. Run christmas_schema.sql in your Supabase project's SQL Editor, then click Save project again.`,
          sql: "-- see christmas_schema.sql in your download \u2014 run the whole file"
        });
        setStatus({ text: "Save failed \u2014 see the notice above.", kind: "err" });
      } else { setStatus({ text: "Couldn't save: " + msg, kind: "err" }); }
      return;
    }
    setFixBanner(null); setForm((f) => ({ ...f, slug })); setCurrentSlug(slug);
    setStatus({ text: "Saved.", kind: "ok" }); refreshList();
  }

  function previewSite() {
    const slug = slugify(form.slug) || "preview";
    try {
      const output = buildSiteHtml(slug, form, themeAssets);
      const blob = new Blob([output], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
      setStatus({ text: "Preview opened in a new tab.", kind: "ok" });
    } catch (e) { setStatus({ text: "Couldn't build the preview: " + e.message, kind: "err" }); }
  }

  function downloadFile() {
    const slug = slugify(form.slug);
    if (!slug) { setStatus({ text: "Give the project a slug first.", kind: "err" }); return; }
    setGenerating(true);
    try {
      const output = buildSiteHtml(slug, form, themeAssets);
      const blob = new Blob([output], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = slug + ".html";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus({ text: "Downloaded " + slug + ".html \u2014 upload it to a new repo to publish it.", kind: "ok" });
    } catch (e) { setStatus({ text: "Couldn't generate the file: " + e.message, kind: "err" }); }
    setGenerating(false);
  }

  async function publishLive() {
    const slug = slugify(form.slug);
    if (!slug) { setStatus({ text: "Give the project a slug first.", kind: "err" }); return; }
    if (!GITHUB_READY) { setStatus({ text: "Connect GitHub first (paste a token at the top of this file).", kind: "err" }); return; }
    setPublishing(true);
    setStatus({ text: form.github_repo ? "Publishing your changes\u2026" : "Publishing for the first time\u2026", kind: "" });
    try {
      const output = buildSiteHtml(slug, form, themeAssets);
      const owner = await githubGetUsername();
      const repoName = form.github_repo || slug;
      let branch = "main", sha = null;
      if (!form.github_repo) {
        const repo = await githubCreateRepo(repoName);
        branch = repo.default_branch || "main";
        await new Promise((resolve) => setTimeout(resolve, 1500));
      } else {
        const repo = await githubGetRepo(owner, repoName);
        branch = repo.default_branch || "main";
        sha = await githubGetFileSha(owner, repoName, "index.html", branch);
      }
      await githubUpsertFile(owner, repoName, "index.html", output, sha ? "Update site" : "Publish site", sha, branch);
      if (!form.github_repo) await githubEnablePages(owner, repoName, branch);
      const liveUrl = "https://" + owner + ".github.io/" + repoName + "/";
      const updatedForm = { ...form, slug, github_repo: repoName, published_url: liveUrl };
      setForm(updatedForm); setCurrentSlug(slug);
      if (supabaseClient) {
        await supabaseClient.from("christmas_projects").upsert({ ...updatedForm, updated_at: new Date().toISOString() }, { onConflict: "slug" });
        refreshList();
      }
      setStatus({ text: "Published! Your link is ready below.", kind: "ok" });
    } catch (e) { setStatus({ text: "Couldn't publish: " + e.message, kind: "err" }); }
    setPublishing(false);
  }

  function copyLiveLink() {
    if (!form.published_url) return;
    navigator.clipboard.writeText(form.published_url).then(
      () => setStatus({ text: "Link copied.", kind: "ok" }),
      () => setStatus({ text: "Couldn't copy automatically \u2014 copy it from the box above.", kind: "err" })
    );
  }

  const isNew = currentSlug === null;

  return (
    <div className="shell">
      <div className="sidebar">
        <div className="brand"><div className="brand-mark">Backstage \u2744</div><div className="brand-sub">Christmas letter builder</div></div>
        <button className="new-btn" onClick={startNew}>+ New project</button>
        <div className="project-list">
          {loadingList && <div className="project-empty">Loading projects\u2026</div>}
          {!loadingList && !projects.length && <div className="project-empty">No projects yet \u2014 create one above.</div>}
          {projects.map((p) => (
            <button key={p.slug} className={"project-item" + (p.slug === currentSlug ? " active" : "")} onClick={() => openProject(p.slug)}>
              <span className="slug">{p.slug}</span>
              <span className="meta">{p.recipient_name || "\u2014"} \u00b7 {p.theme || "family"}</span>
            </button>
          ))}
        </div>
        <div className="sidebar-foot">Every project lives as one row in Supabase. Theme assets (village + ornaments) are shared across all of them \u2014 upload those once below.</div>
      </div>

      <div className="main">
        <div className="main-inner">
          {fixBanner && (
            <div className="fix-banner">
              <div className="fix-banner-text">{fixBanner.text}</div>
              <code className="fix-banner-sql">{fixBanner.sql}</code>
              <div className="fix-banner-actions">
                <button type="button" className="fix-banner-check" onClick={checkRequiredColumns} disabled={checkingColumns}>{checkingColumns ? "Checking\u2026" : "Check again"}</button>
                <button type="button" className="fix-banner-dismiss" onClick={() => setFixBanner(null)}>Dismiss</button>
              </div>
            </div>
          )}
          <div className="topline"><h1>{isNew ? "New project" : form.slug}</h1><span className={"status " + status.kind}>{status.text}</span></div>

          <ThemeAssetsLibrary assets={themeAssets} onChange={setThemeAssets} />

          <div className="card">
            <h2>Basics</h2>
            <p className="hint">The slug identifies this project in Supabase and becomes the downloaded filename / GitHub repo name.</p>
            <div className="row2">
              <div className="field"><label>Slug</label>
                <input type="text" className={!isNew ? "slug-locked" : ""} value={form.slug} disabled={!isNew} placeholder="e.g. for-sarah-2026" onChange={(e) => set("slug", e.target.value)} />
                {!isNew && <div className="field-hint">Slugs can't be changed after the first save \u2014 start a new project instead.</div>}
              </div>
              <div className="field"><label>PIN</label>
                <input type="text" value={form.pin} onChange={(e) => set("pin", e.target.value)} placeholder="123456" />
              </div>
            </div>
            <div className="row2">
              <div className="field"><label>Recipient's name</label><input type="text" value={form.recipient_name} onChange={(e) => set("recipient_name", e.target.value)} placeholder="Sarah" /></div>
              <div className="field"><label>Your name (sign-off)</label><input type="text" value={form.sender_name} onChange={(e) => set("sender_name", e.target.value)} placeholder="Alex" /></div>
            </div>
            <div className="field"><label>Who is this for?</label>
              <div className="theme-swatches">
                {Object.keys(THEME_PRESETS).map((key) => (
                  <div key={key} className={"theme-swatch" + (form.theme === key ? " active" : "")} style={{ background: THEME_PRESETS[key].swatch }} onClick={() => applyThemePreset(key)}>
                    <div className="name">{THEME_PRESETS[key].label}</div><div className="desc">{THEME_PRESETS[key].desc}</div>
                  </div>
                ))}
              </div>
              <div className="field-hint">Sets the site's color palette and fills in suggested wording below (which you can still edit).</div>
            </div>
          </div>

          <div className="card">
            <h2>Opening &amp; the tree</h2>
            <p className="hint">The whisper shown before the golden star is tapped, and the message that types out once the tree lights up.</p>
            <div className="field"><label>Opening whisper</label><input type="text" value={form.opening_message} onChange={(e) => set("opening_message", e.target.value)} /></div>
            <div className="field"><label>Tree caption</label><input type="text" value={form.tree_caption} onChange={(e) => set("tree_caption", e.target.value)} /></div>
            <div className="field"><label>Message line 1</label><input type="text" value={form.message_line1} onChange={(e) => set("message_line1", e.target.value)} /></div>
            <div className="field"><label>Message line 2</label><input type="text" value={form.message_line2} onChange={(e) => set("message_line2", e.target.value)} /></div>
          </div>

          <div className="card">
            <h2>The tree photos</h2>
            <p className="hint">6\u201320 photos become ornaments woven into the tree, alongside the decorative ornaments from the Theme Library.</p>
            <ImageUploader folder={(slugify(form.slug) || "untitled") + "/tree"} items={form.tree_photos} onChange={(v) => set("tree_photos", v)} withCaption={false}
              dropLabel="Click to choose tree photos, or drag them in" min={6} max={20} />
          </div>

          <div className="card">
            <h2>The letter</h2>
            <p className="hint">Same envelope either way \u2014 pick what's inside it.</p>
            <div className="type-toggle">
              <button type="button" className={"type-toggle-btn" + (form.letter_type !== "voice" ? " active" : "")} onClick={() => set("letter_type", "written")}>Written letter</button>
              <button type="button" className={"type-toggle-btn" + (form.letter_type === "voice" ? " active" : "")} onClick={() => set("letter_type", "voice")}>Voice note</button>
            </div>
            <div className="field"><label>Letter title</label><input type="text" value={form.letter_title} onChange={(e) => set("letter_title", e.target.value)} /></div>
            {form.letter_type === "voice" ? (
              <VoiceNoteUploader slug={slugify(form.slug) || "untitled"} value={form.voice_note_url} onChange={(v) => set("voice_note_url", v)} />
            ) : (
              <div className="field"><label>Letter body</label><textarea rows={7} value={form.letter_body} onChange={(e) => set("letter_body", e.target.value)} />
                <div className="field-hint">Blank lines create paragraph breaks.</div></div>
            )}
          </div>

          <div className="card">
            <h2>Moments worth keeping</h2>
            <p className="hint">Photos and short video clips for the fireside slideshow.</p>
            <MemoriesUploader folder={(slugify(form.slug) || "untitled") + "/memories"} items={form.memories} onChange={(v) => set("memories", v)} />
          </div>

          <div className="card">
            <h2>The playlist</h2>
            <p className="hint">Paste a Spotify <strong>track</strong> link or a YouTube link and it plays right on the site. Leave both blank to fall back to a search card.</p>
            <SongsEditor songs={form.songs} onChange={(v) => set("songs", v)} />
          </div>

          <div className="card">
            <h2>Background music</h2>
            <div className="field"><label>Song URL (a direct .mp3/.m4a/.ogg link)</label>
              <input type="text" value={form.music_url} onChange={(e) => set("music_url", e.target.value)} placeholder="https://\u2026/song.mp3" /></div>
            <MusicUploader slug={slugify(form.slug) || "untitled"} value={form.music_url} onChange={(v) => set("music_url", v)} onUploaded={() => setSongListKey((k) => k + 1)} />
            <AllSongsManager currentUrl={form.music_url} refreshKey={songListKey} onPick={(url) => set("music_url", url)} onCurrentDeleted={() => set("music_url", "")} />
            <MusicRangeEditor url={form.music_url} start={form.music_start} end={form.music_end} onChangeStart={(v) => set("music_start", v)} onChangeEnd={(v) => set("music_end", v)} />
          </div>

          <div className="card">
            <h2>The gift <span className="count-badge">optional</span></h2>
            <p className="hint">A special gift, a surprise, or a bit of information for them \u2014 revealed when they open the box. Leave the message blank and this whole section is skipped on the site.</p>
            <div className="field"><label>Gift tag</label><input type="text" value={form.gift_tag} onChange={(e) => set("gift_tag", e.target.value)} /></div>
            <div className="field"><label>What's inside</label><textarea rows={4} value={form.gift_message} onChange={(e) => set("gift_message", e.target.value)} placeholder="Leave blank to skip this section" /></div>
          </div>

          <div className="card">
            <h2>The final message</h2>
            <div className="field"><label>Final line 1</label><input type="text" value={form.final_line1} onChange={(e) => set("final_line1", e.target.value)} placeholder={"Merry Christmas, " + (form.recipient_name || "\u2026")} /></div>
            <div className="field"><label>Final line 2</label><input type="text" value={form.final_line2} onChange={(e) => set("final_line2", e.target.value)} /></div>
            <div className="field"><label>Final line 3</label><input type="text" value={form.final_line3} onChange={(e) => set("final_line3", e.target.value)} /></div>
            <div className="field"><label>Sign-off</label><input type="text" value={form.signoff} onChange={(e) => set("signoff", e.target.value)} /></div>
          </div>

          {form.published_url && (
            <div className="live-link-box">
              <div className="live-link-label">Live at</div>
              <div className="live-link-row"><a href={form.published_url} target="_blank" rel="noreferrer" className="live-link-url">{form.published_url}</a>
                <button type="button" className="copy-link-btn" onClick={copyLiveLink}>Copy link</button></div>
            </div>
          )}

          <div className="action-bar">
            <button className="btn btn-primary" onClick={saveProject} disabled={saving}>{saving ? "Saving\u2026" : "Save project"}</button>
            <button className="btn btn-gold" onClick={publishLive} disabled={publishing}>{publishing ? "Publishing\u2026" : form.github_repo ? "Publish changes" : "Publish live"}</button>
            <button className="btn btn-outline" onClick={previewSite}>Preview it</button>
            <button className="btn btn-outline" onClick={downloadFile} disabled={generating}>{generating ? "Generating\u2026" : "Download file"}</button>
            {!isNew && <button className="btn btn-outline" onClick={startNew}>Start a new project</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [unlocked, setUnlocked] = React.useState(() => sessionStorage.getItem("backstage_christmas_unlocked") === "1");
  if (!unlocked) return <Gate onUnlock={() => setUnlocked(true)} />;
  if (!supabaseClient) return <SetupNotice />;
  return <Dashboard />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
