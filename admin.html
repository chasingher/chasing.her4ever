<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#241010" />
<title>Backstage — Project Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%8E%9E%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --ink: #241010;
    --ink-soft: #7a6a62;
    --panel: #fdf6ee;
    --panel-soft: #f6ead9;
    --line: rgba(36,16,16,.12);
    --accent: #c2185b;
    --accent-deep: #96123f;
    --gold: #cf9f4e;
    --gold-soft: #e0b975;
    --good: #3d7a4f;
    --bad: #b23b3b;
    --font-display: 'Dancing Script', cursive;
    --font-ui: 'Poppins', sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; }
  body{
    font-family: var(--font-ui);
    background: var(--ink);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; }
  #root{ min-height:100%; }
  ::selection{ background: var(--accent); color:#fff; }
  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- Gate screen ---------- */
  .gate{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:40px 20px; text-align:center;
    background: radial-gradient(circle at 50% 20%, #3a1414 0%, var(--ink) 65%);
    color: #f3e3d3;
  }
  .gate-mark{ font-family:var(--font-display); font-size:2.6rem; color:#f3e3d3; text-shadow: 0 4px 20px rgba(194,24,91,.4); }
  .gate-sub{ font-size:.85rem; letter-spacing:.04em; color:#c9ab98; max-width:360px; line-height:1.5; }
  .gate form{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .gate input{
    padding:12px 16px; border-radius:10px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06); color:#fff; font-size:.95rem; min-width:220px;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .gate input:focus{
    outline:none; border-color: var(--gold); background:rgba(255,255,255,.09);
    box-shadow: 0 0 0 3px rgba(232,194,122,.16);
  }
  .gate input::placeholder{ color:rgba(255,255,255,.4); }
  .gate button{
    padding:12px 22px; border-radius:10px; border:none;
    background: linear-gradient(155deg, var(--accent), var(--accent-deep)); color:#fff;
    font-weight:600; font-size:.9rem; letter-spacing:.02em;
    box-shadow: 0 8px 20px rgba(194,24,91,.35);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .gate button:hover{ transform: translateY(-2px); box-shadow: 0 12px 26px rgba(194,24,91,.45); }
  .gate-error{ color:#ff9f9f; font-size:.85rem; min-height:1em; }

  /* ---------- Setup notice ---------- */
  .setup-notice{
    max-width:560px; margin:60px auto; background:var(--panel); border-radius:16px; padding:32px 36px;
    box-shadow:0 20px 50px rgba(0,0,0,.35); line-height:1.6;
  }
  .setup-notice h1{ font-family:var(--font-display); font-size:2rem; margin:0 0 6px; color:var(--accent-deep); }
  .setup-notice code{ background:var(--panel-soft); padding:2px 6px; border-radius:6px; font-size:.85em; }

  /* ---------- App shell ---------- */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:280px; flex:0 0 280px; background: linear-gradient(180deg,#2c1212,#1c0b0b);
    color:#f3e3d3; padding:26px 18px; display:flex; flex-direction:column; gap:18px;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; padding:0 6px 14px; border-bottom:1px solid rgba(255,255,255,.1); }
  .brand-mark{ font-family:var(--font-display); font-size:1.8rem; text-shadow: 0 2px 12px rgba(194,24,91,.35); }
  .brand-sub{ font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:#c9ab98; }

  .new-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 14px; border-radius:10px; border:1px dashed rgba(255,255,255,.35);
    background:transparent; color:#f3e3d3; font-size:.88rem; font-weight:500;
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .new-btn:hover{ background:rgba(255,255,255,.07); border-color:var(--gold); transform: translateY(-1px); }

  .project-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin:0 -6px; padding:0 6px; }
  .project-item{
    text-align:left; padding:10px 12px; border-radius:10px; border:1px solid transparent;
    background:transparent; color:#e9d6c6; font-size:.86rem; display:flex; flex-direction:column; gap:2px;
    transition: background .16s ease, border-color .16s ease;
  }
  .project-item:hover{ background:rgba(255,255,255,.07); }
  .project-item.active{ background:rgba(194,24,91,.24); border-color:rgba(194,24,91,.55); }
  .project-item .slug{ font-weight:600; color:#fff; }
  .project-item .meta{ font-size:.72rem; color:#b79a89; }
  .project-empty{ font-size:.8rem; color:#a98b7c; padding:10px 6px; line-height:1.5; }

  .sidebar-foot{ font-size:.68rem; color:#8a6f62; line-height:1.5; padding:0 6px; }

  .main{ flex:1; overflow-y:auto; background: var(--ink); }
  .main-inner{ max-width:760px; margin:0 auto; padding:40px 32px 140px; }

  .topline{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
  .topline h1{ font-family:var(--font-display); font-size:2.1rem; color:#f3e3d3; margin:0; }
  .topline .status{ font-size:.78rem; color:#c9ab98; }
  .topline .status.err{ color:#ff9f9f; }
  .topline .status.ok{ color:#8fd19e; }

  .fix-banner{
    background:#3a1414; border:1px solid #c2185b; border-radius:14px;
    padding:18px 20px; margin-bottom:22px; color:#ffe3e3;
  }
  .fix-banner-text{ font-size:.86rem; line-height:1.5; margin-bottom:10px; }
  .fix-banner-sql{
    display:block; background:#1c0b0b; border-radius:8px; padding:10px 12px;
    font-size:.78rem; color:#ffd3a8; overflow-x:auto; white-space:pre; margin-bottom:10px;
  }
  .fix-banner-dismiss{
    background:transparent; border:1px solid rgba(255,255,255,.3); color:#ffe3e3;
    border-radius:8px; padding:6px 14px; font-size:.76rem;
  }
  .fix-banner-dismiss:hover{ border-color:#ff9f9f; }

  .card{
    background:var(--panel); border-radius:16px; padding:26px 28px; margin-bottom:20px;
    box-shadow:0 14px 34px rgba(0,0,0,.28);
    border:1px solid rgba(36,16,16,.05);
  }
  .card h2{ margin:0 0 4px; font-size:1.05rem; color:var(--accent-deep); display:flex; align-items:center; gap:8px; }
  .card h2::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--gold); flex-shrink:0; }
  .card .hint{ margin:0 0 18px; font-size:.8rem; color:var(--ink-soft); line-height:1.5; }

  .field{ margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:.78rem; font-weight:600; color:var(--ink); margin-bottom:6px; letter-spacing:.01em; }
  .field .field-hint{ font-size:.72rem; color:var(--ink-soft); margin-top:5px; }
  .field input[type=text], .field input[type=password], .field textarea{
    width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line); background:#fff;
    font-size:.9rem; color:var(--ink); resize:vertical;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--accent);
    box-shadow: 0 0 0 3px rgba(194,24,91,.12);
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px){ .row2{ grid-template-columns:1fr; } }

  /* Songs */
  .song-row{
    display:grid; grid-template-columns: 1.3fr 1.1fr .7fr 1.3fr auto auto; gap:8px; align-items:center;
    padding:10px; border-radius:10px; background:var(--panel-soft); margin-bottom:8px;
  }
  @media (max-width:680px){ .song-row{ grid-template-columns:1fr 1fr; } }
  .song-row input[type=text]{
    padding:8px 10px; border-radius:7px; border:1px solid var(--line); font-size:.82rem;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .song-row input[type=text]:focus{
    outline:none; border-color:var(--accent); box-shadow: 0 0 0 3px rgba(194,24,91,.1);
  }
  .song-row label.chk{ display:flex; align-items:center; gap:5px; font-size:.72rem; color:var(--ink-soft); white-space:nowrap; }
  .icon-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; color:var(--bad); font-size:.9rem;
    transition: background .16s ease, border-color .16s ease;
  }
  .icon-btn:hover{ background:#fdeaea; border-color:rgba(178,59,59,.4); }
  .add-row-btn{
    padding:9px 16px; border-radius:9px; border:1px dashed var(--accent); background:transparent;
    color:var(--accent-deep); font-size:.82rem; font-weight:600;
    transition: background .16s ease, transform .16s ease;
  }
  .add-row-btn:hover{ background:#fdeef3; transform: translateY(-1px); }

  /* Photos */
  .photo-drop{
    border:2px dashed var(--line); border-radius:14px; padding:26px; text-align:center; cursor:pointer;
    color:var(--ink-soft); font-size:.85rem; margin-bottom:18px;
    transition: border-color .2s ease, background .2s ease, color .2s ease;
  }
  .photo-drop:hover, .photo-drop.drag{ border-color:var(--accent); background:#fdeef3; color:var(--accent-deep); }
  .photo-drop input{ display:none; }

  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:16px; }
  .photo-card{
    background:#fff; border-radius:4px; padding:8px 8px 12px; box-shadow:0 6px 16px rgba(0,0,0,.18);
    transform:rotate(var(--tilt,-2deg)); transition: transform .2s ease, box-shadow .2s ease;
  }
  .photo-card:hover{ transform:rotate(0deg) scale(1.03); box-shadow:0 10px 24px rgba(0,0,0,.26); }
  .photo-card .thumb{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:2px; background:var(--panel-soft); display:block;
  }
  .photo-card input{
    width:100%; margin-top:8px; border:none; border-bottom:1px solid var(--line); font-size:.72rem;
    padding:4px 2px; text-align:center; font-family:var(--font-ui); color:var(--ink-soft); background:transparent;
  }
  .photo-card .remove{
    margin-top:6px; width:100%; border:none; background:none; color:var(--bad); font-size:.68rem;
    letter-spacing:.03em; text-transform:uppercase; padding:2px;
  }
  .photo-card .remove:hover{ text-decoration:underline; }
  .photo-uploading{ font-size:.75rem; color:var(--accent-deep); margin-bottom:10px; }

  .live-link-box{
    background: linear-gradient(155deg, rgba(63,122,79,.12), rgba(63,122,79,.05));
    border:1px solid rgba(61,122,79,.35); border-radius:14px;
    padding:16px 18px; margin-bottom:18px;
  }
  .live-link-label{
    font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--good);
    font-weight:600; margin-bottom:6px;
  }
  .live-link-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .live-link-url{
    color:var(--ink); font-size:.88rem; font-weight:600; word-break:break-all;
    text-decoration:none; border-bottom:1px solid transparent;
  }
  .live-link-url:hover{ border-bottom-color: var(--ink); }
  .copy-link-btn{
    background:#fff; border:1px solid rgba(61,122,79,.4); color:var(--good);
    padding:6px 14px; border-radius:8px; font-size:.76rem; font-weight:600;
    transition: background .16s ease, transform .16s ease; flex-shrink:0;
  }
  .copy-link-btn:hover{ background:#effaf1; transform: translateY(-1px); }

  /* Action bar */
  .action-bar{
    position:sticky; bottom:0; left:0; right:0; background:linear-gradient(0deg,var(--ink) 60%,rgba(36,16,16,0));
    padding:26px 0 10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  .btn{
    padding:13px 22px; border-radius:11px; border:none; font-size:.88rem; font-weight:600; letter-spacing:.01em;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn-primary{
    background: linear-gradient(155deg, var(--accent), var(--accent-deep)); color:#fff;
    box-shadow: 0 8px 20px rgba(194,24,91,.32);
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 12px 28px rgba(194,24,91,.42); }
  .btn-gold{
    background: linear-gradient(155deg, var(--gold-soft), var(--gold)); color:#3a2405;
    box-shadow: 0 8px 20px rgba(207,159,78,.32);
  }
  .btn-gold:hover{ transform: translateY(-2px); box-shadow: 0 12px 28px rgba(207,159,78,.42); }
  .btn:disabled{ opacity:.5; cursor:default; transform:none !important; box-shadow:none !important; }
  .btn-outline{
    background:transparent; border:1px solid rgba(255,255,255,.3); color:#f3e3d3;
  }
  .btn-outline:hover{ border-color:var(--bad); color:#ff9f9f; transform: translateY(-2px); }
  .action-status{ font-size:.78rem; color:#c9ab98; }
  .action-status.ok{ color:#8fd19e; }
  .action-status.err{ color:#ff9f9f; }

  .slug-locked{ opacity:.6; }
</style>
</head>

  });
  if (!res.ok) {
    let message = "GitHub API error (" + res.status + ")";
    try {
      const body = await res.json();
      if (body && body.message) message = body.message;
    } catch (e) {
      /* ignore — use the generic message above */
    }
    throw new Error(message);
  }
  if (res.status === 204) return null;
  return res.json();
}

async function githubGetUsername() {
  const user = await githubRequest("/user");
  return user.login;
}

async function githubCreateRepo(name) {
  return githubRequest("/user/repos", {
    method: "POST",
    body: JSON.stringify({
      name,
      description: "A little something, built with Backstage.",
      private: false,
      auto_init: true
    })
  });
}

async function githubGetRepo(owner, repo) {
  return githubRequest("/repos/" + owner + "/" + repo);
}

async function githubGetFileSha(owner, repo, path, branch) {
  try {
    const data = await githubRequest(
      "/repos/" + owner + "/" + repo + "/contents/" + path + "?ref=" + encodeURIComponent(branch)
    );
    return data.sha;
  } catch (e) {
    return null; // file doesn't exist yet on this branch
  }
}

async function githubUpsertFile(owner, repo, path, content, message, sha, branch) {
  const body = { message, content: utf8ToBase64(content), branch };
  if (sha) body.sha = sha;
  return githubRequest("/repos/" + owner + "/" + repo + "/contents/" + path, {
    method: "PUT",
    body: JSON.stringify(body)
  });
}

async function githubEnablePages(owner, repo, branch) {
  try {
    await githubRequest("/repos/" + owner + "/" + repo + "/pages", {
      method: "POST",
      body: JSON.stringify({ source: { branch, path: "/" } })
    });
  } catch (e) {
    /* Most likely Pages is already enabled from a previous publish — fine to ignore. */
  }
}

function Gate({ onUnlock }) {
  const [value, setValue] = React.useState("");
  const [error, setError] = React.useState("");

  function submit(e) {
    e.preventDefault();
    if (value === ADMIN_PASSWORD) {
      sessionStorage.setItem("backstage_unlocked", "1");
      onUnlock();
    } else {
      setError("That's not it — try again.");

  }

  return (
    <div className="gate">
      <div className="gate-mark">Backstage</div>
      <div className="gate-sub">Where each site gets put together before it goes out into the world.</div>
      <form onSubmit={submit}>
        <input
          type="password"
          placeholder="Password"
          value={value}
          onChange={(e) => { setValue(e.target.value); setError(""); }}
          autoFocus
        />
        <button type="submit">Enter</button>
      </form>
      <div className="gate-error">{error}</div>
    </div>
  );
}

--------------------------------------------------------------------- */
function SongsEditor({ songs, onChange }) {
  function update(i, field, value) {
    const next = songs.slice();
    next[i] = { ...next[i], [field]: value };
    onChange(next);
  }
  function remove(i) {
    onChange(songs.filter((_, idx) => idx !== i));
  }
  function add() {
    onChange([...songs, { title: "", artist: "", duration: "", spotify_url: "", explicit: false }]);
  }

  return (
    <div>
      {songs.map((s, i) => (
        <div className="song-row" key={i}>
          <input type="text" placeholder="Title" value={s.title || ""} onChange={(e) => update(i, "title", e.target.value)} />
          <input type="text" placeholder="Artist" value={s.artist || ""} onChange={(e) => update(i, "artist", e.target.value)} />
          <input type="text" placeholder="4:32" value={s.duration || ""} onChange={(e) => update(i, "duration", e.target.value)} />
          <input type="text" placeholder="Spotify TRACK link (e.g. open.spotify.com/track/...)" value={s.spotify_url || ""} onChange={(e) => update(i, "spotify_url", e.target.value)} />
          <label className="chk">
            <input type="checkbox" checked={!!s.explicit} onChange={(e) => update(i, "explicit", e.target.checked)} /> E
          </label>
          <button type="button" className="icon-btn" onClick={() => remove(i)} title="Remove song">✕</button>
        </div>
      ))}
      <button type="button" className="add-row-btn" onClick={add}>+ Add a song</button>
    </div>
  );
}

/* ---------------------------------------------------------------------
   Photo uploader
--------------------------------------------------------------------- */
const POLAROID_TILTS = [-3, 2, -2, 3, -4, 1.5, -1.5, 2.5];

/* items: for photos, [{url, caption}]. For flowers, [{url}] (caption UI hidden). */
function ImageUploader({ slug, folder, items, onChange, withCaption, dropLabel, missingSlugLabel }) {
  const [uploading, setUploading] = React.useState(false);
  const [dragOver, setDragOver] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInput = React.useRef(null);

  async function handleFiles(fileList) {
    setError("");
    if (!slug) {
      setError(missingSlugLabel || "Give the project a slug first (above) — uploads are filed under it.");
      return;
    }
    if (!supabaseClient) {
      setError("Connect Supabase first (see SETUP.md).");
      return;
    }
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setUploading(true);
    const uploaded = [];
    for (const file of files) {
      try {
        const ext = (file.name.match(/\.[^.]+$/) || [""])[0];
        const base = slugify(file.name.replace(/\.[^.]+$/, ""));
        const path = `${slug}/${folder}/${Date.now()}-${base}${ext}`;
        const { error: upErr } = await supabaseClient.storage.from("photos").upload(path, file, { upsert: true });
        if (upErr) throw upErr;
        const { data } = supabaseClient.storage.from("photos").getPublicUrl(path);
        uploaded.push({ url: data.publicUrl, caption: "" });
      } catch (e) {
        setError("Some images didn't upload: " + (e.message || e));
      }
    }
    onChange([...items, ...uploaded]);
    setUploading(false);
  }

  function updateCaption(i, caption) {
    const next = items.slice();
    next[i] = { ...next[i], caption };
    onChange(next);
  }
  function remove(i) {
    onChange(items.filter((_, idx) => idx !== i));
  }

  return (
    <div>
      <div
        className={"photo-drop" + (dragOver ? " drag" : "")}
        onClick={() => fileInput.current && fileInput.current.click()}
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); }}
      >
        <input ref={fileInput} type="file" accept="image/*" multiple onChange={(e) => handleFiles(e.target.files)} />
        {uploading ? "Uploading…" : (dropLabel || "Click to choose images, or drag them in")}
      </div>
      {error && <div className="photo-uploading" style={{ color: "var(--bad)" }}>{error}</div>}
      {!!items.length && (
        <div className="photo-grid">
          {items.map((p, i) => (
            <div className="photo-card" key={p.url + i} style={{ "--tilt": POLAROID_TILTS[i % POLAROID_TILTS.length] + "deg" }}>
              <img className="thumb" src={p.url} alt="" />
              {withCaption && (
                <input
                  type="text"
                  placeholder="caption (optional)"
                  value={p.caption || ""}
                  onChange={(e) => updateCaption(i, e.target.value)}
                />
              )}
              <button type="button" className="remove" onClick={() => remove(i)}>Remove</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------
   Main dashboard
--------------------------------------------------------------------- */
function Dashboard() {
  const [projects, setProjects] = React.useState([]);
  const [loadingList, setLoadingList] = React.useState(true);
  const [currentSlug, setCurrentSlug] = React.useState(null); // null = new project
  const [form, setForm] = React.useState(blankProject());
  const [saving, setSaving] = React.useState(false);
  const [generating, setGenerating] = React.useState(false);
  const [publishing, setPublishing] = React.useState(false);
  const [status, setStatus] = React.useState({ text: "", kind: "" });
  const [fixBanner, setFixBanner] = React.useState(null); // { text, sql } | null

  const refreshList = React.useCallback(async () => {
    if (!supabaseClient) { setLoadingList(false); return; }
    setLoadingList(true);
    const { data, error } = await supabaseClient
      .from("projects")
      .select("slug, intro_message, updated_at")
      .order("updated_at", { ascending: false });
    if (!error && data) setProjects(data);
    setLoadingList(false);
  }, []);

  React.useEffect(() => { refreshList(); }, [refreshList]);

  React.useEffect(() => {
    if (!supabaseClient) return;
    const checks = [
      { col: "flower_images", def: "flower_images jsonb default '[]'" },
      { col: "github_repo", def: "github_repo text" },
      { col: "published_url", def: "published_url text" }
    ];
    Promise.all(
      checks.map((c) =>
        supabaseClient
          .from("projects")
          .select(c.col)
          .limit(1)
          .then(({ error }) => ({ ...c, missing: !!(error && /does not exist/i.test(error.message || "")) }))
      )
    ).then((results) => {
      const missing = results.filter((r) => r.missing);
      if (!missing.length) return;
      const names = missing.map((m) => '"' + m.col + '"').join(", ");
      const sql = missing.map((m) => "alter table projects add column if not exists " + m.def + ";").join("\n");
      setFixBanner({
        text:
          "Your Supabase table is missing " +
          (missing.length > 1 ? "these columns: " : "this column: ") +
          names +
          ". Some features (flower photos, publishing) won't save until this is fixed — even if things " +
          "appear to work at first. Run this once in Supabase's SQL Editor:",
        sql
      });
    });
  }, []);

  function startNew() {
    setCurrentSlug(null);
    setForm(blankProject());
    setStatus({ text: "", kind: "" });
  }

  async function openProject(slug) {
    setStatus({ text: "Loading…", kind: "" });
    const { data, error } = await supabaseClient.from("projects").select("*").eq("slug", slug).single();
    if (error || !data) {
      setStatus({ text: "Couldn't load that project.", kind: "err" });
      return;
    }
    setCurrentSlug(slug);
    setForm({
      slug: data.slug,
      pin: data.pin || "123456",
      intro_message: data.intro_message || "",
      letter_title: data.letter_title || "",
      letter_body: data.letter_body || "",
      final_message: data.final_message || "",
      photos: data.photos || [],
      flower_images: data.flower_images || [],
      songs: data.songs || [],
      github_repo: data.github_repo || "",
      published_url: data.published_url || ""
    });
    setStatus({ text: "", kind: "" });
  }

  function set(field, value) {
    setForm((f) => ({ ...f, [field]: value }));
  }

  async function saveProject() {
    const slug = slugify(form.slug);
    if (!slug) {
      setStatus({ text: "Give the project a slug before saving.", kind: "err" });
      return;
    }
    if (!supabaseClient) {
      setStatus({ text: "Connect Supabase first (see SETUP.md).", kind: "err" });
      return;
    }
    setSaving(true);
    setStatus({ text: "Saving…", kind: "" });
    const payload = { ...form, slug, updated_at: new Date().toISOString() };
    const { error } = await supabaseClient.from("projects").upsert(payload, { onConflict: "slug" });
    setSaving(false);
    if (error) {
      const msg = error.message || "";
      const missingColumn = msg.match(/column ['"]?([a-zA-Z_]+)['"]?[^a-zA-Z]*does not exist/i);
      if (missingColumn) {
        const col = missingColumn[1];
        const arrayFields = ["photos", "flower_images", "songs"];
        const colDef = arrayFields.includes(col) ? col + " jsonb default '[]'" : col + " text";
        setFixBanner({
          text:
            `Nothing was saved just now — including anything you uploaded — because your Supabase table is ` +
            `missing the "${col}" column. Run this once in Supabase's SQL Editor, then click Save project again:`,
          sql: `alter table projects add column if not exists ${colDef};`
        });
        setStatus({ text: "Save failed — see the notice above.", kind: "err" });
      } else {
        setStatus({ text: "Couldn't save: " + msg, kind: "err" });
      }
      return;
    }
    setFixBanner(null);
    setForm((f) => ({ ...f, slug }));
    setCurrentSlug(slug);
    setStatus({ text: "Saved.", kind: "ok" });
    refreshList();
  }

  function base64ToUtf8(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  // The reverse of base64ToUtf8 — needed to hand the generated HTML to
  // GitHub's Contents API, which requires base64 either way regardless of
  // any Unicode characters (em-dashes, curly quotes, emoji) in the content.
  function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = "";
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return btoa(binary);
  }

  function buildSiteHtml(slug, projectForm) {
    const templateHtml = base64ToUtf8(TEMPLATE_B64);
    const snapshot = {
      pin: projectForm.pin,
      intro_message: projectForm.intro_message,
      letter_title: projectForm.letter_title,
      letter_body: projectForm.letter_body,
      final_message: projectForm.final_message,
      photos: projectForm.photos,
      flower_images: projectForm.flower_images,
      songs: projectForm.songs
    };
    const startMarker = "/* DEFAULT_CONFIG:START */";
    const endMarker = "/* DEFAULT_CONFIG:END */";
    const startIdx = templateHtml.indexOf(startMarker);
    const endIdx = templateHtml.indexOf(endMarker);
    if (startIdx === -1 || endIdx === -1) throw new Error("Template markers not found.");
    const before = templateHtml.slice(0, startIdx);
    const after = templateHtml.slice(endIdx + endMarker.length);
    const middle = startMarker + "\nconst DEFAULT_CONFIG = " + JSON.stringify(snapshot, null, 2) + ";\n" + endMarker;

    let output = before + middle + after;
    output = output.split('"YOUR_SUPABASE_URL"').join(JSON.stringify(SUPABASE_URL));
    output = output.split('"YOUR_SUPABASE_ANON_KEY"').join(JSON.stringify(SUPABASE_ANON_KEY));
    output = output.split('"YOUR_PROJECT_SLUG"').join(JSON.stringify(slug));
    return output;
  }

  function downloadFile() {
    const slug = slugify(form.slug);
    if (!slug) {
      setStatus({ text: "Give the project a slug first.", kind: "err" });
      return;
    }
    setGenerating(true);
    try {
      const output = buildSiteHtml(slug, form);
      const blob = new Blob([output], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = slug + ".html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus({ text: "Downloaded " + slug + ".html — upload it to a new repo to publish it.", kind: "ok" });
    } catch (e) {
      setStatus({ text: "Couldn't generate the file: " + e.message, kind: "err" });
    }
    setGenerating(false);
  }

  async function publishLive() {
    const slug = slugify(form.slug);
    if (!slug) {
      setStatus({ text: "Give the project a slug first.", kind: "err" });
      return;
    }
    if (!GITHUB_READY) {
      setStatus({ text: "Connect GitHub first (see SETUP.md).", kind: "err" });
      return;
    }
    setPublishing(true);
    setStatus({ text: form.github_repo ? "Publishing your changes…" : "Publishing for the first time…", kind: "" });
    try {
      const output = buildSiteHtml(slug, form);
      const owner = await githubGetUsername();
      const repoName = form.github_repo || slug;
      let branch = "main";
      let sha = null;

      if (!form.github_repo) {
        const repo = await githubCreateRepo(repoName);
        branch = repo.default_branch || "main";
        // Give GitHub a moment to finish provisioning the new repo before pushing to it.
        await new Promise((resolve) => setTimeout(resolve, 1500));
      } else {
        const repo = await githubGetRepo(owner, repoName);
        branch = repo.default_branch || "main";
        sha = await githubGetFileSha(owner, repoName, "index.html", branch);
      }

      await githubUpsertFile(
        owner,
        repoName,
        "index.html",
        output,
        sha ? "Update site" : "Publish site",
        sha,
        branch
      );

      if (!form.github_repo) {
        await githubEnablePages(owner, repoName, branch);
      }

      const liveUrl = "https://" + owner + ".github.io/" + repoName + "/";
      const updatedForm = { ...form, slug, github_repo: repoName, published_url: liveUrl };
      setForm(updatedForm);
      setCurrentSlug(slug);

      if (supabaseClient) {
        await supabaseClient
          .from("projects")
          .upsert({ ...updatedForm, updated_at: new Date().toISOString() }, { onConflict: "slug" });
        refreshList();
      }

      setStatus({ text: "Published! Your link is ready below.", kind: "ok" });
    } catch (e) {
      setStatus({ text: "Couldn't publish: " + e.message, kind: "err" });
    }
    setPublishing(false);
  }

  function copyLiveLink() {
    if (!form.published_url) return;
    navigator.clipboard.writeText(form.published_url).then(
      () => setStatus({ text: "Link copied.", kind: "ok" }),
      () => setStatus({ text: "Couldn't copy automatically — copy it directly from the box above.", kind: "err" })
    );
  }

  const isNew = currentSlug === null;

  return (
    <div className="shell">
      <div className="sidebar">
        <div className="brand">
          <div className="brand-mark">Backstage</div>
          <div className="brand-sub">Project builder</div>
        </div>
        <button className="new-btn" onClick={startNew}>+ New project</button>
        <div className="project-list">
          {loadingList && <div className="project-empty">Loading projects…</div>}
          {!loadingList && !projects.length && (
            <div className="project-empty">No projects yet — create one above.</div>
          )}
          {projects.map((p) => (
            <button
              key={p.slug}
              className={"project-item" + (p.slug === currentSlug ? " active" : "")}
              onClick={() => openProject(p.slug)}
            >
              <span className="slug">{p.slug}</span>
              <span className="meta">{p.intro_message || "—"}</span>
            </button>
          ))}
        </div>
        <div className="sidebar-foot">
          Every project lives as one row in Supabase. Saving here updates the live site
          instantly; downloading gives you a fresh file to publish.
        </div>
      </div>

      <div className="main">
        <div className="main-inner">
          {fixBanner && (
            <div className="fix-banner">
              <div className="fix-banner-text">{fixBanner.text}</div>
              <code className="fix-banner-sql">{fixBanner.sql}</code>
              <button type="button" className="fix-banner-dismiss" onClick={() => setFixBanner(null)}>
                Dismiss
              </button>
            </div>
          )}
          <div className="topline">
            <h1>{isNew ? "New project" : form.slug}</h1>
            <span className={"status " + status.kind}>{status.text}</span>
          </div>

          <div className="card">
            <h2>Basics</h2>
            <p className="hint">The slug identifies this project in Supabase and becomes the downloaded filename. Lowercase letters, numbers, and dashes.</p>
            <div className="row2">
              <div className="field">
                <label>Slug</label>
                <input
                  type="text"
                  className={!isNew ? "slug-locked" : ""}
                  value={form.slug}
                  disabled={!isNew}
                  placeholder="e.g. for-sarah-2026"
                  onChange={(e) => set("slug", e.target.value)}
                />
                {!isNew && <div className="field-hint">Slugs can't be changed after the first save — start a new project instead.</div>}
              </div>
              <div className="field">
                <label>PIN</label>
                <input type="text" value={form.pin} onChange={(e) => set("pin", e.target.value)} placeholder="123456" />
                <div className="field-hint">Any length works — the dots on the lock screen match it automatically.</div>
              </div>
            </div>
          </div>

          <div className="card">
            <h2>The message</h2>
            <p className="hint">What they'll read as they move through the site.</p>
            <div className="field">
              <label>Hero line (typed out over the photos)</label>

              onChange={(v) => set("photos", v)}

              missingSlugLabel="Give the project a slug first (above) — photos are filed under it."
            />
          </div>

          <div className="card">

            />

          {form.published_url && (
            <div className="live-link-box">

            </button>
            <button className="btn btn-outline" onClick={downloadFile} disabled={generating}>
              {generating ? "Generating…" : "Download file instead"}
            </button>
            {!isNew && <button className="btn btn-outline" onClick={startNew}>Start a new project</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   Root
--------------------------------------------------------------------- */
function App() {
  const [unlocked, setUnlocked] = React.useState(() => sessionStorage.getItem("backstage_unlocked") === "1");

  if (!unlocked) return <Gate onUnlock={() => setUnlocked(true)} />;
  if (!supabaseClient) return <SetupNotice />;
  return <Dashboard />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
